# symbol_level.toml
# 运算符定义，优先级由数组顺序决定（从低到高）

[[operator]]
symbol = "="
arity = 2
assoc = "right"

[[operator]]
symbol = "?"
arity = 3
second = ":"
assoc = "right"

[[operator]]
symbol = "||"
arity = 2
assoc = "left"

[[operator]]
symbol = "&&"
arity = 2
assoc = "left"

[[operator]]
symbol = "|"
arity = 2
assoc = "left"

[[operator]]
symbol = "^"
arity = 2
assoc = "left"

[[operator]]
symbol = "&"
arity = 2
assoc = "left"

[[operator]]
symbol = "=="
arity = 2
assoc = "left"

[[operator]]
symbol = "!="
arity = 2
assoc = "left"

[[operator]]
symbol = ">"
arity = 2
assoc = "left"

[[operator]]
symbol = "<"
arity = 2
assoc = "left"

[[operator]]
symbol = ">="
arity = 2
assoc = "left"

[[operator]]
symbol = "<="
arity = 2
assoc = "left"

[[operator]]
symbol = "<<"
arity = 2
assoc = "left"

[[operator]]
symbol = ">>"
arity = 2
assoc = "left"

[[operator]]
symbol = "+"
arity = 2
assoc = "left"

[[operator]]
symbol = "-"
arity = 2
assoc = "left"

[[operator]]
symbol = "*"
arity = 2
assoc = "left"

[[operator]]
symbol = "/"
arity = 2
assoc = "left"

[[operator]]
symbol = "%"
arity = 2
assoc = "left"

[[operator]]
symbol = "**"
arity = 2
assoc = "right"

# 一元前缀运算符
[[operator]]
symbol = "+"
arity = 1
position = "prefix"

[[operator]]
symbol = "-"
arity = 1
position = "prefix"

[[operator]]
symbol = "~"
arity = 1
position = "prefix"

[[operator]]
symbol = "!"
arity = 1
position = "prefix"

# 一元后缀运算符
[[operator]]
symbol = "++"
arity = 1
position = "postfix"

[[operator]]
symbol = "--"
arity = 1
position = "postfix"
