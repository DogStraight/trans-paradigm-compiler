# ============================================================================
# 运算符优先级 — 全局缺省配置
#
# Pratt 解析器优先加载语言规则目录下的 _symbol_level.toml，
# 找不到时使用本文件作为缺省。
#
# 优先级由数组顺序决定：从上到下递增（列表最低 → 末尾最高）。
# 新语言只需在 <rules_dir>/_symbol_level.toml 中覆盖差异部分。
# ============================================================================

# 三目条件 (右结合)
[[operator]]
symbol = "?"
arity = 3
second = ":"
assoc = "right"

# 逻辑或
[[operator]]
symbol = "||"
arity = 2
assoc = "left"

# 逻辑与
[[operator]]
symbol = "&&"
arity = 2
assoc = "left"

# 位或
[[operator]]
symbol = "|"
arity = 2
assoc = "left"

# 位异或
[[operator]]
symbol = "^"
arity = 2
assoc = "left"

# 位与
[[operator]]
symbol = "&"
arity = 2
assoc = "left"

# 相等/不等
[[operator]]
symbol = "=="
arity = 2
assoc = "left"

[[operator]]
symbol = "!="
arity = 2
assoc = "left"

# 比较
[[operator]]
symbol = ">"
arity = 2
assoc = "left"

[[operator]]
symbol = "<"
arity = 2
assoc = "left"

[[operator]]
symbol = ">="
arity = 2
assoc = "left"

[[operator]]
symbol = "<="
arity = 2
assoc = "left"

# 移位
[[operator]]
symbol = "<<"
arity = 2
assoc = "left"

[[operator]]
symbol = ">>"
arity = 2
assoc = "left"

# 加减
[[operator]]
symbol = "+"
arity = 2
assoc = "left"

[[operator]]
symbol = "-"
arity = 2
assoc = "left"

# 乘除模
[[operator]]
symbol = "*"
arity = 2
assoc = "left"

[[operator]]
symbol = "/"
arity = 2
assoc = "left"

[[operator]]
symbol = "%"
arity = 2
assoc = "left"

# 幂（右结合）
[[operator]]
symbol = "**"
arity = 2
assoc = "right"

# 一元前缀运算符（优先级高于所有二元运算符）
[[operator]]
symbol = "+"
arity = 1
position = "prefix"

[[operator]]
symbol = "-"
arity = 1
position = "prefix"

[[operator]]
symbol = "~"
arity = 1
position = "prefix"

[[operator]]
symbol = "!"
arity = 1
position = "prefix"

[[operator]]
symbol = "~"
arity = 1
position = "prefix"

[[operator]]
symbol = "not"
arity = 1
position = "prefix"

# 一元后缀运算符（最高优先级）
[[operator]]
symbol = "++"
arity = 1
position = "postfix"

[[operator]]
symbol = "--"
arity = 1
position = "postfix"