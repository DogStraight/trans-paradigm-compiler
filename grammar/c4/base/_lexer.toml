# _lexer.toml — c4（Tiny C 演示 DSL）词法配置
#
# 注释：c4 特有——// 和 # 都是行注释（见 rswier/c4 的 c4.c next()，上游 github.com/rswier/c4）。

[comment]
pairs = [
  ["//", "\n", "line"],
  ["#", "\n", "line"],
]

[indent]
enable = false
level = 4

[token_category]
# 字面量/操作符分类（Pratt 解析器 token 识别用）
# match 策略: exact = 精确匹配, prefix = 前缀匹配
number = { match = "exact", types = ["literal.number"] }
string = { match = "exact", types = ["literal.string"] }
identifier = { match = "prefix", types = ["id", "id."] }
operator = { match = "prefix", types = ["symbol.base.", "symbol.extend."] }
none = { match = "exact", types = ["literal.none"] }
