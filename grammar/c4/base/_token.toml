# _token.toml — c4（Tiny C 演示 DSL）基础 Token 定义
#
# 对应 rswier/c4 的 c4.c 词法（上游 github.com/rswier/c4）：数字（十进制/十六进制 0x/八进制 0）、
# 标识符、单字符/多字符运算符、括号、字面量。
# 语言关键字在 ../token.toml（[id.keyword]）。

[space]
blank_space = " "
tab = "\t"
# CRLF 行尾的 \r 部分（\n 由 [newline] 处理）：作为可忽略空白吞掉
carriage_return = "\r"
# UTF-8 BOM：作为可忽略字符吞掉
bom = "\ufeff"

[newline]
newline = "\n"

# 单字符符号（c4 运算符 + 标点；' 由 literal.string 正则处理字符字面量，不入 symbol）
[symbol.base]
add = "+"
sub = "-"
multiple = "*"
div = "/"
mod = "%"
and = "&"
or = "|"
xor = "^"
not = "!"
bit_not = "~"
lesser = "<"
bigger = ">"
equal = "="
question_mark = "?"
colon = ":"
semicolon = ";"
comma = ","

# 多字符符号（最长匹配）
[symbol.extend]
is_equal = "=="
not_equal = "!="
lesser_equal = "<="
bigger_equal = ">="
l_shift = "<<"
r_shift = ">>"
logic_double_and = "&&"
logic_double_or = "||"
add_one = "++"
sub_one = "--"

[bracket]
pairs = [
    ["(", ")", "parentheses"],
    ["[", "]", "square_bracket"],
    ["{", "}", "curly_bracket"],
]

[literal]
# 字符串 "..." 与字符 '...' 字面量（c4 支持 \n 转义，内容由语法层处理）
string = "(\".*\")|('.*')"
number = "\\d+"

[id.id]
id = "[a-z_A-Z][a-z_A-Z0-9]*"
