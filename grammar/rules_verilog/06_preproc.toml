# ============================================================================
# 预处理器指令 — 语法规则（供 Parser/linter 解析宏指令体）
#
# 每条规则定义指令 token 后的参数结构，供 linter 的 parse_sentence 解析。
# 解析成功 → 宏指令语法正确；失败 → linter 跳整行并警告。
#
# 规则都以 is_statement = true + end_case = ["newline"] 声明为语句级规则，
# 使 parse_sentence 能匹配它们。
# ============================================================================

# ── 无参指令 ──────────────────────────────────────────────

[MacroResetall]
[MacroResetall.parser]
production = ["macro.resetall"]
end_case = ["newline"]
structure = { is_statement = true }

[MacroCelldefine]
[MacroCelldefine.parser]
production = ["macro.celldefine"]
end_case = ["newline"]
structure = { is_statement = true }

[MacroEndCellDefine]
[MacroEndCellDefine.parser]
production = ["macro.endcelldefine"]
end_case = ["newline"]
structure = { is_statement = true }

[MacroElse]
[MacroElse.parser]
production = ["macro.else"]
end_case = ["newline"]
structure = { is_statement = true }

[MacroEndif]
[MacroEndif.parser]
production = ["macro.endif"]
end_case = ["newline"]
structure = { is_statement = true }

[MacroEndKeywords]
[MacroEndKeywords.parser]
production = ["macro.end_keywords"]
end_case = ["newline"]
structure = { is_statement = true }

[MacroNoUnconnectedDrive]
[MacroNoUnconnectedDrive.parser]
production = ["macro.nounconnected_drive"]
end_case = ["newline"]
structure = { is_statement = true }

# ── 单标识符参数 ──────────────────────────────────────────

[MacroUndef]
[MacroUndef.parser]
production = ["macro.undef", "@Identifier"]
end_case = ["newline"]
structure = { is_statement = true }

[MacroIfdef]
[MacroIfdef.parser]
production = ["macro.ifdef", "@Identifier"]
end_case = ["newline"]
structure = { is_statement = true }

[MacroIfndef]
[MacroIfndef.parser]
production = ["macro.ifndef", "@Identifier"]
end_case = ["newline"]
structure = { is_statement = true }

[MacroUnconnectedDrive]
[MacroUnconnectedDrive.parser]
production = ["macro.unconnected_drive", "@Identifier"]
end_case = ["newline"]
structure = { is_statement = true }

[MacroDefaultNettype]
# 参数是 net 类型关键字（wire/tri 等），不是 id token，不强制匹配参数
[MacroDefaultNettype.parser]
production = ["macro.default_nettype"]
end_case = ["newline"]
structure = { is_statement = true }

# ── 字符串参数 ────────────────────────────────────────────

[MacroInclude]
[MacroInclude.parser]
production = ["macro.include", "literal.string"]
end_case = ["newline"]
structure = { is_statement = true }

[MacroBeginKeywords]
[MacroBeginKeywords.parser]
production = ["macro.begin_keywords", "literal.string"]
end_case = ["newline"]
structure = { is_statement = true }

# ── 数字 + 字符串 ─────────────────────────────────────────

[MacroLineDirective]
[MacroLineDirective.parser]
production = ["macro.line", "literal.number", "literal.string"]
end_case = ["newline"]
structure = { is_statement = true }

# ── 标识符 / 标识符 ──────────────────────────────────────

[MacroTimescale]
[MacroTimescale.parser]
production = ["macro.timescale", "literal.number", "@Identifier", "symbol.base.div", "literal.number", "@Identifier"]
end_case = ["newline"]
structure = { is_statement = true }

# ── 条件表达式 ────────────────────────────────────────────

[MacroElsif]
[MacroElsif.parser]
production = ["macro.elsif", "@PrimaryExpr"]
end_case = ["newline"]
structure = { is_statement = true }

# ── 多参数 ────────────────────────────────────────────────

[MacroPragma]
[MacroPragma.parser]
production = ["macro.pragma", "@Identifier"]
end_case = ["newline"]
structure = { is_statement = true }

# ── 宏定义 ────────────────────────────────────────────────
# define 体可以是数字字面量、表达式、字符串等常见类型，
# 也可能是自由文本。MacroValue 封装 Expression 并接受 newline 作为终止符。

[MacroValue]
[MacroValue.parser]
production = ["@Expression"]
end_case = ["newline"]

[MacroDefine]
[MacroDefine.parser]
production = ["macro.define", "@Identifier", "@MacroValue?"]
end_case = ["newline"]
structure = { is_statement = true }
[MacroDefine.parser.node]
macro_name = "$1"
body = "$2"





[MacroCall]
[MacroCall.parser]
production = ["macro.call"]
end_case = []

