# ============================================================================
# Verilog 语法规则 — 语句（组合分层）
# ============================================================================

# ---------- 原子组 1：通用控制流和过程赋值 ----------
[BasicStmt]
[BasicStmt.parser]
production = [
    "@IfStatement|@BeginEnd|@NonBlockingAssign|@BlockingAssign|@CaseStatement|@ForLoop|@SubroutineCall|@NullStmt",
]
inline = true
[BasicStmt.parser.node]
stmt = "$1"
[BasicStmt.renderer]
layout = { ref = "stmt" }

# ---------- 原子组 2：过程内部局部声明 ----------
[ProcLocalDecl]
[ProcLocalDecl.parser]
production = ["@RegDecl|@IntegerDecl"]
inline = true
[ProcLocalDecl.parser.node]
decl = "$1"
[ProcLocalDecl.renderer]
layout = { ref = "decl" }

# ---------- 过程语句（用于 always / initial 内部） ----------
[Statement]
[Statement.parser]
production = ["@BasicStmt|@ProcLocalDecl"]
inline = true
[Statement.parser.node]
stmt = "$1"
[Statement.renderer]
layout = { ref = "stmt" }

# ---------- 任务/函数语句（额外允许 TaskPortDecl） ----------
[TaskStatement]
[TaskStatement.parser]
production = ["@BasicStmt|@ProcLocalDecl|@TaskPortDecl"]
inline = true
[TaskStatement.parser.node]
stmt = "$1"
[TaskStatement.renderer]
layout = { ref = "stmt" }

# ---------- 模块顶层条目（用于 module 体） ----------
[ModuleItem]
[ModuleItem.parser]
production = [
    "@AlwaysBlock|@AssignStatement|@ModuleInst|@GenerateBlock|@BodyPortDecl|@WireDecl|@RegDecl|@IntegerDecl|@LocalParamDecl|@FuncDecl|@TaskDecl|@GenvarDecl",
]
inline = true
[ModuleItem.parser.node]
item = "$1"
[ModuleItem.renderer]
layout = { ref = "item" }

# ---------- 以下所有具体语句规则保持不变，只调整内部引用的块 ----------

[IfStatement]
[IfStatement.parser]
production = [
    "keyword.if",
    "bracket.l_parentheses",
    "@Expression",
    "bracket.r_parentheses",
    "@Statement",
    "@ElseChain?",
]
end_case = ["newline", "keyword.end", "keyword.else", "space.dedent"]
[IfStatement.parser.node]
condition = "$3"
then_stmt = "$5"
else_chain = "$6"
[IfStatement.renderer]
layout = { line = [
    "if (",
    { ref = "condition" },
    ") ",
    { ref = "then_stmt" },
    " ",
    { ref = "else_chain" },
] }

[ElseChain]
[ElseChain.parser]
production = ["@ElseIf|@ElseBranch"]
inline = true
[ElseChain.parser.node]
branch = "$1"
[ElseChain.renderer]
layout = { ref = "branch" }

[ElseIf]
[ElseIf.parser]
production = [
    "keyword.else",
    "keyword.if",
    "bracket.l_parentheses",
    "@Expression",
    "bracket.r_parentheses",
    "@Statement",
    "@ElseChain?",
]
[ElseIf.parser.node]
condition = "$4"
then_stmt = "$6"
else_chain = "$7"
[ElseIf.renderer]
layout = { line = [
    "else if (",
    { ref = "condition" },
    ") ",
    { ref = "then_stmt" },
    " ",
    { ref = "else_chain" },
] }

[ElseBranch]
[ElseBranch.parser]
production = ["keyword.else", "@Statement"]
[ElseBranch.parser.node]
body = "$2"
[ElseBranch.renderer]
layout = { line = ["else ", { ref = "body" }] }
body = { role = "direct" }

[NonBlockingAssign]
[NonBlockingAssign.parser]
production = [
    "@PrimaryExpr",
    "symbol.extend.lesser_equal",
    "@Expression",
    "symbol.base.semicolon",
]
end_case = ["newline"]
[NonBlockingAssign.parser.node]
target = "$1"
value = "$3"
[NonBlockingAssign.renderer]
layout = { line = [{ ref = "target" }, " <= ", { ref = "value" }, ";"] }

[BlockingAssign]
[BlockingAssign.parser]
production = [
    "@PrimaryExpr",
    "symbol.base.equal",
    "@Expression",
    "symbol.base.semicolon",
]
end_case = ["newline"]
[BlockingAssign.parser.node]
target = "$1"
value = "$3"
[BlockingAssign.renderer]
layout = { line = [{ ref = "target" }, " = ", { ref = "value" }, ";"] }

[CaseKeyword]
[CaseKeyword.parser]
production = ["keyword.case|keyword.casex|keyword.casez"]
[CaseKeyword.parser.node]
value = "$1"
[CaseKeyword.renderer]
layout = { ref = "value" }

[CaseStatement]
[CaseStatement.parser]
production = [
    "@CaseKeyword",
    "bracket.l_parentheses",
    "@Expression",
    "bracket.r_parentheses",
    "@CaseItemList",
    "keyword.endcase",
]
end_case = ["keyword.endcase", "keyword.end", "newline", "space.dedent"]
[CaseStatement.parser.node]
case_type = "$1"
expr = "$3"
items = "$5"
[CaseStatement.renderer]
head = { line = [{ ref = "case_type" }, " (", { ref = "expr" }, ")"] }
body = { indent = true, source = "items" }
tail = { text = "endcase", break = 1 }

[CaseItemList]
[CaseItemList.parser]
production = ["@CaseItem|@DefaultItem", "(@CaseItem|@DefaultItem)*"]
[CaseItemList.parser.node]
items = ["$1", "$2.items"]
[CaseItemList.renderer]
layout = { join = "\n", items = "items" }

[CaseItem]
[CaseItem.parser]
production = [
    "@Expression",
    "(symbol.base.comma,@Expression)*",
    "symbol.base.colon",
    "@StatementOrNull",
]
[CaseItem.parser.node]
values = ["$1", "$2.items[*].sub_node[1]"]
stmt = "$4"
[CaseItem.renderer]
layout = { line = [{ join = ", ", items = "values" }, ": ", { ref = "stmt" }] }

[DefaultItem]
[DefaultItem.parser]
production = ["keyword.default", "symbol.base.colon?", "@StatementOrNull"]
[DefaultItem.parser.node]
stmt = "$3"
[DefaultItem.renderer]
layout = { line = [
    "default",
    { opt = { ref = "colon" } },
    " ",
    { ref = "stmt" },
] }

[StatementOrNull]
[StatementOrNull.parser]
production = ["@Statement|symbol.base.semicolon"]
inline = true
[StatementOrNull.parser.node]
stmt = "$1"
[StatementOrNull.renderer]
layout = { ref = "stmt" }

[AssignStatement]
[AssignStatement.parser]
production = [
    "keyword.assign",
    "@PrimaryExpr",
    "symbol.base.equal",
    "@Expression",
    "symbol.base.semicolon",
]
end_case = ["newline"]
[AssignStatement.parser.node]
target = "$2"
value = "$4"
[AssignStatement.renderer]
layout = { line = [
    "assign ",
    { ref = "target" },
    " = ",
    { ref = "value" },
    ";",
] }

# ----- 函数声明（两种风格）-----
[FuncDecl]
[FuncDecl.parser]
production = ["@FuncDeclANSI|@FuncDeclOld"]
inline = true
[FuncDecl.parser.node]
body = "$1"

[FuncDeclANSI]
[FuncDeclANSI.parser]
production = [
    "keyword.function",
    "(keyword.automatic|keyword.static)?",
    "@Range?",
    "@Identifier",
    "bracket.l_parentheses",
    "@TaskPortList?",
    "bracket.r_parentheses",
    "symbol.base.semicolon",
    "@TaskBlock",                          # 函数体使用 TaskBlock
    "keyword.endfunction",
]
end_case = ["keyword.endfunction"]
[FuncDeclANSI.parser.node]
func_name = "$4"
body = "$9"
automatic = "$2"
func_range = "$3"
ports = "$6"

[FuncDeclANSI.analyzer]
scope = { name_attr = "func_name", kind = "function" }

[FuncDeclANSI.renderer]
head = { line = [
    "function ",
    { opt = { line = [
        { ref = "automatic" },
        " ",
    ] } },
    { opt = { group = [
        "[",
        { ref = "func_range" },
        "] ",
    ] } },
    { ref = "func_name" },
    "(",
    { ref = "ports" },
    ")",
    ";",
] }
body = { indent = true, source = "body" }
tail = { text = "endfunction", break = 2 }

[FuncDeclOld]
[FuncDeclOld.parser]
production = [
    "keyword.function",
    "(keyword.automatic|keyword.static)?",
    "@Range?",
    "@Identifier",
    "symbol.base.semicolon",
    "@TaskBlock",
    "keyword.endfunction",
]
end_case = ["keyword.endfunction"]
[FuncDeclOld.parser.node]
func_name = "$4"
body = "$6"
automatic = "$2"
func_range = "$3"

[FuncDeclOld.analyzer]
scope = { name_attr = "func_name", kind = "function" }

[FuncDeclOld.renderer]
head = { line = [
    "function ",
    { opt = { line = [
        { ref = "automatic" },
        " ",
    ] } },
    { opt = { group = [
        "[",
        { ref = "func_range" },
        "] ",
    ] } },
    { ref = "func_name" },
    ";",
] }
body = { indent = true, source = "body" }
tail = { text = "endfunction", break = 2 }

# ----- 任务声明（两种风格）-----
[TaskDecl]
[TaskDecl.parser]
production = ["@TaskDeclANSI|@TaskDeclOld"]
inline = true
[TaskDecl.parser.node]
body = "$1"

[TaskDeclANSI]
[TaskDeclANSI.parser]
production = [
    "keyword.task",
    "(keyword.automatic|keyword.static)?",
    "@Identifier",
    "bracket.l_parentheses",
    "@TaskPortList?",
    "bracket.r_parentheses",
    "symbol.base.semicolon",
    "@TaskBlock",
    "keyword.endtask",
]
end_case = ["keyword.endtask"]
[TaskDeclANSI.parser.node]
task_name = "$3"
body = "$8"
automatic = "$2"
ports = "$5"

[TaskDeclANSI.analyzer]
scope = { name_attr = "task_name", kind = "task" }

[TaskDeclANSI.renderer]
head = { line = [
    "task ",
    { opt = { line = [
        { ref = "automatic" },
        " ",
    ] } },
    { ref = "task_name" },
    "(",
    { ref = "ports" },
    ")",
    ";",
] }
body = { indent = true, source = "body" }
tail = { text = "endtask", break = 2 }

[TaskDeclOld]
[TaskDeclOld.parser]
production = [
    "keyword.task",
    "(keyword.automatic|keyword.static)?",
    "@Identifier",
    "symbol.base.semicolon",
    "@TaskBlock",
    "keyword.endtask",
]
end_case = ["keyword.endtask"]
[TaskDeclOld.parser.node]
task_name = "$3"
body = "$5"
automatic = "$2"

[TaskDeclOld.analyzer]
scope = { name_attr = "task_name", kind = "task" }

[TaskDeclOld.renderer]
head = { line = [
    "task ",
    { opt = { line = [
        { ref = "automatic" },
        " ",
    ] } },
    { ref = "task_name" },
    ";",
] }
body = { indent = true, source = "body" }
tail = { text = "endtask", break = 2 }

# ----- For 循环 -----
[ForLoop]
[ForLoop.parser]
production = [
    "keyword.for",
    "bracket.l_parentheses",
    "@ForInit",
    "symbol.base.semicolon",
    "@Expression",
    "symbol.base.semicolon",
    "@ForStep",
    "bracket.r_parentheses",
    "@Statement",
]
end_case = ["newline"]
[ForLoop.parser.node]
init = "$3"
condition = "$5"
step = "$7"
body = "$9"
[ForLoop.renderer]
layout = { line = [
    "for (",
    { ref = "init" },
    "; ",
    { ref = "condition" },
    "; ",
    { ref = "step" },
    ") ",
    { ref = "body" },
] }

[ForInit]
[ForInit.parser]
production = ["@Identifier", "symbol.base.equal", "@Expression"]
[ForInit.parser.node]
target = "$1"
value = "$3"
[ForInit.renderer]
layout = { line = [{ ref = "target" }, " = ", { ref = "value" }] }

[ForStep]
[ForStep.parser]
production = ["@Identifier", "symbol.base.equal", "@Expression"]
[ForStep.parser.node]
target = "$1"
value = "$3"
[ForStep.renderer]
layout = { line = [{ ref = "target" }, " = ", { ref = "value" }] }

# ----- Generate 块 -----
[GenerateBlock]
[GenerateBlock.parser]
production = ["keyword.generate", "@ModuleBlock", "keyword.endgenerate"]
end_case = ["keyword.endgenerate"]
[GenerateBlock.parser.node]
body = "$2"
[GenerateBlock.renderer]
head = "generate"
body = { indent = true, source = "body" }
tail = { text = "endgenerate", break = 2 }

# ----- 模块实例化 -----
[ModuleInst]
[ModuleInst.parser]
production = [
    "@Identifier",
    "@ParamOverride?",
    "@Identifier",
    "@PortConnection",
]
end_case = ["newline"]
[ModuleInst.parser.node]
module_name = "$1"
params = "$2"
inst_name = "$3"
ports = "$4.ports"
[ModuleInst.analyzer]
symbol = { kind = "module_instance", name_attr = "inst_name" }
[ModuleInst.renderer]
head = { line = [
    { ref = "module_name" },
    { opt = { group = [
        " ",
        { ref = "params" },
    ] } },
    " ",
    { ref = "inst_name" },
    " (",
] }
body = { indent = true, items = ["ports"] }
tail = { text = ");", break = 2 }

[ParamOverride]
[ParamOverride.parser]
production = [
    "symbol.base.pound",
    "bracket.l_parentheses",
    "@ParamOverrideList?",
    "bracket.r_parentheses",
]
[ParamOverride.parser.node]
params = "$3"
[ParamOverride.renderer]
head = { line = ["#(", { ref = "params" }, ")"] }

[ParamOverrideList]
[ParamOverrideList.parser]
production = ["@NamedParamOverride", "(symbol.base.comma,@NamedParamOverride)*"]
[ParamOverrideList.parser.node]
items = ["$1", "$2.items[*].sub_node[1]"]
[ParamOverrideList.renderer]
layout = { join = ", ", nest = 1, items = "items" }

[NamedParamOverride]
[NamedParamOverride.parser]
production = [
    "symbol.base.dot",
    "@Identifier",
    "bracket.l_parentheses",
    "@Expression",
    "bracket.r_parentheses",
]
[NamedParamOverride.parser.node]
param_name = "$2"
value = "$4"
[NamedParamOverride.renderer]
layout = { line = [".", { ref = "param_name" }, "(", { ref = "value" }, ")"] }

[PortConnection]
[PortConnection.parser]
production = [
    "bracket.l_parentheses",
    "@NamedPortList?",
    "bracket.r_parentheses",
    "symbol.base.semicolon",
]
end_case = ["newline"]
[PortConnection.parser.node]
ports = "$2"

[NamedPortList]
[NamedPortList.parser]
production = ["@NamedPortConnect", "(symbol.base.comma,@NamedPortConnect)*"]
[NamedPortList.parser.node]
items = ["$1", "$2.items[*].sub_node[1]"]
[NamedPortList.renderer]
layout = { join = ", ", nest = 2, items = "items" }

[NamedPortConnect]
[NamedPortConnect.parser]
production = [
    "symbol.base.dot",
    "@Identifier",
    "bracket.l_parentheses",
    "@Expression",
    "bracket.r_parentheses",
]
[NamedPortConnect.parser.node]
port_name = "$2"
value = "$4"
[NamedPortConnect.renderer]
layout = { line = [".", { ref = "port_name" }, "(", { ref = "value" }, ")"] }

# ----- 子程序调用 -----
[SubroutineCall]
[SubroutineCall.parser]
production = [
    "@Identifier",
    "bracket.l_parentheses",
    "@ArgumentList?",
    "bracket.r_parentheses",
    "symbol.base.semicolon",
]
end_case = ["newline"]
[SubroutineCall.parser.node]
callee = "$1"
args = "$3"
[SubroutineCall.renderer]
layout = { line = [{ ref = "callee" }, "(", { ref = "args" }, ")", ";"] }

[NullStmt]
[NullStmt.parser]
production = ["symbol.base.semicolon"]
end_case = ["newline"]
[NullStmt.parser.node]
[NullStmt.renderer]
layout = ";"
