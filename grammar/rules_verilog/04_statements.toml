# ============================================================================
# Verilog 语法规则 — 语句
# ============================================================================

[Statement]
[Statement.parser]
production = [
    "@IfStatement|@BeginEnd|@NonBlockingAssign|@BlockingAssign|@AlwaysBlock|@CaseStatement|@AssignStatement|@LocalParamDecl|@BodyPortDecl|@WirePortDecl|@RegPortDecl|@FuncDecl|@TaskDecl|@SubroutineCall|@IntegerDecl|@ForLoop|@ModuleInst|@GenerateBlock|@GenvarDecl|@NullStmt",
]
inline = true
[Statement.parser.node]
stmt = "$1"
[Statement.renderer]
layout = { ref = "stmt" }

[IfStatement]
[IfStatement.parser]
production = [
    "keyword.if",
    "bracket.l_parentheses",
    "@Expression",
    "bracket.r_parentheses",
    "@Statement",
    "@ElseChain?",
]
end_case = ["newline", "keyword.end", "keyword.else", "space.dedent"]
[IfStatement.parser.node]
condition = "$3"
then_stmt = "$5"
else_chain = "$6"
[IfStatement.renderer]
layout = { line = [
    "if (",
    { ref = "condition" },
    ") ",
    { ref = "then_stmt" },
    " ",
    { ref = "else_chain" },
] }

[ElseChain]
[ElseChain.parser]
production = ["@ElseIf|@ElseBranch"]
inline = true
[ElseChain.parser.node]
branch = "$1"
[ElseChain.renderer]
layout = { ref = "branch" }

[ElseIf]
[ElseIf.parser]
production = [
    "keyword.else",
    "keyword.if",
    "bracket.l_parentheses",
    "@Expression",
    "bracket.r_parentheses",
    "@Statement",
    "@ElseChain?",
]
[ElseIf.parser.node]
condition = "$4"
then_stmt = "$6"
else_chain = "$7"
[ElseIf.renderer]
layout = { line = [
    "else if (",
    { ref = "condition" },
    ") ",
    { ref = "then_stmt" },
    " ",
    { ref = "else_chain" },
] }

[ElseBranch]
[ElseBranch.parser]
production = ["keyword.else", "@Statement"]
[ElseBranch.parser.node]
body = "$2"
[ElseBranch.renderer]
layout = { line = ["else ", { ref = "body" }] }
body = { role = "direct" }

[NonBlockingAssign]
[NonBlockingAssign.parser]
production = [
    "@PrimaryExpr",
    "symbol.extend.lesser_equal",
    "@Expression",
    "symbol.base.semicolon",
]
end_case = ["newline"]
[NonBlockingAssign.parser.node]
target = "$1"
value = "$3"
[NonBlockingAssign.renderer]
layout = { line = [{ ref = "target" }, " <= ", { ref = "value" }, ";"] }

[BlockingAssign]
[BlockingAssign.parser]
production = [
    "@PrimaryExpr",
    "symbol.base.equal",
    "@Expression",
    "symbol.base.semicolon",
]
end_case = ["newline"]
[BlockingAssign.parser.node]
target = "$1"
value = "$3"
[BlockingAssign.renderer]
layout = { line = [{ ref = "target" }, " = ", { ref = "value" }, ";"] }

# ============================================================================
# Case 语句（符合 Verilog-2005）
# ============================================================================

[CaseKeyword]
[CaseKeyword.parser]
production = ["keyword.case|keyword.casex|keyword.casez"]
[CaseKeyword.parser.node]
value = "$1"
[CaseKeyword.renderer]
layout = { ref = "value" }


[CaseStatement]
[CaseStatement.parser]
production = [
    "@CaseKeyword",
    "bracket.l_parentheses",
    "@Expression",
    "bracket.r_parentheses",
    "@CaseItemList",
    "keyword.endcase",
]
end_case = ["keyword.endcase", "keyword.end"]
[CaseStatement.parser.node]
case_type = "$1" # "case" / "casex" / "casez"
expr = "$3"
items = "$5"
[CaseStatement.renderer]
head = { line = [{ ref = "case_type" }, " (", { ref = "expr" }, ")"] }
body = { indent = true, source = "items" }
tail = { text = "endcase", break = 1 }


[CaseItemList]
[CaseItemList.parser]
production = ["@CaseItem|@DefaultItem", "(@CaseItem|@DefaultItem)*"]
[CaseItemList.parser.node]
items = ["$1", "$2.items"]
[CaseItemList.renderer]
layout = { join = "\n", items = "items" }

[CaseItem]
[CaseItem.parser]
production = [
    "@Expression",
    "(symbol.base.comma,@Expression)*",
    "symbol.base.colon",
    "@StatementOrNull",
]
[CaseItem.parser.node]
values = ["$1", "$2.items"]
stmt = "$4"
[CaseItem.renderer]
layout = { line = [{ join = ", ", items = "values" }, ": ", { ref = "stmt" }] }

[DefaultItem]
[DefaultItem.parser]
production = ["keyword.default", "symbol.base.colon?", "@StatementOrNull"]
[DefaultItem.parser.node]
stmt = "$3"
[DefaultItem.renderer]
layout = { line = [
    "default",
    { opt = { ref = "colon" } },
    " ",
    { ref = "stmt" },
] }

[StatementOrNull]
[StatementOrNull.parser]
production = ["@Statement|symbol.base.semicolon"]
inline = true
[StatementOrNull.parser.node]
stmt = "$1"
[StatementOrNull.renderer]
layout = { ref = "stmt" }

[AssignStatement]
[AssignStatement.parser]
production = [
    "keyword.assign",
    "@PrimaryExpr",
    "symbol.base.equal",
    "@Expression",
    "symbol.base.semicolon",
]
end_case = ["newline"]
[AssignStatement.parser.node]
target = "$2"
value = "$4"
[AssignStatement.renderer]
layout = { line = [
    "assign ",
    { ref = "target" },
    " = ",
    { ref = "value" },
    ";",
] }

# ============================================================================
# 函数声明（两种风格互斥，通过 | 选择）
# ============================================================================

[FuncDecl]
[FuncDecl.parser]
production = ["@FuncDeclANSI|@FuncDeclOld"]
inline = true
[FuncDecl.parser.node]
body = "$1"

# ANSI 风格：function name(ports);
[FuncDeclANSI]
[FuncDeclANSI.parser]
production = [
    "keyword.function",
    "(keyword.automatic|keyword.static)?",
    "@Range?",
    "@Identifier",
    "bracket.l_parentheses",
    "@PortList?",
    "bracket.r_parentheses",
    "symbol.base.semicolon",
    "@Block",
    "keyword.endfunction",
]
end_case = ["keyword.endfunction"]
[FuncDeclANSI.parser.node]
func_name = "$4"
body = "$9"
automatic = "$2"
func_range = "$3"
ports = "$6"

[FuncDeclANSI.analyzer]
scope = { name_attr = "func_name", kind = "function" }

[FuncDeclANSI.renderer]
head = { line = [
    "function ",
    { opt = { line = [
        { ref = "automatic" },
        " ",
    ] } },
    { opt = { group = [
        "[",
        { ref = "func_range" },
        "] ",
    ] } },
    { ref = "func_name" },
    "(",
    { ref = "ports" },
    ")",
    ";",
] }
body = { indent = true, source = "body" }
tail = { text = "endfunction", break = 2 }

# 旧风格：function name; input x; ... endfunction
[FuncDeclOld]
[FuncDeclOld.parser]
production = [
    "keyword.function",
    "(keyword.automatic|keyword.static)?",
    "@Range?",
    "@Identifier",
    "symbol.base.semicolon",
    "@Block",
    "keyword.endfunction",
]
end_case = ["keyword.endfunction"]
[FuncDeclOld.parser.node]
func_name = "$4"
body = "$6"
automatic = "$2"
func_range = "$3"

[FuncDeclOld.analyzer]
scope = { name_attr = "func_name", kind = "function" }

[FuncDeclOld.renderer]
head = { line = [
    "function ",
    { opt = { line = [
        { ref = "automatic" },
        " ",
    ] } },
    { opt = { group = [
        "[",
        { ref = "func_range" },
        "] ",
    ] } },
    { ref = "func_name" },
    ";",
] }
body = { indent = true, source = "body" }
tail = { text = "endfunction", break = 2 }

# ============================================================================
# 任务声明（两种风格互斥）
# ============================================================================

[TaskDecl]
[TaskDecl.parser]
production = ["@TaskDeclANSI|@TaskDeclOld"]
inline = true
[TaskDecl.parser.node]
body = "$1"

# ANSI 风格：task name(ports);
[TaskDeclANSI]
[TaskDeclANSI.parser]
production = [
    "keyword.task",
    "(keyword.automatic|keyword.static)?",
    "@Identifier",
    "bracket.l_parentheses",
    "@PortList?",
    "bracket.r_parentheses",
    "symbol.base.semicolon",
    "@Block",
    "keyword.endtask",
]
end_case = ["keyword.endtask"]
[TaskDeclANSI.parser.node]
task_name = "$3"
body = "$8"
automatic = "$2"
ports = "$5"

[TaskDeclANSI.analyzer]
scope = { name_attr = "task_name", kind = "task" }

[TaskDeclANSI.renderer]
head = { line = [
    "task ",
    { opt = { line = [
        { ref = "automatic" },
        " ",
    ] } },
    { ref = "task_name" },
    "(",
    { ref = "ports" },
    ")",
    ";",
] }
body = { indent = true, source = "body" }
tail = { text = "endtask", break = 2 }

# 旧风格：task name; input x; ... endtask
[TaskDeclOld]
[TaskDeclOld.parser]
production = [
    "keyword.task",
    "(keyword.automatic|keyword.static)?",
    "@Identifier",
    "symbol.base.semicolon",
    "@Block",
    "keyword.endtask",
]
end_case = ["keyword.endtask"]
[TaskDeclOld.parser.node]
task_name = "$3"
body = "$5"
automatic = "$2"

[TaskDeclOld.analyzer]
scope = { name_attr = "task_name", kind = "task" }

[TaskDeclOld.renderer]
head = { line = [
    "task ",
    { opt = { line = [
        { ref = "automatic" },
        " ",
    ] } },
    { ref = "task_name" },
    ";",
] }
body = { indent = true, source = "body" }
tail = { text = "endtask", break = 2 }

# ============================================================================
# For 循环
# ============================================================================

[ForLoop]
[ForLoop.parser]
production = [
    "keyword.for",
    "bracket.l_parentheses",
    "@ForInit",
    "symbol.base.semicolon",
    "@Expression",
    "symbol.base.semicolon",
    "@ForStep",
    "bracket.r_parentheses",
    "@Statement",
]
end_case = ["newline"]
[ForLoop.parser.node]
init = "$3"
condition = "$5"
step = "$7"
body = "$9"
[ForLoop.renderer]
layout = { line = [
    "for (",
    { ref = "init" },
    "; ",
    { ref = "condition" },
    "; ",
    { ref = "step" },
    ") ",
    { ref = "body" },
] }

[ForInit]
[ForInit.parser]
production = ["@Identifier", "symbol.base.equal", "@Expression"]
[ForInit.parser.node]
target = "$1"
value = "$3"
[ForInit.renderer]
layout = { line = [{ ref = "target" }, " = ", { ref = "value" }] }

[ForStep]
[ForStep.parser]
production = ["@Identifier", "symbol.base.equal", "@Expression"]
[ForStep.parser.node]
target = "$1"
value = "$3"
[ForStep.renderer]
layout = { line = [{ ref = "target" }, " = ", { ref = "value" }] }

# ============================================================================
# Generate 块
# ============================================================================

[GenerateBlock]
[GenerateBlock.parser]
production = ["keyword.generate", "@Block", "keyword.endgenerate"]
end_case = ["keyword.endgenerate"]
[GenerateBlock.parser.node]
body = "$2"
[GenerateBlock.renderer]
head = "generate"
body = { indent = true, source = "body" }
tail = { text = "endgenerate", break = 2 }

[GenvarDecl]
[GenvarDecl.parser]
production = ["keyword.genvar", "@Identifier", "symbol.base.semicolon"]
end_case = ["newline"]
[GenvarDecl.parser.node]
genvar_name = "$2"
[GenvarDecl.analyzer]
symbol = { kind = "genvar", name_attr = "genvar_name" }
[GenvarDecl.renderer]
layout = { line = ["genvar ", { ref = "genvar_name" }, ";"] }

# ============================================================================
# 模块实例化
# ============================================================================

[ModuleInst]
[ModuleInst.parser]
production = [
    "@Identifier",
    "@ParamOverride?",
    "@Identifier",
    "@PortConnection",
]
end_case = ["newline"]
[ModuleInst.parser.node]
module_name = "$1"
params = "$2"
inst_name = "$3"
ports = "$4"
[ModuleInst.analyzer]
symbol = { kind = "module_instance", name_attr = "inst_name" }
[ModuleInst.renderer]
head = { line = [
    { ref = "module_name" },
    { opt = { group = [
        " ",
        { ref = "params" },
    ] } },
    " ",
    { ref = "inst_name" },
    " (",
] }
body = { indent = true, items = ["ports"] }
tail = { text = ");", break = 1 }

[ParamOverride]
[ParamOverride.parser]
production = [
    "symbol.base.pound",
    "bracket.l_parentheses",
    "@ParamOverrideList?",
    "bracket.r_parentheses",
]
[ParamOverride.parser.node]
params = "$3"
[ParamOverride.renderer]
head = { line = ["#(", { ref = "params" }, ")"] }

[ParamOverrideList]
[ParamOverrideList.parser]
production = ["@NamedParamOverride", "(symbol.base.comma,@NamedParamOverride)*"]
[ParamOverrideList.parser.node]
items = ["$1", "$2.items"]
[ParamOverrideList.renderer]
layout = { join = ", ", nest = 1, items = "items" }

[NamedParamOverride]
[NamedParamOverride.parser]
production = [
    "symbol.base.dot",
    "@Identifier",
    "bracket.l_parentheses",
    "@Expression",
    "bracket.r_parentheses",
]
[NamedParamOverride.parser.node]
param_name = "$2"
value = "$4"
[NamedParamOverride.renderer]
layout = { line = [".", { ref = "param_name" }, "(", { ref = "value" }, ")"] }

[PortConnection]
[PortConnection.parser]
production = [
    "bracket.l_parentheses",
    "@NamedPortList?",
    "bracket.r_parentheses",
    "symbol.base.semicolon",
]
end_case = ["newline"]
[PortConnection.parser.node]
ports = "$2"
[PortConnection.renderer]
layout = { join = ", ", items = "ports" }

[NamedPortList]
[NamedPortList.parser]
production = ["@NamedPortConnect", "(symbol.base.comma,@NamedPortConnect)*"]
[NamedPortList.parser.node]
items = ["$1", "$2.items"]
[NamedPortList.renderer]
layout = { join = ", ", items = "items" }

[NamedPortConnect]
[NamedPortConnect.parser]
production = [
    "symbol.base.dot",
    "@Identifier",
    "bracket.l_parentheses",
    "@Expression",
    "bracket.r_parentheses",
]
[NamedPortConnect.parser.node]
port_name = "$2"
value = "$4"
[NamedPortConnect.renderer]
layout = { line = [".", { ref = "port_name" }, "(", { ref = "value" }, ")"] }

# ============================================================================
# 子程序调用（任务调用、函数调用作为独立语句）
# ============================================================================

[SubroutineCall]
[SubroutineCall.parser]
production = [
    "@Identifier",
    "bracket.l_parentheses",
    "@ArgumentList?",
    "bracket.r_parentheses",
    "symbol.base.semicolon",
]
end_case = ["newline"]
[SubroutineCall.parser.node]
callee = "$1"
args = "$3"
[SubroutineCall.renderer]
layout = { line = [{ ref = "callee" }, "(", { ref = "args" }, ")", ";"] }

[ArgumentList]
layout = { join = ", ", items = "items" }
production = ["@Expression", "(symbol.base.comma,@Expression)*"]
[ArgumentList.node]
items = ["$1", "$2.items"]

[NullStmt]
[NullStmt.parser]
production = ["symbol.base.semicolon"]
end_case = ["newline"]
[NullStmt.parser.node]
[NullStmt.renderer]
layout = ";"
