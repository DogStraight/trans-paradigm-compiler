# ============================================================================
# Verilog 语法规则 — 语句
# ============================================================================

[Statement]
[Statement.parser]
production = [
    "@IfStatement|@BeginEnd|@NonBlockingAssign|@BlockingAssign|@AlwaysBlock|@CaseStatement|@AssignStatement|@LocalParamDecl|@FuncDecl|@TaskDecl|@SubroutineCall",
]
inline = true
[Statement.parser.node]
stmt = "$1"
[Statement.renderer]
layout = { ref = "stmt" }

[IfStatement]
[IfStatement.parser]
production = [
    "keyword.if",
    "bracket.l_parentheses",
    "@Expression",
    "bracket.r_parentheses",
    "@Statement",
    "@ElseChain?",
]
end_case = ["newline"]
[IfStatement.parser.node]
condition = "$3"
then_stmt = "$5"
else_chain = "$6"
[IfStatement.renderer]
layout = { line = [
    "if (",
    { ref = "condition" },
    ") ",
    { ref = "then_stmt" },
    " ",
    { ref = "else_chain" },
] }

[ElseChain]
[ElseChain.parser]
production = ["@ElseIf|@ElseBranch"]
inline = true
[ElseChain.parser.node]
branch = "$1"
[ElseChain.renderer]
layout = { ref = "branch" }

[ElseIf]
[ElseIf.parser]
production = [
    "keyword.else",
    "keyword.if",
    "bracket.l_parentheses",
    "@Expression",
    "bracket.r_parentheses",
    "@Statement",
    "@ElseChain?",
]
[ElseIf.parser.node]
condition = "$4"
then_stmt = "$6"
else_chain = "$7"
[ElseIf.renderer]
layout = { line = [
    "else if (",
    { ref = "condition" },
    ") ",
    { ref = "then_stmt" },
    " ",
    { ref = "else_chain" },
] }

[ElseBranch]
[ElseBranch.parser]
production = ["keyword.else", "@Statement"]
[ElseBranch.parser.node]
body = "$2"
[ElseBranch.renderer]
layout = { line = ["else ", { ref = "body" }] }
body = { role = "direct" }

[NonBlockingAssign]
[NonBlockingAssign.parser]
production = [
    "@Identifier",
    "symbol.extend.lesser_equal",
    "@Expression",
    "symbol.base.semicolon",
]
end_case = ["newline"]
[NonBlockingAssign.parser.node]
target = "$1"
value = "$3"
[NonBlockingAssign.renderer]
layout = { line = [{ ref = "target" }, " <= ", { ref = "value" }, ";"] }

[BlockingAssign]
[BlockingAssign.parser]
production = ["@Identifier", "symbol.base.equal", "@Expression", "symbol.base.semicolon"]
end_case = ["newline"]
[BlockingAssign.parser.node]
target = "$1"
value = "$3"
[BlockingAssign.renderer]
layout = { line = [{ ref = "target" }, " = ", { ref = "value" }, ";"] }

[CaseStatement]
[CaseStatement.parser]
production = [
    "keyword.case",
    "bracket.l_parentheses",
    "@Expression",
    "bracket.r_parentheses",
    "@CaseItemList",
    "keyword.endcase",
]
end_case = ["newline"]
[CaseStatement.parser.node]
expr = "$3"
items = "$5"
[CaseStatement.renderer]
head = { line = ["case (", { ref = "expr" }, ")"] }
body = { indent = true, source = "items" }
tail = { text = "endcase", break = 1 }

[CaseItemList]
[CaseItemList.parser]
production = ["@CaseItem|@DefaultItem", "(@CaseItem|@DefaultItem)*"]
[CaseItemList.parser.node]
items = ["$1", "$2.items"]
[CaseItemList.renderer]
layout = { join = "\n", items = "items" } # 统一列表

[CaseItem]
[CaseItem.parser]
production = ["@Expression", "symbol.base.colon", "@Statement"]
end_case = ["newline"]
[CaseItem.parser.node]
value = "$1"
stmt = "$3"
[CaseItem.renderer]
layout = { line = [{ ref = "value" }, ": ", { ref = "stmt" }] }

[DefaultItem]
[DefaultItem.parser]
production = ["keyword.default", "symbol.base.colon", "@Statement"]
end_case = ["newline"]
[DefaultItem.parser.node]
stmt = "$3"
[DefaultItem.renderer]
layout = { line = ["default: ", { ref = "stmt" }] }

[AssignStatement]
[AssignStatement.parser]
production = [
    "keyword.assign",
    "@Identifier",
    "symbol.base.equal",
    "@Expression",
    "symbol.base.semicolon",
]
end_case = ["newline"]
[AssignStatement.parser.node]
target = "$2"
value = "$4"
[AssignStatement.renderer]
layout = { line = [
    "assign ",
    { ref = "target" },
    " = ",
    { ref = "value" },
    ";",
] }

# ============================================================================
# 函数声明
# ============================================================================

[FuncDecl]
[FuncDecl.parser]
production = [
    "keyword.function",
    "@Identifier",
    "symbol.base.semicolon",
    "@Block",
    "keyword.endfunction",
]
end_case = ["keyword.endfunction"]
[FuncDecl.parser.node]
func_name = "$2"
body = "$4"

[FuncDecl.analyzer]
scope = { name_attr = "func_name", kind = "function" }

[FuncDecl.renderer]
head = { line = [
    "function ",
    { ref = "func_name" },
    ";",
] }
body = { indent = true, source = "body" }
tail = { text = "endfunction", break = 2 }

# ============================================================================
# 任务声明
# ============================================================================

[TaskDecl]
[TaskDecl.parser]
production = [
    "keyword.task",
    "@Identifier",
    "symbol.base.semicolon",
    "@Block",
    "keyword.endtask",
]
end_case = ["keyword.endtask"]
[TaskDecl.parser.node]
task_name = "$2"
body = "$4"

[TaskDecl.analyzer]
scope = { name_attr = "task_name", kind = "task" }

[TaskDecl.renderer]
head = { line = [
    "task ",
    { ref = "task_name" },
    ";",
] }
body = { indent = true, source = "body" }
tail = { text = "endtask", break = 2 }

# ============================================================================
# 子程序调用（任务调用、函数调用作为独立语句）
# ============================================================================

[SubroutineCall]
[SubroutineCall.parser]
production = ["@Identifier", "symbol.base.semicolon"]
end_case = ["newline"]
[SubroutineCall.parser.node]
callee = "$1"
[SubroutineCall.renderer]
layout = { line = [{ ref = "callee" }, ";"] }

[ArgumentList]
layout = { join = ", ", items = "items" }
production = ["@Expression", "(symbol.base.comma,@Expression)*"]
[ArgumentList.node]
items = ["$1", "$2.items"]
