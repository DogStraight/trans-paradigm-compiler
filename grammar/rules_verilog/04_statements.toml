# ============================================================================
# Verilog 语法规则 — 语句
# ============================================================================

[Statement]
production = ["@IfStatement|@BeginEnd|@NonBlockingAssign|@BlockingAssign|@AlwaysBlock|@CaseStatement|@AssignStatement|@CaseItem|@DefaultItem"]
inline = true
[Statement.node]
stmt = "$1"

[IfStatement]
production = [
    "keyword.if",
    "bracket.l_parentheses",
    "@Expression",
    "bracket.r_parentheses",
    "@Statement",
    "@ElseChain?",
]
end_case = ["newline"]
[IfStatement.node]
condition = "$3"
then_stmt = "$5"
else_chain = "$6"

[ElseChain]
production = ["@ElseIf|@ElseBranch"]
inline = true
[ElseChain.node]
branch = "$1"

[ElseIf]
production = ["keyword.else", "keyword.if", "bracket.l_parentheses", "@Expression", "bracket.r_parentheses", "@Statement", "@ElseChain?"]
[ElseIf.node]
condition = "$4"
then_stmt = "$6"
else_chain = "$7"

[ElseBranch]
production = ["keyword.else", "@Statement"]
[ElseBranch.node]
body = "$2"

[NonBlockingAssign]
production = ["id", "symbol.extend.lesser_equal", "@Expression", "symbol.base.semicolon"]
end_case = ["newline"]
[NonBlockingAssign.node]
target = "$1"
value = "$3"

[BlockingAssign]
production = ["id", "symbol.base.equal", "@Expression", "symbol.base.semicolon"]
end_case = ["newline"]
[BlockingAssign.node]
target = "$1"
value = "$3"

[CaseStatement]
production = ["keyword.case", "bracket.l_parentheses", "@Expression", "bracket.r_parentheses", "@CaseItemList", "keyword.endcase"]
end_case = ["newline"]
[CaseStatement.node]
expr = "$3"
items = "$5"

[CaseItemList]
production = ["@CaseItem|@DefaultItem", "(@CaseItem|@DefaultItem)*"]
[CaseItemList.node]
first = "$1"
rest = "$2"

[CaseItem]
production = ["@Expression", "symbol.base.colon", "@Statement"]
end_case = ["newline"]
[CaseItem.node]
value = "$1"
stmt = "$3"

[DefaultItem]
production = ["keyword.default", "symbol.base.colon", "@Statement"]
end_case = ["newline"]
[DefaultItem.node]
stmt = "$3"

[AssignStatement]
production = ["keyword.assign", "id", "symbol.base.equal", "@Expression", "symbol.base.semicolon"]
end_case = ["newline"]
[AssignStatement.node]
target = "$2"
value = "$4"
