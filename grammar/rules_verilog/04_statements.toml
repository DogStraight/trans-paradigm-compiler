# ============================================================================
# Verilog 语法规则 — 语句
# ============================================================================

[Statement]
layout = { ref = "stmt" }
production = [
    "@IfStatement|@BeginEnd|@NonBlockingAssign|@BlockingAssign|@AlwaysBlock|@CaseStatement|@AssignStatement|@LocalParamDecl",
]
inline = true
[Statement.node]
stmt = "$1"

[IfStatement]
layout = { line = [
    "if (",
    { ref = "condition" },
    ") ",
    { ref = "then_stmt" },
    " ",
    { ref = "else_chain" },
] }
production = [
    "keyword.if",
    "bracket.l_parentheses",
    "@Expression",
    "bracket.r_parentheses",
    "@Statement",
    "@ElseChain?",
]
end_case = ["newline"]
[IfStatement.node]
condition = "$3"
then_stmt = "$5"
else_chain = "$6"

[ElseChain]
layout = { ref = "branch" }
production = ["@ElseIf|@ElseBranch"]
inline = true
[ElseChain.node]
branch = "$1"

[ElseIf]
layout = { line = [
    "else if (",
    { ref = "condition" },
    ") ",
    { ref = "then_stmt" },
    " ",
    { ref = "else_chain" },
] }
production = [
    "keyword.else",
    "keyword.if",
    "bracket.l_parentheses",
    "@Expression",
    "bracket.r_parentheses",
    "@Statement",
    "@ElseChain?",
]
[ElseIf.node]
condition = "$4"
then_stmt = "$6"
else_chain = "$7"

[ElseBranch]
body_role = "direct"
layout = { line = ["else ", { ref = "body" }] }
production = ["keyword.else", "@Statement"]
[ElseBranch.node]
body = "$2"

[NonBlockingAssign]
layout = { line = [{ ref = "target" }, " <= ", { ref = "value" }, ";"] }
production = [
    "id",
    "symbol.extend.lesser_equal",
    "@Expression",
    "symbol.base.semicolon",
]
end_case = ["newline"]
[NonBlockingAssign.node]
target = "$1"
value = "$3"

[BlockingAssign]
layout = { line = [{ ref = "target" }, " = ", { ref = "value" }, ";"] }
production = ["id", "symbol.base.equal", "@Expression", "symbol.base.semicolon"]
end_case = ["newline"]
[BlockingAssign.node]
target = "$1"
value = "$3"

[CaseStatement]
head = { line = ["case (", { ref = "expr" }, ")"] }
body = { indent = true, source = "items" }
tail = "endcase"
production = [
    "keyword.case",
    "bracket.l_parentheses",
    "@Expression",
    "bracket.r_parentheses",
    "@CaseItemList",
    "keyword.endcase",
]
end_case = ["newline"]
[CaseStatement.node]
expr = "$3"
items = "$5"

[CaseItemList]
layout = { join = "\n" }
production = ["@CaseItem|@DefaultItem", "(@CaseItem|@DefaultItem)*"]
[CaseItemList.node]
items = ["$1", "$2.items"] # 统一列表

[CaseItem]
layout = { line = [{ ref = "value" }, ": ", { ref = "stmt" }] }
production = ["@Expression", "symbol.base.colon", "@Statement"]
end_case = ["newline"]
[CaseItem.node]
value = "$1"
stmt = "$3"

[DefaultItem]
layout = { line = ["default: ", { ref = "stmt" }] }
production = ["keyword.default", "symbol.base.colon", "@Statement"]
end_case = ["newline"]
[DefaultItem.node]
stmt = "$3"

[AssignStatement]
layout = { line = [
    "assign ",
    { ref = "target" },
    " = ",
    { ref = "value" },
    ";",
] }
production = [
    "keyword.assign",
    "id",
    "symbol.base.equal",
    "@Expression",
    "symbol.base.semicolon",
]
end_case = ["newline"]
[AssignStatement.node]
target = "$2"
value = "$4"
