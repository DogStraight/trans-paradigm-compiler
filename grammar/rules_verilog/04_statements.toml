# ============================================================================
# Verilog 语法规则 — 语句
# ============================================================================

[Statement]
production = [
    "@IfStatement|@BeginEnd|@NonBlockingAssign|@BlockingAssign|@AlwaysBlock|@CaseStatement|@AssignStatement|@LocalParamDecl",
]
inline = true
template = "{{ stmt }}"
[Statement.node]
stmt = "$1"

[IfStatement]
production = [
    "keyword.if",
    "bracket.l_parentheses",
    "@Expression",
    "bracket.r_parentheses",
    "@Statement",
    "@ElseChain?",
]
end_case = ["newline"]
template = """    if ({{ condition }})
{{ then_stmt }}{{#else_chain}}{{?condition}} else if ({{ condition }})
{{ body }}{{/condition}}{{!condition}} else
{{ body }}{{/condition}}{{/else_chain}}"""
[IfStatement.node]
condition = "$3"
then_stmt = "$5"
else_chain = "$6"

[ElseChain]
production = ["@ElseIf|@ElseBranch"]
inline = true
template = "{{ branch }}"
[ElseChain.node]
branch = "$1"

[ElseIf]
production = [
    "keyword.else",
    "keyword.if",
    "bracket.l_parentheses",
    "@Expression",
    "bracket.r_parentheses",
    "@Statement",
    "@ElseChain?",
]
template = """    else if ({{ condition }})
{{ body }}"""
[ElseIf.node]
condition = "$4"
then_stmt = "$6"
else_chain = "$7"

[ElseBranch]
production = ["keyword.else", "@Statement"]
template = "    else\n{{ body }}"
[ElseBranch.node]
body = "$2"

[NonBlockingAssign]
production = [
    "id",
    "symbol.extend.lesser_equal",
    "@Expression",
    "symbol.base.semicolon",
]
end_case = ["newline"]
template = "{{ target }} <= {{ value }};\n"
[NonBlockingAssign.node]
target = "$1"
value = "$3"

[BlockingAssign]
production = ["id", "symbol.base.equal", "@Expression", "symbol.base.semicolon"]
end_case = ["newline"]
template = "{{ target }} = {{ value }};\n"
[BlockingAssign.node]
target = "$1"
value = "$3"

[CaseStatement]
production = [
    "keyword.case",
    "bracket.l_parentheses",
    "@Expression",
    "bracket.r_parentheses",
    "@CaseItemList",
    "keyword.endcase",
]
end_case = ["newline"]
template = "    case ({{ expr }}){{#items}}\n        {{.}}{{/items}}\n    endcase\n"
[CaseStatement.node]
expr = "$3"
items = "$5"

[CaseItemList]
production = ["@CaseItem|@DefaultItem", "(@CaseItem|@DefaultItem)*"]
[CaseItemList.node]
first = "$1"
rest = "$2"

[CaseItem]
production = ["@Expression", "symbol.base.colon", "@Statement"]
end_case = ["newline"]
template = "{{ value }}: {{ stmt }}"
[CaseItem.node]
value = "$1"
stmt = "$3"

[DefaultItem]
production = ["keyword.default", "symbol.base.colon", "@Statement"]
end_case = ["newline"]
template = "default: {{ stmt }}"
[DefaultItem.node]
stmt = "$3"

[AssignStatement]
production = [
    "keyword.assign",
    "id",
    "symbol.base.equal",
    "@Expression",
    "symbol.base.semicolon",
]
end_case = ["newline"]
template = "    assign {{ target }} = {{ value }};"
[AssignStatement.node]
target = "$2"
value = "$4"
