# ============================================================================
# Verilog 语法规则 — 语句（组合分层）
# ============================================================================

# ---------- 原子组 1：通用控制流和过程赋值 ----------
[BasicStmt]
[BasicStmt.parser]
production = [
    "@IfBlock|@IfStmt|@BeginEnd|@NonBlockingAssign|@BlockingAssign|@CaseStatement|@ForLoopBlock|@ForLoop|@SubroutineCall|@NullStmt",
]
inline = true
[BasicStmt.parser.node]
stmt = "$1"
[BasicStmt.renderer]
layout = { ref = "stmt" }

# 非 begin/end 语句体（用于 for 循环等需要区分体类型的场景）
[NonBlockStmt]
[NonBlockStmt.parser]
production = ["@IfBlock|@IfStmt|@NonBlockingAssign|@BlockingAssign|@CaseStatement|@ForLoopBlock|@ForLoop|@SubroutineCall|@NullStmt"]
inline = true
[NonBlockStmt.parser.node]
stmt = "$1"
[NonBlockStmt.renderer]
layout = { ref = "stmt" }

# ---------- 原子组 2：过程内部局部声明 ----------
[ProcLocalDecl]
[ProcLocalDecl.parser]
production = ["@RegDecl|@IntegerDecl"]
inline = true
[ProcLocalDecl.parser.node]
decl = "$1"
[ProcLocalDecl.renderer]
layout = { ref = "decl" }

# ---------- 过程语句（用于 always / initial 内部） ----------
[Statement]
[Statement.parser]
production = ["@BasicStmt|@ProcLocalDecl"]
inline = true
[Statement.parser.node]
stmt = "$1"
[Statement.renderer]
layout = { ref = "stmt" }

# ---------- 任务/函数语句（额外允许 TaskPortDecl） ----------
[TaskStatement]
[TaskStatement.parser]
production = ["@BasicStmt|@ProcLocalDecl|@TaskPortDecl"]
inline = true
[TaskStatement.parser.node]
stmt = "$1"
[TaskStatement.renderer]
layout = { ref = "stmt" }

# ---------- 模块顶层条目（用于 module 体） ----------
[ModuleItem]
[ModuleItem.parser]
production = [
    "@AlwaysBlock|@AssignStatement|@ModuleInst|@GenerateBlock|@BodyPortDecl|@WireDecl|@RegDecl|@IntegerDecl|@LocalParamDecl|@FuncDecl|@TaskDecl|@GenvarDecl",
]
inline = true
[ModuleItem.parser.node]
item = "$1"
[ModuleItem.renderer]
layout = { ref = "item" }

# ---------- 以下所有具体语句规则保持不变，只调整内部引用的块 ----------
