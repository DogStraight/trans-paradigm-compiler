# ===== if 语句（IEEE 1364 BNF 合并）=====
# statement_or_null = ; | Statement | begin...end

[IfStatement]
[IfStatement.parser]
production = [
    "keyword.if",
    "bracket.l_parentheses",
    "@Expression",
    "bracket.r_parentheses",
    "@StatementOrNull",
    "@ElseChain?",
]
end_case = ["newline", "keyword.end", "keyword.else"]
recovery = { after = "keyword.if" }
[IfStatement.parser.node]
condition = "$3"
then_stmt = "$5"
else_chain = "$6"
[IfStatement.renderer]
layout = { line = [
    "if (",
    { ref = "condition" },
    ")",
    { break = true, indent = 1 },
    { ref = "then_stmt" },
    { opt = { line = [{ break = true, indent = 1 }, { ref = "else_chain" }] } },
] }

[ElseChain]
[ElseChain.parser]
production = ["@ElseBranch|@ElseIfStatement"]
inline = true
[ElseChain.parser.node]
branch = "$1"
[ElseChain.renderer]
layout = { ref = "branch" }

[ElseIfStatement]
[ElseIfStatement.parser]
production = [
    "keyword.else",
    "keyword.if",
    "bracket.l_parentheses",
    "@Expression",
    "bracket.r_parentheses",
    "@StatementOrNull",
    "@ElseChain?",
]
recovery = { after = "keyword.else" }
[ElseIfStatement.parser.node]
condition = "$4"
then_stmt = "$6"
else_chain = "$7"
[ElseIfStatement.renderer]
layout = { line = [
    "else if (",
    { ref = "condition" },
    ")",
    { break = true, indent = 1 },
    { ref = "then_stmt" },
    { opt = { line = [{ break = true, indent = 1 }, { ref = "else_chain" }] } },
] }

[ElseBranch]
[ElseBranch.parser]
production = ["keyword.else", "@StatementOrNull"]
recovery = { after = "keyword.else" }
[ElseBranch.parser.node]
body = "$2"
[ElseBranch.renderer]
layout = { line = [
    "else",
    { break = true, indent = 1 },
    { ref = "body" },
] }
