# ============================================================================
# Verilog 语法规则 — 端口与声明
# ============================================================================

[PortList]
layout = { join = ", " }
production = ["@PortDecl", "(symbol.base.comma,@PortDecl)*"]

[repeat]
layout = { join = "", items = "children" }

[sequence]
production = ["@PortDecl", "(symbol.base.comma,@PortDecl)*"]
[PortList.node]
first = "$1"
rest = "$2"

[PortDecl]
layout = { line = [{ ref = "direction" }, { opt = { group = [" ", { ref = "port_type" }] } }, { opt = { group = [" [", { ref = "range" }, "]"] } }, " ", { ref = "port_name" }] }
production = [
    "keyword.input|keyword.output|keyword.inout",
    "@OptType?",
    "@Range?",
    "id",
]
end_case = [
    "symbol.base.comma",
    "bracket.r_parentheses",
    "newline",
    "space.dedent",
]
symbol_kind = "port"
symbol_name = "port_name"
[PortDecl.node]
direction = "$1"
port_type = "$2"
range = "$3"
port_name = "$4"

[OptType]
layout = { ref = "type_desc" }
production = ["keyword.wire|keyword.reg"]
inline = true
[OptType.node]
type_desc = "$1"

[Range]
layout = { line = [{ ref = "msb" }, ":", { ref = "lsb" }] }
production = [
    "bracket.l_square_bracket",
    "@Expression",
    "symbol.base.colon",
    "@Expression",
    "bracket.r_square_bracket",
]
[Range.node]
msb = "$2"
lsb = "$4"

[WireDecl]
layout = { line = ["wire ", { opt = { group = ["[", { ref = "range" }, "]"] } }, " ", { ref = "wire_name" }, ";"] }
production = ["keyword.wire", "@Range?", "id", "symbol.base.semicolon"]
end_case = ["newline"]
symbol_kind = "wire"
symbol_name = "wire_name"
[WireDecl.node]
wire_type = "$1"
range = "$2"
wire_name = "$3"

[RegDecl]
layout = { line = ["reg ", { opt = { group = ["[", { ref = "range" }, "]"] } }, " ", { ref = "reg_name" }, ";"] }
production = ["keyword.reg", "@Range?", "id", "symbol.base.semicolon"]
end_case = ["newline"]
symbol_kind = "reg"
symbol_name = "reg_name"
[RegDecl.node]
reg_type = "$1"
range = "$2"
reg_name = "$3"

[LocalParamDecl]
layout = { line = ["localparam ", { join = ",", items = "items" }, ";"] }
production = [
    "keyword.localparam",
    "@LocalParamItemList",
    "symbol.base.semicolon",
]
end_case = ["newline"]
symbol_kind = "localparam"
symbol_name = "items"
[LocalParamDecl.node]
items = "$2"

[LocalParamItemList]
layout = { join = "," }
production = ["@LocalParamItem", "(symbol.base.comma,@LocalParamItem)*"]
[LocalParamItemList.node]
first = "$1"
rest = "$2"

[LocalParamItem]
layout = { line = [{ ref = "param_name" }, " = ", { ref = "value" }] }
production = ["id", "symbol.base.equal", "@Expression"]
[LocalParamItem.node]
param_name = "$1"
value = "$3"
