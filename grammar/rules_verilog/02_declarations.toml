# ============================================================================
# Verilog 语法规则 — 端口与声明
# ============================================================================

[PortList]
layout = { join = ", ", first_soft = true, nest = 1 }
production = ["@PortDecl", "(symbol.base.comma,@PortDecl)*"]
[PortList.node]
items = ["$1", "$2.items"] # 统一列表

# ============================================================================
# 端口声明分支（wire 端口 / reg 端口）
# ============================================================================

[PortDecl]
layout = { ref = "decl" }
production = ["@WirePortDecl|@RegPortDecl"]
inline = true
[PortDecl.node]
decl = "$1"

# ----- wire 端口（input / output / inout，可选 wire 关键字，无初始化）-----
[WirePortDecl]
layout = { line = [
    { ref = "direction" },
    { opt = { group = [
        " ",
        { ref = "port_type" },
    ] } },
    { opt = { group = [
        " [",
        { ref = "range" },
        "]",
    ] } },
    " ",
    { ref = "port_name" },
] }
production = [
    "keyword.input|keyword.output|keyword.inout",
    "keyword.wire?",
    "@Range?",
    "id",
]
end_case = [
    "symbol.base.comma",
    "bracket.r_parentheses",
    "newline",
    "space.dedent",
]
symbol_kind = "port"
symbol_name = "port_name"
[WirePortDecl.node]
direction = "$1"
port_type = "$2"
range = "$3"
port_name = "$4"

# ----- reg 端口（仅 output，必须有 reg，允许初始化）-----
[RegPortDecl]
layout = { line = [
    "output ",
    "reg ",
    { opt = { group = [
        "[",
        { ref = "range" },
        "]",
    ] } },
    " ",
    { ref = "port_name" },
    { opt = { group = [
        " = ",
        { ref = "init" },
    ] } },
] }
production = ["keyword.output", "keyword.reg", "@Range?", "id", "@PortInit?"]
end_case = [
    "symbol.base.comma",
    "bracket.r_parentheses",
    "newline",
    "space.dedent",
]
symbol_kind = "port"
symbol_name = "port_name"
[RegPortDecl.node]
direction = "output"
range = "$3"
port_name = "$4"
init = "$5"

# 端口初始化（用于 reg 端口）
[PortInit]
layout = { line = ["= ", { ref = "value" }] }
production = ["symbol.base.equal", "@Expression"]
inline = true
[PortInit.node]
value = "$2"

# ============================================================================
# 范围声明（共用）
# ============================================================================

[Range]
layout = { line = [{ ref = "msb" }, ":", { ref = "lsb" }] }
production = [
    "bracket.l_square_bracket",
    "@Expression",
    "symbol.base.colon",
    "@Expression",
    "bracket.r_square_bracket",
]
[Range.node]
msb = "$2"
lsb = "$4"

# ============================================================================
# 内部 wire / reg / localparam 声明
# ============================================================================

[WireDecl]
layout = { line = [
    "wire ",
    { opt = { group = [
        "[",
        { ref = "range" },
        "]",
    ] } },
    " ",
    { ref = "wire_name" },
    ";",
] }
production = ["keyword.wire", "@Range?", "id", "symbol.base.semicolon"]
end_case = ["newline"]
symbol_kind = "wire"
symbol_name = "wire_name"
[WireDecl.node]
wire_type = "$1"
range = "$2"
wire_name = "$3"

[RegDecl]
layout = { line = [
    "reg ",
    { opt = { group = [
        "[",
        { ref = "range" },
        "]",
    ] } },
    " ",
    { ref = "reg_name" },
    { opt = { group = [
        " = ",
        { ref = "init" },
    ] } },
    ";",
] }
production = [
    "keyword.reg",
    "@Range?",
    "id",
    "@RegInit?",
    "symbol.base.semicolon",
]
end_case = ["newline"]
symbol_kind = "reg"
symbol_name = "reg_name"
[RegDecl.node]
reg_type = "$1"
range = "$2"
reg_name = "$3"
init = "$4"

# 内部 reg 初始化
[RegInit]
layout = { line = ["= ", { ref = "value" }] }
production = ["symbol.base.equal", "@Expression"]
inline = true
[RegInit.node]
value = "$2"

[LocalParamDecl]
layout = { line = ["localparam ", { join = ",", items = "items" }, ";"] }
production = [
    "keyword.localparam",
    "@LocalParamItemList",
    "symbol.base.semicolon",
]
end_case = ["newline"]
symbol_kind = "localparam"
symbol_name = "items.sub_node.param_name"
[LocalParamDecl.node]
items = "$2"

[LocalParamItemList]
layout = { join = "," }
production = ["@LocalParamItem", "(symbol.base.comma,@LocalParamItem)*"]
[LocalParamItemList.node]
items = ["$1", "$2.items"]

[LocalParamItem]
layout = { line = [{ ref = "param_name" }, " = ", { ref = "value" }] }
production = ["id", "symbol.base.equal", "@Expression"]
[LocalParamItem.node]
param_name = "$1"
value = "$3"
