# ============================================================================
# Verilog 语法规则 — 端口与声明
# ============================================================================

[PortList]
[PortList.parser]
production = ["@PortDecl", "(symbol.base.comma,(@PortDecl|@PortIdRef))*"]
[PortList.parser.node]
items = ["$1", "$2.items"]
[PortList.renderer]
layout = { join = ", ", first_soft = true, nest = 1, items = "items" } # 统一列表

# ----- 端口引用（用于 input reg [7:0] a, b 中的 b）-----
[PortIdRef]
[PortIdRef.parser]
production = ["@Identifier"]
[PortIdRef.parser.node]
port_name = "$1"
[PortIdRef.analyzer]
symbol = { kind = "port", name_attr = "port_name" }
[PortIdRef.renderer]
layout = { ref = "port_name" }

# ============================================================================
# 端口声明分支（wire 端口 / reg 端口）
# ============================================================================

[PortDecl]
[PortDecl.parser]
production = ["@WirePortDecl|@RegPortDecl"]
inline = true
[PortDecl.parser.node]
decl = "$1"
[PortDecl.renderer]
layout = { ref = "decl" }

# ----- 函数/任务体端口声明（旧风格 input [7:0] x, y;，优先于 WirePortDecl）-----
[BodyPortDecl]
[BodyPortDecl.parser]
production = [
    "keyword.input|keyword.output|keyword.inout",
    "(keyword.wire|keyword.reg)?",
    "@Range?",
    "@Identifier",
    "(symbol.base.comma,@Identifier)*",
    "symbol.base.semicolon",
]
end_case = ["newline"]
[BodyPortDecl.parser.node]
direction = "$1"
port_type = "$2"
range = "$3"
names = ["$4", "$5.items"]
[BodyPortDecl.analyzer]
symbol = { kind = "port", name_attr = "names.content" }
[BodyPortDecl.renderer]
layout = { line = [
    { ref = "direction" },
    { opt = { group = [" ", { ref = "port_type" }] } },
    { opt = { group = [" [", { ref = "range" }, "]"] } },
    " ",
    { join = ", ", items = "names" },
    ";",
] }

# ----- wire 端口（input / output / inout，可选 wire 关键字，无初始化）-----
[WirePortDecl]
[WirePortDecl.parser]
production = [
    "keyword.input|keyword.output|keyword.inout",
    "(keyword.wire|keyword.reg)?",
    "@Range?",
    "@Identifier",
    "symbol.base.semicolon?",
]
end_case = [
    "symbol.base.semicolon",
    "symbol.base.comma",
    "bracket.r_parentheses",
    "newline",
    "space.dedent",
]
[WirePortDecl.parser.node]
direction = "$1"
port_type = "$2"
range = "$3"
port_name = "$4"
semi = "$5"
[WirePortDecl.analyzer]
symbol = { kind = "port", name_attr = "port_name" }
[WirePortDecl.renderer]
layout = { line = [
    { ref = "direction" },
    { opt = { group = [
        " ",
        { ref = "port_type" },
    ] } },
    { opt = { group = [
        " [",
        { ref = "range" },
        "]",
    ] } },
    " ",
    { ref = "port_name" },
    { opt = { ref = "semi" } },
] }
# ----- reg 端口（仅 output，必须有 reg，允许初始化）-----
[RegPortDecl]
[RegPortDecl.parser]
production = ["keyword.output", "keyword.reg", "@Range?", "@Identifier", "@PortInit?", "symbol.base.semicolon?"]
end_case = [
    "symbol.base.semicolon",
    "symbol.base.comma",
    "bracket.r_parentheses",
    "newline",
    "space.dedent",
]
[RegPortDecl.parser.node]
direction = "output"
range = "$3"
port_name = "$4"
init = "$5"
semi = "$6"
[RegPortDecl.analyzer]
symbol = { kind = "port", name_attr = "port_name" }
[RegPortDecl.renderer]
layout = { line = [
    "output ",
    "reg ",
    { opt = { group = [
        "[",
        { ref = "range" },
        "]",
    ] } },
    " ",
    { ref = "port_name" },
    { opt = { group = [
        " = ",
        { ref = "init" },
    ] } },
    { opt = { ref = "semi" } },
] }

# 端口初始化（用于 reg 端口）
[PortInit]
[PortInit.parser]
production = ["symbol.base.equal", "@Expression"]
inline = true
[PortInit.parser.node]
value = "$2"
[PortInit.renderer]
layout = { line = ["= ", { ref = "value" }] }

# ============================================================================
# 范围声明（共用）
# ============================================================================

[Range]
[Range.parser]
production = [
    "bracket.l_square_bracket",
    "@Expression",
    "symbol.base.colon",
    "@Expression",
    "bracket.r_square_bracket",
]
[Range.parser.node]
msb = "$2"
lsb = "$4"
[Range.renderer]
layout = { line = [{ ref = "msb" }, ":", { ref = "lsb" }] }

# ============================================================================
# 内部 wire / reg / localparam 声明
# ============================================================================

[WireDecl]
[WireDecl.parser]
production = ["keyword.wire", "@Range?", "@Identifier", "@Range?", "symbol.base.semicolon"]
end_case = ["newline"]
[WireDecl.parser.node]
wire_type = "$1"
range = "$2"
wire_name = "$3"
array_range = "$4"
[WireDecl.analyzer]
symbol = { kind = "wire", name_attr = "wire_name" }
[WireDecl.renderer]
layout = { line = [
    "wire ",
    { opt = { group = [
        "[",
        { ref = "range" },
        "]",
    ] } },
    " ",
    { ref = "wire_name" },
    { opt = { group = [
        "[",
        { ref = "array_range" },
        "]",
    ] } },
    ";",
] }

[RegDecl]
[RegDecl.parser]
production = [
    "keyword.reg",
    "@Range?",
    "@Identifier",
    "@Range?",
    "@RegInit?",
    "symbol.base.semicolon",
]
end_case = ["newline"]
[RegDecl.parser.node]
reg_type = "$1"
range = "$2"
reg_name = "$3"
array_range = "$4"
init = "$5"
[RegDecl.analyzer]
symbol = { kind = "reg", name_attr = "reg_name" }
[RegDecl.renderer]
layout = { line = [
    "reg ",
    { opt = { group = [
        "[",
        { ref = "range" },
        "]",
    ] } },
    " ",
    { ref = "reg_name" },
    { opt = { group = [
        "[",
        { ref = "array_range" },
        "]",
    ] } },
    { opt = { group = [
        " = ",
        { ref = "init" },
    ] } },
    ";",
] }

# 内部 reg 初始化
[RegInit]
[RegInit.parser]
production = ["symbol.base.equal", "@Expression"]
inline = true
[RegInit.parser.node]
value = "$2"
[RegInit.renderer]
layout = { line = ["= ", { ref = "value" }] }

[IntegerDecl]
[IntegerDecl.parser]
production = [
    "keyword.integer",
    "@Identifier",
    "symbol.base.semicolon",
]
end_case = ["newline"]
[IntegerDecl.parser.node]
int_name = "$2"
[IntegerDecl.analyzer]
symbol = { kind = "integer", name_attr = "int_name" }
[IntegerDecl.renderer]
layout = { line = ["integer ", { ref = "int_name" }, ";"] }

[LocalParamDecl]
[LocalParamDecl.parser]
production = [
    "keyword.localparam",
    "@LocalParamItemList",
    "symbol.base.semicolon",
]
end_case = ["newline"]
[LocalParamDecl.parser.node]
items = "$2"
[LocalParamDecl.analyzer]
symbol = { kind = "localparam", name_attr = "items.sub_node.param_name" }
[LocalParamDecl.renderer]
layout = { line = ["localparam ", { join = ",", items = "items" }, ";"] }

[LocalParamItemList]
[LocalParamItemList.parser]
production = ["@LocalParamItem", "(symbol.base.comma,@LocalParamItem)*"]
[LocalParamItemList.parser.node]
items = ["$1", "$2.items"]
[LocalParamItemList.renderer]
layout = { join = ",", items = "items" }

[LocalParamItem]
[LocalParamItem.parser]
production = ["@Identifier", "symbol.base.equal", "@Expression"]
[LocalParamItem.parser.node]
param_name = "$1"
value = "$3"
[LocalParamItem.renderer]
layout = { line = [{ ref = "param_name" }, " = ", { ref = "value" }] }
