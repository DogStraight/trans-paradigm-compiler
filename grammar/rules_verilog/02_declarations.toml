# ============================================================================
# Verilog 语法规则 — 端口与声明（组合复用）
# ============================================================================

# ---------- 通用声明器（名称 + 数组范围 + 初始化）----------
[Declarator]
[Declarator.parser]
production = ["@Identifier", "@Range?", "@Init?"]
[Declarator.parser.node]
name = "$1"
array_range = "$2"
init = "$3"
[Declarator.renderer]
layout = { line = [
    { ref = "name" },
    { opt = { group = [
        "[",
        { ref = "array_range" },
        "]",
    ] } },
    { opt = { group = [
        " = ",
        { ref = "init" },
    ] } },
] }

[DeclaratorList]
[DeclaratorList.parser]
production = ["@Declarator", "(symbol.base.comma,@Declarator)*"]
[DeclaratorList.parser.node]
items = ["$1", "$2.items[*].sub_node[1]"]
[DeclaratorList.renderer]
layout = { join = ", ", items = "items" }

# ---------- 初始化与范围 ----------
[Init]
[Init.parser]
production = ["symbol.base.equal", "@Expression"]
inline = true
[Init.parser.node]
value = "$2"
[Init.renderer]
layout = { line = ["= ", { ref = "value" }] }

[Range]
[Range.parser]
production = [
    "bracket.l_square_bracket",
    "@Expression",
    "symbol.base.colon",
    "@Expression",
    "bracket.r_square_bracket",
]
[Range.parser.node]
msb = "$2"
lsb = "$4"
[Range.renderer]
layout = { line = [{ ref = "msb" }, ":", { ref = "lsb" }] }

# ============================================================================
# 模块 ANSI 端口（括号内，无分号）
# ============================================================================

[PortList]
[PortList.parser]
production = ["@AnsiPortDecl", "(symbol.base.comma,@AnsiPortDecl)*"]
[PortList.parser.node]
items = ["$1", "$2.items[*].sub_node[1]"]
[PortList.renderer]
layout = { join = ", ", first_soft = true, nest = 1, items = "items" }

[TaskPortList]
[TaskPortList.parser]
production = ["@TaskAnsiPortDecl", "(symbol.base.comma,@TaskAnsiPortDecl)*"]
[TaskPortList.parser.node]
items = ["$1", "$2.items[*].sub_node[1]"]
[TaskPortList.renderer]
layout = { join = ", ", first_soft = true, nest = 1, items = "items" }

[TaskAnsiPortDecl]
[TaskAnsiPortDecl.parser]
production = ["@TaskAnsiInputDecl|@AnsiOutputDecl|@AnsiInoutDecl"]
inline = true
[TaskAnsiPortDecl.parser.node]
decl = "$1"
[TaskAnsiPortDecl.renderer]
layout = { ref = "decl" }

[TaskAnsiInputDecl]
[TaskAnsiInputDecl.parser]
production = ["keyword.input", "(keyword.wire|keyword.reg)?", "@Range?", "@DeclaratorList"]
end_case = ["symbol.base.comma", "bracket.r_parentheses", "newline"]
[TaskAnsiInputDecl.parser.node]
direction = "input"
port_type = "$2"
packed_range = "$3"
items = "$4"
[TaskAnsiInputDecl.analyzer]
symbol = { kind = "port", name_attr = "items.name" }
[TaskAnsiInputDecl.renderer]
layout = { line = [
    "input",
    { opt = { group = [
        " ",
        { ref = "port_type" },
    ] } },
    { opt = { group = [
        " [",
        { ref = "packed_range" },
        "]",
    ] } },
    " ",
    { ref = "items" },
] }

[AnsiPortDecl]
[AnsiPortDecl.parser]
production = ["@AnsiInputDecl|@AnsiOutputDecl|@AnsiInoutDecl"]
inline = true
[AnsiPortDecl.parser.node]
decl = "$1"
[AnsiPortDecl.renderer]
layout = { ref = "decl" }

[AnsiInputDecl]
[AnsiInputDecl.parser]
production = ["keyword.input", "keyword.wire?", "@Range?", "@DeclaratorList"]
end_case = ["symbol.base.comma", "bracket.r_parentheses", "newline"]
[AnsiInputDecl.parser.node]
direction = "input"
port_type = "$2"
packed_range = "$3"
items = "$4"
[AnsiInputDecl.analyzer]
symbol = { kind = "port", name_attr = "items.name" }
[AnsiInputDecl.renderer]
layout = { line = [
    "input",
    { opt = { group = [
        " ",
        { ref = "port_type" },
    ] } },
    { opt = { group = [
        " [",
        { ref = "packed_range" },
        "]",
    ] } },
    " ",
    { ref = "items" },
] }

[AnsiOutputDecl]
[AnsiOutputDecl.parser]
production = [
    "keyword.output",
    "(keyword.wire|keyword.reg)?",
    "@Range?",
    "@DeclaratorList",
]
end_case = ["symbol.base.comma", "bracket.r_parentheses", "newline"]
[AnsiOutputDecl.parser.node]
direction = "output"
port_type = "$2"
packed_range = "$3"
items = "$4"
[AnsiOutputDecl.analyzer]
symbol = { kind = "port", name_attr = "items.name" }
[AnsiOutputDecl.renderer]
layout = { line = [
    "output",
    { opt = { group = [
        " ",
        { ref = "port_type" },
    ] } },
    { opt = { group = [
        " [",
        { ref = "packed_range" },
        "]",
    ] } },
    " ",
    { ref = "items" },
] }

[AnsiInoutDecl]
[AnsiInoutDecl.parser]
production = ["keyword.inout", "keyword.wire?", "@Range?", "@DeclaratorList"]
end_case = ["symbol.base.comma", "bracket.r_parentheses", "newline"]
[AnsiInoutDecl.parser.node]
direction = "inout"
port_type = "$2"
packed_range = "$3"
items = "$4"
[AnsiInoutDecl.analyzer]
symbol = { kind = "port", name_attr = "items.name" }
[AnsiInoutDecl.renderer]
layout = { line = [
    "inout",
    { opt = { group = [
        " ",
        { ref = "port_type" },
    ] } },
    { opt = { group = [
        " [",
        { ref = "packed_range" },
        "]",
    ] } },
    " ",
    { ref = "items" },
] }

# ============================================================================
# 模块旧风格端口（体内，带分号）—— input/inout 不允许 reg
# ============================================================================

[BodyPortDecl]
[BodyPortDecl.parser]
production = ["@BodyInputDecl|@BodyOutputDecl|@BodyInoutDecl"]
inline = true
[BodyPortDecl.parser.node]
decl = "$1"
[BodyPortDecl.renderer]
layout = { ref = "decl" }

[BodyInputDecl]
[BodyInputDecl.parser]
production = [
    "keyword.input",
    "keyword.wire?",
    "@Range?",
    "@DeclaratorList",
    "symbol.base.semicolon",
]
end_case = ["newline"]
[BodyInputDecl.parser.node]
direction = "input"
port_type = "$2"
packed_range = "$3"
items = "$4"
[BodyInputDecl.analyzer]
symbol = { kind = "port", name_attr = "items.name" }
[BodyInputDecl.renderer]
layout = { line = [
    "input",
    { opt = { group = [
        " ",
        { ref = "port_type" },
    ] } },
    { opt = { group = [
        " [",
        { ref = "packed_range" },
        "]",
    ] } },
    " ",
    { ref = "items" },
    ";",
] }

[BodyOutputDecl]
[BodyOutputDecl.parser]
production = [
    "keyword.output",
    "(keyword.wire|keyword.reg)?",
    "@Range?",
    "@DeclaratorList",
    "symbol.base.semicolon",
]
end_case = ["newline"]
[BodyOutputDecl.parser.node]
direction = "output"
port_type = "$2"
packed_range = "$3"
items = "$4"
[BodyOutputDecl.analyzer]
symbol = { kind = "port", name_attr = "items.name" }
[BodyOutputDecl.renderer]
layout = { line = [
    "output",
    { opt = { group = [
        " ",
        { ref = "port_type" },
    ] } },
    { opt = { group = [
        " [",
        { ref = "packed_range" },
        "]",
    ] } },
    " ",
    { ref = "items" },
    ";",
] }

[BodyInoutDecl]
[BodyInoutDecl.parser]
production = [
    "keyword.inout",
    "keyword.wire?",
    "@Range?",
    "@DeclaratorList",
    "symbol.base.semicolon",
]
end_case = ["newline"]
[BodyInoutDecl.parser.node]
direction = "inout"
port_type = "$2"
packed_range = "$3"
items = "$4"
[BodyInoutDecl.analyzer]
symbol = { kind = "port", name_attr = "items.name" }
[BodyInoutDecl.renderer]
layout = { line = [
    "inout",
    { opt = { group = [
        " ",
        { ref = "port_type" },
    ] } },
    { opt = { group = [
        " [",
        { ref = "packed_range" },
        "]",
    ] } },
    " ",
    { ref = "items" },
    ";",
] }

# ============================================================================
# 任务/函数专用端口（允许 input/inout 带 reg）
# ============================================================================

[TaskPortDecl]
[TaskPortDecl.parser]
production = ["@TaskInputDecl|@TaskOutputDecl|@TaskInoutDecl"]
inline = true
[TaskPortDecl.parser.node]
decl = "$1"
[TaskPortDecl.renderer]
layout = { ref = "decl" }

[TaskInputDecl]
[TaskInputDecl.parser]
production = [
    "keyword.input",
    "(keyword.wire|keyword.reg)?",
    "@Range?",
    "@DeclaratorList",
    "symbol.base.semicolon",
]
end_case = ["newline"]
[TaskInputDecl.parser.node]
direction = "input"
port_type = "$2"
packed_range = "$3"
items = "$4"
[TaskInputDecl.analyzer]
symbol = { kind = "port", name_attr = "items.name" }
[TaskInputDecl.renderer]
layout = { line = [
    "input ",
    { opt = { group = [
        " ",
        { ref = "port_type" },
    ] } },
    { opt = { group = [
        "[",
        { ref = "packed_range" },
        "] ",
    ] } },
    { ref = "items" },
    ";",
] }

[TaskOutputDecl]
[TaskOutputDecl.parser]
production = [
    "keyword.output",
    "(keyword.wire|keyword.reg)?",
    "@Range?",
    "@DeclaratorList",
    "symbol.base.semicolon",
]
end_case = ["newline"]
[TaskOutputDecl.parser.node]
direction = "output"
port_type = "$2"
packed_range = "$3"
items = "$4"
[TaskOutputDecl.analyzer]
symbol = { kind = "port", name_attr = "items.name" }
[TaskOutputDecl.renderer]
layout = { line = [
    "output ",
    { opt = { group = [
        " ",
        { ref = "port_type" },
    ] } },
    { opt = { group = [
        "[",
        { ref = "packed_range" },
        "] ",
    ] } },
    { ref = "items" },
    ";",
] }

[TaskInoutDecl]
[TaskInoutDecl.parser]
production = [
    "keyword.inout",
    "(keyword.wire|keyword.reg)?",
    "@Range?",
    "@DeclaratorList",
    "symbol.base.semicolon",
]
end_case = ["newline"]
[TaskInoutDecl.parser.node]
direction = "inout"
port_type = "$2"
packed_range = "$3"
items = "$4"
[TaskInoutDecl.analyzer]
symbol = { kind = "port", name_attr = "items.name" }
[TaskInoutDecl.renderer]
layout = { line = [
    "inout ",
    { opt = { group = [
        " ",
        { ref = "port_type" },
    ] } },
    { opt = { group = [
        "[",
        { ref = "packed_range" },
        "] ",
    ] } },
    { ref = "items" },
    ";",
] }

# ============================================================================
# 内部声明（wire / reg / integer / localparam / genvar）
# ============================================================================

[WireDecl]
[WireDecl.parser]
production = [
    "keyword.wire",
    "@Range?",
    "@DeclaratorList",
    "symbol.base.semicolon",
]
end_case = ["newline"]
[WireDecl.parser.node]
wire_type = "$1"
packed_range = "$2"
items = "$3"
[WireDecl.analyzer]
symbol = { kind = "wire", name_attr = "items.name" }
[WireDecl.renderer]
layout = { line = [
    "wire ",
    { opt = { group = [
        "[",
        { ref = "packed_range" },
        "] ",
    ] } },
    { ref = "items" },
    ";",
] }

[RegDecl]
[RegDecl.parser]
production = [
    "keyword.reg",
    "@Range?",
    "@DeclaratorList",
    "symbol.base.semicolon",
]
end_case = ["newline"]
[RegDecl.parser.node]
reg_type = "$1"
packed_range = "$2"
items = "$3"
[RegDecl.analyzer]
symbol = { kind = "reg", name_attr = "items.name" }
[RegDecl.renderer]
layout = { line = [
    "reg ",
    { opt = { group = [
        "[",
        { ref = "packed_range" },
        "] ",
    ] } },
    { ref = "items" },
    ";",
] }

[IntegerDecl]
[IntegerDecl.parser]
production = ["keyword.integer", "@DeclaratorList", "symbol.base.semicolon"]
end_case = ["newline"]
[IntegerDecl.parser.node]
items = "$2"
[IntegerDecl.analyzer]
symbol = { kind = "integer", name_attr = "items.name" }
[IntegerDecl.renderer]
layout = { line = ["integer ", { ref = "items" }, ";"] }

[LocalParamDecl]
[LocalParamDecl.parser]
production = ["keyword.localparam", "@DeclaratorList", "symbol.base.semicolon"]
end_case = ["newline"]
[LocalParamDecl.parser.node]
items = "$2"
[LocalParamDecl.analyzer]
symbol = { kind = "localparam", name_attr = "items.name" }
[LocalParamDecl.renderer]
layout = { line = ["localparam ", { ref = "items" }, ";"] }

[GenvarDecl]
[GenvarDecl.parser]
production = ["keyword.genvar", "@Identifier", "symbol.base.semicolon"]
end_case = ["newline"]
[GenvarDecl.parser.node]
genvar_name = "$2"
[GenvarDecl.analyzer]
symbol = { kind = "genvar", name_attr = "genvar_name" }
[GenvarDecl.renderer]
layout = { line = ["genvar ", { ref = "genvar_name" }, ";"] }
