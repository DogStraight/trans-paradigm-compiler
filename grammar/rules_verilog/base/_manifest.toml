# _manifest.toml — 配置加载元协议
#
# 定义每个管线阶段的配置加载链。
# 所有路径相对于语言根目录（rules_verilog/）。
# "base/" 指语言目录下的 base/ 子目录。
# merge = "deep"      递归合并，同名 key 后者覆盖前者
# merge = "override"  直接覆盖同名 section

[stages]

[stages.lexer]
merge = "deep"
files = [
    "base/token.toml",        # 基础词法声明（空白、符号、括号）
    "base/_lexer.toml",       # 词法行为（注释解析、缩进、token 分类）
    "_token.toml",            # 语言特有 token 补充（关键字、系统函数）
]

[stages.parser]
merge = "override"
files = [
    "_symbol_level.toml",     # 运算符优先级
    "00_blocks.toml",         # 语法规则
    "01_module.toml",
    "02_declarations.toml",
    "03_always.toml",
    "04_statements.toml",
    "05_expressions.toml",
]

[stages.renderer]
merge = "deep"
files = [
    "base/_style.toml",       # 渲染风格默认值
    "_style.toml",            # 语言覆盖（可选）
]
