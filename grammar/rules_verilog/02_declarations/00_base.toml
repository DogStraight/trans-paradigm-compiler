# ============================================================================
# Verilog 语法规则 — 端口与声明（组合复用）
# ============================================================================

[Declarator]
[Declarator.parser]
production = ["@Identifier", "@RangeBracket*", "@Init?"]
[Declarator.parser.node]
name = "$1"
array_range = "$2"
init = "$3"
[Declarator.renderer]
layout = { line = [
    { ref = "name" },
    { join = "", items = "array_range" },
    { opt = { group = [
        " = ",
        { ref = "init" },
    ] } },
] }

# 带括号的范围（用于数组维域：@RangeBracket* 实现 [0:3][0:7]）
[RangeBracket]
[RangeBracket.parser]
production = ["@Range"]
[RangeBracket.parser.node]
range = "$1"
[RangeBracket.renderer]
layout = { line = [
    "[",
    { ref = "range" },
    "]",
] }

[DeclaratorList]
[DeclaratorList.parser]
production = ["@Declarator", "(symbol.base.comma,@Declarator)*"]
[DeclaratorList.parser.node]
items = ["$1", "$2.items[*].sub_node[1]"]
[DeclaratorList.renderer]
layout = { join = ", ", items = "items", nest = 1 }

# ---------- 端口声明公共尾部（复用：input/output/inout × ANSI/Body/Task）----------
[PortTail]
[PortTail.parser]
production = ["(keyword.wire|keyword.reg)?", "keyword.signed?", "@Range?", "@DeclaratorList"]
[PortTail.parser.node]
port_type = "$1"
is_signed = "$2"
packed_range = "$3"
items = "$4"

# ---------- 初始化与范围 ----------
[Init]
[Init.parser]
production = ["symbol.base.equal", "@Expression"]
inline = true
[Init.parser.node]
value = "$2"
[Init.renderer]
layout = { line = ["= ", { ref = "value" }] }

[Range]
[Range.parser]
production = [
    "bracket.l_square_bracket",
    "@Expression",
    "symbol.base.colon",
    "@Expression",
    "bracket.r_square_bracket",
]
[Range.parser.node]
msb = "$2"
lsb = "$4"
[Range.renderer]
layout = { line = [{ ref = "msb" }, ":", { ref = "lsb" }] }

