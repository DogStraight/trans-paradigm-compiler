# ============================================================================
# Verilog 语法规则 — 顶层结构与块（重构为组合模式）
# ============================================================================

[Root]
[Root.parser]
is_block = true
recovery = { strategy = "consume_line" }

[Root.renderer]
layout = { join = "\n" }

# ----- Error 节点（语法错误恢复）-----
[Error]
[Error.renderer]
layout = { line = ["/* ERROR: ", { ref = "raw" }, " */"] }

# ----- 注释节点（语句级，自然继承 block 缩进）-----
[Comment]
[Comment.parser]
production = ["comment"]
end_case = []
[Comment.parser.node]
value = "$1.value"
[Comment.renderer]
layout = { ref = "value" }

# ----- 模块体（Module 内部）-----
[ModuleBlock]
[ModuleBlock.parser]
is_block = true
end_case = ["keyword.endmodule"]
recovery = { strategy = "consume_line" }
[ModuleBlock.renderer]
body = { indent = true, role = "flatten" }

# ----- 过程体（always / initial 内部）-----
[ProcBlock]
[ProcBlock.parser]
is_block = true
end_case = ["keyword.end"]
recovery = { strategy = "consume_line" }
[ProcBlock.renderer]
body = { indent = true, role = "flatten" }

# ----- 任务/函数体（task / function 内部）-----
[TaskBlock]
[TaskBlock.parser]
is_block = true
end_case = ["keyword.endfunction", "keyword.endtask"]
recovery = { strategy = "consume_line" }
[TaskBlock.renderer]
body = { indent = true, role = "flatten" }

# ----- Begin/End 块（显式关键字，非缩进）-----
[BeginEnd]
[BeginEnd.parser]
production = [
    "keyword.begin",
    "@BlockLabel?",
    "@ProcBlock",    # 内部使用过程块
    "keyword.end",
]
end_case = ["keyword.end", "newline"]
[BeginEnd.parser.node]
label = "$2"
body = "$3"

[BeginEnd.renderer]
head = { line = ["begin", { opt = { group = [": ", { ref = "label" }] } }] }
body = { indent = true, source = "body" }
tail = { text = "end", break = 1 }

# ----- 块标签（可选）-----
[BlockLabel]
[BlockLabel.parser]
production = ["symbol.base.colon", "@Identifier"]
inline = true
[BlockLabel.parser.node]
name = "$2"
[BlockLabel.renderer]
layout = { line = [": ", { ref = "name" }] }
