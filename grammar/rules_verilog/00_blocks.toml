# ============================================================================
# Verilog 语法规则 — 顶层结构与块
# ============================================================================

[Root]
layout = { join = "\n" }
block_start = ""
block_end = ""
[Block]
block_start = "space.indent"
block_end = "space.dedent"

[BeginEnd]
body_role = "flatten"
head = "begin"
body = { indent = true }
tail = "end"
production = ["keyword.begin", "@Block", "keyword.end"]
[BeginEnd.node]
body = "$2"
