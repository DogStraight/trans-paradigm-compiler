[comment]
# 注释类型定义: [起始标记, 结束标记, 类型]
# line 类型: 行注释，结束于 newline
# block 类型: 块注释，结束于结束标记
pairs = [
  ["//", "\n", "line"],
  ["/*", "*/", "block"],
]

[symbol.extend]
plus_range = "+:"
minus_range = "-:"

# Verilog 逻辑运算符（字母形式）
logic_add = "and"
logic_or = "or"
logic_not = "not"

[id]
[id.keyword]
# 时序/组合逻辑
al_ff = "al_ff"
al_comb = "al_comb"

# 分支
if = "if"
else = "else"
case = "case"
casex = "casex"
casez = "casez"

# 导入
import = "import"
from = "from"
as = "as"

# 循环
for = "for"
while = "while"
break = "break"
continue = "continue"
in = "in"

# 参数
param = "param"
parameter = "parameter"
localparam = "localparam"

# 端口
input = "input"
output = "output"
inout = "inout"
interface = "interface"

# 模块
module = "module"

# 自定义类型（增强语法）
type = "type"
revert = "revert"
fn = "fn"

# 标签
tag = "tag"

# 流程控制
pass = "pass"

# 边沿
posedge = "posedge"
negedge = "negedge"

# 函数/任务
function = "function"
endfunction = "endfunction"
task = "task"
endtask = "endtask"
automatic = "automatic"
static = "static"

# Verilog 关键字
wire = "wire"
reg = "reg"
integer = "integer"
begin = "begin"
end = "end"
always = "always"
endmodule = "endmodule"
assign = "assign"
endcase = "endcase"
default = "default"
generate = "generate"
endgenerate = "endgenerate"
genvar = "genvar"
signed = "signed"

# ========== 系统函数注册表 ==========
[sysfunc]
clog2 = "clog2"
urandom = "urandom"
urandom_range = "urandom_range"
random = "random"
display = "display"
write = "write"
monitor = "monitor"
readmemh = "readmemh"
readmemb = "readmemb"
writememh = "writememh"
writememb = "writememb"
fopen = "fopen"
fclose = "fclose"
fdisplay = "fdisplay"
fwrite = "fwrite"
fread = "fread"
stime = "stime"
time = "time"
realtime = "realtime"
finish = "finish"
stop = "stop"
