[space]
blank_space = " "
tab = "\t"

[newline]
newline = "\n"

[comment]
boundary = "/"

[symbol.base]
add = "+"
sub = "-"
multiple = "*"
and = "&"
or = "|"
not = "!"
bit_not = "~"
xnor = "^"
bigger = ">"
lesser = "<"
div = "/"
mod = "%"
equal = "="
dot = "."
comma = ","
colon = ":"
semicolon = ";"
question_mark = "?"
at = "@"
pound = "#"
single_quote = "'"
dollar = "$"

[symbol.extend]
r_shift = ">>"
l_shift = "<<"
point_to = "->"
power = "**"
bigger_equal = ">="
lesser_equal = "<="
is_equal = "=="
not_equal = "!="
add_equal = "+="
sub_equal = "-="
add_one = "++"
sub_one = "--"
double_dot = ".."
logic_double_and = "&&"
logic_double_or = "||"

# Verilog 逻辑运算符（字母形式，会被 alpha_tokens 匹配）
logic_add = "and"
logic_or = "or"
logic_not = "not"

[bracket]
l_parentheses = "("
r_parentheses = ")"
l_square_bracket = "["
r_square_bracket = "]"
l_curly_bracket = "{"
r_curly_bracket = "}"

[id]
[id.keyword]
# 时序/组合逻辑
al_ff = "al_ff"
al_comb = "al_comb"

# 分支
if = "if"
else = "else"
case = "case"

# 导入
import = "import"
from = "from"
as = "as"

# 循环
for = "for"
while = "while"
break = "break"
continue = "continue"
in = "in"

# 参数
param = "param"
parameter = "parameter"
localparam = "localparam"

# 端口
input = "input"
output = "output"
inout = "inout"
interface = "interface"

# 模块
module = "module"

# 标签
tag = "tag"

# 流程控制
pass = "pass"

# 边沿
posedge = "posedge"
negedge = "negedge"

# 函数/任务
function = "function"
endfunction = "endfunction"
task = "task"
endtask = "endtask"
automatic = "automatic"
static = "static"

# Verilog 关键字
wire = "wire"
reg = "reg"
begin = "begin"
end = "end"
always = "always"
endmodule = "endmodule"
assign = "assign"
endcase = "endcase"
default = "default"
