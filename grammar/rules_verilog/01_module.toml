# ============================================================================
# Verilog 语法规则 — 模块声明
# ============================================================================

[ModuleDecl]
body_role = "flatten"
head = { line = ["module ", { ref = "module_name" }, { ref = "params" }, " (", { ref = "ports" }, ");"] }
body = { indent = true }
tail = "endmodule"
production = [
    "keyword.module",
    "id",
    "@ParameterList?",
    "bracket.l_parentheses",
    "@PortList?",
    "bracket.r_parentheses",
    "symbol.base.semicolon",
    "@Block",
    "keyword.endmodule",
]
end_case = ["keyword.endmodule"]
scope_open = true
scope_name_attr = "module_name"
scope_kind = "module"

[ModuleDecl.node]
module_name = "$2"
params = "$3"
ports = "$5"
body = "$8"

[ParameterList]
layout = { line = [" #(", { join = ", " }, ")"] }
production = [
    "symbol.base.pound",
    "bracket.l_parentheses",
    "@ParamDecl",
    "(symbol.base.comma,@ParamDecl)*",
    "bracket.r_parentheses",
]
[ParameterList.node]
first = "$3"
rest = "$4"

[ParamDecl]
layout = { line = ["parameter ", { ref = "param_name" }, " = ", { ref = "value" }] }
production = ["keyword.parameter", "id", "symbol.base.equal", "@Expression"]
end_case = ["symbol.base.comma", "bracket.r_parentheses", "newline"]
symbol_kind = "parameter"
symbol_name = "param_name"
[ParamDecl.node]
param_name = "$2"
value = "$4"
