# ============================================================================
# Verilog 语法规则 — 模块声明
# ============================================================================

[ModuleDecl]

[ModuleDecl.parser]
production = [
    "keyword.module",
    "@Identifier",
    "@ParameterList?",
    "bracket.l_parentheses",
    "@PortList?",
    "bracket.r_parentheses",
    "symbol.base.semicolon",
    "@Block",
    "keyword.endmodule",
]
end_case = ["keyword.endmodule"]

[ModuleDecl.parser.node]
module_name = "$2"
params = "$3"
ports = "$5"
body = "$8"

[ModuleDecl.analyzer]
scope = { name_attr = "module_name", kind = "module" }

[ModuleDecl.renderer]
head = { line = [
    "module ",
    { ref = "module_name" },
    { opt = { group = [
        " #(",
        { ref = "params" },
        { soft = true },
        ")",
    ] } },
    { opt = { group = [
        "(",
        { ref = "ports" },
        { soft = true },
        ");",
    ] } },
] }
body = { indent = true, source = "body" }
tail = { text = "endmodule", break = 2 }


[ParameterList]
[ParameterList.parser]
production = [
    "symbol.base.pound",
    "bracket.l_parentheses",
    "@ParamDecl",
    "(symbol.base.comma,@ParamDecl)*",
    "bracket.r_parentheses",
]
[ParameterList.parser.node]
params = ["$3", "$4.items"]

[ParameterList.renderer]
layout = { join = ", ", first_soft = true, nest = 1, items = "params" }


[ParamDecl]

[ParamDecl.parser]
production = [
    "keyword.parameter",
    "@Identifier",
    "symbol.base.equal",
    "@Expression",
]
end_case = ["symbol.base.comma", "bracket.r_parentheses", "newline"]
[ParamDecl.parser.node]
param_name = "$2"
value = "$4"

[ParamDecl.analyzer]
symbol = { kind = "parameter", name_attr = "param_name" }

[ParamDecl.renderer]
layout = { line = [
    "parameter ",
    { ref = "param_name" },
    " = ",
    { ref = "value" },
] }
