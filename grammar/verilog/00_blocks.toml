[Root.parser.structure]
is_block = true

[Root.renderer.layout]
join = "\n"

[Root.structure]
is_block = true

[Comment.parser]
production = [
    "comment",
]
end_case = []

[Comment.parser.node]
value = "$1.value"

[Comment.renderer.layout]
ref = "value"

[BeginEnd.parser]
bound = { start = "keyword.begin", end = "keyword.end" }
production = [
    "@BlockLabel?",
]
end_case = [
    "keyword.end",
    "newline",
]

[BeginEnd.parser.node]
label = "$1"

[BeginEnd.renderer.head]
line = [
    "begin",
    { opt = { group = [
    ": ",
    { ref = "label" },
] } },
]

[BeginEnd.renderer.body]
indent = true
role = "flatten"

[BeginEnd.renderer.tail]
text = "end"
break = 1

[BeginEnd.structure]
is_block = true
is_statement = true

[BlockLabel.parser]
production = [
    "symbol.base.colon",
    "@Identifier",
]
inline = true

[BlockLabel.parser.node]
name = "$2"

[BlockLabel.renderer.layout]
line = [
    ": ",
    { ref = "name" },
]
