# ============================================================================
# Verilog 语法规则 — 顶层结构与块（重构为组合模式）
#
# structure 字段可选值：
#   { is_block = true }       — 块规则，引擎走 parse_block 路径
#   { is_statement = false }  — 非语句规则，排除出 parse_sentence 候选列表
#   { is_atom = true }        — 原子规则，不参与语句级匹配 / 注册到 atomic_rules
#   可组合: { is_block = true, is_statement = false }
# ============================================================================

[Root]
[Root.parser]
structure = { is_block = true }

[Root.renderer]
layout = { join = "\n" }

# ----- 注释节点（语句级，自然继承 block 缩进）-----
[Comment]
[Comment.parser]
production = ["comment"]
end_case = []
[Comment.parser.node]
value = "$1.value"
[Comment.renderer]
layout = { ref = "value" }

# ----- 模块体（Module 内部）-----
[ModuleBlock]
[ModuleBlock.parser]
structure = { is_block = true }
end_case = ["keyword.endmodule"]
[ModuleBlock.renderer]
body = { indent = true, role = "flatten" }

# ----- 过程体（always / initial 内部）-----
[ProcBlock]
[ProcBlock.parser]
structure = { is_block = true }
end_case = ["keyword.end"]
[ProcBlock.renderer]
body = { indent = true, role = "flatten" }

# ----- 任务/函数体（task / function 内部）-----
[TaskBlock]
[TaskBlock.parser]
structure = { is_block = true }
end_case = ["keyword.endfunction", "keyword.endtask"]
[TaskBlock.renderer]
body = { indent = true, role = "flatten" }

# ----- Begin/End 块（显式关键字，非缩进）-----
[BeginEnd]
[BeginEnd.parser]
production = [
    "keyword.begin",
    "@BlockLabel?",
    "@ProcBlock",    # 内部使用过程块
    "keyword.end",
]
end_case = ["keyword.end", "newline"]
[BeginEnd.parser.node]
label = "$2"
body = "$3"

[BeginEnd.renderer]
head = { line = ["begin", { opt = { group = [": ", { ref = "label" }] } }] }
body = { indent = true, source = "body" }
tail = { text = "end", break = 1 }

# ----- 块标签（可选）-----
[BlockLabel]
[BlockLabel.parser]
production = ["symbol.base.colon", "@Identifier"]
inline = true
[BlockLabel.parser.node]
name = "$2"
[BlockLabel.renderer]
layout = { line = [": ", { ref = "name" }] }
