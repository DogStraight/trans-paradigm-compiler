# _pre_scan.toml — 预扫描配置
#
# 定义 Lexer 阶段之后、Parser 之前的顶层声明符号预扫描规则。
# 每种声明类别指定 keyword 和 name_capture 方式。
#
# name_capture 支持：
#   "next_word"    — 声明关键词后的第一个单词就是声明名（module/interface/task）
#   "after_range"  — 声明关键词后可能跟范围 [a:b]，再跟声明名（function）
#   "after_skip"   — 声明关键词后跳过指定的 skip_keywords，再捕获声明名
#
# ⚠ 本文件只声明**基础语法**的预扫描槽位。增强语法（如 typed_ports）若需要
#   参与 pre_symbols 消歧，应在插件自己的 tpc.toml 声明 [lexer] pre_scan，
#   不要往这里加——基础文件只负责基础的 id 槽位。

# ── 源文本清理形态（扫描前的注释/字符串剥离） ──
# 预扫描把注释/字符串替换为空白，避免其内容被误识别为声明名。
# 形态是语言知识，在此声明（引擎只做通用正则构建，不硬编码 //、/* */、"）：
#   kind = "line"   → 行注释（start 到行尾）
#   kind = "block"  → 块注释（start 到 end，可跨行）
#   kind = "string" → 字符串字面量（start 定界符到配对定界符，不跨行；
#                     替换为定界符对，避免两侧词粘连）
[[pre_scan.clean]]
kind = "line"
start = "//"

[[pre_scan.clean]]
kind = "block"
start = "/*"
end = "*/"

[[pre_scan.clean]]
kind = "string"
start = '"'

[pre_scan]

# 跟在声明关键词后面但不是声明名的语境关键词
context_keywords = [
    "automatic",
    "signed",
    "unsigned",
    "reg",
    "wire",
    "input",
    "output",
    "inout",
]

# ── 声明类别 ──

[pre_scan.decl.module]
keyword = "module"
name_capture = "next_word"
terminators = ["(", "#", ";"]
# Parser 规则选择提示：遇到已知模块名时优先试这些规则
rule_hints = ["ModuleInst"]

[pre_scan.decl.function]
keyword = "function"
name_capture = "after_range"
skip_keywords = ["automatic"]
terminators = ["("]
rule_hints = ["SubroutineCall"]

[pre_scan.decl.task]
keyword = "task"
name_capture = "next_word"
skip_keywords = ["automatic"]
terminators = ["(", ";"]
rule_hints = ["SubroutineCall"]
