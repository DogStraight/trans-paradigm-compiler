# ============================================================================
# 结构提取协议 — 引擎**文件层**的形态声明（依赖发现 + 单元索引）
# ============================================================================
# ADR-0019 后引擎唯一可视单位 = **文件**：`analyzer/structure.py` 只做读源 / 解析 /
# AST 缓存 / 行映射 / **依赖发现编排**（按单元名找文件、读文件）。故本段只剩
# **发现与索引**所需的声明；语言语义（端口 / 参数 / 连接 / 信号驱动 / generate）
# 全部归语言包插件精化项（`plugins/elaboration/`，引擎不认）。
#
# 未声明本段 = 该语言包不支持结构提取（tpc check 退化为通用 lint + analyze，
# 不提取单元、不递归、不注入 module_index）。
#
# 字段名对应语法 TOML 的 [*.parser.node] 绑定（如 [ModuleDecl.parser.node]
# 的 module_name），改动语法绑定名时同步本文件。
# ============================================================================

[structure]
module_decl_rule = "ModuleDecl"    # 单元声明规则名（提取单元索引）
module_inst_rule = "ModuleInst"    # 实例化规则名（递归发现的链）
module_keyword   = "module"        # 单元声明关键字（定义文件文本扫描兜底）
file_exts        = [".v", ".sv"]   # 源文件扩展名（定义文件查找）
# 端口方向值集：引擎**不解释**语义，只按声明把这些值集注入给插件
# （插件的端口方向判定消费；形态与判定逻辑都在语言包）
output_dirs      = ["output"]      # 方向值 = 驱动
input_dirs       = ["input"]       # 方向值 = 负载
inout_dirs       = ["inout"]       # 方向值 = 双向

# 节点字段（语法 TOML node 绑定名）——只剩发现与索引要用的
[structure.fields]
module_name = "module_name"   # 单元名 / 被实例化单元名字段
#
# ⚠ 下列声明已随 ADR-0019 迁出语言包插件（**不要**搬回引擎）：
#   - 生成/求值面：`gen_block_rule` / `gen_branch_rules` / `gen_not_ops`
#     + `gen_condition` / `gen_then` / `gen_else_chain` → 插件 `gen_activity`（P3-①）
#   - 参数面：`params` / `param_name` → 插件 `param_default`（P2）
#   - 端口面：`ports` / `items` / `decl` / `direction` / `width` / `port_type` /
#     `name` / `bare_rule` / `body_port_rules` / `body_direction`
#     → 插件 `port_decls`（P3-②c-2b）
#   - 连接面：`connects` / `port_name` / `value` / `inst_name` → 插件 `connections`
#   - 赋值/过程面：`assign_rule` / `assign_target` / `assign_extras` /
#     `assign_extra_target` / `proc_assign_rules` / `proc_block_rules`
#     → 插件 `signal_graph`（P3-②c-1）
