[space]
blank_space = " "
tab = "\t"
# CRLF 行尾的 \r 部分（\n 由 [newline] 处理）：作为可忽略空白吞掉，
# 使 \r\n 输入自然解析为单行换行，无需 lexer 侧硬编码行尾风格。
carriage_return = "\r"
# UTF-8 BOM（文件头不可见标记）：作为可忽略字符吞掉，不参与 token 流。
bom = "\ufeff"

[newline]
newline = "\n"

[symbol.base]
add = "+"
sub = "-"
multiple = "*"
and = "&"
or = "|"
not = "!"
bit_not = "~"
xnor = "^"
bigger = ">"
lesser = "<"
div = "/"
mod = "%"
equal = "="
dot = "."
comma = ","
colon = ":"
semicolon = ";"
question_mark = "?"
at = "@"
pound = "#"
single_quote = "'"
dollar = "$"

[symbol.extend]
r_shift = ">>"
l_shift = "<<"
arith_r_shift = ">>>"
arith_l_shift = "<<<"
point_to = "->"
power = "**"
bigger_equal = ">="
lesser_equal = "<="
is_equal = "=="
not_equal = "!="
case_equal = "==="
case_not_equal = "!=="
add_equal = "+="
sub_equal = "-="
add_one = "++"
sub_one = "--"
double_dot = ".."
logic_double_and = "&&"
logic_double_or = "||"
arrow = "=>"

[bracket]
pairs = [
    ["(", ")", "parentheses"],
    ["[", "]", "square_bracket"],
    ["{", "}", "curly_bracket"],
]

[literal]
number = "\\d+"

# 字符串定界符（[string] delimiters）——CaptureRunner delim mode。
# verilog 只有双引号字符串（IEEE 1364）；' 是数字前缀/symbol.base.single_quote，
# 不入字符串定界符。
[string]
delimiters = ['"']

[id.id]
id = "[a-z_A-Z][a-z_A-Z0-9]*"

# 转义标识符（IEEE 1364-2005 A.9.3 escaped_identifier）——配置驱动声明：
# `\` + 非终止符字符序列，到终止符/行尾止（如 `\a.b`、`\my$mod`）。token
# 类型置 id（保留 `\` 前缀），不受关键字限制（`\always` 是合法名）。
# 与 sv-parser 差异（各有取舍）：sv-parser 严格"到空白止"（`wire \a.b;`
# 须写 `\a.b ;`），tpc 宽进——terminators 含语法分隔符使 `wire \a.b;`
# 直接可解析且幂等；名字内含终止符的极端形态（`\a;b`）不支持。
[id.escaped]
prefix = "\\"
terminators = " \t\r\n,;()[]{}"
token_type = "id"
