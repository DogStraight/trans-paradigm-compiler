# ============================================================================
# 宏定义 — 宏形态 / 指令 / 展开参数
# 宏不是语法 token：lexer 按 [macro_recognition] 的**形态声明**从字符流
# 识别宏 token（生产式：前缀 token + 名字），供后续 preprocessing 阶段消费。
# ============================================================================

# ── [macro_recognition] 宏形态（生产式声明）──
#
# 形态用**生产式**书写（与 grammar rules 同一套规则：`,` 顺序 / `|` 选择 /
# `?`/`*`/`+` 后缀 / token 名），引擎只做通用解析（语言知识不进代码）：
#
#   顺序位 0 = 前缀 token 名（符号文本取自 [symbol.*] 声明）
#   顺序位 1 = 名字位：`id` = 语言包标识符；写成 token 名候选（macro.define …）
#              时**命中哪个就产出哪个 token 类型**；其余名字 → macro.call
#
# 未声明某一段 = 该形态不识别（如 C 的宏调用就是普通标识符）。未实现形态
# （后缀序 / 非符号前缀 / 多于两位）fail-fast，不静默降级。
[macro_recognition]
directive = "symbol.base.backtick,(macro.else|macro.line|macro.undef|macro.ifdef|macro.elsif|macro.endif|macro.define|macro.ifndef|macro.pragma|macro.include|macro.resetall|macro.timescale|macro.celldefine|macro.undefineall|macro.end_keywords|macro.endcelldefine|macro.begin_keywords|macro.default_nettype|macro.unconnected_drive|macro.nounconnected_drive)"
call = "symbol.base.backtick,id"

# ── [directives] 已并入上面的形态声明 ──
# 原表（指令关键字 → token 类型）与形态声明是两份手写副本，已删：指令集现由
# `directive` 生产式的名字位候选表达，命中哪个候选就产出哪个 token 类型
# （`macro.define` 等）；`_expand.py` 的指令名集合也从同一处推导。

# ── [macro_hygiene] 宏/指令卫生检查参数（MH 族，linter 层）──
#
# linter 在解析前做指令级卫生检查（配置驱动，引擎零语言知识）：
#   - MH001：文件末尾生效的 nettype 指令值未复位（跨文件泄漏风险）
#   - MH002：宏重定义未先 undef（对齐 Verilator REDEFMACRO：值不同才报）
#
# 各字段是**指令关键字**（与 [macro_recognition] 名字位候选同源），引擎按关键字匹配指令行。
[macro_hygiene]
enabled = true
define_directive = "define"
undef_directive = "undef"
nettype_directive = "default_nettype"
nettype_restore = "wire"
# 续行符（与 [continuation] 同源）：宏体以其结尾表示跨行 → 值不确定，
# MH002 不参与比较（宁可漏报不误报）。
continuation = "\\"

# ── [expand] 宏展开器参数 ──
# 用户可通过此段控制展开行为，无需修改 Python 代码。
[expand]
max_iterations = 128
# 多路径诊断（enumerate_conditions）的最大枚举配置数上限，防分支爆炸。
max_configs = 64

# ── [continuation] 反斜杠续行参数 ──
[continuation]
enabled = true
character = "\\"

# ── [directive_handlers] 指令处理器启用/配置 ──
# 指令关键字 → 预定义操作（op）绑定：换语言时把指令关键字映射到对应操作即可，
# 范式从代码迁移到配置。op 为注册在 primitives/registry.py 的处理器名（缺省=指令关键字）。
# enabled: false 时该指令被扫描器忽略（仍记录到 directive_lines）。
# 可扩展自定义配置，如 include 的搜索路径、define 的参数模式等。
[directive_handlers]
define = { op = "define", enabled = true }
undef = { op = "undef", enabled = true }

[directive_handlers.include]
op = "include"
enabled = true
search_dirs = []
# silent: true 时文件不存在不报错（类似 GPP 的 #sinclude）
silent = false
