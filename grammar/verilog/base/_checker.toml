# ============================================================================
# checker 结构提取协议 — tpc check 跨文件检查的 AST 形态声明
# ============================================================================
# tpc check 引擎（analyzer/checker.py）零语言知识：模块/实例化的规则名、
# 节点字段、文件扩展名、关键字全部由语言包在此声明，引擎只读配置。
#
# 未声明本段 = 该语言包不支持跨文件结构检查（tpc check 退化为通用
# lint + analyze，不提取模块、不递归、不注入 module_index）。
#
# 字段名对应语法 TOML 的 [*.parser.node] 绑定（如 [ModuleDecl.parser.node]
# 的 module_name/ports/params），改动语法绑定名时同步本文件。
# ============================================================================

[checker]
module_decl_rule = "ModuleDecl"    # 模块声明规则名（提取模块定义表）
module_inst_rule = "ModuleInst"    # 模块实例化规则名（递归发现 + 联动检查）
module_keyword   = "module"        # 模块声明关键字（定义文件文本扫描兜底）
file_exts        = [".v", ".sv"]   # 源文件扩展名（定义文件查找）

# 节点字段（语法 TOML node 绑定名）
[checker.fields]
module_name = "module_name"   # 模块名 / 被实例化模块名字段
ports       = "ports"         # 端口列表字段（ModuleDecl/ModuleInst 上）
params      = "params"        # 参数列表字段（ModuleDecl 上）
items       = "items"         # 列表容器 items 字段（PortList/DeclaratorList 等）
decl        = "decl"          # 端口声明包装字段（inline 规则防御穿透）
direction   = "direction"     # 端口方向字段（input/output/inout）
width       = "packed_range"  # 端口宽度表达式字段（TypeSpec 上）
name        = "name"          # 声明器名字段（Declarator.name）
param_name  = "param_name"    # 参数名字段（ParamDecl 上）
value       = "value"         # 表达式值字段（参数默认值等）
bare_rule   = "Identifier"    # 裸名端口节点名（旧风格端口，无方向/宽度）
