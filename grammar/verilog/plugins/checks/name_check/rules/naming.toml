# ============================================================================
# name_check 插件 — 命名约定检查（L1 声明式规则，第一个自定义示例）
# ============================================================================
# 诊断链自定义层（用户自由度）的参考实现：规则=数据——本文件是纯声明式
# [[checks]] 规则表（无 handler 脚本），引擎通用执行器按符号 kind 分发 +
# pattern 正则判定（analyzer/checks.py + core/check_registry.py）。
#
# 蓝本：svlint naming 规则族（~30 类 kind → 正则/前缀默认值，配置注入、
# 规则代码只写判定）——见 docs/references.md svlint 深调研节。
#
# 默认 pattern：信号/变量/子程序取小写下划线（snake_case）；模块/实例
# 放宽为 PascalCase 或 snake_case（行业惯例模块名两者皆常见——真实语料
# picorv32/serv 均为 Pascal）；参数/常量取大写下划线（UPPER_SNAKE）。
# 用户可在 tpc.toml [checks] overrides 覆盖（P4 用户配置层）。kind 键
# 对应语法 TOML [*.analyzer.symbol] kind 声明（module/port/wire/reg/
# parameter/localparam/genvar/function/task/module_instance）。
# `_` 前缀豁免（pattern 前缀 `_?`）：与 unused_check 的 `_` 约定一致
# （下划线前缀 = 显式"故意不用/占位"），命名检查不误报占位符号。
# **默认关闭**（default = false）：命名是团队约定，真实代码混合风格
# （试水实测：真实语料 NC 族 ~1300 条误报海啸）——按需启用（P4 用户
# 配置 enabled 列出，或 per_file/overrides 引用即启用）。0.1.1 默认
# 不刷屏。前后缀约定（端口方向 _i/_o、低有效 _n 等）见 ADR-0004「落地演进」。
# ============================================================================

# ── 模块 / 实例命名（PascalCase 或 snake_case） ─────────────────────

[[checks]]
id = "NC001"
default = false
category = "naming"
severity = "warning"
scope = ["rtl", "tb"]
message = "module 名 '{name}' 不符合 PascalCase 或 snake_case 约定（{pattern}）"
kind = "module"
pattern = "^_?[A-Z][a-zA-Z0-9]*$|^_?[a-z][a-z0-9_]*$"

[[checks]]
id = "NC002"
default = false
category = "naming"
severity = "warning"
scope = ["rtl", "tb"]
message = "实例名 '{name}' 不符合 PascalCase 或 snake_case 约定（{pattern}）"
kind = "module_instance"
pattern = "^_?[A-Z][a-zA-Z0-9]*$|^_?[a-z][a-z0-9_]*$"

# ── 网络 / 变量命名（小写下划线） ──────────────────────────────────

