# ── 子程序命名（小写下划线） ──────────────────────────────────────

[[checks]]
id = "NC009"
category = "naming"
severity = "warning"
scope = ["rtl", "tb"]
message = "函数名 '{name}' 不符合小写下划线约定（{pattern}）"
