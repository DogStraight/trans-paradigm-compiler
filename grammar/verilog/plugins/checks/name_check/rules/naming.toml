id = "NC003"
default = false
category = "naming"
severity = "warning"
scope = ["rtl", "tb"]
message = "网络名 '{name}' 不符合小写下划线约定（{pattern}）"
kind = "wire"
pattern = "^_?[a-z][a-z0-9_]*$"

[[checks]]
id = "NC004"
default = false
category = "naming"
severity = "warning"
scope = ["rtl", "tb"]
message = "寄存器名 '{name}' 不符合小写下划线约定（{pattern}）"
kind = "reg"
pattern = "^_?[a-z][a-z0-9_]*$"

[[checks]]
id = "NC005"
default = false
category = "naming"
severity = "warning"
scope = ["rtl", "tb"]
message = "端口名 '{name}' 不符合小写下划线约定（{pattern}）"
kind = "port"
pattern = "^_?[a-z][a-z0-9_]*$"

# ── 参数 / 常量命名（大写下划线） ──────────────────────────────────

[[checks]]
id = "NC006"
default = false
category = "naming"
severity = "warning"
scope = ["rtl", "tb"]
message = "参数 '{name}' 不符合大写下划线约定（{pattern}）"
kind = "parameter"
pattern = "^_?[A-Z][A-Z0-9_]*$"

[[checks]]
id = "NC007"
default = false
category = "naming"
severity = "warning"
scope = ["rtl", "tb"]
message = "局部参数 '{name}' 不符合大写下划线约定（{pattern}）"
kind = "localparam"
pattern = "^_?[A-Z][A-Z0-9_]*$"

[[checks]]
id = "NC008"
default = false
category = "naming"
severity = "warning"
scope = ["rtl", "tb"]
message = "genvar '{name}' 不符合大写下划线约定（{pattern}）"
kind = "genvar"
pattern = "^_?[A-Z][A-Z0-9_]*$"

# ── 子程序命名（小写下划线） ──────────────────────────────────────

[[checks]]
id = "NC009"
default = false
category = "naming"
severity = "warning"
scope = ["rtl", "tb"]
message = "函数名 '{name}' 不符合小写下划线约定（{pattern}）"
kind = "function"
pattern = "^_?[a-z][a-z0-9_]*$"

[[checks]]
id = "NC010"
default = false
category = "naming"
severity = "warning"
scope = ["rtl", "tb"]
message = "任务名 '{name}' 不符合小写下划线约定（{pattern}）"
kind = "task"
pattern = "^_?[a-z][a-z0-9_]*$"

# ── 跨文件命名（handler 兜底：pattern 表达不了文件上下文） ───────────

[[checks]]
id = "NC011"
default = false
category = "naming"
severity = "warning"
scope = ["rtl", "tb"]
message = "模块名 '{name}' 与文件名不一致（期望 {file_base}）"
kind = "module"
handler = "_filename_check.py:check_module_filename"

# ── 补充符号 kind（P1.10 核心集合：命名族补全，svlint 命名规则对照） ──

[[checks]]
id = "NC012"
default = false
category = "naming"
severity = "warning"
scope = ["rtl", "tb"]
message = "整型变量名 '{name}' 不符合小写下划线约定（{pattern}）"
kind = "integer"
pattern = "^_?[a-z][a-z0-9_]*$"

[[checks]]
id = "NC013"
default = false
category = "naming"
severity = "warning"
scope = ["rtl", "tb"]
message = "类型名 '{name}' 不符合小写下划线约定（{pattern}）"
kind = "type"
pattern = "^_?[a-z][a-z0-9_]*$"

# ── 前后缀语义约定（2026-08-29 配置面，防错；handler 兜底） ───────────
# 比风格更有价值的是前后缀语义（防接错方向/防类型混淆）。蓝本：svlint
# prefix_input/output/inout（require 模式 + 可配置前缀）+ 类型后缀扩展。
# 规则数据声明式：direction_suffix / kind_suffix 表；`_` 前缀豁免。
# `_n` 低有效 / clk_/rst_ 前缀不做——2005 无 clock/reset 符号 kind，
# 需用途分析（事件控制/复位条件），主流 svlint 亦无（ADR-0004「落地演进」）。

[[checks]]
id = "NC014"
default = false
category = "naming"
severity = "warning"
scope = ["rtl", "tb"]
message = "端口 '{name}' 方向后缀不一致（声明 {direction}，后缀表示另一方向）"
kind = "port"
handler = "_prefix_suffix_check.py:check_direction_suffix"
direction_suffix = { input = "_i", output = "_o", inout = "_io" }
# require = true 时未按本方向后缀命名也报（强约定模式）

[[checks]]
id = "NC015"
default = false
category = "naming"
severity = "warning"
scope = ["rtl", "tb"]
message = "信号 '{name}' 类型后缀不一致（声明 {kind}，后缀表示另一类型）"
kind = "wire"
handler = "_prefix_suffix_check.py:check_kind_suffix"
kind_suffix = { wire = "_w", reg = "_r" }
# require = true 时未按本类型后缀命名也报（强约定模式）

[[checks]]
id = "NC016"
default = false
category = "naming"
severity = "warning"
scope = ["rtl", "tb"]
message = "信号 '{name}' 类型后缀不一致（声明 {kind}，后缀表示另一类型）"
kind = "reg"
handler = "_prefix_suffix_check.py:check_kind_suffix"
kind_suffix = { wire = "_w", reg = "_r" }
