# ============================================================================
# sim 插件 — initial 过程语句 [仿真专用][不可综合]
# ============================================================================
# initial 与 always 相似但不带敏感列表，是仿真入口点。
# 根据 IEEE 1364，initial 块只执行一次，在仿真 0 时刻启动。
#
# ⚠ 仿真专用：initial 不可综合，用于测试激励/初始化/波形记录。
#   本插件默认启用（verilog tpc.toml [plugins] enabled），如需纯净可综合
#   子集可关闭（禁用后含 initial 的源码解析失败——真实 RTL 常混 testbench）。
#
# 挂回：注入 ProcStmt 的语句候选（主包 ProcStmt 现只含 @AlwaysStmt）。

[InitialStmt.inject]
targets = ["@ProcStmt"]

[InitialStmt]
is_statement = true

[InitialStmt.analyzer]
scope = { kind = "initial" }

[InitialStmt.parser]
production = [
    "keyword.initial",
    "@Stmt",
]

[InitialStmt.parser.node]
body = "$2"

[InitialStmt.renderer]
layout = { line = ["initial ", { ref = "body" }] }
body = { role = "direct" }
[InitialStmt.renderer.override]
BeginEnd = { tail_break = 2 }
