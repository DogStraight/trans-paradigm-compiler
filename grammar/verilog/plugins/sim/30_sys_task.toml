# ============================================================================
# sim 插件 — 系统任务语句（$ 前缀，如 $display(...)） [仿真/testbench]
# ============================================================================
# 独立语句的系统调用: $display(...); $finish; 等。
# 与 SysFuncCall（表达式原子）区别在于末尾分号，作为独立语句。
# 函数名允许 signed/unsigned（与声明关键字冲突，同 SysFuncCall）。
#
# 挂回：注入 CallStmt 的语句候选（主包 CallStmt 保留调用/空语句）。

[SysTaskStmt.inject]
targets = ["@CallStmt"]

[SysTaskStmt]
is_statement = true

[SysTaskStmt.parser]
production = [
    "symbol.base.dollar",
    "(@Identifier|keyword.signed|keyword.unsigned)",
    "bracket.l_parentheses",
    "@ArgumentList?",
    "bracket.r_parentheses",
    "symbol.base.semicolon",
]

# 2026-08-28 修复：剥离时原样搬移未带 node/renderer——SysTaskStmt 在 AST 中
# 存在但渲染为空（$display/$finish/$readmemh 等系统任务语句静默丢失，
# ice40 `if (INIT_FILE != "") $readmemh(...)` 分支被渲染成空行）。
# 参照 SysFuncCall（05_expressions.toml）补绑定与布局，末尾多分号。
[SysTaskStmt.parser.node]
callee = "$2"
args = "$4"

[SysTaskStmt.renderer.layout]
line = ["$", { ref = "callee" }, "(", { ref = "args" }, ")", ";"]
