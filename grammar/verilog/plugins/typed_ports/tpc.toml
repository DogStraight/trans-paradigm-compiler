[lexer]
token_ext = { file = "_token_ext.toml", required = false }

[grammar]
files = ["00_type_decl.toml", "06_typed_decl.toml", "10_impl_binding.toml"]

[analyzer]
handlers = ["_mapping.py"]
# role 端口集递归展开 postpass（P1.5 invert L2/L3 + step 2 清理）：analyze 遍历
# 结束后对每个 role 递归展开完整端口集（nested + invert 对侧）写 resolved_ports
# ——旧 resolve_refs/flatten_ports/attach_invert_map 原语链已删（_flatten_ports.py/
# _invert_map.py 移除），analyze 只保留声明捕获（raw ports 供 _expand_ports 消费）。
# 须先于 _check（其 _role_flat_ports 读 resolved_ports 优先）。
postpasses = ["_expand_ports.py:run_expand_ports", "_check.py:run_tp_check"]
# 增强语法语义检查 postpass（typed_ports 组件内，TPxxx error →
# analyze 报错 → 阻断展开）。语言知识（type/role/impl 形态）全在 _check.py。

[transform]
handlers = ["_transform.py", "_bridge.py"]

# 槽位契约声明（5b-3c 声明面）：每槽位声明在哪触发（on）、怎么遍历（walk）、
# ctx 从哪来、结果怎么接回（result）。**时点不在此声明**——归管线配置
# （[pipeline.units.*]）。执行仍由 _bridge.py 调用（5b-3c-2 接管遍历/接回）。
[[transform.slots]]
name = "build_wrapper"
on = "TypeDecl"
walk = "top"
result = "extra"
ctx = { type_decl = "$node", impl_block = "TypeImplDecl" }

[[transform.slots]]
name = "delete_type_decl"
on = "TypeDecl"
walk = "top"
result = "remove"

[[transform.slots]]
name = "auto_connect_ports"
on = ["ImplBinding", "ImplBindingWithInterface"]
walk = "recursive"
result = "none"
ctx = { impl_node = "$node" }

[[transform.slots]]
name = "replace_impl_binding"
on = ["ImplBinding", "ImplBindingWithInterface"]
walk = "recursive"
result = "replace"
