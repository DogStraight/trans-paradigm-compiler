[TypedPortDecl.inject]
targets = [
    "@AnsiPortDecl",
    "@ModuleItem",
]

[TypedPortDecl]
is_statement = true

[TypedPortDecl.parser]
production = [
    "@TypedTypeSpec",
    "@Declarator",
]

[TypedPortDecl.parser.node]
type_spec = "$1"
instance_name = "$2"

[TypedPortDecl.analyzer]
ref_collect = true

[TypedPortDecl.analyzer.symbol]
kind = "typed_port"
name_attr = "instance_name.name"

# capture 类型名 → 符号 attrs["type_name"]，供 _scan_typed_ports_scope 建 type_map
# （instance_name → type_name，auto_connect_ports 按接口实例反查类型）。
# 此前缺失：TypedPortDecl 被 ConfigDrivenTransform 的 expand 提前消费后 AST 无残留
# 节点，_scan_typed_ports 扫 AST 拿不到，type_map 恒空 → impl 自动连线永不触发。
[TypedPortDecl.analyzer.symbol.capture]
type_name = "type_spec.type_name"

[TypedPortDecl.transform]
kind = "expand"
foreach = "$"

[TypedPortDecl.transform.condition]
exists = "type_spec.type_name"

[TypedPortDecl.transform.source]
lookup = "type_ports_flat"
key = "{type_spec.type_name}.{type_spec.role_name}"

[TypedPortDecl.transform.emit]
kind = "switch"
on = "{direction}"

[TypedPortDecl.transform.emit.cases.input]
kind = "emit"
node = "AnsiInputDecl"
direction = "input"

[TypedPortDecl.transform.emit.cases.input.items]
node = "DeclaratorList"
items = [
    { node = "Declarator", name = "{instance_name.name.content}_{name}", packed_range = { ref = "packed_range" } },
]

[TypedPortDecl.transform.emit.cases.output]
kind = "emit"
node = "AnsiOutputDecl"
direction = "output"

[TypedPortDecl.transform.emit.cases.output.items]
node = "DeclaratorList"
items = [
    { node = "Declarator", name = "{instance_name.name.content}_{name}", packed_range = { ref = "packed_range" } },
]

[TypedPortDecl.transform.emit.cases.inout]
kind = "emit"
node = "AnsiInoutDecl"
direction = "inout"

[TypedPortDecl.transform.emit.cases.inout.items]
node = "DeclaratorList"
items = [
    { node = "Declarator", name = "{instance_name.name.content}_{name}", packed_range = { ref = "packed_range" } },
]

[TypedTypeSpec.parser]
production = [
    "@Identifier",
    "symbol.base.dot",
    "@Identifier",
]

[TypedTypeSpec.parser.node]
type_name = "$1"
role_name = "$3"

# 注意：type_name 不做 identifier_ref 即时解析——type 定义常在模块之后
# （合法前向引用，增强语法样例惯例），即时 resolve 必然误报 W001。type/role
# 引用存在性由组件内语义检查 postpass（_check.py，TP001/TP002）在遍历结束后
# 全量核对（scope 树已建满，无前向引用问题）。

[TypedTypeSpec.renderer]
layout = { line = [
    { ref = "type_name" },
    ".",
    { ref = "role_name" },
] }


[TypedPortDecl.renderer]
# 保留增强语法：`type.role name`（如 `spi.slave spi_io`）
layout = { line = [
    { ref = "type_spec" },
    " ",
    { ref = "instance_name" },
] }
