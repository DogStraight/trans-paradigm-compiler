[TypeDecl.inject]
targets = [
    "@ModuleItem",
]

[TypeDecl]
is_statement = true

[TypeDecl.parser]
production = [
    "keyword.type",
    "@Identifier",
    "@TypeParamList?",
    "@TypeBody",
]

[TypeDecl.parser.node]
type_name = "$2"
params = "$3"
body = "$4"

[TypeDecl.analyzer.symbol]
kind = "type"
name_attr = "type_name"

[TypeDecl.analyzer.scope]
kind = "type"
name_attr = "type_name"

[TypeParamList.parser]
production = [
    "bracket.l_parentheses",
    "@TypeParamItem?",
    "(symbol.base.comma,@TypeParamItem)*",
    "bracket.r_parentheses",
]

[TypeParamList.parser.node]
items = [
    "$2",
    "$3.items[*].sub_node[1]",
]

[TypeParamItem.parser]
production = [
    "keyword.parameter",
    "@Identifier",
    "symbol.base.equal",
    "@PrimaryExpr",
]

[TypeParamItem.parser.node]
name = "$2"
default = "$4"

[TypeParamItem.renderer]
layout = { line = [
    "parameter ",
    { ref = "name" },
    " = ",
    { ref = "default" },
] }

[TypeParamList.renderer]
layout = { intent = "compact", items = "items", first_soft = false, nest = 0 }

[TypeBody.parser]
production = [
    "bracket.l_curly_bracket",
    "@TypeMember*",
    "bracket.r_curly_bracket",
]

[TypeBody.parser.node]
members = "$2"

[TypeMember]
inline = true

[TypeMember.parser]
production = [
    "@TypeRole | @InvertDecl | @TypeImplDecl",
]

[TypeMember.parser.node]
child = "$1"

[TypeRole.parser]
production = [
    "@Identifier",
    "symbol.base.colon",
    "@TypePortDecl",
    "(symbol.base.comma,@TypePortDecl)*",
    "symbol.base.semicolon",
]

[TypeRole.parser.node]
role_name = "$1"
ports = [
    "$3",
    "$4.items[*].sub_node[1]",
]

# role 端口集展开由组件 postpass（_expand_ports.py）在 analyze 遍历结束后统一
# 递归完成（nested + invert 对侧，写 resolved_ports）；raw sym.attrs["ports"]
# 捕获保留（_expand_ports 数据源）。不再配 resolve_refs/flatten_ports/
# attach_invert_map（P1.5 step 2 清理旧原语链）。

# role 独立子作用域：master/slave 的端口声明（AnsiInputDecl 等）是 role
# 成员，各 role 作用域隔离——同名端口（master/slave 都有 clk）不冲突
# （2026-08-28：_extract_names 修复后端口符号开始收集，暴露此缺陷）。
[TypeRole.analyzer.scope]
kind = "role"
name_attr = "role_name"

[TypeRole.analyzer.symbol]
kind = "role"
name_attr = "role_name"

[TypeRole.analyzer.symbol.capture]
ports = "ports"

[TypePortDecl]
inline = true

[TypePortDecl.parser]
production = [
    "@AnsiInputDecl | @AnsiOutputDecl | @AnsiInoutDecl | @TypeInvertPort | @TypeNestedPort",
]

[TypePortDecl.parser.node]
child = "$1"

[TypeNestedPort.parser]
production = [
    "@TypedTypeSpec",
    "@Identifier",
]

[TypeNestedPort.parser.node]
type_spec = "$1"
instance_name = "$2"

[TypeNestedPort.renderer]
# 嵌套类型端口：`type.role name`（如 `spi.master inner`）
layout = { line = [
    { ref = "type_spec" },
    " ",
    { ref = "instance_name" },
] }

[TypeInvertPort.parser]
production = [
    "keyword.invert",
    "@Identifier",
]

[TypeInvertPort.parser.node]
target_role = "$2"

[TypeImplDecl.parser]
production = [
    "keyword.impl",
    "bracket.l_square_bracket",
    "@Identifier",
    "bracket.r_square_bracket",
    "bracket.l_parentheses",
    "@PortList?",
    "bracket.r_parentheses",
    "bracket.l_curly_bracket",
    "@ModuleItem*",
    "bracket.r_curly_bracket",
]

[TypeImplDecl.parser.node]
role_name = "$3"
ports = "$6"
body = "$9"

[TypeImplDecl.renderer]
# `impl [role] (ports) { body }`（type 定义内的实现声明）
head = { line = [
    "impl [",
    { ref = "role_name" },
    "] (",
    { opt = { group = ["", { ref = "ports" }] } },
    ") {",
] }
body = { source = "body" }
tail = "}"

[InvertDecl.parser]
production = [
    "keyword.invert",
    "@Identifier",
    "symbol.base.semicolon",
]

[InvertDecl.parser.node]
target_role = "$2"


# ── 增强节点渲染（保留增强语法路径）──

[TypeDecl.renderer]
layout = { line = [
    "type ",
    { ref = "type_name" },
    { opt = { group = [
        " (",
        { ref = "params" },
        ")",
    ] } },
    " {",
] }
# body 穿透到 TypeBody.members（点路径，一层 Break 无空行）；
# `}` 由 tail 输出（与 type 对齐）
body = { source = "body.members" }
tail = { text = "}", break = 1 }

[TypeBody.renderer]
# `{` 由 TypeDecl.layout 尾随输出；members 由 TypeDecl.body 穿透渲染
# （TypeBody 自身不再渲染 head/body，避免嵌套 Break 产生空行）
tail = "}"


[TypeMember.renderer]
layout = { ref = "child" }

[TypeRole.renderer]
# `;` 直接进 layout（tail 会因 render_node 的硬 Break 独立成行）
layout = { line = [
    { ref = "role_name" },
    " : ",
    { join = ", ", items = "ports", no_soft = true },
    ";",
] }

[TypeInvertPort.renderer]
layout = { line = [
    "invert ",
    { ref = "target_role" },
] }

[InvertDecl.renderer]
# `;` 进 layout（同上，避免独立成行）
layout = { line = [
    "invert ",
    { ref = "target_role" },
    ";",
] }
