[ImplBinding.inject]
targets = [
    "@InstStmt",
]

[ImplBinding]
is_statement = true

[ImplBinding.parser]
production = [
    "keyword.impl",
    "@Identifier",
    "@ParamOverride?",
    "@Identifier?",
    "@PortConnection",
]
end_case = [
    "newline",
]

[ImplBinding.parser.node]
module_name = "$2"
params = "$3"
inst_name = "$4"
ports = "$5.ports"

[ImplBinding.renderer]
# `impl module_name [params] [inst_name] (ports);`（语句级，仿 ModuleInst）
head = { line = [
    "impl ",
    { ref = "module_name" },
    { opt = { group = [
        " ",
        { ref = "params" },
    ] } },
    { opt = { group = [
        " ",
        { ref = "inst_name" },
    ] } },
    " (",
] }
body = { indent = true, items = ["ports"] }
tail = { text = ");", break = 2 }


[ImplBindingWithInterface.renderer]
# `impl type.role [params] (ports) => iface;`（自动连线绑定）
# 注意：ImplPortsParens 为 inline 节点，ports 属性已直接是 NamedPortList，
# 括号需在 layout 手动给出；箭头 token 是 `=>`（symbol.extend.arrow）。
layout = { line = [
    "impl ",
    { ref = "type_spec" },
    { opt = { group = [
        " ",
        { ref = "params" },
    ] } },
    { opt = { group = [
        " (",
        { ref = "ports" },
        ")",
    ] } },
    " => ",
    { ref = "interface_ref" },
    ";",
] }

[ImplPortsParens.renderer]
# `(ports)` 包装（inline 节点通常被消除，此 layout 备用）
layout = { line = [
    "(",
    { ref = "ports" },
    ")",
] }

[ImplBindingWithInterface.inject]
targets = [
    "@InstStmt",
]

[ImplBindingWithInterface]
is_statement = true

[ImplBindingWithInterface.parser]
production = [
    "keyword.impl",
    "@TypedTypeSpec",
    "@ParamOverride?",
    "@ImplPortsParens?",
    "symbol.extend.arrow",
    "@Identifier",
    "symbol.base.semicolon",
]
end_case = [
    "newline",
]

[ImplBindingWithInterface.parser.node]
type_spec = "$2"
params = "$3"
ports = "$4"
interface_ref = "$6"

[ImplPortsParens.parser]
inline = true
production = [
    "bracket.l_parentheses",
    "@NamedPortList?",
    "bracket.r_parentheses",
]

[ImplPortsParens.parser.node]
ports = "$2"
