# gates 插件 — 词法扩展（IEEE 1364-2005 A.3 门级/开关原语）
# 26 个原语关键字。and/or/not 是字母运算符（symbol.extend，主包已有），
# 此处不重复；strength 关键字与 nettypes 插件同定义（合并无害，两插件
# 可独立启用——跨插件不依赖）。

[id.keyword]
# n 输入门（and/or 用 symbol.extend；nand/nor/xor/xnor 为关键字）
nand = "nand"
nor = "nor"
xor = "xor"
xnor = "xnor"
# n 输出门
buf = "buf"
# 三态门
bufif0 = "bufif0"
bufif1 = "bufif1"
notif0 = "notif0"
notif1 = "notif1"
# MOS 开关
nmos = "nmos"
pmos = "pmos"
rnmos = "rnmos"
rpmos = "rpmos"
# CMOS 开关
cmos = "cmos"
rcmos = "rcmos"
# 双向开关
tran = "tran"
tranif0 = "tranif0"
tranif1 = "tranif1"
rtran = "rtran"
rtranif0 = "rtranif0"
rtranif1 = "rtranif1"
# 上拉/下拉
pullup = "pullup"
pulldown = "pulldown"

# 驱动强度（A.2.2.2，与 nettypes 同定义）
supply0 = "supply0"
supply1 = "supply1"
strong0 = "strong0"
strong1 = "strong1"
pull0 = "pull0"
pull1 = "pull1"
weak0 = "weak0"
weak1 = "weak1"
highz0 = "highz0"
highz1 = "highz1"
