# ============================================================================
# nettypes 插件 — net 类型全谱声明（IEEE 1364-2005 A.2.1.3/A.2.2）
# ============================================================================
# 主包 WireDecl 只覆盖可综合 wire 形态；本插件补全 12 种 net_type 的完整
# 声明形态：drive/charge strength + vectored/scalared + delay3（A.2.2.2/A.2.2.3）。
#
# 设计：
#   - NetTypeKeyword 含 wire（12 种全谱）——插件启用时带 strength/delay 的
#     wire 声明（主包 WireDecl 不支持的形态）由 NetDecl 承接；普通 wire 声明
#     仍走主包 WireDecl（analyzer.symbol kind="wire" 语义不变）。
#   - 组合约束（charge 只配 trireg、drive/charge 互斥、六种合法 strength
#     组合）语法层宽进，语义检查后续承担。
#   - NetStrength 是 drive/charge 二选一选择器（纯 choice 自动 inline）：
#     相邻可选段共享 "(" 首 token 会触发 linter matcher 的 optional 失败
#     恢复误判，choice 内部试备选无此问题。
#
# 挂载：NetDecl 注入主包 DeclStmt（模块体声明分派）。
# 禁用本插件后：关键字回归 id、规则消失——含这些语法的源码解析失败
# （与 sim 插件同款开关语义）。

[NetDecl.inject]
targets = ["@DeclStmt"]


# ── NetTypeKeyword — net_type 关键字（12 种全谱，含 wire） ──

[NetTypeKeyword]
[NetTypeKeyword.parser]
production = [
    "keyword.wire|keyword.tri|keyword.triand|keyword.trior|keyword.tri0|keyword.tri1|keyword.trireg|keyword.uwire|keyword.wand|keyword.wor|keyword.supply0|keyword.supply1",
]
[NetTypeKeyword.parser.node]
type_name = "$1"
[NetTypeKeyword.renderer]
layout = { ref = "type_name" }


# ── StrengthWord — 强度关键字 ──
# A.2.2.2: strength0 ::= supply0 | strong0 | pull0 | weak0
#           strength1 ::= supply1 | strong1 | pull1 | weak1
#           外加 charge_strength 不适用、驱动强度专用 highz0/highz1。

[StrengthWord]
[StrengthWord.parser]
production = [
    "keyword.supply0|keyword.supply1|keyword.strong0|keyword.strong1|keyword.pull0|keyword.pull1|keyword.weak0|keyword.weak1|keyword.highz0|keyword.highz1",
]
[StrengthWord.parser.node]
word = "$1"
[StrengthWord.renderer]
layout = { ref = "word" }


# ── DriveStrength — ( strength , strength ) ──
# 六种合法组合（含 highz 单侧）语法层宽进，语义检查约束。

[DriveStrength]
[DriveStrength.parser]
production = [
    "bracket.l_parentheses",
    "@StrengthWord",
    "symbol.base.comma",
    "@StrengthWord",
    "bracket.r_parentheses",
]
[DriveStrength.parser.node]
w0 = "$2.word"
w1 = "$4.word"
[DriveStrength.renderer]
layout = { line = ["(", { ref = "w0" }, ", ", { ref = "w1" }, ")"] }


# ── ChargeStrength — ( small | medium | large )，只配 trireg ──

[ChargeStrength]
[ChargeStrength.parser]
production = [
    "bracket.l_parentheses",
    "keyword.small|keyword.medium|keyword.large",
    "bracket.r_parentheses",
]
[ChargeStrength.parser.node]
level = "$2"
[ChargeStrength.renderer]
layout = { line = ["(", { ref = "level" }, ")"] }


# ── NetStrength — drive/charge 二选一（纯 choice 自动 inline 展平） ──

[NetStrength]
[NetStrength.parser]
production = ["@DriveStrength|@ChargeStrength"]
[NetStrength.parser.node]
strength = "$1"
[NetStrength.renderer]
layout = { ref = "strength" }


# ── VectoredScalared — 向量属性 ──

[VectoredScalared]
[VectoredScalared.parser]
production = ["keyword.vectored|keyword.scalared"]
[VectoredScalared.parser.node]
attr = "$1"
[VectoredScalared.renderer]
layout = { ref = "attr" }


# ── Delay3 — # 值 | # ( min [ , typ [ , max ] ] ) ──
# A.2.2.3: delay3 ::= # delay_value
#           | # ( mintypmax_expression [ , mintypmax_expression
#             [ , mintypmax_expression ] ] )
# delay_value ::= unsigned_number | real_number | identifier
# mintypmax_expression 见 A.8.4: expression | expression : expression : expression
# 注: mintypmax 的 a : b : c 与三目 ?: 无歧义——pratt 只在 ? 后消费 :。

[Delay3]
[Delay3.parser]
production = ["symbol.base.pound", "@DelayValue|@Delay3Paren"]
[Delay3.parser.node]
value = "$2"
[Delay3.renderer]
layout = { line = ["#", { ref = "value" }] }

[DelayValue]
[DelayValue.parser]
production = ["@Number|@Identifier"]
[DelayValue.parser.node]
value = "$1"
[DelayValue.renderer]
layout = { ref = "value" }

[Delay3Paren]
[Delay3Paren.parser]
production = [
    "bracket.l_parentheses",
    "@MintypmaxExpr",
    "(symbol.base.comma,@MintypmaxExpr)*",
    "bracket.r_parentheses",
]
[Delay3Paren.parser.node]
exprs = ["$2", "$3.items[*].sub_node[1]"]
[Delay3Paren.renderer]
layout = { line = [
    "(",
    { join = ", ", items = "exprs" },
    ")",
] }

[MintypmaxExpr]
[MintypmaxExpr.parser]
production = [
    "@Expression",
    "(symbol.base.colon,@Expression,symbol.base.colon,@Expression)?",
]
# $2 是 optional 节点（组带 ? 后缀）：sub_node[0] 解包组（seq），组内
# 元素为 [colon, Expr, colon, Expr]（token 占位）——typ/max 取 1/3。
[MintypmaxExpr.parser.node]
expr = "$1"
typ = "$2.sub_node[0].sub_node[1]"
max_expr = "$2.sub_node[0].sub_node[3]"
[MintypmaxExpr.renderer]
layout = { line = [
    { ref = "expr" },
    { opt = { group = [
        " : ",
        { ref = "typ" },
        " : ",
        { ref = "max_expr" },
    ] } },
] }


# ── NetDecl — net 声明（12 种 net_type 完整形态） ──
# A.2.1.3 net_declaration 八形态合并为单规则（可选段序列）：
# net_type [drive|charge strength] [vectored|scalared] [signed] [range]
# [delay3] list_of_net_identifiers ;
# list_of_net_decl_assignments（= expression）复用主包 DeclaratorList 的 Init。

[NetDecl]
is_statement = true

[NetDecl.parser]
production = [
    "@NetTypeKeyword",
    "@NetStrength?",
    "@VectoredScalared?",
    "keyword.signed?",
    "@Range?",
    "@Delay3?",
    "@DeclaratorList",
    "symbol.base.semicolon",
]

[NetDecl.parser.node]
net_type = "$1"
strength = "$2"
vectored_scalared = "$3"
is_signed = "$4"
packed_range = "$5"
delay = "$6"
items = "$7"

[NetDecl.renderer.layout]
line = [
    { ref = "net_type" },
    { opt = { group = [" ", { ref = "strength" }] } },
    { opt = { group = [" ", { ref = "vectored_scalared" }] } },
    { opt = { group = [" ", { ref = "is_signed" }] } },
    { opt = { group = [" [", { ref = "packed_range" }, "]"] } },
    { opt = { group = [" ", { ref = "delay" }] } },
    " ",
    { ref = "items" },
    ";",
]
