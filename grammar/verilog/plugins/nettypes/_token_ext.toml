# nettypes 插件 — token 扩展
# IEEE 1364-2005 罕见/仿真向声明语法的关键字（主包纯净可综合，不含这些）。
# 禁用本插件后这些词回归普通 id token，相关语法整体失效（开关语义）。

[id.keyword]
# 声明类型（A.2.1.3）
real = "real"
time = "time"
realtime = "realtime"

# net 类型（A.2.2.1；wire 主包已有，此处不重复）
tri = "tri"
triand = "triand"
trior = "trior"
tri0 = "tri0"
tri1 = "tri1"
trireg = "trireg"
uwire = "uwire"
wand = "wand"
wor = "wor"
supply0 = "supply0"
supply1 = "supply1"

# 驱动强度（A.2.2.2；supply0/supply1 与 net 类型复用同一关键字）
strong0 = "strong0"
strong1 = "strong1"
pull0 = "pull0"
pull1 = "pull1"
weak0 = "weak0"
weak1 = "weak1"
highz0 = "highz0"
highz1 = "highz1"

# 电荷强度 + 向量属性（A.2.2.2 / A.2.1.3）
small = "small"
medium = "medium"
large = "large"
vectored = "vectored"
scalared = "scalared"
