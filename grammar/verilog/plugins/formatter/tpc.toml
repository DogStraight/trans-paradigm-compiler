# Formatter plugin — 结构感知的 Verilog 格式化器
#
# 品类列表：每个品类定义 matcher + family + 对齐行为
# break_distance: 同品类行之间超过 N 行其他内容则切为独立组
# 由 __init__.py build_engine 从 ConfigRegistry["formatter.categories"] 读取。

[[formatter.categories]]
name = "port_dir"
enabled = true
matcher = { first_token = ["input", "output", "inout"] }
family = "port_dir"
align_port_names = true
break_distance = 3

[[formatter.categories]]
name = "declaration"
enabled = true
matcher = { first_token = ["reg", "wire"] }
family = "declaration"
break_distance = 3

[[formatter.categories]]
name = "parameter"
enabled = true
matcher = { first_token = ["parameter", "localparam"] }
family = "parameter"
break_distance = 3

[[formatter.categories]]
name = "assignment"
enabled = true
matcher = { first_token = ["assign"] }
family = "assignment"
break_distance = 3

[[formatter.categories]]
name = "genvar_integer"
enabled = true
matcher = { first_token = ["genvar", "integer"] }
family = "declaration"
break_distance = 3

[[formatter.categories]]
name = "function"
enabled = true
matcher = { first_token = ["function"] }
family = "function"
break_distance = 3

[[formatter.categories]]
name = "task"
enabled = true
matcher = { first_token = ["task"] }
family = "function"
break_distance = 3

# 结构边界映射（token/规则 → 结构类别）**不从本文件配置**——由各规则自身的
# [RuleName.analyzer] scope = { kind = "..." } 声明，boundary.py 从语法规则推导。

# 风格参数：indent_width 缩进空格数 / max_line_width 折行阈值
# （可选，缺省 4 / 100）
[formatter.style]
indent_width = 4
max_line_width = 100

# 折行决策参数（Verible 惩罚模型参考）：
# - break_penalties: 断点类型 → 惩罚值。逗号最低（最自然的断点），
#   逻辑/算术/三目递增。折行选择"总惩罚最小"的断点而非最右贪心。
# - over_column_penalty: 每超 1 列的惩罚系数。折后行可略超 max_line_width
#   但加重惩罚——权衡"折两行某行略超" vs "不折全超"。
# max_width 复用 [formatter.style].max_line_width。
[formatter.wrap]
over_column_penalty = 10
break_penalties = { comma = 1, logic = 10, arith = 20, ternary = 30 }

# 超长注释折行（VeriGood wrapComment 借鉴，默认关闭——破坏性最小原则）：
# 折纯 `//` 注释到 max_line_width，续行保留 `// ` 前缀。行内注释不折。
[formatter.wrap_comments]
enabled = false

# 条件编译指令注释标注（VeriGood 借鉴，默认关闭——加注释是主动增强，
# 与保真度对比 ref 冲突）：给 `` `else `` / `` `endif `` 补配对宏名注释。
[formatter.ifdef_annotate]
enabled = false
