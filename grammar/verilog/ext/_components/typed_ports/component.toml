[component]
name = "typed_ports"
lang = "verilog"
description = "类型化端口：type 声明 + 角色 + impl 绑定 + 自动展开"
requires = []

# 语法规则：引用 ext 目录中的文件，不重复定义
[component.grammar]
files = [
    "00_type_decl.toml",
    "06_typed_decl.toml",
    "10_impl_binding.toml",
]

[component.analyzer]
primitives = ["resolve_refs", "flatten_ports", "attach_invert_map"]
handlers = ["_mapping.py", "_flatten_ports.py", "_invert_map.py"]

[component.transform]
slots = [
    "delete_type_decl",       # TypeDecl → 删除（配置驱动）
    "build_wrapper",          # TypeImplDecl → 包装模块生成
    "expand_typed_port",      # TypedPortDecl → 展开为独立端口
    "auto_connect_ports",     # ImplBindingWithInterface → 自动端口连接
    "replace_impl_binding",   # ImplBinding/ImplBindingWithInterface → ModuleInst
]
handlers = ["_transform.py", "_bridge.py"]
