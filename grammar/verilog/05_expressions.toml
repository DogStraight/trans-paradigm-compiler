[BitWidthLiteral.parser]
production = [
    "literal.number",
    "symbol.base.single_quote",
    "@Identifier",
]

[BitWidthLiteral.parser.structure]
is_atom = true

[BitWidthLiteral.parser.node]
width = "$1"
value = "$3"

[[BitWidthLiteral.renderer.layout.line]]

[BitWidthLiteral.renderer.layout.line.opt]
group = [
    { ref = "width" },
    "'",
]

[[BitWidthLiteral.renderer.layout.line]]
ref = "base"

[[BitWidthLiteral.renderer.layout.line]]
ref = "value"

[BitWidthLiteral.structure]
is_atom = true

[Number.parser]
production = [
    "literal.number",
]

[Number.parser.structure]
is_atom = true

[Number.parser.node]
value = "$1"

[Number.renderer.layout]
ref = "value"

[Number.structure]
is_atom = true

[Identifier.parser]
production = [
    "id",
]
inline = false

[Identifier.parser.structure]
is_atom = true

[Identifier.parser.node]
content = "$1.value"

[Identifier.analyzer]
identifier_ref = true

[Identifier.renderer.layout]
ref = "content"

[Identifier.structure]
is_atom = true

[ParenthesizedExpr.parser]
production = [
    "bracket.l_parentheses",
    "@Expression",
    "bracket.r_parentheses",
]

[ParenthesizedExpr.parser.structure]
is_atom = true

[ParenthesizedExpr.parser.node]
expr = "$2"

[ParenthesizedExpr.renderer.layout]
line = [
    "(",
    { ref = "expr" },
    ")",
]

[ParenthesizedExpr.structure]
is_atom = true

[SelectSuffix.parser]
production = [
    "@Expression",
    "((symbol.base.colon|symbol.extend.plus_range|symbol.extend.minus_range),@Expression)?",
]

[SelectSuffix.parser.node]
index = "$1"
range_suffix = "$2"

[SelectSuffix.renderer.layout]
line = [
    { ref = "index" },
    { opt = { ref = "range_suffix" } },
]

# SelectSuffix 内的 BinaryOp（如 a[i-1]）不产生操作符两侧空格
[SelectSuffix.renderer.override.BinaryOp]
layout = { line = [
    { ref = "left" },
    { ref = "op" },
    { ref = "right" },
] }

[SelectExpr.parser]
production = [
    "@Identifier",
    "bracket.l_square_bracket",
    "@SelectSuffix",
    "bracket.r_square_bracket",
    "(bracket.l_square_bracket,@SelectSuffix,bracket.r_square_bracket)*",
]

[SelectExpr.parser.structure]
is_atom = true

[SelectExpr.parser.node]
base = "$1"
first_suffix = "$3"
extra_suffixes = "$5.items"

[SelectExpr.renderer.layout]
line = [
    { ref = "base" },
    "[",
    { ref = "first_suffix" },
    "]",
    { ref = "extra_suffixes" },
]

[SelectExpr.structure]
is_atom = true

[ConcatExpr.parser]
production = [
    "bracket.l_curly_bracket",
    "@Expression",
    "(symbol.base.comma,@Expression)*",
    "bracket.r_curly_bracket",
]

[ConcatExpr.parser.structure]
is_atom = true

[ConcatExpr.parser.node]
sub_node = [
    "$2",
    "$3.items[*].sub_node[1]",
]

[ConcatExpr.renderer.layout]
line = [
    "{",
    { join = ",", nest = 1 },
    "}",
]

[ConcatExpr.structure]
is_atom = true

[ReplicateExpr.parser]
production = [
    "bracket.l_curly_bracket",
    "@Expression",
    "bracket.l_curly_bracket",
    "@Expression",
    "bracket.r_curly_bracket",
    "bracket.r_curly_bracket",
]

[ReplicateExpr.parser.structure]
is_atom = true

[ReplicateExpr.parser.node]
count = "$2"
value = "$4"

[ReplicateExpr.renderer.layout]
line = [
    "{",
    { ref = "count" },
    "{",
    { ref = "value" },
    "}",
    "}",
]

[ReplicateExpr.structure]
is_atom = true

[PrimaryExpr.parser]
production = [
    "@BitWidthLiteral|@Number|@SelectExpr|@Identifier|@ParenthesizedExpr|@ReplicateExpr|@ConcatExpr|@CallExpr|@SysFuncCall",
]
inline = true

[PrimaryExpr.parser.node]
value = "$1"

[PrimaryExpr.renderer.layout]
ref = "value"

[CallExpr.parser]
production = [
    "@Identifier",
    "bracket.l_parentheses",
    "@ArgumentList?",
    "bracket.r_parentheses",
]

[CallExpr.parser.structure]
is_atom = true

[CallExpr.parser.node]
callee = "$1"
args = "$3"

[CallExpr.renderer.layout]
line = [
    { ref = "callee" },
    "(",
    { ref = "args" },
    ")",
]

[CallExpr.structure]
is_atom = true

[SysFuncCall.parser]
production = [
    "symbol.base.dollar",
    "@Identifier",
    "bracket.l_parentheses",
    "@ArgumentList?",
    "bracket.r_parentheses",
]

[SysFuncCall.parser.structure]
is_atom = true

[SysFuncCall.parser.node]
callee = "$2"
args = "$4"

[SysFuncCall.renderer.layout]
line = [
    "$",
    { ref = "callee" },
    "(",
    { ref = "args" },
    ")",
]

[SysFuncCall.structure]
is_atom = true

[ArgumentList.parser]
production = [
    "@Expression",
    "(symbol.base.comma,@Expression)*",
]

[ArgumentList.parser.node]
items = [
    "$1",
    "$2.items[*].sub_node[1]",
]

[ArgumentList.renderer.layout]
join = ", "
items = "items"
nest = 1

[UnaryExpr.parser]
production = [
    "symbol.base.not|symbol.base.bit_not",
    "@PrimaryExpr",
]
pratt = true

[UnaryExpr.parser.node]
op = "$1"
operand = "$2"

[MulExpr.parser]
production = [
    "@PrimaryExpr|@UnaryExpr",
    "(@MulOp,@PrimaryExpr|@UnaryExpr)*",
]
pratt = true

[MulExpr.parser.node]
head = "$1"
tail = "$2"

[AddExpr.parser]
production = [
    "@MulExpr",
    "(@AddOp,@MulExpr)*",
]
pratt = true

[AddExpr.parser.node]
head = "$1"
tail = "$2"

[CompareExpr.parser]
production = [
    "@AddExpr",
    "(@CmpOp,@AddExpr)?",
]
pratt = true

[CompareExpr.parser.node]
left = "$1"
op_rhs = "$2"

[LogicAndExpr.parser]
production = [
    "@CompareExpr",
    "(@LogicAndOp,@CompareExpr)*",
]
pratt = true

[LogicAndExpr.parser.node]
head = "$1"
tail = "$2"

[LogicOrExpr.parser]
production = [
    "@LogicAndExpr",
    "(@LogicOrOp,@LogicAndExpr)*",
]
pratt = true

[LogicOrExpr.parser.node]
head = "$1"
tail = "$2"

[Expression.parser]
production = [
    "@LogicOrExpr",
]
pratt = true
end_case = [
    "symbol.base.comma",
    "symbol.base.semicolon",
    "bracket.r_parentheses",
    "bracket.r_square_bracket",
    "bracket.r_curly_bracket",
    "symbol.base.colon",
]

[Expression.parser.structure]
is_statement = false

[Expression.parser.node]

[MulOp.parser]
production = [
    "symbol.base.multiple|symbol.base.div|symbol.base.mod",
]

[MulOp.parser.node]
op = "$1"

[AddOp.parser]
production = [
    "symbol.base.add|symbol.base.sub",
]

[AddOp.parser.node]
op = "$1"

[CmpOp.parser]
production = [
    "symbol.extend.is_equal",
    "symbol.extend.not_equal",
    "symbol.base.bigger",
    "symbol.base.lesser",
    "symbol.extend.bigger_equal",
    "symbol.extend.lesser_equal",
]

[CmpOp.parser.node]
op = "$1"

[LogicAndOp.parser]
production = [
    "symbol.extend.logic_double_and",
]

[LogicAndOp.parser.node]
op = "$1"

[LogicOrOp.parser]
production = [
    "symbol.extend.logic_double_or",
]

[LogicOrOp.parser.node]
op = "$1"

[UnaryOp.renderer.layout]
line = [
    { ref = "op" },
    { ref = "operand" },
]

[BinaryOp.renderer.layout]
line = [
    { ref = "left" },
    " ",
    { ref = "op" },
    " ",
    { ref = "right" },
]

[TernaryOp.renderer.layout]
line = [
    { ref = "cond" },
    " ? ",
    { ref = "true_val" },
    " : ",
    { ref = "false_val" },
]

["bracket.l_square_bracket".renderer.layout]
ref = "value"

["bracket.r_square_bracket".renderer.layout]
ref = "value"
