[lexer]
token_base = { file = "base/_token.toml", required = true }
lexer_base = { file = "base/_lexer.toml", required = true }
token_lang = { file = "token.toml", required = false }
macro_config = { file = "base/_macro.toml", required = false }
pre_scan = { file = "base/_pre_scan.toml", section = "pre_scan", required = false }
bracket_map = { file = "base/_token.toml", section = "bracket", required = false }
number = { file = "base/_number.toml", section = "number", required = false }

[parser]
operator_defs = { file = "base/_symbol_level.toml", section = "operator", required = true }
token_categories = { file = "base/_lexer.toml", section = "token_category", required = true }
rules = { file = ["0*.toml", "0*/*.toml"], required = true }
# 解析时需要跳过的空白/折叠 token 类型
skip_types = ["newline", "space.fold"]

[renderer]
style = { file = "base/_style.toml", section = "style", required = false }

[linter]
# 块 opener token → 消歧上下文（语句发现阶段用）
opener_context = [
    ["keyword.module", "module_body"],
    ["keyword.begin", "proc_body"],
    ["keyword.function", "proc_body"],
    ["keyword.task", "proc_body"],
    ["keyword.generate", "gen_body"],
]
# 模块体 / 过程体语句选择器规则名（推导语句叶子集合用）
module_item_rule = "ModuleItem"
stmt_rule = "Stmt"

[preprocessor]
macro_config = { file = "base/_macro.toml", required = false }
expand = { file = "base/_macro.toml", section = "expand", required = false }
directives = { file = "base/_macro.toml", section = "directive_handlers", required = false }
continuation = { file = "base/_macro.toml", section = "continuation", required = false }
reverse = { file = "base/_macro.toml", section = "reverse", required = false }

[plugins]
enabled = ["typed_ports", "formatter", "attributes", "semantic_check"]

# ── 指令管线定义（main.py 指令 → 阶段序列） ──
# 每个指令声明自己的管线阶段（stages 列表），main.py 按声明驱动
# run_pipeline_on_source（stages 参数：跳过未声明阶段）。
#   format  = preprocess(宏展开) → lex → lint → 归一化 → 渲染（含 formatter），还原宏；
#             保留 lint（AST 生成需 lint 通过），跳过 analyze/transform
#   lint    = 只做词法 + 前置 lint（不展开宏）
#   expand  = 完整管线 + 宏展开（变换展开）
#   pipeline= 完整管线（默认，不展开宏，由 CLI/配置显式控制）
[commands.format]
stages = ["preprocess", "lex", "lint", "parse", "normalize", "render"]

[commands.lint]
stages = ["lex", "lint"]

[commands.expand]
stages = ["preprocess", "lex", "lint", "parse", "normalize", "analyze", "transform", "render"]

[commands.pipeline]
stages = ["lex", "lint", "parse", "normalize", "analyze", "transform", "render"]
