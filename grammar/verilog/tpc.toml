[engine]
# 本包构建所依据的引擎 API 线（major.minor）——引擎不匹配即加载 fail-fast
# （契约语义见 core/engine_compat.py，校验点见 core/config_lifecycle.md）。
api = "0.1"

[lexer]
token_base = { file = "base/_token.toml", required = true }
lexer_base = { file = "base/_lexer.toml", required = true }
token_lang = { file = "token.toml", required = false }
pre_scan = { file = "base/_pre_scan.toml", section = "pre_scan", required = false }
bracket_map = { file = "base/_token.toml", section = "bracket", required = false }
number = { file = "base/_number.toml", section = "number", required = false }

[parser]
operator_defs = { file = "base/_symbol_level.toml", section = "operator", required = true }
token_categories = { file = "base/_lexer.toml", section = "token_category", required = true }
# 语法规则按主题目录组织（00_blocks/01_module/02_declarations/03_always/
# 04_statements/05_expressions，每目录内 00_base.toml + 细分小节文件）
rules = { file = ["0*/*.toml"], required = true }

[structure]
protocol = { file = "base/_structure.toml", section = "structure", required = false }

[renderer]
style = { file = "base/_style.toml", section = "style", required = false }

[preprocessor]
macro_config = { file = "base/_macro.toml", required = false }
expand = { file = "base/_macro.toml", section = "expand", required = false }
directives = { file = "base/_macro.toml", section = "directive_handlers", required = false }
continuation = { file = "base/_macro.toml", section = "continuation", required = false }
macro_shape = { file = "base/_macro.toml", section = "macro_shape", required = false }

[linter]
macro_hygiene = { file = "base/_macro.toml", section = "macro_hygiene", required = false }
style_check = { file = "base/_style_check.toml", section = "style_check", required = false }

[plugins]
enabled = ["typed_ports", "formatter", "attributes", "semantic_check", "sim", "inst_check", "nettypes", "configs", "gates", "udp", "specify", "custom_rules_example"]

# ── 管线编排（语言级：加工单元 → 时点 + 契约校验 + 轨迹） ──
# 声明后**替代**默认 pass 序列（analyze → transform），故 analyze 显式声明。
# 声明序与 transform 插件注册序对齐（transform/__init__.py：slot_runner →
# 语义映射 → 配置驱动 codegen）；契约来自各插件 register_plugin 的
# produces/requires（slot_runner: scope → slot_transforms；映射: → mapping_tables；
# codegen: mapping_tables →）。
[[pipeline.units]]
name = "analyze"
type = "analyze"
impl = "builtin.analyze"

[[pipeline.units]]
name = "slots"
type = "transform"
impl = "slot_runner"
after = "analyze"

[[pipeline.units]]
name = "map"
type = "transform"
impl = "SemanticMappingPlugin"
after = "slots"

[[pipeline.units]]
name = "codegen"
type = "transform"
impl = "ConfigDrivenTransform"
after = "map"

# ── 指令定义（main.py 指令 → run_pipeline 参数开关） ──
# 默认值 = 完整管线（preprocess/lint/parse/analyze/transform/render 全 true，
# plugins.formatter=false）——指令只声明**差异项**。
#   - 管线阶段开关：preprocess(宏展开，还原在 render 内部) / lint /
#     analyze / transform / render
#   - 插件能力组别 [commands.<name>.plugins]：formatter = 渲染后过 formatter
#     （format 是 formatter 插件提供的能力，单独组别开关）
[commands.format]
analyze = false
transform = false

[commands.format.plugins]
formatter = true

[commands.lint]
parse = false
analyze = false
transform = false
render = false

[commands.expand.plugins]
formatter = true

[commands.pipeline.plugins]
formatter = true
