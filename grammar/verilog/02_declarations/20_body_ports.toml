# ============================================================================
# Verilog 语法规则 — 模块体端口声明（带分号）
# ============================================================================
# 本文件定义模块体内部的端口声明（即非 ANSI 风格，在 begin…end 外写
# input/output/inout + 分号的形式）以及任务/函数体的端口声明。
#
# 这些规则与 ANSI 端口共享 PortTail/TypeSpec/DeclaratorList 等基础单元。
# 被引用于: 04_statements/00_base.toml (DeclStmt → BodyPortDecl)

# ── BodyPortDecl — 模块体端口声明（分发器） ──

[BodyPortDecl.parser]
production = [
    "@BodyInputDecl|@BodyOutputDecl|@BodyInoutDecl",
]
inline = true

[BodyPortDecl.parser.node]
decl = "$1"

[BodyPortDecl.renderer.layout]
ref = "decl"


# ── BodyInputDecl — 模块体 input 声明 ──
# 模块体内的 input 端口声明，以分号结尾。
# 格式: input [wire] [signed] [range] name1, name2, ... ;

[BodyInputDecl]
is_statement = true

[BodyInputDecl.parser]
production = [
    "keyword.input",
    "@PortTail",
    "symbol.base.semicolon",
]

[BodyInputDecl.parser.node]
direction = "input"
port_type = "$2.port_type"
is_signed = "$2.is_signed"
packed_range = "$2.packed_range"
items = "$2.items"

[BodyInputDecl.analyzer.symbol]
kind = "port"
name_attr = "items.name"

[BodyInputDecl.renderer.layout]
line = [
    "input",
    { opt = { group = [
    " ",
    { ref = "port_type" },
] } },
    { opt = { group = [
    " ",
    { ref = "is_signed" },
] } },
    { opt = { group = [
    " [",
    { ref = "packed_range" },
    "]",
] } },
    " ",
    { ref = "items" },
    ";",
]


