[BodyPortDecl.parser]
production = [
    "@BodyInputDecl|@BodyOutputDecl|@BodyInoutDecl",
]
inline = true

[BodyPortDecl.parser.node]
decl = "$1"

[BodyPortDecl.renderer.layout]
ref = "decl"

[BodyInputDecl.parser]
production = [
    "keyword.input",
    "@PortTail",
    "symbol.base.semicolon",
]
end_case = [
    "newline",
]

[BodyInputDecl.parser.node]
direction = "input"
port_type = "$2.port_type"
is_signed = "$2.is_signed"
packed_range = "$2.packed_range"
items = "$2.items"

[BodyInputDecl.analyzer.symbol]
kind = "port"
name_attr = "items.name"

[BodyInputDecl.renderer.layout]
line = [
    "input",
    { opt = { group = [
    " ",
    { ref = "port_type" },
] } },
    { opt = { group = [
    " ",
    { ref = "is_signed" },
] } },
    { opt = { group = [
    " [",
    { ref = "packed_range" },
    "]",
] } },
    " ",
    { ref = "items" },
    ";",
]

[BodyInputDecl.structure]
is_statement = true

[BodyOutputDecl.parser]
production = [
    "keyword.output",
    "@PortTail",
    "symbol.base.semicolon",
]
end_case = [
    "newline",
]

[BodyOutputDecl.parser.node]
direction = "output"
port_type = "$2.port_type"
is_signed = "$2.is_signed"
packed_range = "$2.packed_range"
items = "$2.items"

[BodyOutputDecl.analyzer.symbol]
kind = "port"
name_attr = "items.name"

[BodyOutputDecl.renderer.layout]
line = [
    "output",
    { opt = { group = [
    " ",
    { ref = "port_type" },
] } },
    { opt = { group = [
    " ",
    { ref = "is_signed" },
] } },
    { opt = { group = [
    " [",
    { ref = "packed_range" },
    "]",
] } },
    " ",
    { ref = "items" },
    ";",
]

[BodyOutputDecl.structure]
is_statement = true

[BodyInoutDecl.parser]
