# ============================================================================
# Verilog 语法规则 — 端口与声明（组合复用）
# ============================================================================
# 本文件定义端口和声明的基础组合单元，被 ANSI 端口、Body 端口、Task 端口
# 以及 Wire/Reg/Integer 声明等规则复用：
#   Declarator      — 单个声明器: name [range] = init
#   RangeBracket    — 带括号的范围 [msb:lsb]，用于多维数组
#   DeclaratorList  — 逗号分隔的声明器列表
#   TypeSpec        — 类型描述符（wire/reg + signed + range）
#   TypeSpecNoReg   — input/inout 专用类型描述符（不含 reg）
#   PortTail        — 端口声明公共尾部（direction + TypeSpec + DeclaratorList）
#   Init            — 初始化器 = expr
#   Range           — 范围 [msb:lsb]

# ── Declarator — 声明器 ──
# 单个声明项: name [range] [= init_value]
# 例如: data_out [0:7] = 8'h00
#
# exclude: 负向前瞻（非 FOLLOW 数据）——Declarator 匹配到 name 后若后跟
# `.`（类型引用如 `spi.slave` 的起点），即失败回退。@DeclaratorList 的
# repeat 会贪吃逗号分隔项（`input rstn, spi.slave ...` 中 `spi` 会被当
# 第二个 declarator），exclude 阻止它吞掉 TypedPortDecl 的类型引用。
# 该歧义是 Declarator 自身语法不可推导的（FOLLOW 不含 `.` 但无此歧义时
# `.` 也应拒绝），故独立字段声明，parser 与 linter 共同消费。

[Declarator]
[Declarator.parser]
production = ["@Range?", "@Identifier", "@RangeBracket*", "@Init?"]
exclude = ["symbol.base.dot"]
[Declarator.parser.node]
packed_range = "$1"
name = "$2"
array_range = "$3"
init = "$4"
[Declarator.renderer]
layout = { line = [
    { opt = { group = [
        "[",
        { ref = "packed_range" },
        "] ",
    ] } },
    { ref = "name" },
    { join = "", items = "array_range" },
    { opt = { group = [
        " = ",
        { ref = "init" },
    ] } },
] }


# ── RangeBracket — 带括号的范围（数组维域） ──
# 将 Range 包装为带括号的形式，用于多维数组声明。
# 例如: [0:3][0:7]（两个 RangeBracket）

[RangeBracket]
[RangeBracket.parser]
production = ["@Range"]
[RangeBracket.parser.node]
range = "$1"
[RangeBracket.renderer]
layout = { line = [
    "[",
    { ref = "range" },
    "]",
] }


# ── DeclaratorList — 声明器列表 ──
# 逗号分隔的多个声明器，如 wire a, b, c;
# intent = "compact"：紧凑列表（ADR-0006 阶段 4a）；first_soft=false 保持
# flat 模式无前导空格（`wire a, b` 而非 `wire  a, b`），nest=1 折行缩进。

[DeclaratorList]
[DeclaratorList.parser]
production = ["@Declarator", "(symbol.base.comma,@Declarator)*"]
[DeclaratorList.parser.node]
items = ["$1", "$2.items[*].sub_node[1]"]
[DeclaratorList.renderer]
layout = { intent = "compact", items = "items", first_soft = false }


# ── TypeSpec — 类型描述符 ──
# 端口/声明的类型部分: (wire|reg|tri)? signed? [range]?
# 用于 output/端口体声明（output 允许 reg）等场景。
# net 类型位 wire/tri 主包（tri 三态总线可综合，inout/output 双向常用）；
# 其余 net 类型由 nettypes 插件扩展（NetDecl 承接完整声明形态）。

[TypeSpec]
[TypeSpec.parser]
production = ["(keyword.wire|keyword.reg|keyword.tri)?", "keyword.signed?", "@Range?"]
[TypeSpec.parser.node]
port_type = "$1"
is_signed = "$2"
packed_range = "$3"
[TypeSpec.renderer]
layout = { line = [
    { opt = { group = [" ", { ref = "port_type" }] } },
    { opt = { group = [" ", { ref = "is_signed" }] } },
    { opt = { group = [" [", { ref = "packed_range" }, "]"] } },
] }


# ── TypeSpecNoReg — input/inout 专用类型描述符（不含 reg） ──
# 与 TypeSpec 的区别是不含 keyword.reg，因为 input/inout 不能声明为 reg。
# net 类型位 wire/tri（tri 三态总线——inout 默认语义；A.2.1.3 net_type
# 全谱其余类型由 nettypes 插件扩展）。

[TypeSpecNoReg]
[TypeSpecNoReg.parser]
production = ["(keyword.wire|keyword.tri)?", "keyword.signed?", "@Range?"]
[TypeSpecNoReg.parser.node]
port_type = "$1"
is_signed = "$2"
packed_range = "$3"
[TypeSpecNoReg.renderer]
layout = { line = [
    { opt = { group = [" ", { ref = "port_type" }] } },
    { opt = { group = [" ", { ref = "is_signed" }] } },
    { opt = { group = [" [", { ref = "packed_range" }, "]"] } },
] }


# ── PortTail — 端口声明公共尾部 ──
# 端口声明的公共部分: TypeSpec + DeclaratorList
# 被 BodyInputDecl/BodyOutputDecl/BodyInoutDecl/TaskInputDecl 等复用。
# 通过 dot 路径语法 ($1.port_type) 穿透 TypeSpec 提取子属性。

[PortTail]
[PortTail.parser]
production = ["@TypeSpec", "@DeclaratorList"]
[PortTail.parser.node]
port_type = "$1.port_type"
is_signed = "$1.is_signed"
packed_range = "$1.packed_range"
items = "$2"


# ── Init — 初始化器 ──
# = value 部分，如 `= 8'hFF`。inline = true 展平为父节点的一部分。

[Init]
[Init.parser]
production = ["symbol.base.equal", "@Expression"]
inline = true
[Init.parser.node]
value = "$2"
[Init.renderer]
layout = { line = ["= ", { ref = "value" }] }


# ── Range — 范围 [msb:lsb] ──
# Verilog 的范围声明 [msb:lsb]，如 [7:0]、[WIDTH-1:0]。
# A.2.5 constant_range_expression ::= constant_expression |
#   constant_part_select_range——单表达式 `[3]` 也是合法维/选择形态，
#   Range 补可选 lsb 分支（`3` 或 `3:0`，sv-parser unpacked_dimension
#   同构：alt(range, expression)）。括号配对由 [bracket].pairs 处理。

[Range]
[Range.parser]
production = [
    "bracket.l_square_bracket",
    "@Expression",
    "(symbol.base.colon,@Expression)?",
    "bracket.r_square_bracket",
]
[Range.parser.node]
msb = "$2"
lsb = "$3.sub_node[0].sub_node[1]"
[Range.renderer]
layout = { line = [
    { ref = "msb" },
    { opt = { group = [
        ":",
        { ref = "lsb" },
    ] } },
] }
