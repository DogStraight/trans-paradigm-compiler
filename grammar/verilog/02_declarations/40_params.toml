# ============================================================================
# Verilog 语法规则 — 参数声明
# ============================================================================
# 本文件定义模块体内的参数声明（localparam 和 genvar）。
# 注意: parameter 声明在 01_module.toml 的 ParamDecl 中定义。
#
# 被引用于: 04_statements/00_base.toml (DeclStmt → LocalParamDecl|GenvarDecl)

# ── LocalParamDecl — localparam 声明 ──
# 格式: localparam name1 = value1, name2 = value2, ... ;
#       localparam integer name = value, ... ;
#       localparam [msb:lsb] name = value, ... ;
# localparam 与 parameter 的区别在于不能被模块实例化时覆盖。
# 类型部分可选（integer 或 [range]），如 localparam integer X = 0。

[LocalParamDecl]
is_statement = true

[LocalParamDecl.parser]
production = [
    "keyword.localparam",
    "keyword.integer?",
    "@Range?",
    "@DeclaratorList",
    "symbol.base.semicolon",
]

[LocalParamDecl.parser.node]
param_integer = "$2"
param_range = "$3"
items = "$4"

[LocalParamDecl.analyzer.symbol]
kind = "localparam"
name_attr = "items.name"

[LocalParamDecl.renderer.layout]
line = [
    "localparam ",
    { opt = { line = [
    { ref = "param_integer" },
    " ",
] } },
    { opt = { line = [
    "[",
    { ref = "param_range" },
    "] ",
] } },
    { ref = "items" },
    ";",
]


# ── GenvarDecl — genvar 声明 ──
# A.4.2: genvar_declaration ::= genvar list_of_genvar_identifiers ;
# list_of_genvar_identifiers ::= genvar_identifier { , genvar_identifier }
#（逗号分隔列表，sv-parser list_of_genvar_identifiers 同构）。
# genvar 是用于 generate 循环的变量类型。

[GenvarDecl]
is_statement = true

[GenvarDecl.parser]
production = [
    "keyword.genvar",
    "@Identifier",
    "(symbol.base.comma,@Identifier)*",
    "symbol.base.semicolon",
]

[GenvarDecl.parser.node]
genvar_names = ["$2", "$3.items[*].sub_node[1]"]

[GenvarDecl.analyzer.symbol]
kind = "genvar"
name_attr = "genvar_names.name"

[GenvarDecl.renderer.layout]
line = [
    "genvar ",
    { intent = "compact", items = "genvar_names", first_soft = false },
    ";",
]


# ── ParamDeclStmt — 模块体 parameter 声明 ──
# 格式: parameter name1 = value1, name2 = value2, ... ;
#       parameter integer name = value, ... ;
#       parameter [msb:lsb] name = value, ... ;
# module 体内的参数声明（IEEE 1364-2005 A.1.2 module_parameter_declaration），
# 与模块头 #() 内的 ParamDecl 不同——这里是独立语句，可被实例化覆盖。
# tv80 等旧代码在 body 用 `parameter Mode = 0;`（非 localparam）。

[ParamDeclStmt]
is_statement = true

[ParamDeclStmt.parser]
production = [
    "keyword.parameter",
    "keyword.integer?",
    "@Range?",
    "@DeclaratorList",
    "symbol.base.semicolon",
]

[ParamDeclStmt.parser.node]
param_integer = "$2"
param_range = "$3"
items = "$4"

[ParamDeclStmt.analyzer.symbol]
kind = "parameter"
name_attr = "items.name"

[ParamDeclStmt.renderer.layout]
line = [
    "parameter ",
    { opt = { line = [
    { ref = "param_integer" },
    " ",
] } },
    { opt = { line = [
    "[",
    { ref = "param_range" },
    "] ",
] } },
    { ref = "items" },
    ";",
]
