# ============================================================================
# Verilog 语法规则 — 表达式 [基础]
# ============================================================================
# 本文件定义 Verilog 表达式体系的全部节点：
#   字面量:   Number
#   标识符:   Identifier
#   选择/索引: SelectSuffix, SelectExpr
#   拼接/复制: ConcatExpr, ReplicateExpr
#   函数调用: CallExpr, SysFuncCall, ArgumentList
#   运算符链: UnaryExpr → MulExpr → AddExpr → CompareExpr
#            → LogicAndExpr → LogicOrExpr → Expression
#   控制流:   ParenthesizedExpr
#
# 依赖: base/_token.toml (运算符符号、括号、逗号等)
# 被引用于: 几乎所有其他语法文件

[Number.parser]
is_atom = true
production = ["literal.number"]

[Number.parser.node]
value = "$1"

[Number.renderer.layout]
ref = "value"


# ── StringLiteral — 字符串字面量 ──
# 双引号/单引号包裹的字符串，如 "lui"、""。用于 ASCII 指令名等（picorv32 的
# new_ascii_instr = "lui"; 赋值即此形态）。作为表达式原子参与赋值/拼接/参数。
# 此前缺失导致字符串 RHS 被静默丢弃（渲染出 `x = ;`）。

[StringLiteral.parser]
is_atom = true
production = ["literal.string"]

[StringLiteral.parser.node]
value = "$1"

[StringLiteral.renderer.layout]
ref = "value"


# ── Identifier — 标识符 ──
# Verilog 标识符，匹配 [a-z_A-Z][a-z_A-Z0-9]*。
# 是表达式中最基本的原子节点。
# analyzer 中 identifier_ref = true 表示此节点参与符号引用分析。
#
# 语言包**不认识宏**：宏由外层（预处理器/管线）处理——展开阶段把宏调用替换为
# 锚（`__tpc_marker_<salt>_<n>`，形态与普通标识符相同），解析照常；宏边界节点
# 由管线按锚表就树改写（见 pipeline 宏边界节点化）。

[Identifier.parser]
is_atom = true
production = ["id"]
inline = false

[Identifier.parser.node]
content = "$1.value"

[Identifier.analyzer]
identifier_ref = true

[Identifier.renderer.layout]
line = [
  { ref = "content" },
  { suffix_when = { startswith = "\\" }, attr = "content", text = " " },
]


# ── MacroCall — 宏调用边界节点（引擎层，语言包不声明 parser 规则） ──
# 宏边界节点由**外层**（管线）就树产生，语言包里
# 只声明它怎么渲染：直接输出宏调用原文（`_macro_source_text` = raw 源区间切片）。
# 语言包不得为宏保留语法槽位——宏位置本质上是**文本任意**的，逐槽位声明
# 既补不齐（结构词/运算符/分隔符位无槽可声明），又会在某些槽位静默错渲染
# （槽位 layout 自带字面量时多套一对括号），见 ADR-0017 决策 3。
[MacroCall.renderer.layout]
line = [{ ref = "_macro_source_text" }]

[MacroCall.analyzer]
identifier_ref = true


# ── ParenthesizedExpr — 括号表达式 ──
# 括号包裹的子表达式，如 (a + b)。
# 作用是改变运算符优先级或提高可读性。

[ParenthesizedExpr.parser]
is_atom = true
production = ["bracket.l_parentheses", "@Expression", "bracket.r_parentheses"]

[ParenthesizedExpr.parser.node]
expr = "$2"

[ParenthesizedExpr.renderer.layout]
line = ["(", { ref = "expr" }, ")"]


# ── SelectSuffix — 选择/索引后缀 ──
# 数组/向量选择的后半部分: 单个索引 (a[0])、范围 (a[3:0])、+:/−: 切片。
# 生产式: <index> (: <msb> | +: <width> | -: <width>)?
# BinaryOp 在此上下文中不产生操作符两侧空格（如 a[i-1] 紧凑输出）。

[SelectSuffix.parser]
production = [
    "@Expression",
    "((symbol.base.colon|symbol.extend.plus_range|symbol.extend.minus_range),@Expression)?",
]

[SelectSuffix.parser.node]
index = "$1"
range_suffix = "$2"

[SelectSuffix.renderer.layout]
line = [{ ref = "index" }, { opt = { ref = "range_suffix" } }]

# SelectSuffix 内的 BinaryOp（如 a[i-1]）不产生操作符两侧空格
[SelectSuffix.renderer.override.BinaryOp]
layout = { line = [{ ref = "left" }, { ref = "op" }, { ref = "right" }] }


# ── SelectExpr — 选择表达式（数组/向量下标） ──
# 对标识符进行下标或范围选择，如 arr[idx]、vec[3:0]、matrix[i][j]。
# 支持链式后缀: base[idx1][idx2]...

[SelectExpr.parser]
is_atom = true
# exclude 负向前瞻（2026-08-28，层次化引用交错形态）：`a[0].b` 时 SelectExpr
# 匹配 `a[0]` 后遇 `.` 明确拒绝（纯下标表达式不含成员访问）→ 失败回滚让
# PrimaryExpr choice 试 HierExpr（吃 a[0].b）。Verilog 无 `.` 运算符，
# SelectExpr 后跟 `.` 只可能是层级成员引用，误伤面为零。
exclude = ["symbol.base.dot"]
production = [
    "@Identifier",
    "bracket.l_square_bracket",
    "@SelectSuffix",
    "bracket.r_square_bracket",
    "(bracket.l_square_bracket,@SelectSuffix,bracket.r_square_bracket)*",
]

[SelectExpr.parser.node]
base = "$1"
first_suffix = "$3"
extra_suffixes = "$5.items"

[SelectExpr.renderer.layout]
line = [
    { ref = "base" },
    "[",
    { ref = "first_suffix" },
    "]",
    { ref = "extra_suffixes" },
]


# ── ConcatExpr — 拼接表达式 ──
# Verilog 的拼接操作 {a, b, c}，将多个信号/值合并为更宽的向量。
# 生产式: { Expr , Expr , ... }

[ConcatExpr.parser]
is_atom = true
production = [
    "bracket.l_curly_bracket",
    "@Expression",
    "(symbol.base.comma,@Expression)*",
    "bracket.r_curly_bracket",
]

[ConcatExpr.parser.node]
sub_node = ["$2", "$3.items[*].sub_node[1]"]

[ConcatExpr.renderer.layout]
line = ["{", { intent = "compact", first_soft = false }, "}"]


# ── ReplicateExpr — 复制表达式 ──
# Verilog 的复制操作 {n{value}}，将值重复 n 次拼接。
# 例如: {4{1'b0}} → 4'b0000

[ReplicateExpr.parser]
is_atom = true
production = [
    "bracket.l_curly_bracket",
    "@Expression",
    "bracket.l_curly_bracket",
    "@Expression",
    "bracket.r_curly_bracket",
    "bracket.r_curly_bracket",
]

[ReplicateExpr.parser.node]
count = "$2"
value = "$4"

[ReplicateExpr.renderer.layout]
line = ["{", { ref = "count" }, "{", { ref = "value" }, "}", "}"]


# ── HierExpr — 层次化引用表达式 ──
# A.9.3 hierarchical_identifier：a.b.c[0]（层级成员链 + 下标链）。
# 与 SelectExpr（a[0]）/Identifier 并列的表达式原子；放在 SelectExpr
# 之后、Identifier 之前——a[0] 优先走 SelectExpr，a.b 走本规则。
# 真实代码高频（模块实例层级引用 top.u1.q、assign x = a.b 等），
# 2026-08-28 真实语料缺口修复（A 类）。
# 形式化宽进（2026-08-28）：成员与下标**任意交错**（a[0].b / a.b[0].c /
# mem[i].field）——tpc 只做语法接受 + 保真渲染，不做"a[0] 是哪个实例、
# b 是不是其成员"的继承链语义解析（那是综合/仿真工具的职责）。段经
# HierMember（渲染 .b）/HierSuffix（渲染 [0]）包装，parts 空分隔 join
# 保序输出；纯下标 a[0] 由 SelectExpr 先匹配（等长取先），交错形态由
# 本规则在 SelectExpr 无进展/残留时接管（原子最长匹配，见 parser 与
# linter matcher）。

[HierMember.parser]
production = ["symbol.base.dot", "@Identifier"]

[HierMember.parser.node]
name = "$2"

[HierMember.renderer]
layout = { line = [".", { ref = "name" }] }


[HierSuffix.parser]
production = ["bracket.l_square_bracket", "@SelectSuffix", "bracket.r_square_bracket"]

[HierSuffix.parser.node]
index = "$2"

[HierSuffix.renderer]
layout = { line = ["[", { ref = "index" }, "]"] }


[HierExpr.parser]
is_atom = true
production = [
    "@Identifier",
    "(@HierMember|@HierSuffix)*",
]

[HierExpr.parser.node]
parts = ["$1", "$2.items"]

[HierExpr.renderer]
layout = { join = "", items = "parts", no_soft = true }


# ── PrimaryExpr — 初等表达式（原子选择器） ──
# 表达式的最底层: 字面量、标识符、选择、层次引用、括号、复制、拼接、调用。
# 所有运算符操作的起点。

[PrimaryExpr.parser]
production = [
    "@Number|@StringLiteral|@SelectExpr|@HierExpr|@Identifier|@ParenthesizedExpr|@ReplicateExpr|@ConcatExpr|@CallExpr|@SysFuncCall",
]
inline = true

[PrimaryExpr.parser.node]
value = "$1"

[PrimaryExpr.renderer.layout]
ref = "value"


# ── CallExpr — 函数调用（无 $ 前缀） ──
# 用户定义函数或任务调用: func_name(arg1, arg2)

[CallExpr.parser]
is_atom = true
production = [
    "@Identifier",
    "bracket.l_parentheses",
    "@ArgumentList?",
    "bracket.r_parentheses",
]

[CallExpr.parser.node]
callee = "$1"
args = "$3"

[CallExpr.renderer.layout]
line = [{ ref = "callee" }, "(", { ref = "args" }, ")"]


# ── SysFuncCall — 系统函数/任务调用（$ 前缀） ──
# 以 $ 开头的系统调用，如 $display(), $clog2(), $urandom()。
# 生产式: $ Identifier ( ArgumentList? )
# 函数名可为 @Identifier，也允许 signed/unsigned（IEEE 系统函数 $signed/$unsigned
# 的函数名与声明关键字冲突，需显式放行，否则 $signed(...) 无法作为表达式原子）。

[SysFuncCall.parser]
is_atom = true
production = [
    "symbol.base.dollar",
    "(@Identifier|keyword.signed|keyword.unsigned)",
    "bracket.l_parentheses",
    "@ArgumentList?",
    "bracket.r_parentheses",
]

[SysFuncCall.parser.node]
callee = "$2"
args = "$4"

[SysFuncCall.renderer.layout]
line = ["$", { ref = "callee" }, "(", { ref = "args" }, ")"]


# ── SysFuncBare — 无括号系统函数（如 SVA 属性中的 $initstate / $time） ──
# 部分系统函数作为表达式原子时不带括号（$initstate、$time 等）。
# 与 SysFuncCall（带括号）共存：match_atom 按 production 长度降序尝试，
# 带括号形式优先匹配，无括号形式兜底，互不干扰。

[SysFuncBare.parser]
is_atom = true
production = [
    "symbol.base.dollar",
    "@Identifier",
]

[SysFuncBare.parser.node]
callee = "$2"

[SysFuncBare.renderer.layout]
line = ["$", { ref = "callee" }]


# ── ArgumentList — 函数参数列表 ──
# 逗号分隔的表达式列表: (expr1, expr2, …)
# intent = "compact"：紧凑列表（ADR-0006 阶段 4a）；first_soft=false 保持
# flat 无前导空格，nest=1 折行缩进（等价原 join 形态）。

[ArgumentList.parser]
production = ["@Expression", "(symbol.base.comma,@Expression)*"]

[ArgumentList.parser.node]
items = ["$1", "$2.items[*].sub_node[1]"]

[ArgumentList.renderer.layout]
intent = "compact"
items = "items"
first_soft = false


# ── 运算符表达式链（Pratt 解析） ──
# 以下规则按优先级从高到低排列，通过 pratt = true 接入 Pratt 解析器。
#
# 层级结构（从高到低）:
#   UnaryExpr     — ! ~ （一元）
#   MulExpr       — * / %
#   AddExpr       — + -
#   CompareExpr   — == != > < >= <=
#   LogicAndExpr  — &&
#   LogicOrExpr   — ||
#   Expression    — 顶层
#
# ⚠ Verilog 还支持字母形式的逻辑运算符 (and/or/not)，
#   但当前实现只覆盖了符号形式 (&&/||/!~)，字母运算符待补充。

# —— 一元运算符 ——
[UnaryExpr.parser]
production = ["symbol.base.not|symbol.base.bit_not", "@PrimaryExpr"]
pratt = true

[UnaryExpr.parser.node]
op = "$1"
operand = "$2"

# —— 乘法类 ——
[MulExpr.parser]
production = ["@PrimaryExpr|@UnaryExpr", "(@MulOp,@PrimaryExpr|@UnaryExpr)*"]
pratt = true

[MulExpr.parser.node]
head = "$1"
tail = "$2"

# —— 加法类 ——
[AddExpr.parser]
production = ["@MulExpr", "(@AddOp,@MulExpr)*"]
pratt = true

[AddExpr.parser.node]
head = "$1"
tail = "$2"

# —— 比较 ——
[CompareExpr.parser]
production = ["@AddExpr", "(@CmpOp,@AddExpr)?"]
pratt = true

[CompareExpr.parser.node]
left = "$1"
op_rhs = "$2"

# —— 逻辑与 ——
[LogicAndExpr.parser]
production = ["@CompareExpr", "(@LogicAndOp,@CompareExpr)*"]
pratt = true

[LogicAndExpr.parser.node]
head = "$1"
tail = "$2"

# —— 逻辑或（表达式顶层）——
[LogicOrExpr.parser]
production = ["@LogicAndExpr", "(@LogicOrOp,@LogicAndExpr)*"]
pratt = true

[LogicOrExpr.parser.node]
head = "$1"
tail = "$2"


# ── Expression — 顶层表达式 ──
# Verilog 表达式的根节点。表达式何时结束由 pratt 绑定强度决定
# （非运算符 token 自然终止中缀循环），无需显式边界声明。

[Expression.parser]
production = ["@LogicOrExpr"]
pratt = true

[Expression.parser.node]


# ── 运算符原子规则 ──

# 乘法类运算符: * / %
[MulOp.parser]
production = ["symbol.base.multiple|symbol.base.div|symbol.base.mod"]

[MulOp.parser.node]
op = "$1"

# 加法类运算符: + -
[AddOp.parser]
production = ["symbol.base.add|symbol.base.sub"]

[AddOp.parser.node]
op = "$1"

# 比较运算符: == != === !== > < >= <=
[CmpOp.parser]
production = [
    "symbol.extend.is_equal",
    "symbol.extend.not_equal",
    "symbol.extend.case_equal",
    "symbol.extend.case_not_equal",
    "symbol.base.bigger",
    "symbol.base.lesser",
    "symbol.extend.bigger_equal",
    "symbol.extend.lesser_equal",
]

[CmpOp.parser.node]
op = "$1"


# 逻辑与运算符: &&
[LogicAndOp.parser]
production = ["symbol.extend.logic_double_and"]

[LogicAndOp.parser.node]
op = "$1"

# 逻辑或运算符: ||
[LogicOrOp.parser]
production = ["symbol.extend.logic_double_or"]

[LogicOrOp.parser.node]
op = "$1"


# ── 运算符通用渲染器 ──
# 以下渲染器由 Pratt 解析器在构造 BinaryOp/UnaryOp/TernaryOp 节点时使用。
# BinaryOp 在操作符两侧各加一个空格（a + b）；
# UnaryOp 无空格（~a）；
# TernaryOp 在 ? 和 : 两侧加空格（cond ? t : f）。

[UnaryOp.renderer.layout]
line = [{ ref = "op" }, { ref = "operand" }]

[BinaryOp.renderer.layout]
line = [{ ref = "left" }, " ", { ref = "op" }, " ", { ref = "right" }]

[TernaryOp.renderer.layout]
line = [
    { ref = "cond" },
    " ? ",
    { ref = "true_val" },
    " : ",
    { ref = "false_val" },
]

["bracket.l_square_bracket".renderer.layout]
ref = "value"

["bracket.r_square_bracket".renderer.layout]
ref = "value"
