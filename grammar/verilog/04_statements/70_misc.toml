# ============================================================================
# Verilog 语法规则 — 杂项语句
# ============================================================================
# 本文件定义不归属大类的语句规则:
#   SubroutineCall — 子程序调用（无返回值）
#   SysTaskStmt    — 系统任务语句（$display(...) 等）
#   NullStmt       — 空语句（单独的分号）
#   GenerateBlock  — generate … endgenerate 块
#   LoopGen        — 生成循环（generate 体内的 for 循环）
#
# 被引用于: 04_statements/00_base.toml (CallStmt, InstStmt)

# ── SubroutineCall — 子程序调用 ──
# 函数/任务调用语句: func_name(arg1, arg2);
# 与 CallExpr 的区别在于末尾有分号，作为独立语句。

[SubroutineCall]
is_statement = true

[SubroutineCall.parser]
production = [
    "@Identifier",
    "bracket.l_parentheses",
    "@ArgumentList?",
    "bracket.r_parentheses",
    "symbol.base.semicolon",
]
end_case = [
    "newline",
]


# ── TaskCallStmt — 裸任务调用（无括号） ──
# 无参数任务调用: task_name;
# 与 SubroutineCall 的区别在于省略括号直接调用（Verilog 允许
# 无参数任务不带 () 调用，picorv32 的 assert 宏展开为 empty_statement; 即此形态）。
# 被引用于: 04_statements/00_base.toml (CallStmt)

[TaskCallStmt]
is_statement = true

[TaskCallStmt.parser]
production = [
    "@Identifier",
    "symbol.base.semicolon",
]
end_case = [
    "newline",
]

[TaskCallStmt.parser.node]
callee = "$1"

[TaskCallStmt.renderer.layout]
line = [
    { ref = "callee" },
    ";",
]


# ── SysTaskStmt — 系统任务语句（$ 前缀，如 $display(...)） ──
# 独立语句的系统调用: $display(...); $finish; 等。
# 与 SysFuncCall（表达式原子）区别在于末尾分号，作为独立语句。
# 函数名允许 signed/unsigned（与声明关键字冲突，同 SysFuncCall）。

[SysTaskStmt]
is_statement = true

[SysTaskStmt.parser]
production = [
    "symbol.base.dollar",
    "(@Identifier|keyword.signed|keyword.unsigned)",
    "bracket.l_parentheses",
    "@ArgumentList?",
    "bracket.r_parentheses",
    "symbol.base.semicolon",
]
end_case = [
    "newline",
]

[SubroutineCall.parser.node]
callee = "$1"
args = "$3"

[SubroutineCall.renderer.layout]
line = [
    { ref = "callee" },
    "(",
    { ref = "args" },
    ")",
    ";",
]


# ── PropertyStmt — SVA property 语句（assert/assume/restrict property） ──
# ⚠ SystemVerilog Assertions（IEEE 1800）特性，已随 SV 摘除移出 verilog 主包。
#    SV 实例落地后（grammar/sv/）以 `property` 关键字恢复。
#    此前实现: assert/assume/restrict property (expr); —— property 作关键字
#    匹配，通过判别前缀与赋值/调用等 id 语句消歧。现保留规则占位但停用
#    （production 不再被 Stmt 引用，见 00_base.toml CallStmt 移除引用）。

[PropertyStmt.parser.node]
kind = "$1"
prop = "$2"
body = "$4"

[PropertyStmt.renderer.layout]
line = [
    { ref = "kind" },
    " ",
    { ref = "prop" },
    "(",
    { ref = "body" },
    ");",
]


# ── NullStmt — 空语句 ──
# 单独的 ; 分号，表示无操作。语法上总是合法的。

[NullStmt]
is_statement = true

[NullStmt.parser]
production = [
    "symbol.base.semicolon",
]
end_case = [
    "newline",
]

[NullStmt.parser.node]

[NullStmt.renderer]
layout = ";"


# ── GenerateBlock — generate 块 ──
# generate … endgenerate 结构，用于条件生成和循环生成。
# production = [] 表示依赖 block 的块机制（无独有生产式），
# 体内容由 flatten 机制收集。

[GenerateBlock.parser]
production = [
    "keyword.generate",
    "keyword.endgenerate",
]
end_case = [
    "keyword.endgenerate",
    "newline",
]

[GenerateBlock.parser.node]

[GenerateBlock.renderer]
head = "generate"

[GenerateBlock.renderer.body]
indent = true
role = "flatten"

[GenerateBlock.renderer.tail]
text = "endgenerate"
break = 2

[GenerateBlock]
is_block = true
is_statement = true

# generate 引入独立的 generate 作用域：generate-if 各分支互斥（elaboration 时
# 只展开一个），其内同名声明（如各分支实例化同名的模块）合法，不应报重复声明。
[GenerateBlock.analyzer]
scope = { kind = "generate" }


# ── LoopGen — 生成循环（generate 体内的 for 循环） ──
# Verilog 的 generate for 循环，用于在 elaboration 阶段静态展开硬件结构，
# 而非在仿真/运行时动态执行。
#
# 与过程体 for 循环 (ForLoop/ForLoopBlock) 的区别:
#   - 循环变量为 genvar 类型（编译期整数变量）
#   - 循环体必须为 begin…end 块（且通常带标签）
#   - 体内只能包含生成项（实例化、assign、嵌套 generate 块等）
#   - 在 elaboration 阶段展开，不消耗仿真时间
#
# 格式:
#   for (i = 0; i < N; i = i + 1) begin : loop_label
#     ...实例化/赋值/生成项...
#   end
#
# 依赖: token.toml (keyword.for)
#       04_statements/ (ForInit, Expression, ForStep, BeginEnd)
# 被引用于: 04_statements/00_base.toml (InstStmt → LoopGen)
#
# 渲染示例:
#   genvar i;
#   generate
#     for (i = 0; i < N; i = i + 1) begin : gen_adder
#       adder #(.WIDTH(8)) u_add (.a(a[i]), .b(b[i]), .sum(sum[i]));
#     end
#   endgenerate

[LoopGen]
is_statement = true

[LoopGen.parser]
production = [
    "keyword.for",
    "bracket.l_parentheses",
    "@ForInit",
    "symbol.base.semicolon",
    "@Expression",
    "symbol.base.semicolon",
    "@ForStep",
    "bracket.r_parentheses",
    "@BeginEnd",
]
end_case = [
    "newline",
]

[LoopGen.parser.node]
init = "$3"
condition = "$5"
step = "$7"
body = "$9"

[LoopGen.renderer.layout]
line = [
    "for (",
    { ref = "init" },
    "; ",
    { ref = "condition" },
    "; ",
    { ref = "step" },
    ") ",
    { ref = "body" },
]
