# ============================================================================
# Verilog 语法规则 — 杂项语句
# ============================================================================
# 本文件定义不归属大类的语句规则:
#   SubroutineCall — 子程序调用（无返回值）
#   SysTaskStmt    — 系统任务语句（$display(...) 等）
#   NullStmt       — 空语句（单独的分号）
#   GenerateBlock  — generate … endgenerate 块
#   LoopGen        — 生成循环（generate 体内的 for 循环）
#
# 被引用于: 04_statements/00_base.toml (CallStmt, InstStmt)

# ── SubroutineCall — 子程序调用 ──
# 函数/任务调用语句: func_name(arg1, arg2);
# 与 CallExpr 的区别在于末尾有分号，作为独立语句。

[SubroutineCall]
is_statement = true

[SubroutineCall.parser]
production = [
    "@Identifier",
    "bracket.l_parentheses",
    "@ArgumentList?",
    "bracket.r_parentheses",
    "symbol.base.semicolon",
]


# ── TaskCallStmt — 裸任务调用（无括号） ──
# 无参数任务调用: task_name;
# 与 SubroutineCall 的区别在于省略括号直接调用（Verilog 允许
# 无参数任务不带 () 调用，picorv32 的 assert 宏展开为 empty_statement; 即此形态）。
# 被引用于: 04_statements/00_base.toml (CallStmt)

[TaskCallStmt]
is_statement = true

[TaskCallStmt.parser]
production = [
    "@Identifier",
    "symbol.base.semicolon",
]

[TaskCallStmt.parser.node]
callee = "$1"

# semantic_check 插件：裸任务调用名参与通用名称检查
[TaskCallStmt.analyzer]
check_name_call = { name_attr = "callee" }

[TaskCallStmt.renderer.layout]
line = [
    { ref = "callee" },
    ";",
]


[SubroutineCall.parser.node]
callee = "$1"
args = "$3"

# semantic_check 插件：调用名参与通用名称检查（check_name_call 原语）
[SubroutineCall.analyzer]
check_name_call = { name_attr = "callee" }

[SubroutineCall.renderer.layout]
line = [
    { ref = "callee" },
    "(",
    { ref = "args" },
    ")",
    ";",
]


# ── PropertyStmt — SVA property 语句（assert/assume/restrict property） ──
# ⚠ SystemVerilog Assertions（IEEE 1800）特性，已随 SV 摘除移出 verilog 主包。
#    SV 实例落地后（grammar/sv/）以 `property` 关键字恢复。
#    此前实现: assert/assume/restrict property (expr); —— property 作关键字
#    匹配，通过判别前缀与赋值/调用等 id 语句消歧。现保留规则占位但停用
#    （production 不再被 Stmt 引用，见 00_base.toml CallStmt 移除引用）。

[PropertyStmt.parser.node]
kind = "$1"
prop = "$2"
body = "$4"

[PropertyStmt.renderer.layout]
line = [
    { ref = "kind" },
    " ",
    { ref = "prop" },
    "(",
    { ref = "body" },
    ");",
]


# ── NullStmt — 空语句 ──
# 单独的 ; 分号，表示无操作。语法上总是合法的。

[NullStmt]
is_statement = true

[NullStmt.parser]
production = [
    "symbol.base.semicolon",
]

[NullStmt.parser.node]

[NullStmt.renderer]
layout = ";"


# ── GenerateBlock — generate 块 ──
# generate … endgenerate 结构，用于条件生成和循环生成。
# production = [] 表示依赖 block 的块机制（无独有生产式），
# 体内容由 flatten 机制收集。

[GenerateBlock.parser]
production = [
    "keyword.generate",
    "keyword.endgenerate",
]

[GenerateBlock.parser.node]

[GenerateBlock.renderer]
head = "generate"

[GenerateBlock.renderer.body]
indent = true
role = "flatten"

[GenerateBlock.renderer.tail]
text = "endgenerate"
break = 2

[GenerateBlock]
is_block = true
is_statement = true

# generate 引入独立的 generate 作用域：generate-if 各分支互斥（elaboration 时
# 只展开一个），其内同名声明（如各分支实例化同名的模块）合法，不应报重复声明。
# allow_duplicate = true 声明此语义（analyzer 符号原语读字段，不硬编码 kind 名）。
[GenerateBlock.analyzer]
scope = { kind = "generate", allow_duplicate = true }


# ── LoopGen — 生成循环（generate 体内的 for 循环） ──
# Verilog 的 generate for 循环，用于在 elaboration 阶段静态展开硬件结构，
# 而非在仿真/运行时动态执行。
#
# 与过程体 for 循环 (ForLoop/ForLoopBlock) 的区别:
#   - 循环变量为 genvar 类型（编译期整数变量）
#   - 体为 generate_block（A.4.2）：单条模块项（GenBlockOrNull 的
#     @ModuleItem 分支，如 `for (i=0;...) adder u (a,b);`）或 begin…end 块
#   - 体内只能包含生成项（实例化、assign、嵌套 generate 块等）
#   - 在 elaboration 阶段展开，不消耗仿真时间
#
# 格式:
#   for (i = 0; i < N; i = i + 1) begin : loop_label
#     ...实例化/赋值/生成项...
#   end
#   for (i = 0; i < N; i = i + 1) adder u (a, b);   ← 单语句体（2005 补齐）
#
# 依赖: token.toml (keyword.for)
#       04_statements/ (ForInit, Expression, ForStep, BeginEnd)
# 被引用于: 04_statements/00_base.toml (InstStmt → LoopGen)
#
# 渲染示例:
#   genvar i;
#   generate
#     for (i = 0; i < N; i = i + 1) begin : gen_adder
#       adder #(.WIDTH(8)) u_add (.a(a[i]), .b(b[i]), .sum(sum[i]));
#     end
#   endgenerate

[LoopGen]
is_statement = true

[LoopGen.parser]
production = [
    "keyword.for",
    "bracket.l_parentheses",
    "@ForInit",
    "symbol.base.semicolon",
    "@Expression",
    "symbol.base.semicolon",
    "@ForStep",
    "bracket.r_parentheses",
    "@GenBlockOrNull",
]

[LoopGen.parser.node]
init = "$3"
condition = "$5"
step = "$7"
body = "$9"

[LoopGen.renderer.layout]
line = [
    "for (",
    { ref = "init" },
    "; ",
    { ref = "condition" },
    "; ",
    { ref = "step" },
    ") ",
    { ref = "body" },
]


# ── GenBlockOrNull — generate 体（A.4.2 generate_block_or_null） ──
# generate_block ::= module_or_generate_item | begin [: id] { item } end
# generate_block_or_null ::= generate_block | ;
# 单条模块项由 @ModuleItem（模块项分发，含实例化/声明/assign/generate
# 嵌套等）承载，begin…end 由 @BeginEnd，空体为分号。状态依赖生成的
# if/case 分支体（GenerateIfDecl/GenerateCaseDecl）与循环体共用。

[GenBlockOrNull]
[GenBlockOrNull.parser]
production = [
    "@ModuleItem|@BeginEnd|symbol.base.semicolon",
]
[GenBlockOrNull.parser.node]
inner = "$1"
[GenBlockOrNull.renderer]
layout = { ref = "inner" }


# ── GenerateIfDecl — 条件生成（A.4.2 if_generate_construct） ──
# if ( constant_expression ) generate_block_or_null
# [ else generate_block_or_null ]
# 与过程体 IfBlock/IfStmt 区分：分支体是模块项/begin/空（GenBlockOrNull），
# 而非过程语句。挂 InstStmt（模块项级），候选顺序在 IfBlock/IfStmt 之后
# ——过程体内 if 仍由 IfBlock/IfStmt 消费，generate 区域单语句体由此规则。

[GenerateIfDecl]
is_statement = true

[GenerateIfDecl.parser]
production = [
    "keyword.if",
    "bracket.l_parentheses",
    "@Expression",
    "bracket.r_parentheses",
    "@GenBlockOrNull",
    "(keyword.else,@GenBlockOrNull)?",
]

[GenerateIfDecl.parser.node]
cond = "$3"
then_body = "$5"
else_body = "$6.sub_node[0].sub_node[1]"

[GenerateIfDecl.renderer.layout]
line = [
    "if (",
    { ref = "cond" },
    ") ",
    { ref = "then_body" },
    { opt = { group = [
        " else ",
        { ref = "else_body" },
    ] } },
]


# ── GenerateCaseDecl — 分支生成（A.4.2 case_generate_construct） ──
# case ( constant_expression ) case_generate_item { case_generate_item } endcase
# case_generate_item ::= constant_expression { , constant_expression }
#   : generate_block_or_null | default [ : ] generate_block_or_null
# 与过程体 CaseStmt 区分：case 项体是模块项/begin/空（GenBlockOrNull），
# 且 default 冒号可选（A.4.2 与 A.6.7 差异）。

[GenerateCaseDecl]
is_statement = true

[GenerateCaseDecl.analyzer]
scope = { kind = "case" }

[GenerateCaseDecl.parser]
production = [
    "@CaseKeyword",
    "bracket.l_parentheses",
    "@Expression",
    "bracket.r_parentheses",
    "@GenCaseItem+",
    "keyword.endcase",
]

[GenerateCaseDecl.parser.node]
case_type = "$1"
expr = "$3"
items = "$5.items[*]"

[GenerateCaseDecl.renderer.head]
line = [
    { ref = "case_type" },
    " (",
    { ref = "expr" },
    ")",
]

[GenerateCaseDecl.renderer.body]
indent = true
source = "items"

[GenerateCaseDecl.renderer.tail]
text = "endcase"
break = 1

[GenCaseItem]
[GenCaseItem.parser]
production = [
    "@GenLabelCaseItem|@GenDefaultCaseItem",
]
[GenCaseItem.parser.node]
inner = "$1"
[GenCaseItem.renderer]
layout = { ref = "inner" }

[GenLabelCaseItem]
[GenLabelCaseItem.parser]
production = [
    "@GenCaseLabels",
    "symbol.base.colon",
    "@GenBlockOrNull",
]
[GenLabelCaseItem.parser.node]
values = "$1"
body = "$3"
[GenLabelCaseItem.renderer]
layout = { line = [
    { ref = "values" },
    ": ",
    { ref = "body" },
] }

[GenDefaultCaseItem]
[GenDefaultCaseItem.parser]
production = [
    "keyword.default",
    "symbol.base.colon?",
    "@GenBlockOrNull",
]
[GenDefaultCaseItem.parser.node]
body = "$3"
[GenDefaultCaseItem.renderer]
layout = { line = [
    "default: ",
    { ref = "body" },
] }

[GenCaseLabels]
[GenCaseLabels.parser]
production = [
    "@Expression",
    "(symbol.base.comma,@Expression)*",
]
[GenCaseLabels.parser.node]
items = ["$1", "$2.items[*].sub_node[1]"]
[GenCaseLabels.renderer]
layout = { join = ", ", items = "items", no_soft = true }
