[SubroutineCall.parser]
production = [
    "@Identifier",
    "bracket.l_parentheses",
    "@ArgumentList?",
    "bracket.r_parentheses",
    "symbol.base.semicolon",
]
end_case = [
    "newline",
]

[SubroutineCall.parser.node]
callee = "$1"
args = "$3"

[SubroutineCall.renderer.layout]
line = [
    { ref = "callee" },
    "(",
    { ref = "args" },
    ")",
    ";",
]

[SubroutineCall.structure]
is_statement = true

[NullStmt.parser]
production = [
    "symbol.base.semicolon",
]
end_case = [
    "newline",
]

[NullStmt.parser.node]

[NullStmt.renderer]
layout = ";"

[NullStmt.structure]
is_statement = true

[GenerateBlock.parser]
production = [
    "keyword.generate",
    "@ModuleBlock",
    "keyword.endgenerate",
]
end_case = [
    "keyword.endgenerate",
]

[GenerateBlock.parser.node]
body = "$2"

[GenerateBlock.renderer]
head = "generate"

[GenerateBlock.renderer.body]
indent = true
source = "body"

[GenerateBlock.renderer.tail]
text = "endgenerate"
break = 2

[GenerateBlock.structure]
is_statement = true
