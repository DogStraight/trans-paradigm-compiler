# ============================================================================
# Verilog 语法规则 — function/task 声明
# ============================================================================
# 本文件定义函数和任务声明，各支持两种风格:
#   FuncDeclANSI / FuncDeclOld  — 函数（ANSI 和旧式）
#   TaskDeclANSI / TaskDeclOld  — 任务（ANSI 和旧式）
#
# 被引用于: 04_statements/00_base.toml (FuncStmt)
#
# 2005 核对（A.2.6/A.2.7）：
#   - function_range_or_type ::= [signed] [range] | integer | real |
#     realtime | time —— FuncRangeOrType 分发（integer/real/realtime/time
#     关键字由 nettypes 插件 token_ext 注册，默认启用）。
#   - task_port_type ::= integer | real | realtime | time —— 端口声明
#     （ANSI/旧式）经 TaskPortTypeTail 分支支持 `input integer a` 形态
#     （与 TypeSpec 的 wire/reg 类型互斥，A.2.7 两分支）。

[FuncDecl.parser]
production = [
    "@FuncDeclANSI|@FuncDeclOld",
]
inline = true

[FuncDecl.parser.node]
body = "$1"

[FuncDeclANSI.parser]
production = [
    "keyword.function",
    "(keyword.automatic|keyword.static)?",
    "@FuncRangeOrType?",
    "@Identifier",
    "bracket.l_parentheses",
    "@TaskPortList?",
    "bracket.r_parentheses",
    "symbol.base.semicolon",
    "keyword.endfunction",
]

[FuncDeclANSI.parser.peek]
scope = "analyzer"

[FuncDeclANSI.parser.node]
func_name = "$3"
automatic = "$1"
func_type = "$2.sub_node[0]"
ports = "$5"

[FuncDeclANSI.analyzer.scope]
name_attr = "func_name"
kind = "function"

[FuncDeclANSI.renderer.head]
line = [
    "function ",
    { opt = { line = [
    { ref = "automatic" },
    " ",
] } },
    { opt = { ref = "func_type" } },
    { ref = "func_name" },
    "(",
    { ref = "ports" },
    ")",
    ";",
]

[FuncDeclANSI.renderer.body]
indent = true
role = "flatten"

[FuncDeclANSI.renderer.tail]
text = "endfunction"
break = 2

[FuncDeclANSI]
is_block = true
is_statement = true

[FuncDeclOld.parser]
production = [
    "keyword.function",
    "(keyword.automatic|keyword.static)?",
    "@FuncRangeOrType?",
    "@Identifier",
    "symbol.base.semicolon",
    "keyword.endfunction",
]

[FuncDeclOld.parser.node]
func_name = "$3"
automatic = "$1"
func_type = "$2.sub_node[0]"

[FuncDeclOld.analyzer.scope]
name_attr = "func_name"
kind = "function"

[FuncDeclOld.renderer.head]
line = [
    "function ",
    { opt = { line = [
    { ref = "automatic" },
    " ",
] } },
    { opt = { ref = "func_type" } },
    { ref = "func_name" },
    ";",
]

[FuncDeclOld.renderer.body]
indent = true
role = "flatten"

[FuncDeclOld.renderer.tail]
text = "endfunction"
break = 2

[FuncDeclOld]
is_block = true
is_statement = true


# ── FuncRangeOrType — function 返回类型（A.2.6） ──
# function_range_or_type ::= [signed] [range] | integer | real |
#   realtime | time。分发到 FuncRangeSpec（可综合位宽返回）与
#   FuncScalarType（net 类型返回，nettypes 插件关键字）。

[FuncRangeOrType]
[FuncRangeOrType.parser]
production = ["@FuncRangeSpec|@FuncScalarType"]
[FuncRangeOrType.parser.node]
inner = "$1"
[FuncRangeOrType.renderer]
layout = { ref = "inner" }

[FuncRangeSpec]
[FuncRangeSpec.parser]
production = ["@FuncRangeS|@FuncRangeR"]
[FuncRangeSpec.parser.node]
inner = "$1"
[FuncRangeSpec.renderer]
layout = { ref = "inner" }

# signed [range]?——signed 必现，range 可选（`function signed f;`）
[FuncRangeS]
[FuncRangeS.parser]
production = ["keyword.signed", "@Range?"]
[FuncRangeS.parser.node]
func_range = "$2.sub_node[0]"
[FuncRangeS.renderer]
layout = { line = [
    "signed ",
    { opt = { group = [
        "[",
        { ref = "func_range" },
        "] ",
    ] } },
] }

# [range]——仅范围（`function [7:0] f;`）
[FuncRangeR]
[FuncRangeR.parser]
production = ["@Range"]
[FuncRangeR.parser.node]
func_range = "$1"
[FuncRangeR.renderer]
layout = { line = [
    "[",
    { ref = "func_range" },
    "] ",
] }

[FuncScalarType]
[FuncScalarType.parser]
production = [
    "keyword.integer|keyword.real|keyword.realtime|keyword.time",
]
[FuncScalarType.parser.node]
kind = "$1"
[FuncScalarType.renderer]
layout = { line = [
    { ref = "kind" },
    " ",
] }


# ── TaskDecl — 任务声明（分发器） ──

[TaskDecl.parser]
production = [
    "@TaskDeclANSI|@TaskDeclOld",
]
inline = true

[TaskDecl.parser.node]
body = "$1"


# ── TaskDeclANSI — 任务声明（ANSI 风格） ──
# 格式: task [automatic] name (ports); … endtask

[TaskDeclANSI.parser]
production = [
    "keyword.task",
    "(keyword.automatic|keyword.static)?",
    "@Identifier",
    "bracket.l_parentheses",
    "@TaskPortList?",
    "bracket.r_parentheses",
    "symbol.base.semicolon",
    "keyword.endtask",
]

[TaskDeclANSI.parser.peek]
scope = "analyzer"

[TaskDeclANSI.parser.node]
task_name = "$2"
automatic = "$1"
ports = "$4"

[TaskDeclANSI.analyzer.scope]
name_attr = "task_name"
kind = "task"

[TaskDeclANSI.renderer.head]
line = [
    "task ",
    { opt = { line = [
    { ref = "automatic" },
    " ",
] } },
    { ref = "task_name" },
    "(",
    { ref = "ports" },
    ")",
    ";",
]

[TaskDeclANSI.renderer.body]
indent = true
role = "flatten"

[TaskDeclANSI.renderer.tail]
text = "endtask"
break = 2

[TaskDeclANSI]
is_block = true
is_statement = true

[TaskDeclOld.parser]
production = [
    "keyword.task",
    "(keyword.automatic|keyword.static)?",
    "@Identifier",
    "symbol.base.semicolon",
    "keyword.endtask",
]

[TaskDeclOld.parser.node]
task_name = "$2"
automatic = "$1"

[TaskDeclOld.analyzer.scope]
name_attr = "task_name"
kind = "task"

[TaskDeclOld.renderer.head]
line = [
    "task ",
    { opt = { line = [
    { ref = "automatic" },
    " ",
] } },
    { ref = "task_name" },
    ";",
]

[TaskDeclOld.renderer.body]
indent = true
role = "flatten"

[TaskDeclOld.renderer.tail]
text = "endtask"
break = 2

# ── TaskDeclOld — 任务声明（旧式风格） ──
# 格式: task [automatic] name; …端口声明… endtask
# 与 ANSI 风格的区别是端口在函数体内声明而非括号内。

[TaskDeclOld]
is_block = true
is_statement = true
