[FuncDecl.parser]
production = [
    "@FuncDeclANSI|@FuncDeclOld",
]
inline = true

[FuncDecl.parser.node]
body = "$1"

[FuncDeclANSI.parser]
production = [
    "keyword.function",
    "(keyword.automatic|keyword.static)?",
    "keyword.signed?",
    "@Range?",
    "@Identifier",
    "bracket.l_parentheses",
    "@TaskPortList?",
    "bracket.r_parentheses",
    "symbol.base.semicolon",
    "@TaskBlock",
    "keyword.endfunction",
]
end_case = [
    "keyword.endfunction",
]

[FuncDeclANSI.parser.peek]
scope = "analyzer"

[FuncDeclANSI.parser.node]
func_name = "$5"
body = "$10"
automatic = "$2"
is_signed = "$3"
func_range = "$4"
ports = "$7"

[FuncDeclANSI.analyzer.scope]
name_attr = "func_name"
kind = "function"

[FuncDeclANSI.renderer.head]
line = [
    "function ",
    { opt = { line = [
    { ref = "automatic" },
    " ",
] } },
    { opt = { line = [
    { ref = "is_signed" },
    " ",
] } },
    { opt = { group = [
    "[",
    { ref = "func_range" },
    "] ",
] } },
    { ref = "func_name" },
    "(",
    { ref = "ports" },
    ")",
    ";",
]

[FuncDeclANSI.renderer.body]
indent = true
source = "body"

[FuncDeclANSI.renderer.tail]
text = "endfunction"
break = 2

[FuncDeclANSI.structure]
is_statement = true

[FuncDeclOld.parser]
production = [
    "keyword.function",
    "(keyword.automatic|keyword.static)?",
    "keyword.signed?",
    "@Range?",
    "@Identifier",
    "symbol.base.semicolon",
    "@TaskBlock",
    "keyword.endfunction",
]
end_case = [
    "keyword.endfunction",
    "newline",
]

[FuncDeclOld.parser.node]
func_name = "$5"
body = "$7"
automatic = "$2"
is_signed = "$3"
func_range = "$4"

[FuncDeclOld.analyzer.scope]
name_attr = "func_name"
kind = "function"

[FuncDeclOld.renderer.head]
line = [
    "function ",
    { opt = { line = [
    { ref = "automatic" },
    " ",
] } },
    { opt = { line = [
    { ref = "is_signed" },
    " ",
] } },
    { opt = { group = [
    "[",
    { ref = "func_range" },
    "] ",
] } },
    { ref = "func_name" },
    ";",
]

[FuncDeclOld.renderer.body]
indent = true
source = "body"

[FuncDeclOld.renderer.tail]
text = "endfunction"
break = 2

[FuncDeclOld.structure]
is_statement = true

