[FuncDecl.parser]
production = [
    "@FuncDeclANSI|@FuncDeclOld",
]
inline = true

[FuncDecl.parser.node]
body = "$1"

[FuncDeclANSI.parser]
production = [
    "(keyword.automatic|keyword.static)?",
    "keyword.signed?",
    "@Range?",
    "@Identifier",
    "bracket.l_parentheses",
    "@TaskPortList?",
    "bracket.r_parentheses",
    "symbol.base.semicolon",
]
end_case = [
    "keyword.endfunction",
    "newline",
]

[FuncDeclANSI.parser.peek]
scope = "analyzer"

[FuncDeclANSI.parser.node]
func_name = "$4"
automatic = "$1"
is_signed = "$2"
func_range = "$3"
ports = "$6"

[FuncDeclANSI.analyzer.scope]
name_attr = "func_name"
kind = "function"

[FuncDeclANSI.renderer.head]
line = [
    "function ",
    { opt = { line = [
    { ref = "automatic" },
    " ",
] } },
    { opt = { line = [
    { ref = "is_signed" },
    " ",
] } },
    { opt = { group = [
    "[",
    { ref = "func_range" },
    "] ",
] } },
    { ref = "func_name" },
    "(",
    { ref = "ports" },
    ")",
    ";",
]

[FuncDeclANSI.renderer.body]
indent = true
role = "flatten"

[FuncDeclANSI.renderer.tail]
text = "endfunction"
break = 2

[FuncDeclANSI.structure]
is_block = true
is_statement = true

[FuncDeclANSI.block]
start = "keyword.function"
end = "keyword.endfunction"

[FuncDeclOld.parser]
production = [
    "(keyword.automatic|keyword.static)?",
    "keyword.signed?",
    "@Range?",
    "@Identifier",
    "symbol.base.semicolon",
]
end_case = [
    "keyword.endfunction",
    "newline",
]

[FuncDeclOld.parser.node]
