func_range = "$3"

[FuncDeclOld.analyzer.scope]
name_attr = "func_name"
kind = "function"

[FuncDeclOld.renderer.head]
line = [
    "function ",
    { opt = { line = [
    { ref = "automatic" },
    " ",
] } },
    { opt = { line = [
    { ref = "is_signed" },
    " ",
] } },
    { opt = { group = [
    "[",
    { ref = "func_range" },
    "] ",
] } },
    { ref = "func_name" },
    ";",
]

[FuncDeclOld.renderer.body]
indent = true
role = "flatten"

[FuncDeclOld.renderer.tail]
text = "endfunction"
break = 2

[FuncDeclOld.structure]
is_block = true
is_statement = true

[FuncDeclOld.block]
start = "keyword.function"
end = "keyword.endfunction"

