# ============================================================================
# Verilog 语法规则 — always 块 [时序/组合逻辑][可综合]
# ============================================================================
# 本文件定义 always 块及其灵敏度列表相关规则：
#   AlwaysStmt      — always <event_control> <statement> 过程语句
#   EventControl    — 事件控制分发器（event_control，路由四种形态）
#   EventCtrlParen  — @ ( event_expression )  括号事件表达式（含 @(*)）
#   EventCtrlStar   — @*                      自动敏感（无括号）
#   EventCtrlIdent  — @ event_identifier      单事件标识符（无括号）
#   SensitivityList — 灵敏度列表（posedge/negedge 或 *）
#   EdgeSense       — 边沿敏感表达式（posedge clk）
#
# 贴合 IEEE 1364-2005 A.6.7（event_control）：
#   event_control ::= @ event_identifier | @ ( event_expression ) | @* | @ (*)
#   EventControl 为分发器（choice of calls），按 @ 后内容路由到三种形态
#   （@(*) 归入 EventCtrlParen，SensitivityList 支持括号内 *）。
#
# 依赖: token.toml (keyword.always / keyword.posedge / keyword.negedge /
#                   symbol.base.at / symbol.base.multiple / symbol.base.comma /
#                   symbol.extend.logic_or)
#       04_statements/ (Statement)
# 被引用于: 04_statements/00_base.toml (ProcStmt → AlwaysStmt)
#
# ⚠ 作用域说明:
#   always 是**可综合**的过程块，用于描述时序逻辑（posedge/negedge 敏感）
#   和组合逻辑（@* 或电平敏感列表），是 FPGA/ASIC 综合的核心构造。
#   与 initial（仅仿真）相对。
#
# 渲染示例:
#   always @(posedge clk or negedge rst_n) begin
#     if (!rst_n)
#       q <= 1'b0;
#     else
#       q <= d;
#   end

# ── AlwaysStmt — always 过程语句 ──
# Verilog 的 always 过程语句：always + @EventControl（事件控制）+ @Stmt。
# 事件控制统一走 EventControl 分发器（标准 event_control 四种形态）。
# renderer.body.role = "direct" 表示体内容直出（不额外包装）。
# renderer.override.BeginEnd.tail_break = 2 当体内是 begin…end 时，end 后多空一行。

[AlwaysStmt]
is_statement = true

[AlwaysStmt.analyzer]
scope = { kind = "always" }

[AlwaysStmt.parser]
production = [
    "keyword.always",
    "@EventControl",
    "@Stmt",
]

[AlwaysStmt.parser.node]
always_kw = "$1"
event_control = "$2"
body = "$3"

[AlwaysStmt.renderer.layout]
line = [
    { ref = "always_kw" },
    " ",
    { ref = "event_control" },
    " ",
    { ref = "body" },
]

[AlwaysStmt.renderer.body]
role = "direct"

[AlwaysStmt.renderer.override.BeginEnd]
tail_break = 2


# ── EventControl — 事件控制分发器 ──
# 对应标准 event_control，路由三种形态：
#   @ ( event_expression )  → EventCtrlParen（含 @(*)）
#   @*                       → EventCtrlStar
#   @ event_identifier       → EventCtrlIdent
# 分发器模式：choice of calls（同 CtrlStmt/PrimaryExpr），@ 后内容决定路由。

[EventControl.parser]
production = [
    "symbol.base.at",
    "@EventCtrlParen|@EventCtrlStar|@EventCtrlIdent",
]

[EventControl.parser.node]
control = "$2"

[EventControl.renderer.layout]
line = [
    "@",
    { ref = "control" },
]


# ── EventCtrlParen — @ ( event_expression ) ──
# 括号事件表达式，如 @(posedge clk)、@(a or b)、@(*)。
# 括号为必选整体（不拆可选元素，保证配对），灵敏度列表由 @SensitivityList 承接
# （其 production 支持 * 与 or/, 分隔的边沿表达式）。

[EventCtrlParen.parser]
production = [
    "bracket.l_parentheses",
    "@SensitivityList",
    "bracket.r_parentheses",
]

[EventCtrlParen.parser.node]
sensitivity = "$2"

[EventCtrlParen.renderer.layout]
line = [
    "(",
    { ref = "sensitivity" },
    ")",
]


# ── EventCtrlStar — @* ──
# 自动敏感（无括号）：@* 后直接跟语句。

[EventCtrlStar.parser]
production = [
    "symbol.base.multiple",
]

[EventCtrlStar.renderer.layout]
line = [
    "*",
]


# ── EventCtrlIdent — @ event_identifier ──
# 单事件标识符（无括号）：@clk 后直接跟语句。

[EventCtrlIdent.parser]
production = [
    "@Identifier",
]

[EventCtrlIdent.parser.node]
ident = "$1"

[EventCtrlIdent.renderer.layout]
line = [
    { ref = "ident" },
]


# ── SensitivityList — 灵敏列表 ──
# always 块中的敏感信号列表，如 `posedge clk or negedge rst_n`。
# 支持 `*`（自动敏感），以及 `or` / `,` 分隔的边沿表达式。
# 根据 IEEE 1364-2001，or 和逗号在灵敏度列表中语义等价。
# intent = "compact"：紧凑列表（ADR-0006 阶段 4a）；sep=" or " 保持
# Verilog 风格事件连接，first_soft=false 无前导空格，nest=0 不折行缩进。
# $1 可以是 @EdgeSense 或 symbol.base.multiple（即 *）。
# $2 收集后续的 (or|,, @EdgeSense) 重复对。

[SensitivityList.parser]
production = [
    "@EdgeSense|@Identifier|symbol.base.multiple",
    "((symbol.extend.logic_or|symbol.base.comma),(@EdgeSense|@Identifier))*",
]

[SensitivityList.parser.node]
items = [
    "$1",
    "$2.items[*].sub_node[1]",
]

[SensitivityList.renderer.layout]
intent = "compact"
sep = " or "
items = "items"
first_soft = false
nest = 0


# ── EdgeSense — 边沿敏感表达式 ──
# 单个边沿敏感信号，如 `posedge clk`。
# 生产式: (posedge|negedge) <identifier>
# 渲染: posedge clk（边沿类型 + 空格 + 信号名）。

[EdgeSense.parser]
production = [
    "keyword.posedge|keyword.negedge",
    "@Identifier",
]

[EdgeSense.parser.node]
edge = "$1"
signal = "$2"

[EdgeSense.renderer.layout]
line = [
    { ref = "edge" },
    " ",
    { ref = "signal" },
]
