# ===================================================================
# 语法规则定义文件
# ===================================================================
# 本文件定义语言的语法规则，采用类 EBNF 格式。
# 每个规则以 `[RuleName]` 开头，可包含以下字段：
#   - production : 产生式列表，支持的元素：
#         "token.type"      : 匹配特定 token 类型
#         "@RuleName"       : 调用另一个规则
#         "A|B|C"           : 选择（分支）
#         "item*"           : 零次或多次重复
#         "item+"           : 一次或多次重复
#         "item?"           : 零次或一次可选
#         "( ... )"         : 分组
#         ","               : 序列分隔（用于列表等）
#   - end_case   : 规则结束时应遇到的 token 类型列表（用于语句规则）
#   - node       : 属性映射，格式 { "attr" = "$pos" }，表示将产生式中第 pos 个匹配结果绑定到节点属性 attr
#   - inline     : true/false，内联规则，在解析时直接提取其内容（不创建节点）
#   - pratt      : true/false，该规则是否由 Pratt 解析器处理（用于表达式）
#   - block_start: 块开始的 token 类型（如 "space.indent"）
#   - block_end  : 块结束的 token 类型（如 "space.dedent"）
# ===================================================================


# ============================================================================
# 1. 字面量及原子表达式
# ============================================================================

[Constant]
production = ["literal.number"]
[Constant.node]
value = "$1"

[Variable]
production = ["id"]
[Variable.node]
identifier = "$1"

[ParenthesizedExpr]
production = ["bracket.l_parentheses", "@Expression", "bracket.r_parentheses"]
[ParenthesizedExpr.node]
expr = "$2"

[PrimaryExpr]
production = ["@Constant|@Variable|@ParenthesizedExpr|@StringLiteral|@Call"]
[PrimaryExpr.node]
value = "$1"

[StringLiteral]
production = ["literal.string"]
[StringLiteral.node]
value = "$1"


# ============================================================================
# 2. 运算符（单元）
# ============================================================================

[MulOp]
production = ["symbol.base.multiple|symbol.base.div"]
[MulOp.node]
op = "$1"

[AddOp]
production = ["symbol.base.add|symbol.base.sub"]
[AddOp.node]
op = "$1"

[CmpOp]
production = [
    "symbol.extend.is_equal|symbol.extend.not_equal|symbol.base.bigger|symbol.base.lesser|symbol.extend.bigger_equal|symbol.extend.lesser_equal",
]
[CmpOp.node]
op = "$1"

[LogicOp]
production = [
    "id.keyword.logic_add|id.keyword.logic_or|symbol.base.and|symbol.base.or",
]
[LogicOp.node]
op = "$1"


# ============================================================================
# 3. 表达式（由 Pratt 解析器处理）
# ============================================================================

[MulExpr]
production = ["@PrimaryExpr", "(@MulOp,@PrimaryExpr)*"]
pratt = true
[MulExpr.node]
head = "$1"
tail = "$2"

[AddExpr]
production = ["@MulExpr", "(@AddOp,@MulExpr)*"]
pratt = true
[AddExpr.node]
head = "$1"
tail = "$2"

[CompareExpr]
production = ["@AddExpr", "(@CmpOp,@AddExpr)?"]
pratt = true
[CompareExpr.node]
left = "$1"
op_rhs = "$2"

[BoolExpr]
production = ["@CompareExpr", "(@LogicOp,@CompareExpr)*"]
[BoolExpr.node]
head = "$1"
tail = "$2"


# ============================================================================
# 4. 函数调用与参数
# ============================================================================

[Arguments]
production = ["@Expression", "(symbol.base.comma,@Expression)*"]
[Arguments.node]
first = "$1"
rest = "$2"

[Call]
production = [
    "id",
    "bracket.l_parentheses",
    "@Arguments?",
    "bracket.r_parentheses",
]
[Call.node]
callable_name = "$1"
args = "$3"


# ============================================================================
# 5. 类型系统
# ============================================================================

[ListType]
production = ["bracket.l_square_bracket", "@Type", "bracket.r_square_bracket"]
[ListType.node]
elem_type = "$2"

[OptionalType]
production = ["symbol.base.question_mark", "@Type"]
[OptionalType.node]
inner = "$2"

[Type]
production = ["id|@ListType|@OptionalType"]
inline = true
[Type.node]
type_desc = "$1"


# ============================================================================
# 6. 字面量表达式（列表、初始化）
# ============================================================================

[ListLiteral]
production = [
    "bracket.l_square_bracket",
    "(@Initializer,symbol.base.comma)*",
    "bracket.r_square_bracket",
]
[ListLiteral.node]
elements = "$2"

[Initializer]
production = ["@ListLiteral|@Call|@Expression"]
inline = true
[Initializer.node]
value = "$1"


# ============================================================================
# 7. 语句（Statements）
# ============================================================================

[VarDecl]
production = ["id", "symbol.base.colon", "@Type"]
end_case = ["newline"]
[VarDecl.node]
var_name = "$1"
type = "$3"

[VarInit]
production = [
    "id",
    "symbol.base.colon",
    "@Type",
    "symbol.base.equal",
    "@Initializer",
]
end_case = ["newline"]
[VarInit.node]
var_name = "$1"
type = "$3"
value = "$5"

[AssignStmt]
production = ["id", "symbol.base.equal", "@Initializer"]
end_case = ["newline"]
[AssignStmt.node]
var_name = "$1"
value = "$3"

[IdList]
production = ["id+"]
end_case = ["newline"]
[IdList.node]
items = "$1"

[CallStmt]
production = ["@Call"]
end_case = ["newline"]
[CallStmt.node]
call = "$1"

[PassStmt]
production = ["keyword.pass"]
end_case = ["newline"]
[PassStmt.node]

[BreakStmt]
production = ["keyword.break"]
end_case = ["newline"]
[BreakStmt.node]

[ContinueStmt]
production = ["keyword.continue"]
end_case = ["newline"]
[ContinueStmt.node]


# ============================================================================
# 8. 控制流（if-else, while, for）
# ============================================================================

[IfStatement]
production = [
    "keyword.if",
    "@Condition",
    "symbol.base.colon",
    "@Block",
    "@ElseBranch?",
]
end_case = ["newline"]
[IfStatement.node]
condition = "$2"
then_body = "$4"
else_body = "$5"

[ElseBranch]
production = ["keyword.else", "symbol.base.colon", "@Block"]
inline = true
[ElseBranch.node]
body = "$3"

[WhileStatement]
production = ["keyword.while", "@Condition", "symbol.base.colon", "@Block"]
end_case = ["newline"]
[WhileStatement.node]
condition = "$2"
body = "$4"

[ForStatement]
production = [
    "keyword.for",
    "id+",
    "keyword.in",
    "@Expression",
    "symbol.base.colon",
    "@Block",
]
end_case = ["newline"]
[ForStatement.node]
vars = "$2"
iterable = "$4"
body = "$6"


# ============================================================================
# 9. 导入语句
# ============================================================================

[ImportStatement]
production = ["keyword.import", "id", "(keyword.as,id)?"]
end_case = ["newline"]
[ImportStatement.node]
module = "$2"
alias = "$3"

[FromImport]
production = ["keyword.from", "id", "keyword.import", "id", "(keyword.as,id)?"]
end_case = ["newline"]
[FromImport.node]
module = "$2"
name = "$4"
alias = "$5"


# ============================================================================
# 10. 块结构（缩进块、根块）
# ============================================================================

[Root]
block_start = ""
block_end = ""

[Block]
block_start = "space.indent"
block_end = "space.dedent"


# ============================================================================
# 11. 条件表达式（仅供 if/while 内部调用，不作为顶层语句）
# ============================================================================

[Condition]
production = ["@CompareExpr|@BoolExpr"]
end_case = ["symbol.base.colon"]
pratt = true
[Condition.node]
expr = "$1"

[Expression]
production = ["@AddExpr|@BoolExpr"]
end_case = ["newline", "symbol.base.comma", "bracket.r_square_bracket"]
pratt = true
[Expression.node]
expr = "$1"
