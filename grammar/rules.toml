[Constant]
production = ["literal.number"]
[Constant.node]
value = "$1"

[Variable]
production = ["id"]
[Variable.node]
name = "$1"


# Parenthesized expressions
[ParenthesizedExpr]
production = ["bracket.l_parentheses", "@Expression", "bracket.r_parentheses"]
[ParenthesizedExpr.node]
expr = "$2"

# Primary expressions (atoms)
[PrimaryExpr]
production = ["@Constant|@Variable|@ParenthesizedExpr"]
[PrimaryExpr.node]
value = "$1"

# 乘除运算符单元
[MulOp]
production = ["symbol.base.multiple|symbol.base.div"]
[MulOp.node]
op = "$1"

# 乘除表达式
[MulExpr]
production = ["@PrimaryExpr", "(@MulOp,@PrimaryExpr)*"]
pratt = true
[MulExpr.node]
head = "$1" # 第一个PrimaryExpr
tail = "$2" # 后续的 (操作符 操作数) 重复序列

# 加减运算符单元
[AddOp]
production = ["symbol.base.add|symbol.base.sub"]
[AddOp.node]
op = "$1"

# 加减表达式
[AddExpr]
production = ["@MulExpr", "(@AddOp,@MulExpr)*"]
pratt = true
[AddExpr.node]
head = "$1" # 第一个MulExpr
tail = "$2" # 后续的 (操作符 操作数) 重复序列

# 比较表达式
[CompareExpr]
production = ["@AddExpr", "(@CmpOp,@AddExpr)?"]
pratt = true
[CompareExpr.node]
left = "$1"
op_rhs = "$2" # 可选部分：操作符和右操作数

[CmpOp]
production = [
    "symbol.extend.is_equal|symbol.extend.not_equal|symbol.base.bigger|symbol.base.lesser|symbol.extend.bigger_equal|symbol.extend.lesser_equal",
]
[CmpOp.node]
op = "$1"


# 顶层表达式
[Expression]
production = ["@AddExpr|@BoolExpr"]
end_case = ["newline", "symbol.base.comma", "bracket.r_square_bracket"]
pratt = true    
[Expression.node]
expr = "$1"


[LogicOp]
production = [
    "id.keyword.logic_add|id.keyword.logic_or|symbol.base.and|symbol.base.or",
]
[LogicOp.node]
op = "$1"

[BoolExpr]
production = ["@CompareExpr", "(@LogicOp,@CompareExpr)*"]
[BoolExpr.node]
head = "$1"
tail = "$2"


[Arguments]
production = ["@Expression", "(symbol.base.comma,@Expression)*"]
[Arguments.node]
first = "$1"
rest = "$2"

[Call]
production = [
    "id",
    "bracket.l_parentheses",
    "@Arguments?",
    "bracket.r_parentheses",
]
[Call.node]
name = "$1"
args = "$3"


# 列表类型: [ Type ]
[ListType]
production = ["bracket.l_square_bracket", "@Type", "bracket.r_square_bracket"]
[ListType.node]
elem_type = "$2"

[ListLiteral]
production = [
    "bracket.l_square_bracket",
    "(@Initializer,symbol.base.comma)*",
    "bracket.r_square_bracket",
]
[ListLiteral.node]
elements = "$2"

[OptionalType]
production = ["symbol.base.question_mark", "@Type"]
[OptionalType.node]
inner = "$2"

[VarDecl]
production = ["id", "symbol.base.colon", "@Type"]
end_case = ["newline"]
[VarDecl.node]
name = "$1"
type = "$3"


[Initializer]
production = ["@ListLiteral|@Call|@Expression"]
inline = true
[Initializer.node]
value = "$1"

[VarInit]
production = [
    "id",
    "symbol.base.colon",
    "@Type",
    "symbol.base.equal",
    "@Initializer",
]
end_case = ["newline"]
[VarInit.node]
name = "$1"
type = "$3"
value = "$5"

# Type 作为顶层规则，可以是 id（基本类型）或 @ListType 或 @OptionalType
[Type]
production = ["id|@ListType|@OptionalType"]
inline = true
[Type.node]
type_desc = "$1"


[IdList]
production = ["id+"] # 期望至少一个 id
[IdList.node]
items = "$1"


[Block]
production = []
end_case = ["space.dedent"]     # 缩进块的结束符
block_start = "space.indent"    # 缩进块的开始符


[IfStatement]
production = [
    "id.keyword.if",
    "@Expression",
    "symbol.base.colon",
    "@Block",
    "@ElseBranch?",
]
end_case = ["space.dedent"] # if 语句结束后需要缩进退格
[IfStatement.node]
condition = "$2"
then_body = "$4"
else_body = "$5"

[ElseBranch]
production = ["id.keyword.else", "symbol.base.colon", "@Block"]
inline = true
[ElseBranch.node]
body = "$3"
