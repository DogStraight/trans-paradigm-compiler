[Constant]
keywords = ["constant", "base"]
productions = ["literal.number"]
[Constant.node_info]
name = "constant"
content = "$1"

[Variable]
keywords = ["variable", "base"]
productions = ["id"]
[Variable.node_info]
name = "variable"
content = "$1"

[Operation]
keywords = ["operation", "link"]
productions = [
    "symbol.base.add|sub|multiple|div",
]
[Operation.node_info]
name="operation"
left_node = "$0"
operator = "$1"
right = "$-1"

[VariableDef]
keywords = ["variable", "definition"]
productions = [
    "id",
    "id",
    "symbol.base.equal",
    "GrammarRule(Constant)|GrammarRule(Variable)",
]
[VarDef.node_info]
name = "$1"
var_type = "$2"
init_value = "$4"
