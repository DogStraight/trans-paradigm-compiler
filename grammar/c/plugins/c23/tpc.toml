# c23 插件 — C23 增量（第三档：c23 ⊇ c17 ⊇ c11 ⊇ 核心基线）
#
# 与 c11/c17 的分工：`requires = ["c17"]` 让包含关系在**加载期可执行**（缺前置响亮失败）。
#
# **本插件落地了哪些**：`static_assert`（C23 关键字化；**文件 + 块 + struct/union 成员表
#   三处作用域**；两参形态 + C23 新增的**单参形态**）+ **下划线拼写 `_Static_assert` 的单参
#   形态**（§6.7.10 两种拼写同语法；`22_static_assert_no_msg.toml`，循环 #41）+
#   **枚举固定底层类型**（§6.7.2.2 `enum e : int …`；核心空槽位 `@EnumSpecExtra?` +
#   `23_enum_underlying.toml`，循环 #42）+ `nullptr` / `true` / `false`（表达式原子）+
#   `bool` / `typeof` / `typeof_unqual`（类型说明符，注入核心 `SimpleType` 交替）+
#   `constexpr`（存储类，注入 `StorageClass`）+ `alignas` / `alignof` /
#   `thread_local`（c11 三个关键字的 C23 拼写）+ `[[属性]]` + `_BitInt` /
#   `_Decimal32/64/128` + 字面量面（`u8` 字符前缀、二进制常量 `0b…`、**数字分隔符**
#   `1'000`）——后三者走**声明面**（`_token_ext.toml` / `_number_c23.toml` 按名合并）。
#
# ⚠ **同构造异拼写的包内约定（2026-09-26 定；TODO 里"需先定约定"的那条答复）**：
#   **c23 侧各写一条同形规则**，不做跨插件 token 引用、也不用 `inject_replace_rule` 去改
#   c11 的规则。理由与代价见 `16_alignas_alias.toml` 头注——一句话：词法层 **token 类型
#   由拼写决定**（`keyword_type(拼写)`），"一个 token 类型两种拼写"在现役词法里表达不了；
#   改别人规则的 production 只有软路径。代价 = **同一构造两个节点名**。
#
# ⚠ **历史更正（2026-09-26 实测）**：本文件原先写"需要『改』核心规则的那一类增量
#   （typeof / constexpr / nullptr …）做不了，因为现役 `grammar_inject` 只能做
#   production 的字符串子串补丁（且软失败）"——**两条都不成立**：现役 `inject_productions`
#   的直接注入是**树层** `insert_choice_candidate`（把 `@ExtRule` 作为候选并进目标
#   production 的交替，`parser/grammar_inject.py`），fail-fast；缺的只是插件没写那几行
#   声明。上面各项即按此落地（各文件头注写明注入点与"为什么选那个最窄的注入点"）。
#
# ⚠ **标准等效语法缺口已清零**（2026-10-21）：gcc oracle 扫出的最后一条
#   （`enum e : int` 固定底层类型）于循环 #42 落地；`enabled` 只门控声明面的旧限制由
#   ADR-0023（可选件 grammar 随档加载）解除后，纯核心 token 形态（`_Static_assert(1)`
#   #41、`enum e : int` #42）都能按"c23 规则 + 档位门控"落地。现行边界（过接受 / 未实现
#   约束）登记在 `docs/gaps/gap-language-pack-scope.md`「仍存的接受边界」。
#
# 词法面：C23 新增关键字**全部声明**（词法完整）；没有规则的用起来就是语法错误
#   （响亮失败，不会静默当标识符）——与 c11 插件同一策略。

requires = ["c17"]

[lexer]
token_ext = { file = "_token_ext.toml", required = true }
# 十进制浮点字面量后缀（`1.5dd`）：给核心的数字形态 `c_dec` **补一个后缀字符**。
# `merge = "by-name"` = 与核心基线**同名声明按 `name` 合并**（声明级合并语义，
# 见 `core/config_registry.py::merge_by_name`）——本插件只写要改的字段，
# 其余字段由核心 `base/_number.toml` 供给（不整条重抄 = 不制造第二份知识）。
# 缺省（不写 `merge`）仍是"后者覆盖"，故对既有配置零影响。
number = { file = "_number_c23.toml", section = "number", merge = "by-name" }

[grammar]
files = [
    "10_static_assert_alias.toml",
    "11_nullptr.toml",
    "12_bool_literal.toml",
    "13_bool_type.toml",
    "14_typeof.toml",
    "15_constexpr.toml",
    "16_alignas_alias.toml",
    "17_alignof_alias.toml",
    "18_thread_local_alias.toml",
    "19_bitint.toml",
    "20_decimal.toml",
    "21_attributes.toml",
    "22_static_assert_no_msg.toml",
    "23_enum_underlying.toml",
]
