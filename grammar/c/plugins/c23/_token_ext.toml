# c23 插件 — 词法扩展（C23 §6.4.1 关键字）
#
# 策略：**声明齐全**（词法面完整），语法规则按已落地的子集引用——没有规则的用起来
# 就是语法错误（响亮失败，不会静默当标识符）。
#   已有语法规则：`static_assert`（文件 + 块两作用域）、`bool`、`true`、`false`、
#     `nullptr`、`typeof`/`typeof_unqual`、`constexpr`、`alignas`、`alignof`、
#     `thread_local`、`_BitInt`、`_Decimal32`/`_Decimal64`/`_Decimal128`；
#   仍无规则：`[[属性]]`（需声明/语句前缀位点设计）。
#   ⚠ 十进制浮点**字面量后缀**（`1.5df`/`dd`/`dl`）不在词法面：那属 `base/_number.toml`
#     （核心基线），插件侧另声明会被 `deep_merge` 的"列表后者覆盖"顶掉核心数字形态——
#     见 `20_decimal.toml` 头注与 `TODO.md` 同项。
#
# `bool` / `true` / `false` / `nullptr` / `typeof` 等在 C23 里是**关键字**（不再是
# <stdbool.h>/<stddef.h> 的宏或标识符）。声明它们会让"把 `bool` 当 typedef 名"的
# 旧代码报语法错误——这是**忠于标准**的代价，且是**响亮失败**；若某工程需要旧写法，
# 就不启用 c23 档。

[id.keyword]
static_assert = "static_assert"
alignas = "alignas"
alignof = "alignof"
bool = "bool"
constexpr = "constexpr"
false = "false"
nullptr = "nullptr"
thread_local = "thread_local"
true = "true"
typeof = "typeof"
typeof_unqual = "typeof_unqual"
_BitInt = "_BitInt"
_Decimal32 = "_Decimal32"
_Decimal64 = "_Decimal64"
_Decimal128 = "_Decimal128"
