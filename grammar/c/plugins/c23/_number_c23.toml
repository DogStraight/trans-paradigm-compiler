# ============================================================================
# c23 插件 — 十进制浮点**字面量后缀** `df` / `dd` / `dl`（C23 §6.4.4.2）
# ============================================================================
# C23 的 decimal-floating-constant 在常规浮点后缀之外还允许 `df` / `dd` / `dl`
# （分别对应 `_Decimal32` / `_Decimal64` / `_Decimal128`）。它们作用在**词法的数字形态**
# 上，而数字形态由核心基线的 `base/_number.toml` 声明（`[[number.based]] name = "c_dec"`
# 的 `suffix = { chars = "uUlLfF", max = 3 }`）。
#
# ⚠ **插件不能改核心文件，也不能整条重抄**：把 `d` 写进核心会让**基线档**也接受 `1.5dd`
#   （档位语义被污染）；整条重抄 `c_dec` 则是知识重复、必然漂移。故本轮给引擎补了
#   **声明级合并语义** `merge = "by-name"`（`core/config_registry.py::merge_by_name`）：
#   同名声明之间按 `name` 合并 `[[number.based]]` 条目 —— 本文件只写**要改的字段**，
#   其余（size / base_prefix / value_digits / lead_dot …）由核心形态供给。
#
# ⚠ `chars` 是**字符集 + 长度上限**（不是"合法后缀表"）：加了 `d` 之后 `1.5d` / `1.5dd`
#   / `1.5dl` / `1.5ddf` 都会被吃成一个数字 token —— 与核心基线既有的宽进口径一致
#   （`_number.toml` 头注："组合合法性不在词法层判定，C 的 pp-number 本就宽进"）。
#   只加**小写** `d`：标准的三个后缀都是小写（`DF` 不是合法后缀，故不进字符集）。

[[number.based]]
name = "c_dec"
suffix = { chars = "uUlLfFd", max = 3 }
