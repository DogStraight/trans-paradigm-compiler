# ============================================================================
# c23 插件 — 十进制浮点类型词 `_Decimal32` / `_Decimal64` / `_Decimal128`（C23 §6.7.2）
# ============================================================================
# 三个词都是**类型说明符**（与 `float`/`double` 同层，就是"一个类型词"），故形态是
# **单 token 的三拼写交替**（同一规则内用裸交替，同核心基线 `SimpleType` 的写法）——
# 不写三条规则：三者的**形态与语义位点完全相同**，只差拼写，拆开只会多两份重复。
#
# 注入点 = **`@SimpleType`**（与 c11 的 `bool`/c23 的 `_BitInt` 同宿主）：一次注入，
#   声明 / 成员 / 参数 / 类型名 / 强制转换多处生效。
#
# **接受域（2026-09-26 更新：字面量后缀已落地）**：语法层只认"这是一个类型词"；
#   十进制浮点的**字面量**（`1.5df` / `1.5dd` / `1.5dl`）由 `_number_c23.toml`
#   **合并核心数字形态**落地（声明级 `merge = "by-name"`，见该文件头注）——不再有缺口。
#   ⚠ 为什么不在本文件里做：后缀属**词法面**（`base/_number.toml` 的 `[[number.based]]`），
#   而那是**核心基线**声明的命名条目列表；插件改核心文件会让基线档也接受 `1.5dd`
#   （档位语义被污染），整条重抄 `c_dec` 又是知识重复。故走"按名合并"。
#   对照：`_Decimal64 x = 1.5;` 与 `_Decimal64 x = 1.5dd;` 现在都进 AST。
#
# ⚠ 三个词都是 C23 新增关键字；c11/c17 档下当标识符（`_Decimal32 x;` 在那里是
#   "typedef 名 + 声明符"的宽进读法），不进本节点。

[DecimalSpec.parser]
production = [
    "keyword._Decimal32|keyword._Decimal64|keyword._Decimal128",
]

[DecimalSpec.parser.node]
base = "$1"

[DecimalSpec.inject]
targets = ["@SimpleType.production[0]"]

[DecimalSpec.renderer.layout]
ref = "base"
