# ============================================================================
# c23 插件 — 十进制浮点类型词 `_Decimal32` / `_Decimal64` / `_Decimal128`（C23 §6.7.2）
# ============================================================================
# 三个词都是**类型说明符**（与 `float`/`double` 同层，就是"一个类型词"），故形态是
# **单 token 的三拼写交替**（同一规则内用裸交替，同核心基线 `SimpleType` 的写法）——
# 不写三条规则：三者的**形态与语义位点完全相同**，只差拼写，拆开只会多两份重复。
#
# 注入点 = **`@SimpleType`**（与 c11 的 `bool`/c23 的 `_BitInt` 同宿主）：一次注入，
#   声明 / 成员 / 参数 / 类型名 / 强制转换多处生效。
#
# **接受域（本轮定的口径）**：语法层只认"这是一个类型词"。十进制浮点的**字面量**
#   （`1.5df` / `1.5dd` / `1.5dl` 的 `df`/`dd`/`dl` 后缀）**不在本轮**——理由与归属：
#   · 后缀属**词法面**（`base/_number.toml` 的 `[[number.based]] suffix`）；那份配置是
#     **核心基线**（≈C99 面），把 C23 的后缀写进核心会让**基线档也接受** `1.5dd`
#     （档位语义被污染）；
#   · 插件侧另declared一份 `number` 形态**不行**：`deep_merge` 对列表是**后者覆盖**
#     （`core/config_registry.py::deep_merge`），插件声明 `number` 会把核心三条数字形态
#     整体顶掉；要支持需先给"数字形态列表"加**跨声明合并**语义（引擎侧小项）。
#   故记在 `TODO.md`（附上述两条证据与触发条件），不在此含糊带过。
#   现状对照：`_Decimal64 x = 1.5;` ✓ 可解析（整数字面量赋给十进制类型，语法层不管转换）；
#   `_Decimal64 x = 1.5dd;` 目前切成 `1.5` + `dd` ⇒ 整条声明解析失败（缺口如实登记）。
#
# ⚠ 三个词都是 C23 新增关键字；c11/c17 档下当标识符（`_Decimal32 x;` 在那里是
#   "typedef 名 + 声明符"的宽进读法），不进本节点。

[DecimalSpec.parser]
production = [
    "keyword._Decimal32|keyword._Decimal64|keyword._Decimal128",
]

[DecimalSpec.parser.node]
base = "$1"

[DecimalSpec.inject]
targets = ["@SimpleType.production[0]"]

[DecimalSpec.renderer.layout]
ref = "base"
