# c17 插件 — C17（C18）增量（**无新语法**，只表达标准包含关系）
#
# C17 是**缺陷修正版**：相对 C11 **没有新增语法**（修的是 `_Static_assert` 单参形态、
# `_Atomic` 与对齐相关缺陷等）。故本插件**不带语法文件**——这是忠于事实的形态，
# 也是"标准增量 = 语法增量 + 关键字增量 + 预处理指令增量"这条拼接关系的一个
# 反例说明：**有的标准只贡献包含关系，不贡献语法面**。
#
# `requires` 是**组件依赖**（core/plugin_loader.py 的 _resolve_dependencies 按它做
# 拓扑排序，缺前置即 ValueError）——它让"c17 ⊆ c11 ⊆ 核心基线"这条包含关系
# **在加载期可执行**：只启用 c17 而不启用 c11 会响亮失败，而不是静默少加载。
#
# ⚠ 本插件是**组件级 requires 的首个实例**：现役两处 requires 都用在
#   `[[analyzer.postpasses]]` 级别（链内时点依赖），组件级此前无人用。

requires = ["c11"]
