#   CSC005 `constexpr` 须与 static/extern 之一共现
#   CSC006 `constexpr` 与 typedef/auto/register/_Thread_local 组合限制
#   反证：cppreference「constexpr specifier (C23)」示例即块作用域裸用
#         （`constexpr float f = 23.0f;`，无 static/extern），且明言
#         "It still has linkage appropriate to its declaration"；
#       本包 `c23/15_constexpr.toml` 自述的标准形态也是裸 `constexpr int n = 4;`。
#   ⇒ 这两条若实现会把**正常 C23 用法**全量误报。原文未能取得，作出反证 ⇒ 待作者核实后
#     再决定（报告已列为拍板点）。`_api.CSC_PERMISSIVE_SPECS` 让 CSC001/CSC002 对
#     `constexpr` 保守放行（宁可漏报不误报）。
