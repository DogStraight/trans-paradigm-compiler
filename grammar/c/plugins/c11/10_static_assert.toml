# ============================================================================
# c11 插件 — 静态断言 `_Static_assert ( 常量表达式 , 字面量 ) ;`（C11 §6.7.4）
# ============================================================================
# **三处**作用域都合法（C11 §6.7.4 + §6.7.2.1）：文件、块、struct/union 成员表。
# 三条注入通路各管一处（缺一档就有一档合法代码进不来）：
#   · 文件作用域：`is_statement = true` → 引擎的全局语句发现直接认它；
#   · 块作用域：核心 `Stmt` 选择器里得有这一支 → 结构化注入 `targets = ["@Stmt"]`；
#   · 成员表：注入核心**空槽位** `@StructMemberExtra`（C 核心 `02_types.toml` 的
#     `StructBody = { (@StructMember|@StructMemberExtra)* }`）——**不要**注入 `@StructMember`：
#     那会把静态断言并成它的一条分支、污染它的 FIRST（顶层 `_Static_assert(…)` 被分类成
#     `StructMember` ⇒ `phase-statement` 假红，2026-10-20 实测；干净对照与结论见
#     c23 `10_static_assert_alias.toml` 头注与 `policy/collaboration.md`「因果句必须带对照」）。
#
# ⚠ 旧注释说"块作用域需要在核心 `Stmt` 里加分支，属跨文件改动，留待注入机制补『改』
#   路径"——**该判断是错的**（2026-09-26 实测）：现役 `inject_productions` 的**直接注入**
#   就是把 `@ExtRule` 作为候选并进目标规则 production 的树
#   （`insert_choice_candidate`），正是"往既有交替里加一支"；缺的只是本插件没写这行。
#   实测（副本对照）：加了它，`void f(void) { _Static_assert(1, "x"); }` 解析出
#   FuncDef + 块内 StaticAssertDecl、linter 0 诊断、渲染逐字还原；不加则整条函数解析
#   失败（空 AST）。
#
# ⚠ 剩余边界（记在此防"看起来支持"）：
#   · 消息必须是字符串字面量（C11 允许任意字符串字面量拼接，此处不处理）。

[StaticAssertDecl]
is_statement = true

# `@Stmt`：文件/块作用域（并**传播**到所有引用 `@Stmt` 的规则——if/while/for/switch/
#   标号/复合语句的 body 位；`Stmt.production[0]` 是 choice → 插 alternatives 首）。
# `@StructMemberExtra`：struct/union 成员表的空槽位（容器级分支，不碰 `StructMember` 自身）。
[StaticAssertDecl.inject]
targets = ["@Stmt", "@StructMemberExtra"]

[StaticAssertDecl.parser]
production = [
    "keyword._Static_assert",
    "bracket.l_parentheses",
    "@Expression",
    "symbol.base.comma",
    "literal.string",
    "bracket.r_parentheses",
    "symbol.base.semicolon",
]

[StaticAssertDecl.parser.node]
cond = "$3"
message = "$5"

# 渲染（世界 A）：`_Static_assert(条件, 消息);`——message 绑的是 literal.string
# token，normalize 后即含引号的字符串，ref 原样输出。
[StaticAssertDecl.renderer.layout]
line = [
    "_Static_assert(",
    { ref = "cond" },
    ", ",
    { ref = "message" },
    ");",
]
