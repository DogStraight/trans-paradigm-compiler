# ============================================================================
# c11 插件 — 静态断言 `_Static_assert ( 常量表达式 , 字面量 ) ;`（C11 §6.7.4）
# ============================================================================
# 文件作用域与块作用域均合法。标 `is_statement = true`：文件作用域走引擎的全局语句
# 发现（按 is_statement + 首 token），**不依赖核心基线的 `Stmt` 选择器**——
# 这是刻意的：增量插件不改核心规则文件（否则"增量"就变成"改基座"）。
#
# ⚠ 已知边界（记在此防"看起来支持"）：
#   · 仅文件作用域可用（块作用域需要在核心 `Stmt` 选择器里加分支，属跨文件改动，
#     留待"注入机制补『改』路径"立项后处理——见 ROADMAP 该条）；
#   · 消息必须是字符串字面量（C11 允许任意字符串字面量拼接，此处不处理）。

[StaticAssertDecl]
is_statement = true

[StaticAssertDecl.parser]
production = [
    "keyword._Static_assert",
    "bracket.l_parentheses",
    "@Expression",
    "symbol.base.comma",
    "literal.string",
    "bracket.r_parentheses",
    "symbol.base.semicolon",
]

[StaticAssertDecl.parser.node]
cond = "$3"
message = "$5"

# 渲染（世界 A）：`_Static_assert(条件, 消息);`——message 绑的是 literal.string
# token，normalize 后即含引号的字符串，ref 原样输出。
[StaticAssertDecl.renderer.layout]
line = [
    "_Static_assert(",
    { ref = "cond" },
    ", ",
    { ref = "message" },
    ");",
]
