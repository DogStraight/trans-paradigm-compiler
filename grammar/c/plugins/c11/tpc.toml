# c11 插件 — C11 增量语法（**首个"标准增量插件"**，验证 ROADMAP 的插件族形态）
#
# 形态（ROADMAP 2026-08-29 定调）：核心基线 = `grammar/c/`（≈c99 语法面本包已落），
# 各标准增量 = 各自一个插件目录；`requires`（组件依赖）表达标准包含关系
# （c17 requires c11、c23 requires c17）——启用组合等效某个标准的语法面。
#
# ⚠ 运行时**按 `<pack>/plugins/` 自动发现**（`load_language(pack, plugins_dir=...)`）：
#   不加 plugins_dir 时只有核心基线，加了才带增量——本插件的测试即按这两档验证。
#   `[plugins] enabled`（语言包 tpc.toml 里那份）是**打包/分发面**的清单，不是运行时开关。
#
# 本插件当前落地：`_Static_assert`（C11 §6.7.4 静态断言，文件作用域与块作用域均合法）。
# 词法面**先声明 C11 全部关键字**（`_Generic`/`_Alignas`/`_Alignof`/`_Noreturn`/
# `_Thread_local`/`_Atomic`），语法规则按已落地的子集引用——未引用的关键字会被
# linter 视为"未期望 token"，这正是负样本判据之一。

[lexer]
token_ext = { file = "_token_ext.toml", required = true }

[grammar]
files = ["10_static_assert.toml"]
