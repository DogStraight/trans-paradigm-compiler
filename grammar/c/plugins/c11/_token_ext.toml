# c11 插件 — 词法扩展（C11 §6.4.1 新增关键字）
#
# ⚠ 全部 6 个 C11 新关键字都在此声明（词法面完整）。语法面（2026-09-26 批次）：
#   `_Static_assert`（**文件 + 块**两处作用域）、`_Alignof`、`_Generic`、`_Noreturn`、
#   `_Thread_local` 已落地（各一个规则文件，靠**声明的注入**接上核心交替）；
#   **`_Alignas` / `_Atomic` 仍未做**（说明符位设计，见 grammar/c/README.md「未做」表）。
#   声明了关键字但没有规则时，用它们就是语法错误（响亮失败），不会静默当作标识符。

[id.keyword]
_Static_assert = "_Static_assert"
_Generic = "_Generic"
_Alignas = "_Alignas"
_Alignof = "_Alignof"
_Noreturn = "_Noreturn"
_Thread_local = "_Thread_local"
_Atomic = "_Atomic"
