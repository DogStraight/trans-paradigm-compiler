# c11 插件 — 词法扩展（C11 §6.4.1 新增关键字）
#
# ⚠ 全部 6 个 C11 新关键字都在此声明（词法面完整）。语法面（2026-09-26 两批）：
#   `_Static_assert`（**文件 + 块**两处作用域）、`_Alignof`、`_Generic`、`_Noreturn`、
#   `_Thread_local`、`_Alignas`、`_Atomic`（限定符形态 + `_Atomic(T)` 说明符形态）
#   **全部已落地**（各一个规则文件，靠**声明的注入**接上核心说明符/原子交替）。

[id.keyword]
_Static_assert = "_Static_assert"
_Generic = "_Generic"
_Alignas = "_Alignas"
_Alignof = "_Alignof"
_Noreturn = "_Noreturn"
_Thread_local = "_Thread_local"
_Atomic = "_Atomic"

# C11 §6.4.5 / §6.4.4.4：Unicode 字符串前缀 u/U（两种字面量）与 UTF-8 字符串前缀 u8
# （C11 只给字符串；u8 字符常量是 C23 的事，见 c23 插件的同名键覆盖）。
[string.prefixes]
u = ['"', "'"]
U = ['"', "'"]
u8 = ['"']
