# tpc.toml — C 语言包入口（核心基线 ≈ C99 语法面；标准增量插件见 ROADMAP「C 语言包」）
#
# 覆盖：词法 / 声明与声明符 / 类型（struct·union·enum·typedef）/ 语句 / 表达式；
# 标准增量 = `plugins/{c11,c17,c23}`（启用组合见下 `[plugins] enabled`）。
# 接受域现状见 docs/gaps/gap-language-pack-scope.md「C 语言包：接受域现状」节。

[engine]
# 本包依赖的引擎契约面（逐项能力 + 版本）——任一项引擎不认识或版本不匹配即
# 加载 fail-fast，报错点名是哪一项（能力表见 core/engine_capabilities.py）。
uses = [
    "grammar.rules.v1",
    "lexer.token_ext.v1",
    "parser.pratt.v1",
    "renderer.doc_ir.v1",
    # 语义基座 P1（`plugins/semantics/`）：analyzer handler + 语义原语注册 + 后置产物
    "analyzer.primitives.v1",
    # 存储类语义约束（`plugins/checks/storage_class/`，循环 #10）：check 规则表 + L2 handler
    "checks.rules.v1",
    # 预处理器（`base/_macro.toml` + 本文件 `[preprocessor]` 挂载，循环 #14）：宏形态声明 + 指令处理器 + 展开配置
    "preprocessor.pipeline.v1",
]

[renderer]
# 渲染风格（页宽/缩进）——C 惯例 80 列；理由见 base/_style.toml 头注
style = { file = "base/_style.toml", section = "style", required = false }

[lexer]
token_base = { file = "base/_token.toml", required = true }
lexer_base = { file = "base/_lexer.toml", required = true }
token_lang = { file = "token.toml", required = true }
bracket_map = { file = "base/_token.toml", section = "bracket", required = false }
number = { file = "base/_number.toml", section = "number", required = false }

[parser]
# 运算符表（优先级 / 结合性 / 一元位置，C99 §6.5）——Layer B 起生效
operator_defs = { file = "base/_operator.toml", section = "operator", required = true }
# 解析期符号命名空间（`[Rule.parser] requires_symbol` 门控用；C 的"类型名形态"= typedef 名）
# 见 docs/gaps/gap-c-typedef-cast.md：G4 typedef 名强转靠解析序单遍符号注册 + 本门控消歧。
symbol_namespaces = { type_name = ["typedef"] }
token_categories = { file = "base/_lexer.toml", section = "token_category", required = true }
rules = { file = ["0*.toml"], required = true }

# 预处理器面（阶段 4 首片 A）：宏形态 + 指令处理器绑定（声明面见 base/_macro.toml）
[preprocessor]
macro_config = { file = "base/_macro.toml", required = false }
directives = { file = "base/_macro.toml", section = "directive_handlers", required = false }
expand = { file = "base/_macro.toml", section = "expand", required = false }

# ── 插件清单（核心基线之外的增量） ──
# ⚠ 这份清单**不是**打包面的装饰：实测 `load_language(pack, plugins_dir=…)` 只在该清单
#   列出的插件上合并其声明（含 `[lexer] token_ext` 的词法扩展）。对照：verilog 的
#   `nand`（plugins/syntax/gates 的关键字）在 verilog 下无需任何 ext_dirs 即为关键字，
#   因为 verilog 的 `[plugins] enabled` 列出了 gates。
#   故"启用组合等效某个标准"的运行入口就在这里——c11 已启用；c17/c23 待落地后追加。
[plugins]
enabled = ["c11", "c17", "c23"]
