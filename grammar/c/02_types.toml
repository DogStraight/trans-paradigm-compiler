# ============================================================================
# C 语法规则 — 类型说明符与类型定义（阶段 2a）
# ============================================================================
# C99 §6.7.2（类型说明符）/ §6.7.2.1（struct/union）/ §6.7.2.2（enum）/
# §6.7.3（类型定义 typedef 名）。
#
# 阶段 2a 支持：
#   struct/union 说明符：带标签（可选成员体）/ 匿名（必须有成员体）
#   enum 说明符：带标签（可选枚举体）/ 匿名
#   成员声明（结构体成员 = 说明符 + 声明符列表 + `;`）
#   枚举项（`NAME` 或 `NAME = 数字字面量`）
#   **typedef 名作类型**（`myint x;`——语法层宽进，靠语义层区分类型名与变量名）
#
# 阶段 2a **不支持**（留阶段 2b/3）：位域 `int x : 3`、成员初始化器、
#   枚举值用一般常量表达式（本阶段只接受数字字面量）、`_Alignas`、属性。
#
# ⚠ **typedef 名的歧义是刻意留给语义层的**：把 `@TypedefName` 放进说明符交替后，
#   "以标识符开头的语句"既可能是声明（`myint x;`）也可能是表达式语句（`x = 1;`）。
#   C 靠符号表消歧（typedef 名在普通标识符命名空间里是"类型"）；本包同样把这一步
#   留给语义层——**阶段 3 接表达式语句时必须处理该歧义**（届时按符号表判定，
#   而不是在语法层瞎猜）。

# ── StructSpecifier / UnionSpecifier ──
# 带标签：`struct tag` / `struct tag { … }`
# 匿名：`struct { … }`（typedef 匿名结构体是 C 里最常见的用法之一）

[StructSpecifier.parser]
production = [
    "@StructOrUnion",
    "@Identifier",
    "@StructBody?",
]

[StructSpecifier.parser.node]
kind = "$1"
tag = "$2"
body = "$3"


[AnonStructSpecifier.parser]
production = [
    "@StructOrUnion",
    "@StructBody",
]

[AnonStructSpecifier.parser.node]
kind = "$1"
body = "$2"


[StructOrUnion.parser]
production = [
    "keyword.struct|keyword.union",
]

[StructOrUnion.parser.node]
base = "$1"


[StructBody.parser]
production = [
    "bracket.l_curly_bracket",
    "@StructMember*",
    "bracket.r_curly_bracket",
]

[StructBody.parser.node]
members = "$2"


# 成员声明：说明符 + 声明符列表 + `;`（位域在阶段 2b）
[StructMember]
is_statement = true

# 成员声明：说明符 + 声明符列表 + 可选**位域宽度** + `;`
# 位域（C99 §6.7.2.1）：`unsigned int flag : 3;` / `int : 0;`（匿名占位）。
# ⚠ 宽度是常量表达式（`@Expression`，语法层宽进——"是不是整型常量"归语义层）；
#   匿名位域 `int : 0;` 的声明符表**可省**，故此处沿用 `@DeclaratorList`（非可选）会让
#   匿名位域解析失败——需要 `;` 前允许省略声明符，见下面 `@DeclaratorList?`。
#   环安全：宽度里的 `@Expression` 不回到 `StructMember`，与数组长度同性质。
# ⚠ **已知边界**：宽度在整个成员声明之后（一个 `@DeclaratorList` 共用一个宽度），
#   故**逐声明符宽度**写不出来——`int a : 3, b : 4;` 解析失败（实测；标准里位宽是
#   `declarator : constant-expression` 的一部分，可逐个不同）。单声明符位域
#   （`unsigned int f : 3;`）与匿名占位（`int : 0;`）均可用；`tools/c_acceptance.py`
#   的位域用例即单声明符形态。
[StructMember.parser]
production = [
    "@MemberSpec",
    "@DeclaratorList?",
    "(symbol.base.colon,@Expression)?",
    "symbol.base.semicolon",
]

[StructMember.parser.node]
specs = "$1"
declarators = "$2"
# bit_width — 位宽表达式本体（绑定落到组内的表达式，理由同 InitDeclarator.init：
#   包住 `:` 的形态会多印一个 `:`；并联新属性会让子树被 iter_nodes 走两遍）
bit_width = "$3.sub_node[0].sub_node[1]"


[MemberSpec.parser]
production = [
    "@TypeQualifier|@SimpleType|@StructSpecifier|@AnonStructSpecifier|@EnumSpecifier|@AnonEnumSpecifier|@TypedefName",
    "@SpecRest*",
]

[MemberSpec.parser.node]
first = "$1"
rest = "$2"


# ── EnumSpecifier ──

[EnumSpecifier.parser]
production = [
    "keyword.enum",
    "@Identifier",
    "@EnumBody?",
]

[EnumSpecifier.parser.node]
tag = "$2"
body = "$3"


[AnonEnumSpecifier.parser]
production = [
    "keyword.enum",
    "@EnumBody",
]

[AnonEnumSpecifier.parser.node]
body = "$2"


[EnumBody.parser]
production = [
    "bracket.l_curly_bracket",
    "@Enumerator",
    "(symbol.base.comma,@Enumerator)*",
    "symbol.base.comma?",
    "bracket.r_curly_bracket",
]

# ⚠ 合并 `items`（渲染前提，同 DeclaratorList）：`$2` 是首个枚举项、
#   `$3.items[*].sub_node[1]` 是其余项（每个 `(comma,Enumerator)` 组的第二个子节点）。
[EnumBody.parser.node]
items = ["$2", "$3.items[*].sub_node[1]"]


# 枚举项：`NAME` / `NAME = 数字字面量` / `NAME attr… = 数字字面量`（一般常量表达式在阶段 3）
# ⚠ **属性槽在 `=` 之前**（C23 §6.7.2.2：`enumeration-constant attribute-specifier-sequence_opt
#   (= constant-expression)?`）——与声明符内属性**共用**核心的 `AttributeSlot` 空槽位
#   （见 `01_declarations.toml`），故插件只需一处注入声明。
[Enumerator.parser]
production = [
    "@Identifier",
    "@AttributeSlot*",
    "(symbol.base.equal,literal.number)?",
]

[Enumerator.parser.node]
name = "$1"
attrs = "$2"
# value — 显式枚举值本体（绑定落到组内的表达式，理由同 InitDeclarator.init）
value = "$3.sub_node[0].sub_node[1]"


# ── 简单类型说明符（内建类型词）与 typedef 名 ──
# `@TypedefName` 只是"标识符作类型"的语法占位——是不是真的 typedef 名由语义层判定。

[SimpleType.parser]
production = [
    "(keyword.void|keyword.char|keyword.short|keyword.int|keyword.long|keyword.float|keyword.double|keyword.signed|keyword.unsigned|keyword._Bool|keyword._Complex)",
]

[SimpleType.parser.node]
base = "$1"


[TypedefName.parser]
production = [
    "@Identifier",
]

[TypedefName.parser.node]
name = "$1"


# ============================================================================
# 渲染配置（世界 A 布局）— 类型说明符与类型定义
# ============================================================================
# 口径同 00_expressions.toml 头注。聚合体（struct/union/enum 体）是**块**：
# head 打头（`{` / `enum tag {`）、body 逐成员缩进一行、tail 收尾（`}`），
# 与 verilog 的 ModuleDecl 三段式同构（renderer/renderer_architecture.md）。

[StructSpecifier.renderer.layout]
line = [
    { ref = "kind" },
    " ",
    { ref = "tag" },
    { opt = { group = [
    " ",
    { ref = "body" },
] } },
]

[AnonStructSpecifier.renderer.layout]
line = [{ ref = "kind" }, " ", { ref = "body" }]

[StructOrUnion.renderer.layout]
ref = "base"

[StructBody.renderer.head]
line = ["{"]

# body 子节点来源用 `items`（理由同 CompoundStmt：单成员 struct 会被 normalize
# 塌成单节点，`source` 路径会再往下钻一层取错子节点）
[StructBody.renderer.body]
indent = true
items = ["members"]

[StructBody.renderer.tail]
text = "}"

# StructMember — 成员声明：说明符 [声明符] [: 位宽] ;
[StructMember.renderer.layout]
line = [
    { ref = "specs" },
    { opt = { group = [
    " ",
    { ref = "declarators" },
] } },
    { opt = { group = [
    " : ",
    { ref = "bit_width" },
] } },
    ";",
]

[MemberSpec.renderer.layout]
line = [
    { ref = "first" },
    { opt = { group = [
    " ",
    { intent = "compact", items = "rest", sep = " ", first_soft = false, nest = 0 },
] } },
]

[EnumSpecifier.renderer.layout]
line = [
    "enum ",
    { ref = "tag" },
    { opt = { group = [
    " ",
    { ref = "body" },
] } },
]

[AnonEnumSpecifier.renderer.layout]
line = ["enum ", { ref = "body" }]

[EnumBody.renderer.layout]
line = [
    "{",
    { intent = "compact", items = "items", first_soft = false, nest = 0 },
    "}",
]

[Enumerator.renderer.layout]
line = [
    { ref = "name" },
    { opt = { group = [" ", { join = " ", items = "attrs" }] } },
    { opt = { group = [
    " = ",
    { ref = "value" },
] } },
]

[SimpleType.renderer.layout]
ref = "base"

[TypedefName.renderer.layout]
ref = "name"
