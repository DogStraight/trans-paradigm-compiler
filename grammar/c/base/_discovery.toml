# ============================================================================
# 语句发现形态声明 — linter 切语句边界所需的**语言事实**
# ============================================================================
# 为什么声明而不是推导：语句发现要在没有 parser 的前提下切边界（坏输入也要能定位），
# 它需要知道"语法形状"。这类形状无法从 production 结构可靠推导——
# `[[nodiscard]] int f(void){...}` 与 `{...}` 在结构上同形（都是定界 token + 语句引用），
# 区分依据是**语义意图**，只能声明（ADR-0025）。
#
# 未声明本段 = 该语言没有这些形态（引擎按空集处理，**不猜**）。
#
# 字段：
#   containers        — 括号定界的语句容器规则名（body 递归发现；父检查器让位）
#   continuations     — 容器延续关键字（else 等：不单独成语句，body 由后续扫描发现）
#   prefix_pairs      — 前缀对 [开 token, 次 token]：整体跳过、不注册语句节点（如属性对）
#   clause_separators — 子句分隔符：`(sep, keyword.X)` 相邻时 X 不是块起始（如 `use a:config`）
# ============================================================================

[discovery]
containers = ["CompoundStmt"]
continuations = ["keyword.else"]
