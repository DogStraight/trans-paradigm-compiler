# _macro.toml — C 预处理声明面（宏形态 / 指令处理器）
#
# 形态与机制的分工见 `preprocessor/README.md`：**语言知识声明在这里**（前缀 token、
# 指令关键字候选、路径形态），**引擎只做文本操作**（替换 / 锚 / 还原）。
# 范围基线见 `docs/gaps/gap-c-preprocessor-scope.md`（阶段 4 首片 A）。
#
# ⚠ C 的指令引导符 `#` 是 [symbol.base].hash（base/_token.toml）；前缀写法与
#   verilog 的 `symbol.base.backtick` 同款——引擎不硬编码语言字符。
# ⚠ C 的宏**调用**是**裸标识符**（无前缀），由 call_shape 显式声明"无前缀"；
#   未声明该形态的语言包（verilog 等）语义不变。

# ── [macro_recognition] 形态声明 ──
[macro_recognition]
# 指令形态：前缀 token + 名字位（命中候选 → 产出对应 macro.* token）
shape = "symbol.base.hash,name"
directive = [
    "macro.define",
    "macro.undef",
    "macro.include",
]
# 调用形态 = **显式声明"无前缀"**（单元素生产式 `name`；引擎不提供默认空前缀）。
# 裸标识符是否真的展开由展开器的**宏表**决定（未 #define 的名字不进匹配），
# 且字符串/注释内的同名标识符由掩码排除（不参与匹配）。
call_shape = "name"
call = []

# 带参宏实参形态：C 的 `(` / `)` / `,`（声明名见 base/_token.toml 的 [bracket].pairs
# 与 [symbol.base].comma）——定义侧与调用侧同形。
call_args = "bracket.l_parentheses,args,bracket.r_parentheses"
arg_separator = "symbol.base.comma"

# 宏算子（C99 §6.10.3.2–§6.10.3.4）：字符串化 / 令牌粘贴 / 变参占位。
# 引擎按声明启用对应语义；**未声明的语言包不启用**（verilog 无这些算子，零影响）。
stringize_operator = "#"
paste_operator = "##"
variadic_name = "__VA_ARGS__"

# ── [macro_syntax] 宏定义的**形式语法**声明（linter 阶段，AST 前）──
#
# 消费点：`linter/macro_syntax.py`——宏定义行已被扫指令消费、不进 lint 流，故其语法
# 约束必须对**原始源码**检查。**语言包声明本段 ⇒ 启用**；未声明 ⇒ 不检查
# （引擎不把 C 的定义语法套到别的语言上；verilog 侧补齐是触发式项，见 ADR-0021）。
#
# 形参表形态（括号 / 分隔符）与宏体算子（`#` / `##` / 变参名）分别沿用
# `[macro_recognition]` 的 `call_args` 与算子声明——本段只补**定义侧**独有的形态。
[macro_syntax]
# 形参表里的变参占位写法（C99 §6.10.3p4 的 `...`：只能末位、只能一个）；
# 未声明 ⇒ 形参项只能是标识符（不允许变参项）。
variadic_marker = "..."

# ── [expand] 展开器参数 ──
[expand]
# rescan/自引用抑制由展开算法保证（hideset）；本值只是**资源上限守卫**
# （同一算法上的预算，不是第二套算法）。
max_iterations = 128

# ── [directive_handlers] 指令关键字 → 处理器（op）绑定 ──
[directive_handlers]
define = { op = "define", enabled = true }
undef = { op = "undef", enabled = true }
# include：**缺文件/循环/深度超限 = 诊断**（C 是真实预处理，缺头文件必须报错；
# 对比 verilog 不声明 ⇒ 默认 warn 保持既有打印，A/B 零变化）。
# `max_depth` = 嵌套深度上限（防止病态包含链，非标准语义常量）。
include = { op = "include", enabled = true, on_missing = "error", max_depth = 32 }
