arity = 2
assoc = "left"

# ── §6.5.3 一元前缀（高于所有二元；`*` 解引用 / `&` 取址复用二元符号） ──
# 注意：这些项的优先级只在"与二元同符号"时有意义——pratt 的
# `_parse_prefix_unary` 一律以 `unary_prefix_rbp = max_infix_prio + 1` 递归
# 操作数（见 parser/pratt_parser.py），故一元永远高于所有二元。
[[operator]]
symbol = "+"
arity = 1
position = "prefix"

[[operator]]
symbol = "-"
arity = 1
position = "prefix"

[[operator]]
symbol = "!"
arity = 1
position = "prefix"

[[operator]]
symbol = "~"
arity = 1
position = "prefix"

[[operator]]
symbol = "*"
arity = 1
position = "prefix"

[[operator]]
symbol = "&"
arity = 1
position = "prefix"

[[operator]]
symbol = "++"
arity = 1
position = "prefix"

[[operator]]
symbol = "--"
arity = 1
position = "prefix"

# ── §6.5.2 后缀 ++/--（最高） ──
# ⚠ 实际由 PostfixExpr 的产生式消费（原子最长匹配先吃 `x++` 整体），本表项
#   保证"独立出现时"pratt 中缀循环也能归约（形态与 c4 一致，不另设机制）。
[[operator]]
symbol = "++"
arity = 1
position = "postfix"

[[operator]]
symbol = "--"
arity = 1
position = "postfix"
