assoc = "left"

# ── §6.5.8 关系 ──
[[operator]]
symbol = "<"
arity = 2
assoc = "left"

[[operator]]
symbol = ">"
arity = 2
assoc = "left"

[[operator]]
symbol = "<="
arity = 2
assoc = "left"

