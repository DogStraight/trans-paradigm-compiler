# ============================================================================
# C 语法规则 — 翻译单元与声明/声明符（阶段 1）
# ============================================================================
# C99 §6.5.2 声明符（declarator）语法。**声明符递归是 C 语法最难点**，也是后续
# 一切（函数定义/类型/表达式）的地基——AST 形状由它决定，故阶段 1 先打这一层。
#
# 阶段 1 支持：
#   声明说明符（存储类 / 类型限定符 / 类型说明符，顺序自由）
#   简单声明符：标识符 / 多级指针 / 数组后缀 / 函数后缀 / 括号声明符
# 阶段 1 **不支持**（留阶段 2/3，见缺口档接受域清单）：
#   struct/union/enum 说明符、typedef 名作类型、初始化器 `= expr`、
#   数组长度表达式（本阶段只接受数字字面量）、函数体、函数指针的完整形态
#
# ⚠ 说明符的**组合合法性**（如 `long long int` 合法、`float int` 非法）不在语法层
#   判定——语法层宽进，留给语义层（与本包其余部分同哲学）。

# ── TranslationUnit — 根块（整个文件 = 外部声明序列） ──

[TranslationUnit]
is_block = true

[TranslationUnit.parser]
production = []

[TranslationUnit.parser.node]


# ── Declaration — 声明（语句发现靠 is_statement） ──

[Declaration]
is_statement = true

[Declaration.parser]
production = [
    "@StorageClass|@TypeQualifier|@TypeSpecifier|@FuncSpec",
    "@SpecRest*",
    "@DeclaratorList?",
    "symbol.base.semicolon",
]

[Declaration.parser.node]
specs = "$1"
rest = "$2"
declarators = "$3"


# ── 说明符三层规则（存储类 / 类型限定符 / 类型说明符） ──
# ⚠ **形态约束（实测得出，勿随意改）**：本仓的语句发现/FIRST 集推导按
#   `split_token_types` 口径解析**不带括号的 token 交替** `a|b|c`；写成带括号的组
#   `"(a|b|c)"` 时整串会被当成**一个** token 类型（`_first_token_of_spec` 的
#   退化分支），该规则的首 token 静默缺失 → 解析出空 AST。
#   故此处三处关键字交替一律用**裸交替**（同 yaml 的 `"@Scalar|@MergeKey"` 形态）。
#   分层（存储类 / 限定符 / 类型说明符）是**语法形态**而非语义判定——组合合法性
#   仍归语义层。

[StorageClass.parser]
production = [
    "keyword.typedef|keyword.extern|keyword.static|keyword.auto|keyword.register",
]

[StorageClass.parser.node]
base = "$1"


[TypeQualifier.parser]
production = [
    "keyword.const|keyword.volatile|keyword.restrict",
]

[TypeQualifier.parser.node]
base = "$1"


[TypeSpecifier.parser]
production = [
    "@SimpleType|@StructSpecifier|@AnonStructSpecifier|@EnumSpecifier|@AnonEnumSpecifier|@TypedefName",
]

[TypeSpecifier.parser.node]
spec = "$1"


# SpecRest — 说明符序列的其余部分（`unsigned long long` 等组合靠重复表达）
# ⚠ **刻意不含 `@TypedefName`**：它（标识符）若进了重复项，贪婪的 `@SpecRest*` 会把
#   声明符名当类型名吃掉（实测：`int x;` 解析成 specs=int + rest=[x] + 无声明符，
#   `declarators` 槽位为空）。typedef 名**只允许出现在首个说明符位置**——
#   代价是 `unsigned myint x;`（类型词之后再跟 typedef 名）暂不支持，属罕见写法，
#   记在缺口档阶段 2 未落地项里。
[SpecRest.parser]
production = [
    "@StorageClass|@TypeQualifier|@SimpleType|@StructSpecifier|@AnonStructSpecifier|@EnumSpecifier|@AnonEnumSpecifier|@FuncSpec",
]

[SpecRest.parser.node]
spec = "$1"


# FuncSpec — C99 §6.7.4 函数说明符（`inline`；`_Noreturn` 是 C11，走插件）
# 只挂在 Declaration / FuncDef 的说明符位上（成员/参数说明符位不放：`struct { inline int x; }`
# 是语法错误，不是语义约束）。"inline 只能出现在函数声明"是 §6.7.4p2 的**约束**，
# 归语义层——语法层与 `@TypedefName` 同口径宽进。
[FuncSpec.parser]
production = [
    "keyword.inline",
]

[FuncSpec.parser.node]
base = "$1"


# ── DeclaratorList / Declarator — 声明符（指针 + 直接声明符） ──

[DeclaratorList.parser]
production = [
    "@InitDeclarator",
    "(symbol.base.comma,@InitDeclarator)*",
]

# ⚠ **渲染前提：列表容器用合并 `items` 字段**（原 first/rest 形态只能按位引子节点，
#   逗号分隔符拿不到正确形态——`items` 是 renderer `intent = "compact"` 的消费面）。
#   `$2.items[*].sub_node[1]`：每个 `(comma,InitDeclarator)` 组的第二个子节点。
[DeclaratorList.parser.node]
items = ["$1", "$2.items[*].sub_node[1]"]


# ── 初始化器（阶段 2b）──
# C99 §6.7.8：`= assignment-expression` 或 `= { initializer-list }`（可递归嵌套）。
#
# ⚠ 环的性质与表达式环不同：`InitList → Initializer → InitList` 这条环**由 `{` 守卫**
#   （`InitList` 的首 token 是 `{`，不可空），故 FIRST 推导收敛、不会 RecursionError；
#   而 `Initializer → @Expression` 那条不回到 `Initializer` 自身。落地时不必像表达式
#   环那样加 pratt/inline 三件套，但**不要**把 `InitList` 改成可空形态（那才会引入
#   真正的 FIRST 环）。
#
# 本阶段**未做**（记在此防"看起来支持"）：指示符初始化 `.field = v` / `[i] = v`（C99
#   新增）、括号内的类型名（复合字面量 `(T){…}`）、`sizeof`、位域。

[InitDeclarator.parser]
production = [
    "@Declarator",
    "(symbol.base.equal,@Initializer)?",
]

[InitDeclarator.parser.node]
declarator = "$1"
# init — `=` 之后的初始化器本体。绑定直接落到组内的初始化器（而不是包住 `=`
#   的可选组）：包住 `=` 的形态渲染时会多印一个 `=`，而"并联一个新属性"会让同一
#   棵子树被 iter_nodes 走两遍（结构查询/计数类断言失真）。
init = "$2.sub_node[0].sub_node[1]"


[Initializer.parser]
production = [
    "@Expression|@InitList",
]
inline = true

[Initializer.parser.node]
value = "$1"


[InitList.parser]
production = [
    "bracket.l_curly_bracket",
    "(@InitElement,(symbol.base.comma,@InitElement)*)?",
    "symbol.base.comma?",
    "bracket.r_curly_bracket",
]

# ⚠ 合并 `items`（渲染前提，同 DeclaratorList）：`$2` 是可选组，其唯一子节点是
#   `seq(首元素, (comma,元素)*)`——取 `[0]` 得首元素、取 `[1].items[*].sub_node[1]`
#   得其余元素（每个 `(comma,元素)` 组的第二个子节点）。空 `{}` 时可选组无子节点，
#   两条路径都落空 → items 不挂载。
[InitList.parser.node]
items = [
    "$2.sub_node[0].sub_node[0]",
    "$2.sub_node[0].sub_node[1].items[*].sub_node[1]",
]


# InitElement — 初始化列表的一项：普通初始化器或**指示符初始化器**
# 候选顺序：指示符在前（它以 `.` / `[` 开头，与表达式/列表不冲突，更具体先试）。
[InitElement.parser]
production = [
    "@DesignatedInitializer|@Initializer",
]
inline = true

[InitElement.parser.node]
value = "$1"


# ── 指示符初始化（阶段 2b，C99 §6.7.8）──
# 形态：`desig-list = initializer`，desig-list = designator+（可链：`.a.b = v`、
# `[0].x = v`）。环安全：`DesignatedInitializer → Initializer → InitList →
# InitElement → DesignatedInitializer` 由 `.` / `[` / `{` 守卫（三者首 token 都不可空），
# 与 InitList 自身那条环同性质。
#
# ⚠ 语法层宽进：`.a` 里的名字是否是该结构体的成员、`[i]` 是否越界，都归语义层。
[DesignatedInitializer.parser]
production = [
    "@Designator+",
    "symbol.base.equal",
    "@Initializer",
]

# ⚠ `@Designator+` 出来的是引擎内部的 `plus` 容器节点（normalize 不展平它、
#   也没有对应布局）——直接 ref 它会静默渲染成空。故绑定直接落到它的 items 列表，
#   渲染按普通列表拼接（`.a.b` → `.a` + `.b`）。
[DesignatedInitializer.parser.node]
designators = ["$1.items[*]"]
init = "$3"


[Designator.parser]
production = [
    "@MemberDesignator|@IndexDesignator",
]
inline = true

[Designator.parser.node]
value = "$1"


# MemberDesignator — `.field`
[MemberDesignator.parser]
production = [
    "symbol.base.dot",
    "@Identifier",
]

[MemberDesignator.parser.node]
field = "$2"


# IndexDesignator — `[ 常量表达式 ]`
[IndexDesignator.parser]
production = [
    "bracket.l_square_bracket",
    "@Expression",
    "bracket.r_square_bracket",
]

[IndexDesignator.parser.node]
index = "$2"


[Declarator.parser]
production = [
    "@Pointer?",
    "@DirectDeclarator",
]

[Declarator.parser.node]
pointers = "$1"
direct = "$2"


# Pointer — 指针前缀 `*` 序列（自递归表达多级指针）
# 自递归写法：首元素 `*` 之后可选再跟一层 Pointer，覆盖 `*` / `**` / `***`。
[Pointer.parser]
production = [
    "symbol.base.multiple",
    "@Pointer?",
]

[Pointer.parser.node]
first = "$1"
more = "$2"


[DirectDeclarator.parser]
production = [
    "@Identifier|@ParenDeclarator",
    "(@ArraySuffix|@FuncSuffix)*",
]

[DirectDeclarator.parser.node]
head = "$1"
suffixes = "$2"


[ParenDeclarator.parser]
production = [
    "bracket.l_parentheses",
    "@Declarator",
    "bracket.r_parentheses",
]

[ParenDeclarator.parser.node]
inner = "$2"


# 数组后缀 `[ size? ]`
# ⚠ 长度改为**常量表达式**（原先只收数字字面量）：`int a[N]` / `int a[2 * 4]` 都是真实
#   语料里的常见写法。语法层宽进——"是不是整型常量表达式"归语义层判（`int a[f()]`
#   在语法上仍会通过）。环安全：`ArraySuffix` 不参与表达式环（没有回到自身的路径）。
[ArraySuffix.parser]
production = [
    "bracket.l_square_bracket",
    "@Expression?",
    "bracket.r_square_bracket",
]

[ArraySuffix.parser.node]
size = "$2"


# 函数后缀 `( 参数表? )`
[FuncSuffix.parser]
production = [
    "bracket.l_parentheses",
    "@ParamList?",
    "bracket.r_parentheses",
]

[FuncSuffix.parser.node]
params = "$2"


# ── 参数表 ──
# C99 §6.7.5.3：`parameter-type-list: parameter-list | parameter-list , ...`
# 变参尾段 `...` 走**重复组内的交替**（第二支 `symbol.extend.ellipsis`）——
# 这样它落在重复组的迭代项里，`items` 绑定（见下）自然把它收进列表并按源序渲染。
# ⚠ 两处实测坑（2026-09-26，此前"三种写法全部证伪"的**真根因**，都不是形态问题）：
#   ① **token 类型写错**：`ellipsis = "..."` 声明在 `[symbol.extend]` 下，完整类型是
#      `symbol.extend.ellipsis`；写成 `symbol.base.ellipsis` 时该元素永不匹配
#      （对照 `arrow = "->"` → `symbol.extend.arrow`，同表同规则）；
#   ② **lexer 最长匹配缺陷**（已修）：逐字符 probe 要求"每层前缀自身也是声明过的
#      符号"，而 `...` 要经过未声明的 `..` ⇒ `...` 被降级成三个 `.`。修好后
#      `..` 这类"仅为 probe 链"的占位声明（yaml/verilog 各有一个）可以删。
# ⚠ 用**尾随可选**（`(comma,ellipsis)?` 独立成第三个元素）也能解析，但 `items`
#   绑定拿不到它 ⇒ 渲染把 `...` 静默丢掉（实测 `int printf(const char *fmt);`）——
#   解析进 AST 不等于保真，别只看 AST。

[ParamList.parser]
production = [
    "@ParamDecl",
    "(symbol.base.comma,(@ParamDecl|symbol.extend.ellipsis))*",
]

[ParamList.parser.node]
items = ["$1", "$2.items[*].sub_node[1]"]


# ⚠ 参数类型必须是**说明符序列**，不能只收单个 `@TypeSpecifier`：`SimpleType` 是**一个
#   类型词**，而 `unsigned int` / `const char` / `long long` 都是多词。只收单个时的症状
#   很隐蔽——`int f(int a)` 正常、`int f(unsigned int n)` 整个函数定义解析失败
#   （实测：真实语料样本的 `ring_push` 即栽在这里，报 match_length 截断）。
#   与 `MemberSpec`（结构体成员）同形：限定符/类型说明符打头 + 说明符序列重复项。
[ParamDecl.parser]
production = [
    "@ParamSpec",
    "@Declarator?",
]

[ParamDecl.parser.node]
type_spec = "$1"
declarator = "$2"


[ParamSpec.parser]
production = [
    "@TypeQualifier|@TypeSpecifier",
    "@SpecRest*",
]

[ParamSpec.parser.node]
first = "$1"
rest = "$2"


# ============================================================================
# 渲染配置（世界 A 布局）— 翻译单元与声明/声明符
# ============================================================================
# 口径同 00_expressions.toml 头注（叶子 ref / 可选 opt+group / 列表 compact）。
# 说明符序列（`unsigned long long`）是**空格分隔**的列表：`intent = "compact"`
# 的 `sep` 传 `" "`（分隔文本 rstrip 后为空，间距由软换行给出）。

# TranslationUnit — 根块：顶层声明逐个成行（首项无前导换行 → join 而非 body）
[TranslationUnit.renderer.layout]
join = "\n"

[Declaration.renderer.layout]
line = [
    { ref = "specs" },
    { opt = { group = [
    " ",
    { intent = "compact", items = "rest", sep = " ", first_soft = false, nest = 0 },
] } },
    { opt = { group = [
    " ",
    { ref = "declarators" },
] } },
    ";",
]

[StorageClass.renderer.layout]
ref = "base"

[FuncSpec.renderer.layout]
ref = "base"

[TypeQualifier.renderer.layout]
ref = "base"

[TypeSpecifier.renderer.layout]
ref = "spec"

[SpecRest.renderer.layout]
ref = "spec"

[DeclaratorList.renderer.layout]
intent = "compact"
items = "items"
first_soft = false

[InitDeclarator.renderer.layout]
line = [
    { ref = "declarator" },
    { opt = { group = [
    " = ",
    { ref = "init" },
] } },
]

[Initializer.renderer.layout]
ref = "value"

[InitList.renderer.layout]
line = [
    "{",
    { intent = "compact", items = "items", first_soft = false, nest = 0 },
    "}",
]

[InitElement.renderer.layout]
ref = "value"

# designators 同样用 `join = ""`（理由同 DirectDeclarator.suffixes：可能含注释项）
[DesignatedInitializer.renderer.layout]
line = [{ join = "", items = "designators" }, " = ", { ref = "init" }]

[Designator.renderer.layout]
ref = "value"

[MemberDesignator.renderer.layout]
line = [".", { ref = "field" }]

[IndexDesignator.renderer.layout]
line = ["[", { ref = "index" }, "]"]

[Declarator.renderer.layout]
line = [{ opt = { ref = "pointers" } }, { ref = "direct" }]

[Pointer.renderer.layout]
line = [{ ref = "first" }, { opt = { ref = "more" } }]

# DirectDeclarator — 头 + 后缀链（`f(int a)` / `a[4]`）：后缀直接拼接，无分隔符。
# ⚠ 用 `join = ""`（items 列表）而不是 `{ ref = "suffixes" }`：后缀链里可能混进
#   **独占行注释**（引擎把 `f(\n// c\nint a)` 的注释挂进 suffixes 迭代项，
#   见 parser/_production.py `_claim_if_line_start`）——`join` 会把 `_comment` 项
#   拆成独立行段，`ref` 则直接顺序拼接 → 注释会把后续后缀吃掉整行
#   （实测 `int f// c(int a);`，输出已不是合法 C）。
[DirectDeclarator.renderer.layout]
line = [{ ref = "head" }, { opt = { join = "", items = "suffixes" } }]

[ParenDeclarator.renderer.layout]
line = ["(", { ref = "inner" }, ")"]

[ArraySuffix.renderer.layout]
line = ["[", { opt = { ref = "size" } }, "]"]

[FuncSuffix.renderer.layout]
line = ["(", { opt = { ref = "params" } }, ")"]

[ParamList.renderer.layout]
intent = "compact"
items = "items"
first_soft = false

[ParamDecl.renderer.layout]
line = [
    { ref = "type_spec" },
    { opt = { group = [
    " ",
    { ref = "declarator" },
] } },
]

[ParamSpec.renderer.layout]
line = [
    { ref = "first" },
    { opt = { group = [
    " ",
    { intent = "compact", items = "rest", sep = " ", first_soft = false, nest = 0 },
] } },
]
