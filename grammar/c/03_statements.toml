# ============================================================================
# C 语法规则 — 语句（阶段 3 分层；本文件当前 = Layer A：最小语句集）
# ============================================================================
# C99 §6.8 语句。Layer A 只落"能让函数体立起来"的最小集：
#   CompoundStmt（复合语句，同时用作函数体）/ ExprStmt / EmptyStmt / ReturnStmt
#   + Stmt 选择器 + FuncDef（函数定义）
# Layer C（本层已补）：if / else / while / do-while / for / switch + case/default /
#   break / continue / goto / 标号。
#
# ⚠ 本层**未做**（记在此防"看起来支持"）：
#   · `case 1 ... 5:`（GNU 范围扩展，非 C99）；
#   · switch 体内的声明（C99 允许，但需初始化器面）。
#
# ⚠ 语句规则一律标 `is_statement = true`：引擎的语句发现按"首 token 能否起始某条
#   语句规则"挑候选；未标记的规则不会成为语句入口（linter 会整行静默跳过）。
# ⚠ 容器语句（body 是语句序列）不要给 `_derived_end_case` 可推导的结尾字面 token，
#   否则语句边界会被截断在内部语句处——故 `CompoundStmt` 的 `@Stmt*` 之后再无字面
#   token（`}` 是括号、由括号配对处理）。

# ── CompoundStmt — { Stmt* }（函数体与块语句共用） ──

[CompoundStmt]
is_statement = true

[CompoundStmt.parser]
production = [
    "bracket.l_curly_bracket",
    "@Stmt*",
    "bracket.r_curly_bracket",
]

[CompoundStmt.parser.node]
body = "$2"


# ── Stmt — 语句选择器（Layer A 候选集 + Layer C 控制流） ──
# ⚠ **必须含 `@Declaration`**：C 里"块内声明"也是语句（`{ int n; … }`）。漏掉它的症状
#   很隐蔽——顶层声明照样解析（翻译单元走全局语句发现），但**函数体内的局部声明会让
#   整个函数定义解析失败**（实测：`int f(void) { int n; return n; }` → 空 AST，而
#   `int f(void) { return 0; }` 正常）。verilog 的 `Stmt` 同样含 `DeclStmt`，同一道理。
# ⚠ **`@Declaration` 必须排在 `@ExprStmt` 之后**（候选按序尝试）：C 的 typedef 名与
#   变量名同处一个命名空间，`b;` 既可读作表达式语句，也可读作"以 typedef 名 `b` 为
#   类型、无声明符的声明"（声明符表可选）。放前面会让所有"标识符开头"的语句都变成
#   声明（实测把 `if (a) b;` 的 then 分支从 ExprStmt 变成 Declaration）。
#   顺序消歧与"语法层宽进、语义层收"一致：真伪 typedef 由语义层按符号表判。

[Stmt.parser]
production = [
    "@CompoundStmt|@ExprStmt|@EmptyStmt|@ReturnStmt|@IfStmt|@WhileStmt|@DoWhileStmt|@ForStmt|@SwitchStmt|@BreakStmt|@ContinueStmt|@GotoStmt|@LabelStmt|@CaseLabel|@DefaultLabel|@Declaration",
]
inline = true

[Stmt.parser.node]
value = "$1"


# ── ExprStmt — Expression ; ──

[ExprStmt]
is_statement = true

[ExprStmt.parser]
production = [
    "@Expression",
    "symbol.base.semicolon",
]

[ExprStmt.parser.node]
expr = "$1"


# ── EmptyStmt — ; ──

[EmptyStmt]
is_statement = true

[EmptyStmt.parser]
production = ["symbol.base.semicolon"]

[EmptyStmt.parser.node]


# ── ReturnStmt — return Expression? ; ──

[ReturnStmt]
is_statement = true

[ReturnStmt.parser]
production = [
    "keyword.return",
    "@Expression?",
    "symbol.base.semicolon",
]

[ReturnStmt.parser.node]
value = "$2"


# ── FuncDef — 类型 声明符 复合语句（与 Declaration 的区分靠结尾 `{` vs `;`） ──

[FuncDef]
is_statement = true

[FuncDef.parser]
production = [
    "@StorageClass|@TypeQualifier|@TypeSpecifier",
    "@SpecRest*",
    "@Declarator",
    "@CompoundStmt",
]

[FuncDef.parser.node]
specs = "$1"
rest = "$2"
declarator = "$3"
body = "$4"


# ── 控制流（Layer C）──
# 容器语句（body 是语句）：`_derived_end_case` 对容器返回空集，语句边界走通用跳过——
# 故这类规则的 production **不要以可分号终结的字面 token 收尾**（`IfStmt` 以 @Stmt
# 收尾、`WhileStmt` 同），否则语句边界会被截断在内部。

# IfStmt — if ( Expression ) Stmt [else Stmt]
[IfStmt]
is_statement = true

[IfStmt.parser]
production = [
    "keyword.if",
    "bracket.l_parentheses",
    "@Expression",
    "bracket.r_parentheses",
    "@Stmt",
    "(keyword.else,@Stmt)?",
]

[IfStmt.parser.node]
cond = "$3"
then = "$5"
else_branch = "$6"


# WhileStmt — while ( Expression ) Stmt
[WhileStmt]
is_statement = true

[WhileStmt.parser]
production = [
    "keyword.while",
    "bracket.l_parentheses",
    "@Expression",
    "bracket.r_parentheses",
    "@Stmt",
]

[WhileStmt.parser.node]
cond = "$3"
body = "$5"


# DoWhileStmt — do Stmt while ( Expression ) ;
[DoWhileStmt]
is_statement = true

[DoWhileStmt.parser]
production = [
    "keyword.do",
    "@Stmt",
    "keyword.while",
    "bracket.l_parentheses",
    "@Expression",
    "bracket.r_parentheses",
    "symbol.base.semicolon",
]

[DoWhileStmt.parser.node]
body = "$2"
cond = "$5"


# ForStmt — for ( init? ; cond? ; step? ) Stmt
# （声明式初值 `for (int i = 0; …)` 需初始化器 → 阶段 2b，见头注）
[ForStmt]
is_statement = true

# ⚠ 初值位既可用**表达式**也可用**声明**（C99 §6.8.5.3 的 `for (int i = 0; …)`）——
#   声明式初值靠阶段 2b 的初始化器才可行。`@ForInitDecl` 是"说明符 + 初始化声明符"
#   （不含结尾 `;`，因为 `;` 是 for 头自己的分隔符）。
[ForInitDecl.parser]
production = [
    "@TypeQualifier|@TypeSpecifier",
    "@SpecRest*",
    "@InitDeclarator",
]

[ForInitDecl.parser.node]
specs = "$1"
rest = "$2"
declarator = "$3"


[ForStmt.parser]
production = [
    "keyword.for",
    "bracket.l_parentheses",
    "(@Expression|@ForInitDecl)?",
    "symbol.base.semicolon",
    "@Expression?",
    "symbol.base.semicolon",
    "@Expression?",
    "bracket.r_parentheses",
    "@Stmt",
]

[ForStmt.parser.node]
init = "$3"
cond = "$5"
step = "$7"
body = "$9"


# SwitchStmt — switch ( Expression ) Stmt（体内为 CompoundStmt，含 case/default 标号）
[SwitchStmt]
is_statement = true

[SwitchStmt.parser]
production = [
    "keyword.switch",
    "bracket.l_parentheses",
    "@Expression",
    "bracket.r_parentheses",
    "@Stmt",
]

[SwitchStmt.parser.node]
cond = "$3"
body = "$5"


# CaseLabel / DefaultLabel —— 复合语句体内的标号（也算语句，否则体内解析看不到）
[CaseLabel]
is_statement = true

[CaseLabel.parser]
production = [
    "keyword.case",
    "@Expression",
    "symbol.base.colon",
]

[CaseLabel.parser.node]
value = "$2"


[DefaultLabel]
is_statement = true

[DefaultLabel.parser]
production = ["keyword.default", "symbol.base.colon"]

[DefaultLabel.parser.node]


# BreakStmt / ContinueStmt
[BreakStmt]
is_statement = true

[BreakStmt.parser]
production = ["keyword.break", "symbol.base.semicolon"]

[BreakStmt.parser.node]


[ContinueStmt]
is_statement = true

[ContinueStmt.parser]
production = ["keyword.continue", "symbol.base.semicolon"]

[ContinueStmt.parser.node]


# GotoStmt — goto Identifier ;
[GotoStmt]
is_statement = true

[GotoStmt.parser]
production = ["keyword.goto", "@Identifier", "symbol.base.semicolon"]

[GotoStmt.parser.node]
label = "$2"


# LabelStmt — Identifier : Stmt
[LabelStmt]
is_statement = true

[LabelStmt.parser]
production = ["@Identifier", "symbol.base.colon", "@Stmt"]

[LabelStmt.parser.node]
name = "$1"
stmt = "$3"
