# ============================================================================
# C 语法规则 — 表达式（阶段 3 分层落地；本文件当前 = Layer A：原子）
# ============================================================================
# ⚠ **形态约束（照 c4 验证过的实现，勿改）**：表达式环必须有这三项保护，缺任一项
#   都会在 `setup_grammar` 阶段直接 `RecursionError`（FIRST/nullable 推导遇环溢出）：
#     ① 原子规则标 `is_atom = true`（pratt 的 atom_parser 遍历它们）；
#     ② `Expression` / `UnaryExpr` 标 `pratt = true`（真正的前缀/中缀解析交给
#        `base/_operator.toml` 的 operator_defs）；
#     ③ 原子选择器 `PrimaryExpr` 标 `inline = true`，且 production 是**单条交替**。
#   `ParenthesizedExpr` 内含 `@Expression` 会与 `Expression` 成环——这不是问题：
#   上述三项齐备时环被 pratt 层截断。（阶段 3 的一次委派尝试即因缺这些标记，
#   在 setup_grammar 报 RecursionError；产物存 `_drafts/stage3_wip/` 备查。）
#
# Layer 划分（每层落地即跑 `tests/languages/c`）：
#   Layer A（本层）：原子（数字 / 字符串 / 标识符 / 括号）+ 选择器 + 表达式入口
#   Layer B：运算符表（一元前缀 / 后缀 / 二元优先级链 / 赋值 / 条件 / 逗号）
#   Layer C：控制流语句（if / while / do / for / switch / goto / 标号）

# ── 原子规则 ──

# Number — 数字字面量（十/八/十六进制；lexer 按 literal.number 产出）
[Number.parser]
is_atom = true
production = ["literal.number"]

[Number.parser.node]
value = "$1"


# StringLiteral — 字符串 "..." 与字符常量 '...'（lexer 均产出 literal.string）
[StringLiteral.parser]
is_atom = true
production = ["literal.string"]

[StringLiteral.parser.node]
value = "$1"


# Identifier — 标识符（**语言包必须自带**：引擎不内置；漏定义会让引用它的规则
# 静默匹配为空——本包阶段 1 为此踩过坑，详见缺口档「包作者须知」）
[Identifier.parser]
is_atom = true
production = ["id"]

[Identifier.parser.node]
content = "$1.value"

[Identifier.analyzer]
identifier_ref = true

[Identifier.renderer.layout]
ref = "content"


# ParenthesizedExpr — ( Expression )（与 Expression 成环，靠 pratt + inline 截断）
# ⚠ 括号内是**整个表达式**（C99 primary-expression: `( expression )`）→ 用 `@FullExpr`
#   让 `(a, b)` 成立（标准里 `(a, b)` 就是逗号表达式最常见的写法）。
[ParenthesizedExpr.parser]
is_atom = true
production = ["bracket.l_parentheses", "@FullExpr", "bracket.r_parentheses"]

[ParenthesizedExpr.parser.node]
expr = "$2"


# UnaryExpr — 一元前缀（`+ - ! ~ * & ++ --`）
# 环保护第 ② 项：`pratt = true` 让前缀由 operator_defs 的 position=prefix 接管；
# 本规则自身的 production 主要供 **first set**（语句/表达式起点识别）——
# 否则 `-x;` / `*p;` / `!b;` 这类语句没有候选起点，linter 会整行静默跳过。
[UnaryExpr.parser]
production = [
    "(symbol.extend.add_one|symbol.extend.sub_one|symbol.base.add|symbol.base.sub|symbol.base.not|symbol.base.bit_not|symbol.base.multiple|symbol.base.and)",
    "@PrimaryExpr",
]
pratt = true

[UnaryExpr.parser.node]
op = "$1"
value = "$2"


# ── 表达式结构 ──

# PrimaryExpr — 原子选择器（inline + 单条交替 = 环保护第 ③ 项）
# ⚠ 本规则是**语句/表达式起点**的种子（首 token 推导读它）：含 `@UnaryExpr`
#   让前缀一元语句有候选起点；含 `@PostfixExpr` 有第二个作用——**派生 FOLLOW**。
#   FOLLOW 由"谁引用本规则"推出来：`PostfixExpr` 若不在这里被引用，它的 FOLLOW
#   只剩 pratt 注入的运算符族，于是 `switch (p->key)` / `if (p->key)` / `(p->key)`
#   这类**后随 `)`** 的形态会被 FOLLOW 硬检查拦掉（实测：`ring_buffer.c` 的
#   `ring_scan` 整函数解析失败）。
# ⚠ 本规则的原子清单与 `PostfixExpr` 的 head 清单**同一份**（两处都写）：
#   这是"无环"与"不扰动 linter"两个约束下的取舍——把原子清单抽成独立规则
#   （曾试 `AtomExpr`）会多一层 inline 间接，而 linter 的 token 匹配器**不回溯**
#   （见 `docs/gaps/gap-parser-linter-approximation.md` 机制 A），多一层就多在
#   `sizeof` 初值处误报一条（实测 7 → 8）。加原子形态时两处都要改。
[PrimaryExpr.parser]
production = [
    "@Number|@StringLiteral|@Identifier|@ParenthesizedExpr|@UnaryExpr|@SizeofTypeExpr|@SizeofExpr|@PostfixExpr",
]
inline = true

[PrimaryExpr.parser.node]
value = "$1"


# Expression — 表达式入口（pratt 接管运算符；Layer B 接 operator_defs）
# ⚠ 本规则对应标准里的 **assignment-expression** 层级（pratt 表最低项是 `=`）：逗号
#   不在表里，故 `Expression` 不含逗号——分隔符敏感的位点（实参 / 初始化器 /
#   数组长度 / 枚举值 / 位宽 / case 值）引它，与 C99 的对应层级一致。
[Expression.parser]
production = ["@PrimaryExpr"]
pratt = true

[Expression.parser.node]
value = "$1"


# CommaExpr — 逗号表达式（C99 §6.5.17）
#   expression: assignment-expression | expression , assignment-expression
# ⚠ **刻意不进运算符表**（`base/_operator.toml` §6.5.17 节记了完整理由）：pratt 的
#   中缀项在**任何** pratt 规则里都按整张表解析，逗号一入表，`f(a, b)` 的实参分隔、
#   `int a = 1, b` 的声明符分隔、`enum {A, B}` 的枚举项分隔都会被当成运算符吞掉
#   （实测：枚举体 3 项塌成 1 项）。故走**语法形态**：显式 `,` 分隔 + 逐项 pratt
#   子表达式。
# ⚠ **只在标准允许 `expression` 的位点使用**（其余位点引 `@Expression`）：
#   整表达式位点 = 表达式语句 / `return` 值 / `if`·`while`·`do`·`switch` 条件 /
#   `for` 三段 / `( expression )` / `[ expression ]`；
#   assignment-expression 位点 = 实参表 / 初始化器 / 数组长度 / 枚举值与位宽 /
#   `case` 值（后者是 constant-expression）——这些位置的标准层级本来就不含逗号。
#   位点一律引 `@FullExpr`（见下），不直接引 `@CommaExpr`。
[CommaExpr.parser]
production = ["@Expression", "(symbol.base.comma,@Expression)+"]

[CommaExpr.parser.node]
items = ["$1", "$2.items[*].sub_node[1]"]


# FullExpr — 标准 `expression` 层的选择器（有逗号才成 CommaExpr）
#   expression: assignment-expression | expression , assignment-expression
# ⚠ 为什么用选择器而不是让逗号层自己可选（`(...)*`）：那样**没有逗号**的普通表达式
#   也会被包一层 `CommaExpr(items=[…])`，全局 AST 形状变脸（每个表达式语句/条件/括号
#   都多一层）。选择器让"无逗号"路径仍返回 `Expression` 本体，有逗号才出现 `CommaExpr`
#   ——与 `PostfixExpr` 用 `+`（而非 `*`）避开裸原子是同一取舍。
# ⚠ inline（单条交替 + 单映射）：`parse_choice` 按序试，`@CommaExpr` 在前（更具体），
#   失配后落回 `@Expression`，故常见路径不受影响。
[FullExpr.parser]
inline = true
production = ["@CommaExpr|@Expression"]

[FullExpr.parser.node]
value = "$1"


# ── 后缀链（Layer B2）──
# 标准（ISO C99 §6.5.2）是**左递归**：
#   postfix-expression: primary-expression
#                     | postfix-expression [ expression ]
#                     | postfix-expression ( argument-expression-list? )
#                     | postfix-expression . identifier
#                     | postfix-expression -> identifier
#                     | postfix-expression ++ | postfix-expression --
# 本仓是递归下降 + 原子最长匹配（`parser_core._atom_parser_impl` 遍历 is_atom 规则
# 取消费最多者），左递归会无限递归，故按**同族形态**表达成"原子 + 后缀*"——
# 与 clang 手写路径同形（先解析 leading part，再循环吃后缀，见
# `ParsePostfixExpressionSuffix`）；本包声明符链（DirectDeclarator + ArraySuffix/
# FuncSuffix）已是这个形态，此处照搬。
#
# ⚠ `PostfixExpr` 标 `is_atom = true`：它经后缀含 `@Expression`，与 `Expression`
#   成环——环只在原子规则里被截断（同 ParenthesizedExpr 一族）。
# ⚠ 后缀用 `+`（**至少一个**）而不是 `*`：裸原子不该落进本规则。原因在引擎的
#   原子选择：`atomic_rules` 按 production 数**降序**排，等长匹配取先试者
#   （`consumed > best` 严格比较）——本规则 2 条 production 会排在 `Identifier`
#   （1 条）**之前**，于是裸 `x` 会被包成 `PostfixExpr(base=Identifier, [])`，
#   全局 AST 形状变脸。要求 ≥1 后缀后，裸原子由原子规则自己胜出；有链时才由
#   本规则以更长消费量胜出 ✓。
#
# 后缀 `++`/`--`（§6.5.2 后两项）**不走本链**：它们是 pratt 的后缀运算符
# （`[[operator]] position = "postfix"`），由 `UnaryOp` + `when` 分发承载，
# 与链自然复合（`a[i]++` → UnaryOp(postfix, PostfixExpr(a,[i]))）。
#
# 已知边界（本层不做，记在此防"看起来支持"）：强制转换 `(T)x` 与复合字面量
#   `(T){…}`（需类型名知识，见 sizeof 段说明）。

# PostfixExpr — 原子 + 后缀+（`a.b.c` / `f(x)[i]` / `p->a[i]` / `(*fp)(x)`）
# ⚠ head 用**显式原子清单**（不复用 `@PrimaryExpr`）：`PrimaryExpr` 含 pratt 入口
#   `@UnaryExpr`，head 若走它则 `PostfixExpr → PrimaryExpr → UnaryExpr →（pratt
#   原子路径）→ PostfixExpr` 无限递归（实测每步撞 `maximum recursion depth
#   exceeded` 告警：解析仍成功但慢且脆）。清单与 `PrimaryExpr` 同步维护。
[PostfixExpr.parser]
is_atom = true
production = [
    "(@Number|@StringLiteral|@Identifier|@ParenthesizedExpr|@SizeofTypeExpr|@SizeofExpr)",
    "(@IndexSuffix|@CallSuffix|@MemberSuffix)+",
]

[PostfixExpr.parser.node]
base = "$1"
# suffixes — 后缀组是 `+` 量词 → **plus 包装节点**（normalizer 只消 optional/
# repeat/seq，不消 plus：`transform/normalizer.py::ELIMINATE_TYPES`）。故走路径
# `$2.items[*]` 取出**节点列表**给渲染端 join（同旧 IndexExpr 的 indexes 口径）；
# 直接绑 `"$2"` 会拿到 plus 节点本身，而它没有布局 → 静默渲染成空
# （实测 `r->head = 0;` 渲成 `r = 0;`，token 序列判据当场抓到）。
suffixes = ["$2.items[*]"]


# IndexSuffix — [ Expression ]
# IndexSuffix — [ Expression ]（C99 `postfix-expression [ expression ]`：下标是**整个
# 表达式** → `@FullExpr`，`a[i, j]` 合法）
[IndexSuffix.parser]
production = [
    "bracket.l_square_bracket",
    "@FullExpr",
    "bracket.r_square_bracket",
]

[IndexSuffix.parser.node]
index = "$2"


# CallSuffix — ( ArgumentList? )（实参表可空：`f()`）
[CallSuffix.parser]
production = [
    "bracket.l_parentheses",
    "@ArgumentList?",
    "bracket.r_parentheses",
]

[CallSuffix.parser.node]
args = "$2"


# MemberSuffix — `.` identifier / `->` identifier
[MemberSuffix.parser]
production = [
    "(symbol.base.dot|symbol.extend.arrow)",
    "@Identifier",
]

[MemberSuffix.parser.node]
access = "$1"
member = "$2"


# ArgumentList — 逗号分隔实参（**表达式列表**；这里的逗号是分隔符不是运算符）
[ArgumentList.parser]
production = ["@Expression", "(symbol.base.comma,@Expression)*"]

[ArgumentList.parser.node]
items = ["$1", "$2.items[*].sub_node[1]"]


# ── sizeof（阶段 2b）──
# C99 §6.5.3.4：`sizeof unary-expression` 与 `sizeof ( type-name )` 两种形态。
# ⚠ 两个规则都标 `is_atom = true`：它们内部含 `@Expression`（经 `@PrimaryExpr`），
#   与 `Expression` 成环——环只在原子规则里被 pratt 截断（同 ParenthesizedExpr）。
#   两条规则的首 token 都是 `keyword.sizeof`，靠**候选顺序**消歧：先试"括号类型名"
#   （更具体），失败再退到"一元表达式"。
#
# ⚠ **未做：强制转换 `(T)x`**（C99 §6.5.4）。它与 `(expr)` 的区分需要**类型名知识**
#   （C 的经典歧义，标准靠"T 是否为 typedef 名"判定），属语义层信息，不能靠语法层
#   猜。留待与 typedef 名判定同批处理（`hier`/语义层就位后）。

# SizeofTypeExpr — sizeof ( type-name )   例：sizeof(int) / sizeof(struct s) / sizeof(char *)
[SizeofTypeExpr.parser]
is_atom = true
production = [
    "keyword.sizeof",
    "bracket.l_parentheses",
    "@TypeName",
    "bracket.r_parentheses",
]

[SizeofTypeExpr.parser.node]
type_name = "$3"


# SizeofExpr — sizeof unary-expression   例：sizeof x / sizeof a[0]
[SizeofExpr.parser]
is_atom = true
# ⚠ 操作数用 `@UnaryExpr`（pratt 入口）而不是 `@PrimaryExpr`：后者在 `sizeof a[0]` /
#   `sizeof f(y)` 上只匹配到标识符就停（后缀没跟上），整个语句随后失配。
#   `@UnaryExpr` 走 pratt 层的"最长匹配"（遍历 is_atom 规则取消费最多者），后缀链才对得上。
production = [
    "keyword.sizeof",
    "@UnaryExpr",
]

[SizeofExpr.parser.node]
operand = "$2"


# TypeName — 类型名（说明符序列 + 指针星号），仅供 sizeof/转换等"类型作操数"的位置用
[TypeName.parser]
production = [
    "@TypeQualifier|@TypeSpecifier",
    "@SpecRest*",
    "(symbol.base.multiple)*",
]

[TypeName.parser.node]
first = "$1"
rest = "$2"
pointers = "$3"


# ============================================================================
# 渲染配置（世界 A 布局）— 表达式
# ============================================================================
# 口径（同 verilog/c4，见 renderer/renderer_architecture.md）：
#   · 叶子/关键字：`{ ref = "字段" }`（字段绑到 token，normalize 后是字符串）；
#   · 可选段：`{ opt = { group = [...] } }`——group 内任一 ref 求值为 None 时
#     整组消失（renderer/primitives/group.py），故标点不会被留下；
#   · 列表：规则带合并 `items` 字段 + `intent = "compact"`；
#   · 分隔符是 `join` 文本 rstrip 后 + 软换行，故 `sep = " "` 的空格来自软换行。

[Number.renderer.layout]
ref = "value"

[StringLiteral.renderer.layout]
ref = "value"

[ParenthesizedExpr.renderer.layout]
line = ["(", { ref = "expr" }, ")"]

# UnaryExpr 与 Expression 是 pratt 入口规则：规则节点被 pratt 产物
# （UnaryOp/BinaryOp/TernaryOp）取代，通常不在 AST 里出现。布局按"若出现即正确"
# 给出（与 PrimaryExpr 同形的分发布局），不是空壳。
[UnaryExpr.renderer.layout]
line = [{ ref = "op" }, { ref = "value" }]

[PrimaryExpr.renderer.layout]
ref = "value"

[Expression.renderer.layout]
ref = "value"

# CommaExpr — 逐项逗号分隔（`a, b` / `i = 0, j = n`）
[CommaExpr.renderer.layout]
line = [
    { intent = "compact", items = "items", sep = ", ", first_soft = false, nest = 0 },
]

[FullExpr.renderer.layout]
ref = "value"

# PostfixExpr — 原子 + 后缀链（`a.b.c` / `f(x)[i]` / `p->a[i]`）。
# ⚠ 后缀链用 `join = ""`（items）：用 `{ ref = "suffixes" }` 会把整链当一段文本，
#   但**注释落在后缀里**时 `ref` 无换行能力（实测把整行代码吃进注释）。
#   同 DirectDeclarator 的 suffix 链形态。
[PostfixExpr.renderer.layout]
line = [{ ref = "base" }, { opt = { join = "", items = "suffixes" } }]

[IndexSuffix.renderer.layout]
line = ["[", { ref = "index" }, "]"]

[CallSuffix.renderer.layout]
line = ["(", { opt = { ref = "args" } }, ")"]

[MemberSuffix.renderer.layout]
line = [{ ref = "access" }, { ref = "member" }]

# ArgumentList — 实参表：紧凑列表，flat 无前导空格（`f(a, b)` 而非 `f( a, b)`）
[ArgumentList.renderer.layout]
intent = "compact"
items = "items"
first_soft = false
nest = 0

[SizeofTypeExpr.renderer.layout]
line = ["sizeof(", { ref = "type_name" }, ")"]

[SizeofExpr.renderer.layout]
line = ["sizeof ", { ref = "operand" }]

[TypeName.renderer.layout]
line = [
    { ref = "first" },
    { opt = { group = [
    " ",
    { intent = "compact", items = "rest", sep = " ", first_soft = false, nest = 0 },
] } },
    { ref = "pointers" },
]

# ── pratt 产物节点的布局（引擎构造，语言包声明文本形态）──
# ⚠ UnaryOp 的 prefix/postfix **共用同一节点名**（`position` 字段区分），故按属性
#   分发布局（`when` 原语）：前缀 `-x` / 后缀 `i++` 各取一支。
#   此前布局原语无"按属性值换序"能力、只能二选一，postfix 被渲成 `++i`
#   （token 齐全但顺序反了——C 里 `i++` 与 `++i` 语义不同）。
[UnaryOp.renderer.layout]
when = { attr = "position", eq = "postfix" }
then = { line = [{ ref = "operand" }, { ref = "op" }] }
else = { line = [{ ref = "op" }, { ref = "operand" }] }

[BinaryOp.renderer.layout]
line = [{ ref = "left" }, " ", { ref = "op" }, " ", { ref = "right" }]

[TernaryOp.renderer.layout]
line = [
    { ref = "cond" },
    " ? ",
    { ref = "true_val" },
    " : ",
    { ref = "false_val" },
]

# ── 括号 token 节点的布局 ──
# ⚠ **必需**：normalize 的 token 叶子提取只覆盖 `keyword.`/`symbol.`/`literal.`
#   前缀（transform/normalizer.py EXTRACT_PREFIXES）——`bracket.*` 节点不在其中，
#   会**原样留在 AST 里**。凡布局把"整组"（而非抽出的子节点）渲染出来时
#   （如 IndexExpr.index_groups），括号节点就会走到这里；不声明布局 = 括号静默
#   消失（`a[i]` 渲染成 `ai`）。形态同 verilog（05_expressions/00_base.toml 末）。
["bracket.l_parentheses".renderer.layout]
ref = "value"

["bracket.r_parentheses".renderer.layout]
ref = "value"

["bracket.l_square_bracket".renderer.layout]
ref = "value"

["bracket.r_square_bracket".renderer.layout]
ref = "value"

["bracket.l_curly_bracket".renderer.layout]
ref = "value"

["bracket.r_curly_bracket".renderer.layout]
ref = "value"
