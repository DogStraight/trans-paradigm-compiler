# ============================================================================
# C 语法规则 — 表达式（阶段 3 分层落地；本文件当前 = Layer A：原子）
# ============================================================================
# ⚠ **形态约束（照 c4 验证过的实现，勿改）**：表达式环必须有这三项保护，缺任一项
#   都会在 `setup_grammar` 阶段直接 `RecursionError`（FIRST/nullable 推导遇环溢出）：
#     ① 原子规则标 `is_atom = true`（pratt 的 atom_parser 遍历它们）；
#     ② `Expression` / `UnaryExpr` 标 `pratt = true`（真正的前缀/中缀解析交给
#        `base/_operator.toml` 的 operator_defs）；
#     ③ 原子选择器 `PrimaryExpr` 标 `inline = true`，且 production 是**单条交替**。
#   `ParenthesizedExpr` 内含 `@Expression` 会与 `Expression` 成环——这不是问题：
#   上述三项齐备时环被 pratt 层截断。（阶段 3 的一次委派尝试即因缺这些标记，
#   在 setup_grammar 报 RecursionError；产物存 `_drafts/stage3_wip/` 备查。）
#
# Layer 划分（每层落地即跑 `tests/languages/c`）：
#   Layer A（本层）：原子（数字 / 字符串 / 标识符 / 括号）+ 选择器 + 表达式入口
#   Layer B：运算符表（一元前缀 / 后缀 / 二元优先级链 / 赋值 / 条件 / 逗号）
#   Layer C：控制流语句（if / while / do / for / switch / goto / 标号）

# ── 原子规则 ──

# Number — 数字字面量（十/八/十六进制；lexer 按 literal.number 产出）
[Number.parser]
is_atom = true
production = ["literal.number"]

[Number.parser.node]
value = "$1"


# StringLiteral — 字符串 "..." 与字符常量 '...'（lexer 均产出 literal.string）
[StringLiteral.parser]
is_atom = true
production = ["literal.string"]

[StringLiteral.parser.node]
value = "$1"


# Identifier — 标识符（**语言包必须自带**：引擎不内置；漏定义会让引用它的规则
# 静默匹配为空——本包阶段 1 为此踩过坑，详见缺口档「包作者须知」）
[Identifier.parser]
is_atom = true
production = ["id"]

[Identifier.parser.node]
content = "$1.value"

[Identifier.analyzer]
identifier_ref = true

[Identifier.renderer.layout]
ref = "content"


# ParenthesizedExpr — ( Expression )（与 Expression 成环，靠 pratt + inline 截断）
[ParenthesizedExpr.parser]
is_atom = true
production = ["bracket.l_parentheses", "@Expression", "bracket.r_parentheses"]

[ParenthesizedExpr.parser.node]
expr = "$2"


# UnaryExpr — 一元前缀（`+ - ! ~ * & ++ --`）
# 环保护第 ② 项：`pratt = true` 让前缀由 operator_defs 的 position=prefix 接管；
# 本规则自身的 production 主要供 **first set**（语句/表达式起点识别）——
# 否则 `-x;` / `*p;` / `!b;` 这类语句没有候选起点，linter 会整行静默跳过。
[UnaryExpr.parser]
production = [
    "(symbol.extend.add_one|symbol.extend.sub_one|symbol.base.add|symbol.base.sub|symbol.base.not|symbol.base.bit_not|symbol.base.multiple|symbol.base.and)",
    "@PrimaryExpr",
]
pratt = true

[UnaryExpr.parser.node]
op = "$1"
value = "$2"


# ── 表达式结构 ──

# PrimaryExpr — 原子选择器（inline + 单条交替 = 环保护第 ③ 项）
[PrimaryExpr.parser]
production = [
    "@Number|@StringLiteral|@Identifier|@ParenthesizedExpr|@UnaryExpr|@CallExpr|@IndexExpr|@MemberExpr|@SizeofTypeExpr|@SizeofExpr",
]
inline = true

[PrimaryExpr.parser.node]
value = "$1"


# Expression — 表达式入口（pratt 接管运算符；Layer B 接 operator_defs）
[Expression.parser]
production = ["@PrimaryExpr"]
pratt = true

[Expression.parser.node]
value = "$1"


# ── 后缀链（Layer B2）──
# ⚠ 三个后缀形态一律标 `is_atom = true`：它们内部含 `@Expression`，与 `Expression`
#   成环——环只有在**原子规则**里才被 pratt 层截断（同 `ParenthesizedExpr`）。
#   写成普通规则会让 `setup_grammar` 直接 RecursionError（上一轮委派即栽在同类位置上）。
#
# 已知边界（本层不做，记在此防"看起来支持"）：
#   · 链式后缀 `f(a)[i]` / `a.b.c` / `p->q->r` —— 需要"原子 + 后缀*"形态，
#     与环保护冲突（后缀组不在原子位置）；留待与引擎侧确认后再做。
#   · 通过函数指针调用 `(*fp)(x)`、复合字面量、`sizeof` 表达式。

# CallExpr — 调用 f(arg, ...)（实参表可空：`f()`）
[CallExpr.parser]
is_atom = true
production = [
    "@Identifier",
    "bracket.l_parentheses",
    "@ArgumentList?",
    "bracket.r_parentheses",
]

[CallExpr.parser.node]
callee = "$1"
args = "$3"


# IndexExpr — 下标 a[i][j]（c4 同款：`(...)` 组 + 量词表达链式下标）
[IndexExpr.parser]
is_atom = true
production = [
    "@Identifier",
    "(bracket.l_square_bracket,@Expression,bracket.r_square_bracket)+",
]

[IndexExpr.parser.node]
base = "$1"
# indexes —「`[ Expression ]` 组」列表（含方括号）。渲染必须拿到**组**：
#   `$2.items[*].sub_node[1]` 那种"只抽 Expression"的形态会把方括号丢掉
#   （`a[i]` 渲染成 `ai`）。组节点经 normalize 展平成 `["[", Expression, "]"]`，
#   ref 顺序拼接即 `a[i][j]`。
indexes = ["$2.items[*]"]


# MemberExpr — 成员访问 a.b / p->q（单级；多级链见上方"已知边界"）
[MemberExpr.parser]
is_atom = true
production = [
    "@Identifier",
    "(symbol.base.dot|symbol.extend.arrow)",
    "@Identifier",
]

[MemberExpr.parser.node]
base = "$1"
access = "$2"
member = "$3"


# ArgumentList — 逗号分隔实参（**表达式列表**；这里的逗号是分隔符不是运算符）
[ArgumentList.parser]
production = ["@Expression", "(symbol.base.comma,@Expression)*"]

[ArgumentList.parser.node]
items = ["$1", "$2.items[*].sub_node[1]"]


# ── sizeof（阶段 2b）──
# C99 §6.5.3.4：`sizeof unary-expression` 与 `sizeof ( type-name )` 两种形态。
# ⚠ 两个规则都标 `is_atom = true`：它们内部含 `@Expression`（经 `@PrimaryExpr`），
#   与 `Expression` 成环——环只在原子规则里被 pratt 截断（同 ParenthesizedExpr）。
#   两条规则的首 token 都是 `keyword.sizeof`，靠**候选顺序**消歧：先试"括号类型名"
#   （更具体），失败再退到"一元表达式"。
#
# ⚠ **未做：强制转换 `(T)x`**（C99 §6.5.4）。它与 `(expr)` 的区分需要**类型名知识**
#   （C 的经典歧义，标准靠"T 是否为 typedef 名"判定），属语义层信息，不能靠语法层
#   猜。留待与 typedef 名判定同批处理（`hier`/语义层就位后）。

# SizeofTypeExpr — sizeof ( type-name )   例：sizeof(int) / sizeof(struct s) / sizeof(char *)
[SizeofTypeExpr.parser]
is_atom = true
production = [
    "keyword.sizeof",
    "bracket.l_parentheses",
    "@TypeName",
    "bracket.r_parentheses",
]

[SizeofTypeExpr.parser.node]
type_name = "$3"


# SizeofExpr — sizeof unary-expression   例：sizeof x / sizeof a[0]
[SizeofExpr.parser]
is_atom = true
# ⚠ 操作数用 `@UnaryExpr`（pratt 入口）而不是 `@PrimaryExpr`：后者在 `sizeof a[0]` /
#   `sizeof f(y)` 上只匹配到标识符就停（后缀没跟上），整个语句随后失配。
#   `@UnaryExpr` 走 pratt 层的"最长匹配"（遍历 is_atom 规则取消费最多者），后缀链才对得上。
production = [
    "keyword.sizeof",
    "@UnaryExpr",
]

[SizeofExpr.parser.node]
operand = "$2"


# TypeName — 类型名（说明符序列 + 指针星号），仅供 sizeof/转换等"类型作操数"的位置用
[TypeName.parser]
production = [
    "@TypeQualifier|@TypeSpecifier",
    "@SpecRest*",
    "(symbol.base.multiple)*",
]

[TypeName.parser.node]
first = "$1"
rest = "$2"
pointers = "$3"


# ============================================================================
# 渲染配置（世界 A 布局）— 表达式
# ============================================================================
# 口径（同 verilog/c4，见 renderer/renderer_architecture.md）：
#   · 叶子/关键字：`{ ref = "字段" }`（字段绑到 token，normalize 后是字符串）；
#   · 可选段：`{ opt = { group = [...] } }`——group 内任一 ref 求值为 None 时
#     整组消失（renderer/primitives/group.py），故标点不会被留下；
#   · 列表：规则带合并 `items` 字段 + `intent = "compact"`；
#   · 分隔符是 `join` 文本 rstrip 后 + 软换行，故 `sep = " "` 的空格来自软换行。

[Number.renderer.layout]
ref = "value"

[StringLiteral.renderer.layout]
ref = "value"

[ParenthesizedExpr.renderer.layout]
line = ["(", { ref = "expr" }, ")"]

# UnaryExpr 与 Expression 是 pratt 入口规则：规则节点被 pratt 产物
# （UnaryOp/BinaryOp/TernaryOp）取代，通常不在 AST 里出现。布局按"若出现即正确"
# 给出（与 PrimaryExpr 同形的分发布局），不是空壳。
[UnaryExpr.renderer.layout]
line = [{ ref = "op" }, { ref = "value" }]

[PrimaryExpr.renderer.layout]
ref = "value"

[Expression.renderer.layout]
ref = "value"

[CallExpr.renderer.layout]
line = [{ ref = "callee" }, "(", { opt = { ref = "args" } }, ")"]

[IndexExpr.renderer.layout]
line = [{ ref = "base" }, { join = "", items = "indexes" }]

[MemberExpr.renderer.layout]
line = [{ ref = "base" }, { ref = "access" }, { ref = "member" }]

# ArgumentList — 实参表：紧凑列表，flat 无前导空格（`f(a, b)` 而非 `f( a, b)`）
[ArgumentList.renderer.layout]
intent = "compact"
items = "items"
first_soft = false
nest = 0

[SizeofTypeExpr.renderer.layout]
line = ["sizeof(", { ref = "type_name" }, ")"]

[SizeofExpr.renderer.layout]
line = ["sizeof ", { ref = "operand" }]

[TypeName.renderer.layout]
line = [
    { ref = "first" },
    { opt = { group = [
    " ",
    { intent = "compact", items = "rest", sep = " ", first_soft = false, nest = 0 },
] } },
    { ref = "pointers" },
]

# ── pratt 产物节点的布局（引擎构造，语言包声明文本形态）──
# ⚠ UnaryOp 的 prefix/postfix **共用同一节点名**（`position` 字段区分），而布局
#   没有"按属性值换序"的原语，只能二选一：此处取 prefix 序（`*p` / `-x`）。
#   代价：postfix（`i++` / `p--`）会渲染成 `++i` / `--p`（token 齐全、顺序反了）。
[UnaryOp.renderer.layout]
line = [{ ref = "op" }, { ref = "operand" }]

[BinaryOp.renderer.layout]
line = [{ ref = "left" }, " ", { ref = "op" }, " ", { ref = "right" }]

[TernaryOp.renderer.layout]
line = [
    { ref = "cond" },
    " ? ",
    { ref = "true_val" },
    " : ",
    { ref = "false_val" },
]

# ── 括号 token 节点的布局 ──
# ⚠ **必需**：normalize 的 token 叶子提取只覆盖 `keyword.`/`symbol.`/`literal.`
#   前缀（transform/normalizer.py EXTRACT_PREFIXES）——`bracket.*` 节点不在其中，
#   会**原样留在 AST 里**。凡布局把"整组"（而非抽出的子节点）渲染出来时
#   （如 IndexExpr.index_groups），括号节点就会走到这里；不声明布局 = 括号静默
#   消失（`a[i]` 渲染成 `ai`）。形态同 verilog（05_expressions/00_base.toml 末）。
["bracket.l_parentheses".renderer.layout]
ref = "value"

["bracket.r_parentheses".renderer.layout]
ref = "value"

["bracket.l_square_bracket".renderer.layout]
ref = "value"

["bracket.r_square_bracket".renderer.layout]
ref = "value"

["bracket.l_curly_bracket".renderer.layout]
ref = "value"

["bracket.r_curly_bracket".renderer.layout]
ref = "value"
