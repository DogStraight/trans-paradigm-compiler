[ModuleDecl]
template = """module {{ module_name }}{{#params}}{{?@first}} #(
{{/@first}}    {{.}}{{!@last}},{{/@last}}{{?@last}}
){{/@last}}{{/params}} (
{{#ports}}    {{.}}{{!@last}},{{/@last}}
{{/ports}});
{{#body}}    {{.}}
{{/body}}endmodule"""

[ParameterList]
template = "# ({{ first }}{{#rest}} {{.}}{{/rest}})"

[ParamDecl]
template = "parameter {{ param_name }} = {{ value }}"

[PortList]
# PortList is flattened by optimizer; if not, iterate children
template = "{{#first}}{{.}}{{/first}}{{#rest}} {{.}}{{/rest}}"

[PortDecl]
template = "{{ direction }}{{?port_type}} {{ port_type }}{{/port_type}}{{?range}} [{{range}}]{{/range}} {{ port_name }}"

[OptType]
template = "{{ type_desc }}"