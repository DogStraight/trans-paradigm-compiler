[Statement]
template = "{{ stmt }}"

[IfStatement]
template = """    if ({{ condition }}) begin
{{ then_stmt }}    end{{#else_chain}}
{{?condition}} else if ({{ condition }}) begin
{{ body }}    end{{/condition}}{{!condition}} else begin
{{ body }}    end{{/condition}}{{/else_chain}}"""

[ElseIf]
template = """    else if ({{ condition }}) begin
{{ body }}    end"""

[ElseBranch]
template = "    else begin\n{{ body }}    end"

[ElseChain]
template = "{{ branch }}"

[BeginEnd]
template = "begin\n{{ body }}    end"

[NonBlockingAssign]
template = "{{ target }} <= {{ value }};\n"

[BlockingAssign]
template = "{{ target }} = {{ value }};\n"

[AssignStatement]
template = "    assign {{ target }} = {{ value }};"

[CaseStatement]
template = "    case ({{ expr }}){{#items}}\n        {{.}}{{/items}}\n    endcase\n"

[CaseItem]
template = "{{ value }}: {{ stmt }}"

[DefaultItem]
template = "default: {{ stmt }}"