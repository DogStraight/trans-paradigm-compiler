[Statement]
template = "{{ stmt }}"

[IfStatement]
template = """\tif ({{ condition }}) begin
{{ then_stmt }}\tend{{#else_chain}}
{{?condition}} else if ({{ condition }}) begin
{{ body }}\tend{{/condition}}{{!condition}} else begin
{{ body }}\tend{{/condition}}{{/else_chain}}"""

[ElseIf]
template = """\telse if ({{ condition }}) begin
{{ body }}\tend"""

[ElseBranch]
template = "\telse begin\n{{ body }}\tend"

[BeginEnd]
template = "begin\n{{ body }}\tend"

[NonBlockingAssign]
template = "\t\t{{ target }} <= {{ value }};\n"

[BlockingAssign]
template = "\t\t{{ target }} = {{ value }};"