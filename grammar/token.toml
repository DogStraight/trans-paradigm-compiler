[space]
blank_space = " "
tab = "\t"

[newline]
newline = "\n"

[symbol.base]
add = "+"
sub = "-"
multiple = "*"
and = "&"
or = "|"
not = "!"
bit_not = "~"
xnor = "^"
bigger = ">"
lesser = "<"
div = "/"
mod = "%"
equal = "="
dot = "."
comma = ","
colon = ":"
semicolon = ";"
question_mark = "?"
at = "@"
pound = "#"
single_quote = "'"
dollar = "$"

[symbol.extend]
r_shift = ">>"
l_shift = "<<"
point_to = "->"
power = "**"
bigger_equal = ">="
lesser_equal = "<="
is_equal = "=="
not_equal = "!="
add_equal = "+="
sub_equal = "-="
add_one = "++"
sub_one = "--"
double_dot = ".."
logic_double_and = "&&"
logic_double_or = "||"

[bracket]
pairs = [
    ["(", ")", "parentheses"],
    ["[", "]", "square_bracket"],
    ["{", "}", "curly_bracket"],
]

[literal]
string = "(\".*\")|('.*')"
number = "\\d+"

[id.id]
id = "[a-z_A-Z][a-z_A-Z0-9]*"
