[space]
blank_space = " "
tab = "\t"

[newline]
newline = "\n"

[symbol.base]
add = "+"
sub = "-"
multiple = "*"
and = "&"
or = "|"
not = "!"
bit_not = "~"
xnor = "^"
bigger = ">"
lesser = "<"
div = "/"
mod = "%"
equal = "="
dot = "."
comma = ","
colon = ":"
semicolon = ";"
question_mark = "?"
at = "@"
pound = "#"
single_quote = "'"
dollar = "$"

[symbol.extend]
r_shift = ">>"
l_shift = "<<"
point_to = "->"
power = "**"
bigger_equal = ">="
lesser_equal = "<="
is_equal = "=="
not_equal = "!="
add_equal = "+="
sub_equal = "-="
add_one = "++"
sub_one = "--"
double_dot = ".."
logic_double_and = "&&"
logic_double_or = "||"

[bracket]
l_parentheses = "("
r_parentheses = ")"
l_square_bracket = "["
r_square_bracket = "]"
l_curly_bracket = "{"
r_curly_bracket = "}"

[literal]
string = "(\".*\")|('.*')"
number = "\\d+"

[id.id]
id = "[a-z_A-Z][a-z_A-Z0-9]*"
