# ===================================================================
# 代码生成规则定义文件
# ===================================================================
# 本文件定义 AST → 目标代码的映射规则，采用模板语法。
# 支持的外部配置机制：
#
# [node_type]             - AST 节点类型对应的模板规则
# template = "..."        - 模板字符串
# match = "attr"          - 根据节点属性值选择不同模板（见 UnaryOp 示例）
# [[node_type.case]]      - match 的分支定义
#
# [[file_rules]]          - 文件分发规则，控制多文件输出
#
# 模板语法：
#   {{path}}              - 渲染子节点：沿 path 解析属性，若结果是 Node 则递归 visit
#   {{#path}}...{{.}}...  - 列表迭代：对 path 对应的列表逐项渲染
#   {{/path}}
#   {{?path}}...{{/path}} - 条件包含：path 存在且为真时渲染
#   {{!path}}...{{/path}} - 条件取反：path 不存在或为假时渲染
# ===================================================================


# ============================================================================
# 0. 文件分发规则
# ============================================================================
# file_rules 定义如何将一个 AST 的输出分发到多个文件。
# 当 visit 到 node_type 匹配的节点时，会创建或切换到对应文件。
# 不匹配任何 file_rule 的节点输出到上一个匹配的文件。
#
# 如果只需要单文件输出，定义一个 Root 规则即可。

[[file_rules]]
node_type = "Root"
file_name = "output.v"
header = "// Generated by PyV Compiler\n\n"

# 示例：如果将来有 Module 节点，可以按模块名分文件输出
# [[file_rules]]
# node_type = "Module"
# file_name = "{{ name.value }}.v"
# header = "// Module: {{ name.value }}\n"


# ============================================================================
# 1. 顶层和块结构
# ============================================================================

# Root - 遍历所有顶层子节点
[Root]
template = """{{#child}}{{.}}
{{/child}}"""

# Block - 缩进块，遍历子节点（每行缩进一级由外层处理）
[Block]
template = """{{#child}}{{.}}
{{/child}}"""


# ============================================================================
# 2. 变量声明与赋值
# ============================================================================

# 带初始化的变量声明：a: int = 1
[VarInit]
template = "\t{{ var_name }}: {{ type }} = {{ value }}"

# 不带初始化的变量声明：a: int
[VarDecl]
template = "\t{{ var_name }}: {{ type }}"

# 赋值语句：a = expr
[AssignStmt]
template = "\t{{ var_name }} = {{ value }}"


# ============================================================================
# 3. 控制流
# ============================================================================

[IfStatement]
template = """\tif {{ condition }}:
{{ then_body }}{{?else_body}}
{{ else_body }}{{/else_body}}"""

[ElseBranch]
template = """else:
{{ body }}"""

[WhileStatement]
template = """\twhile {{ condition }}:
{{ body }}"""

[ForStatement]
template = """\tfor {{ vars }} in {{ iterable }}:
{{ body }}"""


# ============================================================================
# 4. 导入语句
# ============================================================================

[ImportStatement]
template = "\timport {{ module }}{{?alias}} as {{ alias }}{{/alias}}"

[FromImport]
template = "\tfrom {{ module }} import {{ name }}{{?alias}} as {{ alias }}{{/alias}}"


# ============================================================================
# 5. 调用与传参
# ============================================================================

[CallStmt]
template = "\t{{ call }}"

[Call]
template = "{{ callable_name }}({{ args }})"

[Arguments]
template = "{{ first }}{{#rest}}, {{.}}{{/rest}}"


# ============================================================================
# 6. 字面量
# ============================================================================

[Number]
template = "{{ value }}"

[Bool]
template = "{{ value }}"

[String]
template = "\"{{ value }}\""

[NoneLiteral]
template = "none"


# ============================================================================
# 7. 标识符
# ============================================================================

# 规则解析器产生的标识符节点
[id]
template = "{{ value }}"

# Pratt 解析器产生的标识符节点
[Identifier]
template = "{{ content }}"


# ============================================================================
# 8. 运算符表达式
# ============================================================================

[BinaryOp]
template = "({{ left }} {{ op }} {{ right }})"

# 一元运算符：根据 position 属性选择 prefix 或 postfix 模板
[UnaryOp]
match = "position"
[[UnaryOp.case]]
when = "prefix"
template = "{{ op }}{{ operand }}"

[[UnaryOp.case]]
when = "postfix"
template = "{{ operand }}{{ op }}"


# ============================================================================
# 9. 列表与类型
# ============================================================================

[ListLiteral]
template = "[{{ elements }}]"

[ListType]
template = "[]{{ elem_type }}"

[OptionalType]
template = "?{{ inner }}"

[IdList]
template = "{{ items }}"


# ============================================================================
# 10. 简单语句（无子节点，纯文本）
# ============================================================================

[PassStmt]
template = "\tpass"

[BreakStmt]
template = "\tbreak"

[ContinueStmt]
template = "\tcontinue"


# ============================================================================
# 11. AST 容器节点
# ============================================================================
# 这些是语法分析器内部生成的包装节点，用于表示重复、可选、序列等结构。

# plus 节点：id+ 等 "一次或多次" 结构
[plus]
template = "{{#child}}{{.}}{{/child}}"

# repeat 节点：(...)* 等 "零次或多次" 结构
[repeat]
template = "{{#child}}{{.}}{{/child}}"

# sequence 节点：(...) 分组结构
[sequence]
template = "{{#child}}{{.}}{{/child}}"

# optional 节点：(...)? 可选结构，内部 child 为空时整个消失
[optional]
template = "{{#child}}{{.}}{{/child}}"

# list 节点：具名列表容器
[list]
template = "{{#items}}{{.}}, {{/items}}"


# ============================================================================
# 12. 关键字节点（fallback 由通用处理）
# ============================================================================
# keyword.as 等节点由通用处理，此处仅为显式兜底
[keyword.as]
template = "{{ value }}"

[keyword.in]
template = "{{ value }}"

# 符号节点
[symbol.base.comma]
template = "{{ value }}"
