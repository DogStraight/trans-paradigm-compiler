# ============================================================================
# AST 容器节点
# ============================================================================
# 这些是语法分析器内部生成的包装节点，用于表示重复、可选、序列等结构。

[plus]
template = "{{#child}}{{.}}{{/child}}"

[repeat]
template = "{{#child}}{{.}}{{/child}}"

[sequence]
template = "{{#child}}{{.}}{{/child}}"

[optional]
template = "{{#child}}{{.}}{{/child}}"

[list]
template = "{{#items}}{{.}}, {{/items}}"
