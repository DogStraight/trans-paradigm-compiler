# _token.toml — yaml（YAML 子集）基础 Token 定义
#
# YAML 子集的 token 需求：
#   - 映射分隔符 `:`（symbol.base.colon）
#   - 列表标记 `-`（symbol.base.sub，行首时是列表项）
#   - 标量：裸标识符（localhost/true/null）、数字、引号字符串
#   - 注释：# 行注释
#   - 缩进：由 [indent] 配置驱动（见 _lexer.toml）

[space]
blank_space = " "
tab = "\t"
# CRLF 行尾的 \r 部分（\n 由 [newline] 处理）：作为可忽略空白吞掉
carriage_return = "\r"
# UTF-8 BOM：作为可忽略字符吞掉
bom = "\ufeff"

[newline]
newline = "\n"

# 单字符符号：映射分隔符/列表标记 + 流式集合/锚点/别名
#   comma —— 流式集合分隔符 `[a, b]`
#   amp   —— 锚点声明 `&anchor`
#   star  —— 别名引用 `*alias`
#   lesser—— merge key `<<` 的起始字符
#   dot   —— 文档结束符 `...` 的起始字符
# 说明：这些字符在旧子集中均为"unrecognized → ValueError"（fail-fast 词法），
# 加入后从报错变为可 tokenize，不构成回归。
[symbol.base]
colon = ":"
sub = "-"
comma = ","
amp = "&"
star = "*"
lesser = "<"
dot = "."

# 多字符符号（从 base 字符贪心最长匹配）
# 注意：lexer 最长匹配逐字符 probe，中间形态也必须在 extend 表——
# `---` 需 `--` 命中后才能继续 probe 到 `---`（verilog 的 >>> 同理依赖 >>）。
[symbol.extend]
double_dash = "--"  # 中间形态（无独立语义，仅为 --- 的 probe 链）
double_dot = ".."   # 中间形态（无独立语义，仅为 ... 的 probe 链）
merge = "<<"        # 合并键（merge key）：`<<: *defaults`
doc_start = "---"   # 文档分隔符（独占一行）
doc_end = "..."     # 文档流结束符（独占一行）

# 括号：流式集合 `[a, b]` / `{k: v}`。
# bracket_depth 跟踪使括号内换行不触发结构缩进（lexer 既有机制），
# 流式集合可跨行书写。
[bracket]
pairs = [
  ["[", "]", "square_bracket"],
  ["{", "}", "curly_bracket"],
]

[literal]
# 数字（整数/小数）
number = "-?\\d+(\\.\\d+)?"

# 字符串定界符（[string] delimiters）——CaptureRunner delim mode。
# YAML 双/单引号字符串。
[string]
delimiters = ['"', "'"]

# 块标量（[[capture]] indent_leq mode）——`key: |` / `- >` 的原始文本捕获。
# 触发条件（language 知识在配置不在引擎）：
#   after      : 前一个显著 token 须是 ":" 或 "-"（值位置）——排除 `a | b`
#                中缀场景
#   next_chars : 后随字符须是空白/换行/切块与缩进指示符（+-/数字）——
#                排除 `key: |x`（| 直接粘内容）这类非块标量形态
# 终止条件：内容行缩进 ≤ 触发行缩进（base_col，lexer 运行时传行首空白宽）。
# 注：指示符行上的注释（`| # c`）随内容一体捕获（非独立 comment token），
# 缩进/切块指示符（|-/|+/|2）原样保留不做语义展开（见 README 已知边界）。
[[capture]]
start = "|"
kind = "indent_leq"
token_type = "literal.block_scalar"
after = ["symbol.base.colon", "symbol.base.sub"]
next_chars = " \t\r\n+-0123456789"

[[capture]]
start = ">"
kind = "indent_leq"
token_type = "literal.block_scalar"
after = ["symbol.base.colon", "symbol.base.sub"]
next_chars = " \t\r\n+-0123456789"

# 裸标量（plain scalar）扫描配置——[plain] 段（lexer plain 分支）：
# first = 触发字符集（数字走 number 分支；-/:/&/*/引号/# 等由其它分支
#   处理）；continuation = 续字符集（含空格 → 多词值；词内 -/:@{}[], 等
#   容忍——真实配置值形态）。
# stop_space_after：':' 后随空白/行尾即终止（映射分隔），否则是标量一部分
#   （nginx:1.25 / ./data:/usr/... 的词内冒号）。
# no_space_after_tokens：前一显著 token 是锚点/别名指示符时遇空格终止
#   （锚点名/别名名是单词——'&anchor value' 拆两个 token）。
[plain]
first = ["A-Z", "a-z", "_", ".", "$", "/", "一-鿿"]
continuation = [
  "A-Z", "a-z", "0-9", "_", ".", "$", "/", " ", ":", "@", "+", "#", "~",
  "{", "}", "[", "]", ",", "-", "=", "&", "*", "'", "!", "<", ">", "(", ")",
  # CJK 统一表意文字（U+4E00-U+9FFF，中文配置值）+ 常见中文/全角标点
  "一-鿿", "—", "→", "、", "。", "：", "；", "（", "）", "，",
]
stop_space_after = ":"
no_space_after_tokens = ["symbol.base.amp", "symbol.base.star"]
# flow 终止符：括号内（流式集合语境）这些字符终止扫描——'{a, b}' 的
# ','/'}'、'[a, b]' 的 ','/']' 不能吞进 plain（YAML flow 语境规则）；
# 块语境（括号外）吸收（配置宽容：'name: a, b' / '${{ matrix.os }}'）。
flow_terminators = ["{", "}", "[", "]", ","]

[id.id]
id = "[a-zA-Z_][a-zA-Z0-9_]*"