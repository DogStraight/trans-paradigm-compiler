# _number.toml — yaml（YAML 子集）数字字面量形态声明
#
# YAML 子集：十进制整数/小数（含**符号**与 **0 开头小数**）。无十六进制/八进制/二进制。
#
# ── 为什么 `yaml_dec` 用 `size.digits = "any"`（允许 0 开头） ──
# 无前缀形态的**小数/指数链**建在 size 子图里（`number_gen.build_size` 的
# `dot` / `eE` 转移），而 size 子图的首位数字由 `digits` 声明控制：
#   · `nonzero` → 首字符转移只有 digit1-9，`0.5` **进不了**该链 ⇒ 被切成
#     `number(0)` + `plain(.5)`，渲染成 `key: 0`——`.5` 静默丢内容（实测）；
#   · `any`     → 首字符含 digit0 ⇒ `0.5` / `0.25` / `0.5e3` 整体一个 token。
# 同族先例（C 包对同一问题的既有解）：`grammar/c/base/_number.toml` 的 `c_dec`
# 同样是 `digits = "any"`。语法层只判"这是一个数字 token"；`0.5` 的取值、
# `017` 是否八进制都属语义层（本子集无八进制）。
# 故**不需要**单独承载 `0` 的前缀形态：原 `yaml_zero`（`0[0-9_]*`）是
# `yaml_dec(any)` 的严格子集、且声明其后（`number_runner.run` 等长取先）
# ⇒ 从不产出 token（实测：删除前后语料逐条相同）。已删，避免死声明与双路径。
#
# ── 负数形态（`lead_sign`，与 `lead_dot` 同族） ──
# 词法层把"符号 + 数字"**整体**吃成一个 `literal.number`（`-5` / `+5` / `-0.5`）
# ——符号后必须有数字，裸 `-` 仍归符号表（序列指示符 `- 8080` 不被劫持，判据见
# tests/engine/lexer/test_number_suffix.py::TestLeadSignConfig 与
# tests/languages/yaml/ 的负数用例）。
# 为什么不在语法层加"symbol.base.sub + literal.number"规则：换行/空格是 trivia，
# `key: -5` 与 `seq:` 换行后的 `- 8080` 化简成同一 token 对，语法层无法区分
# （实测：语法侧方案会把 `seq:\n- 8080` 吞成 `seq: -8080`）。邻接是词法事实。
#
# ── 已知边界（不在本形态内） ──
# 点首小数 `.5` 归**裸标量**（`[plain] first` 含 `.`）：yaml 未声明 `lead_dot`，
# 故 `key: .5` 渲成 `key: .5`（Identifier 节点，形态保真但类型不是 number）。

[[number.based]]
name = "yaml_dec"
size = { digits = "any" }       # 允许 0 开头：0 / 017 / 0.5 / 0.5e3 都走本形态
base_prefix = "none"
bases = []
value_digits = { d = "dec" }
value_allow = []

# 前导符号数（yaml 的 `-5` / `+5` / `-0.5`）：
#   size.digits = "any" —— 允许 0 开头（`-0` / `-0.5`），并带小数/指数链
#   lead_sign = true    —— 词法放行"符号起始"，但符号态不接受 ⇒ 必须有数字
[[number.based]]
name = "yaml_neg"
size = { digits = "any" }
base_prefix = "none"
bases = []
value_digits = { d = "dec" }
value_allow = []
lead_sign = true
