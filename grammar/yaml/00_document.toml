# ============================================================================
# yaml（YAML 子集）语法规则 — 文档结构
# ============================================================================
# 迷你语言包：验证 tpc 的缩进 token 机制（space.indent/space.dedent）。
#
# 结构：
#   Document（根块）→ body 循环解析 MappingEntry / SequenceItem
#   MappingEntry：key: value（value 标量或缩进块）
#   SequenceItem：- item（item 标量或缩进块）
#   IndentBlock：space.indent 开始，body 循环，space.dedent 结束
#
# 缩进块归属：`key:` 后无标量时，@Value? 匹配 @IndentBlock（下一行的
# space.indent），块正确挂在 MappingEntry 的 value 下（嵌套 AST）。
# 注意：renderer 配置也在此文件（勿单独建 99_*.toml——load_all_toml
# 加载所有 .toml，同名规则表会被后者整体覆盖，parser 配置丢失）。

# ── Document — 根块（整个文件 = 映射/列表项序列） ──

[Document]
is_block = true

[Document.parser]
production = []

[Document.parser.node]

[Document.renderer.body]
indent = false


# ── Comment — 注释节点 ──
# production == ["comment"] 使引擎的 _derive_comment_node_name 推导到本规则
# （有渲染布局 → 注释渲染保真；无此规则时回退无布局节点，注释静默丢弃——
# c4 现状，yaml 补上后注释参与渲染）。

[Comment.parser]
production = ["comment"]

[Comment.parser.node]
value = "$1.value"

[Comment.renderer.layout]
ref = "value"


# ── MappingEntry — key: value ──
# key 可为标量或 merge key（`<<: *defaults`，见 01_flow.toml）

[MappingEntry]
is_statement = true

[MappingEntry.parser]
production = ["@Scalar|@MergeKey", "symbol.base.colon", "@Value?"]

[MappingEntry.parser.node]
key = "$1"
value = "$3"

[MappingEntry.renderer.layout]
line = [
    { ref = "key" },
    ": ",
    { ref = "value" },
]


# ── SequenceItem — - item ──
# item 可为标量/缩进块/流式集合/块标量，或行内映射（compact mapping）：
#   `- name: Test` + 同列对齐的续块（`  run: |` 兄弟成员）
# 入口 SeqValue：先试 @CompactMap（行内映射），回退普通 @Value。

[SequenceItem]
is_statement = true

[SequenceItem.parser]
production = ["symbol.base.sub", "@SeqValue?"]

[SequenceItem.parser.node]
value = "$2"

[SequenceItem.renderer.layout]
line = [
    "- ",
    { ref = "value" },
]


# ── SeqValue — 序列项值入口（行内映射优先，回退普通值） ──

[SeqValue]
inline = true

[SeqValue.parser]
production = ["@CompactMap|@Value"]

[SeqValue.parser.node]
value = "$1"

[SeqValue.renderer]
layout = { ref = "value" }


# ── CompactMap — 行内映射（compact mapping） ──
# 第一对（name: Test）与序列指示符同行；其后同列对齐的续块（run: |）
# 由 @IndentBlock? 吃入 rest（兄弟成员语义）。
# 歧义分流（无需显式声明，从 MappingEntry 结构自然分出）：
#   `- name:`        → MappingEntry 的 @Value? 自己吃深缩进块（嵌套值，现有语义）
#   `- name: Test`   → @Value? 吃行内 Test，对齐续块由 @IndentBlock? 吃（兄弟语义）
#   `- a`            → MappingEntry 的 colon 匹配失败 → 回退 @Value

[CompactMap.parser]
production = ["@MappingEntry", "@IndentBlock?"]

[CompactMap.parser.node]
first = "$1"
rest = "$2"

[CompactMap.renderer.layout]
line = [
    { ref = "first" },
    { ref = "rest" },
]


# ── Value — 标量 / 缩进块 / 流式集合 / 锚点别名 / 块标量（规则见 01_flow.toml） ──

[Value.parser]
production = ["@Scalar|@IndentBlock|@FlowSeq|@FlowMap|@AnchorValue|@AliasRef|@BlockScalar"]
inline = true

[Value.parser.node]
value = "$1"


# ── IndentBlock — 缩进块（space.indent 开始，space.dedent 结束） ──

[IndentBlock]
is_block = true

# 块边界从 production 首尾字面 token 推导：
#   block_start = "space.indent"，block_end = "space.dedent"
# body 由 parse_block_body 循环 parse_sentence 解析子项。
[IndentBlock.parser]
production = ["space.indent", "space.dedent"]

[IndentBlock.parser.node]

# body 缩进由 body_cfg["indent"] 控制：Document 顶层 indent=false（顶格），
# IndentBlock 是嵌套块，子项相对引用方（MappingEntry 的 {ref="value"}）
# 缩进 1 级（4 格），正好补上 YAML 的嵌套层级。
[IndentBlock.renderer.body]
indent = true


# ── Scalar — 标量（标识符/数字/字符串/布尔/null） ──

[Scalar.parser]
production = ["@Identifier|@Number|@StringLit|@BoolLit|@NullLit"]
inline = true

[Scalar.parser.node]
value = "$1"


# ── 标量原子 ──

# Identifier — 裸标识符/裸标量（plain scalar，localhost/true/null 等）
[Identifier.parser]
is_atom = true
production = ["id|literal.plain"]

[Identifier.parser.node]
content = "$1.value"

[Identifier.renderer.layout]
ref = "content"


# Number — 数字字面量
[Number.parser]
is_atom = true
production = ["literal.number"]

[Number.parser.node]
value = "$1"

[Number.renderer.layout]
ref = "value"


# StringLit — 引号字符串
[StringLit.parser]
is_atom = true
production = ["literal.string"]

[StringLit.parser.node]
value = "$1"

[StringLit.renderer.layout]
ref = "value"


# BoolLit — 布尔（true/false）
[BoolLit.parser]
is_atom = true
production = ["(keyword.true|keyword.false)"]

[BoolLit.parser.node]
value = "$1"

[BoolLit.renderer.layout]
ref = "value"


# NullLit — null
[NullLit.parser]
is_atom = true
production = ["keyword.null"]

[NullLit.parser.node]
value = "$1"

[NullLit.renderer.layout]
ref = "value"

# ── BlockScalar — 块标量（`key: |` / `- >`，lexer 产出 literal.block_scalar） ──
# 内容为逐字捕获（含指示符与切块/缩进指示符），渲染原样输出。
# 语法层不做折叠/切块语义展开（见 README 已知边界）。

[BlockScalar.parser]
is_atom = true
production = ["literal.block_scalar"]

[BlockScalar.parser.node]
value = "$1"

[BlockScalar.renderer.layout]
ref = "value"