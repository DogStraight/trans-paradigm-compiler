# _types.toml — 增强类型定义
#
# 每项定义一个可被 transform 展开的信号组。
# key = "type.{group}.{role}"

[type.spi.master]
signals = [
  { name = "clk",  direction = "output" },
  { name = "mosi", direction = "output" },
  { name = "miso", direction = "input"  },
  { name = "cs",   direction = "output" },
]

[type.spi.slave]
signals = [
  { name = "clk",  direction = "input"  },
  { name = "mosi", direction = "input"  },
  { name = "miso", direction = "output" },
  { name = "cs",   direction = "input"  },
]
