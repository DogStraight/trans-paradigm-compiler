# ===== 类型声明：TypeDecl =====
# type spi (parameter MODE = 0, parameter DATA_WIDTH = 8) {
#     master : input miso, output clk, mosi, cs;
#     slave  : invert master;
#     fn read : { }
# }

[TypeDecl]
[TypeDecl.inject]
# TypeDecl 是顶层声明（与 ModuleDecl 同级），靠 statement_rule_names 自动发现，
# 注入 ModuleItem 使其在模块体内也可用（嵌套类型场景）
targets = ["@ModuleItem"]

[TypeDecl.parser]
production = ["keyword.type", "@Identifier", "@TypeParamList?", "@TypeBody"]
end_case = ["newline"]

[TypeDecl.parser.node]
type_name = "$2"
params = "$3"
body = "$4"

[TypeDecl.renderer]
[TypeDecl.renderer.layout]
line = [
    "keyword.type",
    " ",
    { ref = "type_name" },
    { ref = "params" },
    " ",
    { ref = "body" },
]

# analyzer: 类型符号注册到父作用域 + 类型内部创建独立作用域
[TypeDecl.analyzer]
symbol = { kind = "type", name_attr = "type_name" }
scope = { kind = "type", name_attr = "type_name" }

# transform: 类型声明不会出现在输出中，被 SemanticAnalyzer 消费后移除
[TypeDecl.transform]
kind = "delete"


# ── 类型参数列表 type (parameter MODE = 0, ...) ──
[TypeParamList]
[TypeParamList.parser]
production = [
    "bracket.l_parentheses",
    "@TypeParamItem",
    "(symbol.base.comma,@TypeParamItem)*",
    "bracket.r_parentheses",
]

[TypeParamList.parser.node]
items = ["$2", "$3.items[*].sub_node[1]"]

[TypeParamList.renderer]
layout = { line = ["(", { join = ", ", items = [{ ref = "items" }] }, ")"] }


# ── type (parameter MODE = 0) 单个参数 ──
[TypeParamItem]
[TypeParamItem.parser]
production = [
    "keyword.parameter",
    "@Identifier",
    "symbol.base.equal",
    "@PrimaryExpr",
]
[TypeParamItem.parser.node]
name = "$2"
default = "$4"
[TypeParamItem.renderer]
layout = { line = ["parameter ", { ref = "name" }, " = ", { ref = "default" }] }


# ── 类型体 { master : ...; fn read : { }; } ──
[TypeBody]
[TypeBody.parser]
production = [
    "bracket.l_curly_bracket",
    "@TypeMember*",
    "bracket.r_curly_bracket",
]
[TypeBody.parser.node]
members = "$2"
[TypeBody.renderer]
[TypeBody.renderer.layout]
line = ["{", { break = 1 }]
[TypeBody.renderer.layout.body]
indent = 4
source = "members"
[TypeBody.renderer.layout.tail]
text = "}"
break = 2


# ── 类型成员（role | invert | method）──
[TypeMember]
inline = true
[TypeMember.parser]
production = ["@TypeRole | @InvertDecl | @TypeMethod"]
[TypeMember.parser.node]
child = "$1"

[TypeMember.renderer]
layout = { ref = "child" }


# ── 角色 master : input miso, output clk, ...; ──
[TypeRole]
[TypeRole.parser]
production = [
    "@Identifier",
    "symbol.base.colon",
    "@TypePortDecl",
    "(symbol.base.comma,@TypePortDecl)*",
    "symbol.base.semicolon",
]
[TypeRole.parser.node]
role_name = "$1"
ports = ["$3", "$4.items[*].sub_node[1]"]
[TypeRole.renderer]
[TypeRole.renderer.layout]
[TypeRole.renderer.layout.line]
items = [{ ref = "role_name" }, ":", { break = 1 }]
[TypeRole.renderer.layout.body]
indent = 4
source = "ports"
[TypeRole.analyzer]
symbol = { kind = "role", name_attr = "role_name", capture = { ports = "ports" } }
primitives = ["resolve_refs"]

[TypeRole.analyzer.resolve_refs]
source = "ports"
target = "_ref_callbacks"
name_attr = "role_name"

[[TypeRole.analyzer.resolve_refs.refs]]
marker = "type_spec"
kind = "nested"
scope_mode = "child"
scope_kind = "type"
key = "{type_spec.type_name}"
role_key = "{type_spec.role_name}"
meta = { prefix = "instance_name" }

[[TypeRole.analyzer.resolve_refs.refs]]
marker = "target_role"
kind = "invert"
scope_mode = "self"
role_key = "{target_role}"


# ── 角色端口　input miso | output clk | invert master ──
# 复用核心规则的 AnsiInputDecl/AnsiOutputDecl/AnsiInoutDecl
# TypeInvertPort 用于角色体内的 invert 引用（不含分号）
# TypeNestedPort 用于引用另一类型的角色端口（嵌套类型）
[TypePortDecl]
inline = true
[TypePortDecl.parser]
production = [
    "@AnsiInputDecl | @AnsiOutputDecl | @AnsiInoutDecl | @TypeInvertPort | @TypeNestedPort",
]
[TypePortDecl.parser.node]
child = "$1"
[TypePortDecl.renderer]
layout = { ref = "child" }


# ── 嵌套类型引用 axis.master data（被 TypePortDecl 引用）──
# 注意：不含 ; — 由外层 TypeRole 或调用者提供
[TypeNestedPort]
[TypeNestedPort.parser]
production = ["@TypedTypeSpec", "@Identifier"]
[TypeNestedPort.parser.node]
type_spec = "$1"
instance_name = "$2"
[TypeNestedPort.renderer]
layout = { line = [{ ref = "type_spec" }, " ", { ref = "instance_name" }] }


# ── 角色内 invert（不含分号，被 TypePortDecl 引用）──
[TypeInvertPort]
[TypeInvertPort.parser]
production = ["keyword.invert", "@Identifier"]
[TypeInvertPort.parser.node]
target_role = "$2"
[TypeInvertPort.renderer]
layout = { line = ["invert ", { ref = "target_role" }] }


# ── 成员级 invert（含分号，被 TypeMember 引用）──
# 注意与 TypeInvertPort 的区别：
#   TypeInvertPort — 角色端口中的引用（不含分号，被 TypePortDecl 引用）
#   InvertDecl    — 类型成员中的语句（含分号，被 TypeMember 引用）
[InvertDecl]
[InvertDecl.parser]
production = ["keyword.invert", "@Identifier", "symbol.base.semicolon"]
[InvertDecl.parser.node]
target_role = "$2"
[InvertDecl.renderer]
layout = { line = ["invert ", { ref = "target_role" }, ";"] }


# ── 方法声明 fn read : { ... } ──
[TypeMethod]
[TypeMethod.parser]
production = [
    "keyword.fn",
    "@Identifier",
    "symbol.base.colon",
    "@TypeMethodBody",
]

[TypeMethod.parser.node]
method_name = "$2"
body = "$4"

[TypeMethod.renderer]
[TypeMethod.renderer.layout]
line = ["fn ", { ref = "method_name" }, ": ", { ref = "body" }]

[TypeMethod.analyzer]
symbol = { kind = "type_method", name_attr = "method_name" }


# ── 方法体 { ... } ──
[TypeMethodBody]
[TypeMethodBody.parser]
production = ["bracket.l_curly_bracket", "bracket.r_curly_bracket"]

[TypeMethodBody.renderer]
layout = { line = ["{", "}"] }
