# _manifest.toml — 增强语法配置入口
#
# 增强层的配置只会被 transform 阶段读取，
# Parser / Renderer 不感知 transform 的存在。

[ext]
# 增强层依赖的核心语法规则目录
base_rules = "rules_verilog"

# 各增强规则的挂载点声明在规则自身的 [RuleName.inject] 中
# TypeDecl 的类型角色信息由 SemanticAnalyzer 从 TOML 规则定义中提取并存入 scope 符号表，
# Transform 引擎通过 lookup_type_scope 原语从 scope 查询，无需独立的 _types.toml。
