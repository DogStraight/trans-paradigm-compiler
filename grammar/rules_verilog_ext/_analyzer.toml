# _analyzer.toml — 增强语法层的语义映射配置
#
# 定义分析器在符号注册后如何收集语义映射数据。
# 每条 mapping 条目声明映射表的触发条件、键构造规则、和数据源提取方式。
#
# trigger = { kind = "..." }     ← 符号类别触发
# table = "name"                 ← 输出到 mapping["name"]
# key = "{scope.name}.{name}"    ← 键模板（{attr} 取符号上下文）
# source = { attr = "ports", ... } ← 从符号 attrs 的哪个字段提取
# items = true                   ← 源数据是列表，逐项处理
# fields = { ... }               ← 每项提取的子字段
# value = "field"                ← 简写：直接取某字段值
# exclude_keys = [...]           ← 排除含指定 key 的条目（用于跳过 ref）

# ── 常规端口表（不含 ref 条目）──
# exclude_keys 跳过 TypeNestedPort(type_spec) 和 TypeInvertPort(target_role)
[mapping.type_ports_flat]
trigger = { kind = "role" }
table = "type_ports_flat"
key = "{scope.name}.{name}"
source = { attr = "ports", items = true, exclude_keys = [
    "type_spec",
    "target_role",
] }
fields = { direction = "{$.direction}", name = "items.items[*].name" }

[mapping.type_ports]
trigger = { kind = "role" }
table = "type_ports"
key = "{scope.name}.{name}"
source = { attr = "ports", items = true }
fields = { direction = "{$.direction}", names = "items.items[*].name" }

[mapping.type_invert]
trigger = { kind = "role" }
table = "type_invert"
key = "{scope.name}.{name}"
source = { attr = "ports", items = true, filter = { node_name = "TypeInvertPort" } }
value = "target_role"

[mapping.type_default_ports]
trigger = { kind = "role" }
table = "type_default_ports"
key = "{scope.name}"
first_only = true
source = { attr = "ports", items = true }
fields = { direction = "{$.direction}", name = "items.items[*].name" }

# ── 方向反转映射表（语言专用数据）──
# 被 resolve_refs 原语和 transform 共享
[direction]
invert_map = { input = "output", output = "input", input_reg = "output_reg", output_reg = "input_reg", inout = "inout" }

# ── 变换回调：引用解析 ──
# 分析器原语 resolve_refs 产出 _ref_callbacks，
# 变换器收到回调后，按回调中 scope 知识（resolved_ports）做实操。
#
# 协议（分析器→变换器）：
#   sym.attrs["_ref_callbacks"] = [
#     { "kind": "nested",
#       "resolved_ports": [{"direction": ..., "name": ...}],
#       "prefix": "upstream",               # nested: 实例名前缀
#       "source_type": "axis",              # nested: 源类型名
#       "source_role": "master" },           # 源角色名
#     { "kind": "invert",
#       "resolved_ports": [...],
#       "source_role": "master" }
#   ]
# 变换器消费后做机械操作（prefix / invert_map），合并到 type_ports_flat。
[resolve.apply_type_refs]
kind = "apply_refs"
source_table = "type_ports_flat"
