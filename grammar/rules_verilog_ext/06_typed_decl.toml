# ===== 增强语法：类型化端口声明 =====
#
# spi(master) spi_io;
#   ↓ transform 展开
# output spi_io_clk;
# output spi_io_mosi;
# input  spi_io_miso;
# output spi_io_cs;
#
# 架构：
#   TypeSpec 已从 PortTail 中抽离为独立规则
#   TypedTypeSpec 注入到 TypeSpec 作为优先分支
#   TypedPortDecl 注入到 AnsiPortDecl 作为优先分支

# 挂载点
[TypedPortDecl.inject]
targets = ["AnsiPortDecl", "ModuleItem"]

# ── 类型化类型描述符 spi.slave ──
[TypedTypeSpec]
[TypedTypeSpec.inject]
# 挂载在 PortDeclPrefix 的调用处，与 @PortDeclPrefix 平行分支
targets = ["AnsiInputDecl.production[0]", "AnsiOutputDecl.production[0]", "AnsiInoutDecl.production[0]"]

[TypedTypeSpec.parser]
production = ["@Identifier", "symbol.base.dot", "@Identifier"]
[TypedTypeSpec.parser.node]
type_name = "$1"
role_name = "$3"
[TypedTypeSpec.renderer]
layout = { line = [{ ref = "type_name" }, ".", { ref = "role_name" }] }

# ── 类型化端口声明（无方向关键字）spa(master) spi_io ──
[TypedPortDecl]
[TypedPortDecl.parser]
production = ["@TypedTypeSpec", "@Declarator"]
end_case = ["newline", "symbol.base.semicolon", "symbol.base.comma", "bracket.r_parentheses"]
[TypedPortDecl.parser.node]
type_spec = "$1"
instance_name = "$2"

# analyzer
[TypedPortDecl.analyzer]
symbol = { kind = "typed_port", name_attr = "instance_name.name" }
ref_collect = true

# transform: 原语展开 — 将类型化端口展开为具体端口声明
#   source.lookup  → 从 type 表查 {type_spec.type_name}.{type_spec.role_name}
#   foreach       → 取查到的 signals 列表
#   as            → 每项绑定为 signal，emit 模板中用 {signal.xxx}
#   emit          → 为每个信号生成一个 AnsiInputDecl 节点
[TypedPortDecl.transform]
kind = "expand"
source = { lookup = "type", key = "{type_spec.type_name}.{type_spec.role_name}" }
foreach = "signals"
as = "signal"
condition = { exists = "type_spec.type_name" }

[TypedPortDecl.transform.emit]
node = "AnsiInputDecl"
direction = "{signal.direction}"

[[TypedPortDecl.transform.emit.sub_node]]
node = "Declarator"
name = "{instance_name}_{signal.name}"
