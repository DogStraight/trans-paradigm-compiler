# ===== 增强语法：类型化声明 =====
#
# spi.master spi_io;
#   ↓ transform 展开
# output spi_io_clk;
# output spi_io_mosi;
# input  spi_io_miso;
# output spi_io_cs;

# 挂载点：注入到核心语法规则
[TypedDecl.inject]
targets = ["AnsiPortDecl", "ModuleItem"]

# ANSI 端口声明替换为 SimpleTail（无 DeclaratorList 逗号重复）
# SV 标准中 ANSI 端口列表的每个端口只声明一个信号名，
# 逗号只出现在 port_list 级别，不出现在 apsi_port 内部。
# 修复前：input wire rstn, spi.master spi_io → DeclaratorList 吃掉 spi
# 修复后：@Declarator 只匹配 rstn，, spi.master spi_io 由外层 PortList 处理
[TypedDecl.inject.replace]
AnsiInputDecl = { old = "@PortTail", new = "@SimpleTail" }
AnsiOutputDecl = { old = "@PortTail", new = "@SimpleTail" }
AnsiInoutDecl = { old = "@PortTail", new = "@SimpleTail" }
# TaskAnsiInputDecl 的 end_case 补上 ; — 函数体中的端口声明以 ; 结束
TaskAnsiInputDecl = { old = "end_case = [\"symbol.base.comma\", \"bracket.r_parentheses\", \"newline\"]", new = "end_case = [\"symbol.base.comma\", \"bracket.r_parentheses\", \"newline\", \"symbol.base.semicolon\"]" }

[TypeRef]
[TypeRef.parser]
production = ["id", "symbol.base.dot", "id"]
inline = true
[TypeRef.parser.node]
group = "$1"
role = "$3"
[TypeRef.renderer]
layout = { line = [{ ref = "group" }, ".", { ref = "role" }] }

[TypedDecl]
[TypedDecl.parser]
production = [
    "@TypeRef",
    "id",
]
end_case = ["newline", "symbol.base.semicolon", "symbol.base.comma", "bracket.r_parentheses"]
[TypedDecl.parser.node]
type_ref = "$1"
instance_name = "$2"

# analyzer：收集对此符号的所有引用（供 transform 引用替换用）
[TypedDecl.analyzer]
symbol = { kind = "typed_port", name_attr = "instance_name" }
ref_collect = true

# transform：展开为 WireDecl 列表
[TypedDecl.transform]
kind = "expand"
source = { ref = "{type_ref.group}.{type_ref.role}", table = "type" }
foreach = "signals"
[TypedDecl.transform.output]
node = "WireDecl"
[TypedDecl.transform.output.attrs]
direction = "{signal.direction}"
name = "{instance_name}_{signal.name}"
