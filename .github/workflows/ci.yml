name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run tests
        run: python verilog/run_all_tests.py
      - name: Run tests (macro expansion)
        run: python verilog/run_all_tests.py --expand-macros
