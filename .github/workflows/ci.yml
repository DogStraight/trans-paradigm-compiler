name: CI

on:
  push:
    branches: [main, master, dev, feature]
    # 发布 tag 也跑 CI：此前推 tag 不触发任何工作流，0.1.4 的发布提交只靠本地
    # ci_rehearsal 验证（2026-11-12 实测：两个 release push 的 CI test 矩阵被
    # xdist worker 超时挂起 6h 后取消，发布因此少了远程复核）。
    tags: ["v*"]
  pull_request:
  workflow_dispatch:   # 手动触发（验证 CI 修复/重跑，不必造 push）

jobs:
  test:
    # 防 6h 挂起（GitHub 默认 job 超时 360min）：任何一步真挂住，90 分钟内必红。
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (editable + test deps)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run full test suite with coverage gate (Linux)
        # 2026-11-12 实测：`-n auto --cov` 在 4 核 runner 上，真实语料 diag 基线
        # 测试（setup ~72s/本地，争抢下 >120s）触发 pytest-timeout 的 thread
        # 方法 → worker 崩溃（"Not properly terminated"）→ xdist 挂到 job 超时。
        # 修法：CI 降到 -n 2（内存/CPU 争抢减半）+ timeout 600 + POSIX 用
        # signal 方法（线程方法在 xdist 下会杀 worker）+ step 级 60min 兜底。
        # 本地 addopts 的 -n auto / timeout=120 不变。
        if: runner.os == 'Linux'
        timeout-minutes: 60
        env:
          PYTHONHASHSEED: "0"
        run: |
          python -m pytest tests -q -n 2 --timeout=600 --timeout-method=signal \
            --cov --junitxml=pytest-results.xml --durations=10

      - name: Run full test suite with coverage gate (Windows)
        # Windows 无 SIGALRM ⇒ signal 方法不可用；thread 方法 + 600s 阈值，
        # 配合 -n 2 降争抢，避免长耗时真实语料测试被 120s 误杀。
        if: runner.os == 'Windows'
        timeout-minutes: 60
        env:
          PYTHONHASHSEED: "0"
        run: |
          python -m pytest tests -q -n 2 --timeout=600 `
            --cov --junitxml=pytest-results.xml --durations=10

      - name: Upload pytest results (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-${{ matrix.os }}-${{ matrix.python-version }}
          path: pytest-results.xml
          if-no-files-found: ignore

      - name: Shuffled-order smoke (跨文件顺序敏感早发现)
        # 文件级乱序（固定种子 → 可复现）：文件间顺序依赖的隔离缺口当场变红，
        # 而不是回流成"偶发 flake"。全量乱序档在 nightly。
        env:
          TPC_SHUFFLE_SEED: "1"
          PYTHONHASHSEED: "0"
        run: |
          python -m pytest -m smoke -q

      - name: Policy checks (约定即门禁)
        # --strict-doc：R3（Doc: 头）升 gate——引擎新文件必须带 Doc: 反向引用
        # --strict-import：R4 升 gate——引擎代码不得直接 import grammar.<lang>
        #   插件（P2.5 插件回调能力化完成：pipeline 直连已清零）
        # check_doc_refs：文档调用点门禁（D1/D2 gate）——代码 Doc: 头与导航
        #   索引引用的文档必须存在（docs 增删改防断链）
        run: |
          # --strict-parse / --strict-input：解析失败与输入面缺失升为 gate
          #   （默认只打印 [告警]；CI 里必须红，否则"可见通道"等于没人看）
          python policy/check_hardcode.py --strict-doc --strict-import --strict-parse
          python policy/check_doc_refs.py --strict-input
          # check_invariants：不变量清单门禁——docs/invariants.toml 的锚点
          #   （policy 规则 id / 测试函数 / 变异序号）必须可解析，防清单腐烂
          python policy/check_invariants.py
          # 异常卫生：宽异常必须写理由、禁裸 except（模型最高频的静默缺陷）
          python policy/check_exception_hygiene.py --strict

      - name: Structural / scatter ratchet (D2 门禁)
        # 结构欠账分与功能散点：**新增即回归**（不是"总分下降就算过"——那样会把
        # 欠账洗掉）。口径见 policy/structural_budget.md、gap-feature-scatter.md。
        run: |
          python tools/structural_score.py --compare
          python tools/feature_sites.py compare

      - name: Redundant-code ratchet (D10 kept 基线)
        # 逐部件冗余代码扫描：新候选 / 基线条目消失都算回归；基线非空而当前 0 条
        # （探针被绕过）exit 2。裁定与理由见 tools/baselines/redundant_code_kept.json。
        run: |
          python tools/scan_redundant_code.py --strict

      - name: Affected-test map health (动态入口映射表)
        # 只检查 tests/affected_map.toml 的健康（路径存在 / 条目非空 / 目标存在）。
        # CI 跑什么永远由本 workflow 决定——动态入口只服务日常快反馈，不决定门禁。
        run: |
          python tools/affected_tests.py --audit-map

      - name: Cross-platform text I/O gate (D9 门禁)
        # --strict：输入面缺失（扫描根不存在）升为 gate；工具内含防假绿下限
        #   （扫描面 <100 个 .py 直接失败），空集合不许当绿。
        run: |
          python tools/check_platform_encoding.py --strict

      - name: Static type gate (pyright strict)
        # 版本钉在 1.1.413（与本地验证一致）；升级时同步 bump
        run: |
          npx -y pyright@1.1.413 --project pyrightconfig.strict.json

      - name: Edge corpus gate
        run: |
          python tests/edge/run_edge.py

      - name: Fuzz smoke (PR 快速, 时间预算 ~60s)
        run: |
          python tests/fuzz/run_fuzz.py --iters 500

      - name: Verify CLI works
        run: |
          echo "module m; reg a; endmodule" | Out-File -Encoding utf8 ci_check.v
          tpc format ci_check.v
        shell: pwsh

  # wheel 安装验证：构建 wheel → 装到独立 venv → 从非项目目录运行 CLI。
  # 防止"editable 模式可用但 wheel 安装后 CLI 失败"（管线核心在 tests/ 里、
  # data-files 扁平化多语言包、相对路径在任意目录失效）。
  wheel-install:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install wheel in fresh venv + run CLI (Linux)
        if: runner.os == 'Linux'
        run: |
          python -m venv "$GITHUB_WORKSPACE/_venv"
          "$GITHUB_WORKSPACE/_venv/bin/python" -m pip install dist/*.whl
          cd /tmp
          "$GITHUB_WORKSPACE/_venv/bin/tpc" lint "$GITHUB_WORKSPACE/tests/e2e/samples/normal/ref/ref_simple.v"
          "$GITHUB_WORKSPACE/_venv/bin/tpc" format "$GITHUB_WORKSPACE/tests/e2e/samples/normal/ref/ref_simple.v" > /dev/null

      - name: Install wheel in fresh venv + run CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m venv "$env:GITHUB_WORKSPACE\_venv"
          $whl = (Get-ChildItem dist -Filter *.whl).FullName
          & "$env:GITHUB_WORKSPACE\_venv\Scripts\python.exe" -m pip install $whl
          cd C:\
          & "$env:GITHUB_WORKSPACE\_venv\Scripts\tpc.exe" lint "$env:GITHUB_WORKSPACE\tests\e2e\samples\normal\ref\ref_simple.v"
          & "$env:GITHUB_WORKSPACE\_venv\Scripts\tpc.exe" format "$env:GITHUB_WORKSPACE\tests\e2e\samples\normal\ref\ref_simple.v" | Out-Null
