[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "trans-paradigm-compiler"
version = "0.1.0"
description = "Configuration-driven language pipeline — write language rules in TOML; configurable, forkable, model-friendly"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "biominescence", email = "oho15799293498@outlook.com" },
    { name = "deepseek-v4-flash" },  # AI 协作者（模型辅助开发，0.1.0 起署名）
]
keywords = [
    "compiler",
    "parser",
    "formatter",
    "linter",
    "verilog",
    "toml-grammar",
    "dsl",
    "language-workbench",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: General",
]

# 零运行时依赖（测试用 pytest）
dependencies = []

[project.scripts]
tpc = "main:main"

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pytest-timeout>=2.0",
    "pytest-xdist>=3.6",  # 并发回归：pytest -n auto（进程级并行；global_state 进程内隔离天然兼容）
]

# main.py 作为顶层模块打包（tpc 命令入口）
[tool.setuptools]
py-modules = ["main", "scaffold_component"]

[tool.setuptools.packages.find]
include = [
    "core*",
    "lexer*",
    "parser*",
    "linter*",
    "analyzer*",
    "transform*",
    "renderer*",
    "preprocessor*",
    "grammar*",
    "pipeline*",
]

# 运行时数据：语法 TOML 作为包内数据（package-data）分发，保留目录结构。
# 注1：语法（grammar/verilog/*.toml）是独立外置资产，可单独发布 / 单独 fork 使用；
#      此处随引擎捆绑只是便捷形态之一，不是语法的唯一发布方式。
# 注2：editable/dev 模式从源码树定位（main.py / config 查找逻辑以源码路径为准）；
#      此处供 sdist/wheel 携带数据，供未来发行使用。
# 注3：不用 data-files——它会扁平化文件（grammar/verilog/ 与 grammar/c4/ 混在一起，
#      插件目录丢失），多语言包不可用。package-data 保留目录结构。
[tool.setuptools.package-data]
"grammar" = ["**/*.toml"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
# 默认并发（pytest-xdist，进程级并行；global_state 进程内隔离天然兼容）：
# 全量 315s → ~88s（~3.6x）。coverage 场景须显式 -n 0 关并发
# （xdist 每 worker 独立计数会失真，实测 61% < fail_under 80）。
addopts = "-n auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]
timeout = 60
timeout_method = "thread"

[tool.coverage.run]
source = [
    "core",
    "lexer",
    "parser",
    "linter",
    "analyzer",
    "transform",
    "renderer",
    "preprocessor",
]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/main.py",
    "*/lexer/number_fsm.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
sort = "Cover"
# 覆盖率门禁：防回退硬门槛（非高数值追求）；当前引擎核心实测 83.39%，
# 远期目标 90%（TODO P2.2）
fail_under = 80

[tool.coverage.html]
directory = "coverage_html"
