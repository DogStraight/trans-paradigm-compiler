# AST 规范化配置
# 定义 normalizer 如何将 parser 原始输出翻译为规范 AST。
# 可按语言覆盖（放在对应规则目录下）。

# 需要提取为字符串值的节点
[extract_value]
prefixes = ["keyword.", "symbol."]
names = ["id"]

# 需要消除的包装节点类型
[eliminate]
types = ["optional", "repeat", "sequence"]

# 需要合并到 children 的命名属性
[merge]
attrs = ["first", "rest"]

# 需要展开的透明容器节点（它们的子节点被提升到父节点）
[flatten]
types = ["Block"]

# 字段名约定
[fields]
children = "sub_node"
body = "body"
