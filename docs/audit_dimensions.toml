trigger = "新增或修改任何 policy/ 门禁时，必须为它加一条变异并跑 check_gate_efficacy"
measured = "默认 gate 单元 7/7 有直接变异（120 D1 / 121 R1 / 122 R2 / 123 R5 / 124 R6 / 125 D2 / 126 INVARIANTS），各自 --only 如期变红"
proxies = "每个门禁在被违反时确实会红（不是只在干净树上通过）"
