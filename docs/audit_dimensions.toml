# 审计维度注册表（数据层）— 审计循环的"审什么"
#
# 每个维度必须二选一：
#   probe = "<可执行命令>"   → 该维度**可判定**，循环里能自动跑
#   probe = "todo"           → 还没有探针，必须写 trigger（什么情况下必须补）
# 硬规则（tests/policy/test_audit_dimensions.py 校验）：
#   · status = "closed" 的维度**必须有 probe**（没探针不允许宣布关闭）
#   · todo 维度必须有 trigger（否则它就是"以后再说"的黑洞）
#
# origin：user = 用户提的 4 个核心任务；agent = 审计中发现的新维度
# Doc: policy/collaboration.md（任务循环六步 + 审计维度轮）

[[dimension]]
id = "D1"
name = "冗余内容文件"
origin = "user"
probe = "python tools/scan_redundant.py --only scratch"
closure = "scratch 无残留；悬空引用仅剩 CHANGELOG 历史（不可改）"
status = "open"

[[dimension]]
id = "D2"
name = "机制正交性"
origin = "user"
probe = "python tools/structural_score.py --compare"
closure = "新增 0 项；同一事实只有一处（副本清零，或有 fail-closed 门禁保证漏了会响）"
status = "open"

[[dimension]]
id = "D3"
name = "测试用例正交性"
origin = "user"
probe = "python tools/scan_test_redundancy.py"
closure = "同构组数不增长；参数化前后收集数不变"
status = "open"

[[dimension]]
id = "D4"
name = "缺口文档冗余"
origin = "user"
probe = "python policy/check_doc_refs.py"
closure = "D1-D4 全 0；同根因多档已合并；未合并的给出 Jaccard 证据"
status = "open"

[[dimension]]
id = "D5"
name = "门禁有效性（假绿）"
origin = "agent"
probe = "todo"
trigger = "新增或修改任何 policy/ 门禁时，必须为它加一条变异并跑 check_gate_efficacy"
status = "open"
closure = "每个门禁至少一条变异能证明它变红；变异载荷与当前源码匹配"

[[dimension]]
id = "D6"
name = "静默降级（fail-open）"
origin = "agent"
probe = "todo"
trigger = "发现一次'跳过/丢弃但不记录'的路径，或新增任何 except/continue 兜底"
status = "open"
closure = "fail-open 点全部改为显式报错或写入可见通道"

[[dimension]]
id = "D7"
name = "测试断言强度"
origin = "agent"
probe = "todo"
trigger = "出现一次'测试全绿但回归未被拦住'的事故"
status = "open"
closure = "弱断言（仅真值性/非空/不抛异常）占比有基线且不上升；同源测试为 0"

[[dimension]]
id = "D8"
name = "基线/账本腐化"
origin = "agent"
probe = "python -m pytest tests/policy/test_structural_kept.py -q"
closure = "所有 kept/baseline/ledger 条目可解析到存在的符号或测试节点"
status = "open"

[[dimension]]
id = "D9"
name = "跨平台与编码假设"
origin = "agent"
probe = "todo"
trigger = "出现一次只在 Windows/某 locale 下失效的门禁或测试"
status = "open"
closure = "open()/read_text() 无缺省编码；路径比较无 str(path) 拼接；无反斜杠字面量判断"
