# 审计维度注册表（数据层）— 审计循环的"审什么"
#
# 每个维度必须二选一：
#   probe = "<可执行命令>"   → 该维度**可判定**，循环里能自动跑
#   probe = "todo"           → 还没有探针，必须写 trigger（什么情况下必须补）
# 硬规则（tests/policy/test_audit_dimensions.py 校验）：
#   · status = "closed" 的维度**必须有 probe**（没探针不允许宣布关闭）
#   · todo 维度必须有 trigger（否则它就是"以后再说"的黑洞）
#   · 每个维度必须写 proxies / invalidated_if —— 探针只是**代理**，不是本体：
#       proxies       = 这个探针代理的是哪条性质（不是"它输出什么"）
#       invalidated_if = 什么变化会让这个代理失效
#     探针失效后仍会照常返回 PASS（假绿），所以每轮动手前必须人工复核一次：
#     "它代理的性质还是当前的性质吗？invalidated_if 发生了吗？"（判断不可外包）
#
# origin：user = 用户提的 4 个核心任务；agent = 审计中发现的新维度
# Doc: policy/collaboration.md（任务循环六步 + 审计维度轮）

[[dimension]]
id = "D1"
name = "冗余内容文件"
origin = "user"
probe = "python tools/scan_redundant.py --only scratch"
proxies = "仓库里没有指向不存在产物的引用，也没有该删未删的草稿"
invalidated_if = "草稿区改名/取消，或引用改为配置注入（扫描器就看不见真实引用）"
closure = "scratch 无残留；悬空引用仅剩 CHANGELOG 历史（不可改）"
status = "open"

[[dimension]]
id = "D2"
name = "机制正交性"
origin = "user"
probe = "python tools/structural_score.py --compare"
proxies = "同一事实只有一处实现；新增机制不抬复杂度/重复度"
invalidated_if = "复杂度口径或 kept 账本口径改变（分数不再可比），或重构把重复搬进新文件"
closure = "新增 0 项；同一事实只有一处（副本清零，或有 fail-closed 门禁保证漏了会响）"
status = "open"

[[dimension]]
id = "D3"
name = "测试用例正交性"
origin = "user"
probe = "python tools/scan_test_redundancy.py"
proxies = "同构用例没被重复写多份；参数化不丢覆盖"
invalidated_if = "用例改用新的参数化/夹具风格，AST 骨架不再可比"
closure = "同构组数不增长；参数化前后收集数不变"
status = "open"

[[dimension]]
id = "D4"
name = "缺口文档冗余"
origin = "user"
probe = "python policy/check_doc_refs.py"
proxies = "缺口档没有孤儿、没有同根因多档、引用未断链"
invalidated_if = "缺口档改为别的组织形式（如并入 issues/看板），D4 的统计口径失效"
closure = "D1-D4 全 0；同根因多档已合并；未合并的给出 Jaccard 证据"
status = "open"

[[dimension]]
id = "D5"
name = "门禁有效性（假绿）"
origin = "agent"
probe = "todo"
trigger = "新增或修改任何 policy/ 门禁时，必须为它加一条变异并跑 check_gate_efficacy"
proxies = "每个门禁在被违反时确实会红（不是只在干净树上通过）"
invalidated_if = "门禁改为外部服务/CI-only 校验，变异注入不再能触达"
closure = "每个门禁至少一条变异能证明它变红；变异载荷与当前源码匹配"
status = "open"

[[dimension]]
id = "D6"
name = "静默降级（fail-open）"
origin = "agent"
probe = "todo"
trigger = "发现一次'跳过/丢弃但不记录'的路径，或新增任何 except/continue 兜底"
proxies = "跳过/丢弃路径都会留下可见痕迹（日志/计数/异常），不会变成零违规"
invalidated_if = "日志改为结构化采集，AST 形态识别不再覆盖真实出口"
closure = "fail-open 点全部改为显式报错或写入可见通道"
status = "open"

[[dimension]]
id = "D7"
name = "测试断言强度"
origin = "agent"
probe = "todo"
trigger = "出现一次'测试全绿但回归未被拦住'的事故"
proxies = "测试断言检查具体值/错误码，而不是只检查非空/不抛异常"
invalidated_if = "断言风格转向快照/属性测试，弱断言口径不再适用"
closure = "弱断言（仅真值性/非空/不抛异常）占比有基线且不上升；同源测试为 0"
status = "open"

[[dimension]]
id = "D8"
name = "基线/账本腐化"
origin = "agent"
probe = "python -m pytest tests/policy/test_structural_kept.py -q"
proxies = "kept/baseline/ledger 的条目都还能解析到存在的符号或测试节点"
invalidated_if = "账本改为自动生成（不再手工维护），腐化模式随之消失"
closure = "所有 kept/baseline/ledger 条目可解析到存在的符号或测试节点"
status = "open"

[[dimension]]
id = "D9"
name = "跨平台与编码假设"
origin = "agent"
probe = "todo"
trigger = "出现一次只在 Windows/某 locale 下失效的门禁或测试"
proxies = "代码不依赖 locale 编码、路径分隔符、文件系统排序"
invalidated_if = "开发/CI 统一到单一容器环境，跨平台差异不再暴露"
closure = "open()/read_text() 无缺省编码；路径比较无 str(path) 拼接；无反斜杠字面量判断"
status = "open"
