# 审计维度注册表（数据层）— 审计循环的"审什么"
#
# 每个维度必须二选一：
#   probe = "<可执行命令>"   → 该维度**可判定**，循环里能自动跑
#   probe = "todo"           → 还没有探针，必须写 trigger（什么情况下必须补）
# 硬规则（tests/policy/test_audit_dimensions.py 校验）：
#   · status = "closed" 的维度**必须有 probe**（没探针不允许宣布关闭）
#   · todo 维度必须有 trigger（否则它就是"以后再说"的黑洞）
#   · 每个维度必须写 proxies / invalidated_if —— 探针只是**代理**，不是本体：
#       proxies       = 这个探针代理的是哪条性质（不是"它输出什么"）
#       invalidated_if = 什么变化会让这个代理失效
#     探针失效后仍会照常返回 PASS（假绿），所以每轮动手前必须人工复核一次：
#     "它代理的性质还是当前的性质吗？invalidated_if 发生了吗？"（判断不可外包）
#
# origin：user = 用户提的 4 个核心任务；agent = 审计中发现的新维度
# Doc: policy/collaboration.md（任务循环六步 + 审计维度轮）

[[dimension]]
id = "D1"
name = "冗余内容文件"
origin = "user"
probe = "python tools/scan_redundant.py --only scratch"
proxies = "仓库里没有指向不存在产物的引用，也没有该删未删的草稿"
invalidated_if = "草稿区改名/取消，或引用改为配置注入（扫描器就看不见真实引用）"
closure = "scratch 无残留；悬空引用仅剩 CHANGELOG 历史（不可改）"
status = "open"

[[dimension]]
id = "D2"
name = "机制正交性"
origin = "user"
probe = "python tools/structural_score.py --compare"
proxies = "同一事实只有一处实现；新增机制不抬复杂度/重复度"
invalidated_if = "复杂度口径或 kept 账本口径改变（分数不再可比），或重构把重复搬进新文件"
closure = "新增 0 项；同一事实只有一处（副本清零，或有 fail-closed 门禁保证漏了会响）"
status = "open"

[[dimension]]
id = "D3"
name = "测试用例正交性"
origin = "user"
probe = "python tools/scan_test_redundancy.py"
proxies = "同构用例没被重复写多份；参数化不丢覆盖"
invalidated_if = "用例改用新的参数化/夹具风格，AST 骨架不再可比"
closure = "同构组数不增长；参数化前后收集数不变"
status = "open"

[[dimension]]
id = "D4"
name = "缺口文档冗余"
origin = "user"
probe = "python policy/check_doc_refs.py"
proxies = "缺口档没有孤儿、没有同根因多档、引用未断链"
invalidated_if = "缺口档改为别的组织形式（如并入 issues/看板），D4 的统计口径失效"
closure = "D1-D4 全 0；同根因多档已合并；未合并的给出 Jaccard 证据"
status = "open"

[[dimension]]
id = "D5"
name = "门禁有效性（假绿）"
origin = "agent"
probe = "todo"
trigger = "新增或修改任何 policy/ 门禁时，必须为它加一条变异并跑 check_gate_efficacy"
proxies = "每个门禁在被违反时确实会红（不是只在干净树上通过）"
invalidated_if = "门禁改为外部服务/CI-only 校验，变异注入不再能触达"
closure = "每个门禁至少一条变异能证明它变红；变异载荷与当前源码匹配"
status = "open"

[[dimension]]
id = "D6"
name = "静默降级（fail-open）"
origin = "agent"
probe = "todo"
trigger = "发现一次'跳过/丢弃但不记录'的路径，或新增任何 except/continue 兜底"
proxies = "无异常参与的丢弃（catch 后给默认值/if 不满足就返回）也会留可见痕迹，不会变成零违规"
invalidated_if = "丢弃路径改为统一 helper（如 _skip(reason)），AST 形态识别不再覆盖真实出口"
compare_tool = "slopcop（外部二进制，分钟级，不进门禁）"
compare_note = "本机实测 5 文件：3 处空/泛型 catch 全中；6 处「catch 后静默给默认值」全漏；报告恒为 minScore 4、阈值不可调 ⇒ 只作定性对照，不比分"
compare_invalidated_if = "slopcop 能识别「无异常丢弃」或阈值可调时，才可升级为对照判据"
closure = "fail-open 点全部改为显式报错或写入可见通道"
status = "open"

[[dimension]]
id = "D7"
name = "测试断言强度"
origin = "agent"
probe = "todo"
trigger = "出现一次'测试全绿但回归未被拦住'的事故"
proxies = "测试断言检查具体值/错误码，而不是只检查非空/不抛异常"
invalidated_if = "断言风格转向快照/属性测试，弱断言口径不再适用"
closure = "弱断言（仅真值性/非空/不抛异常）占比有基线且不上升；同源测试为 0"
status = "open"

[[dimension]]
id = "D8"
name = "基线/账本腐化"
origin = "agent"
probe = "python -m pytest tests/policy/test_structural_kept.py -q"
proxies = "kept/baseline/ledger 的条目都还能解析到存在的符号或测试节点"
invalidated_if = "账本改为自动生成（不再手工维护），腐化模式随之消失"
closure = "所有 kept/baseline/ledger 条目可解析到存在的符号或测试节点"
status = "open"

[[dimension]]
id = "D9"
name = "跨平台与编码假设"
origin = "agent"
probe = "todo"
trigger = "出现一次只在 Windows/某 locale 下失效的门禁或测试"
proxies = "代码不依赖 locale 编码、路径分隔符、文件系统排序"
invalidated_if = "开发/CI 统一到单一容器环境，跨平台差异不再暴露"
closure = "open()/read_text() 无缺省编码；路径比较无 str(path) 拼接；无反斜杠字面量判断"
status = "open"

# ============================================================================
# 审计管线（槽位化）：可插拔，不是固定流程
# ============================================================================
# 设计要点：制度本身**不闭合**——槽位留着，随时插/拔；只有"本版就绪"有闭合目标
# （见文件末尾 [[goal]]）。像 AST 后端那样：管线固定，环节可插拔。
#
# 槽位三态（tests/policy/test_audit_dimensions.py 校验）：
#   impl_kind = "file"     → 仓内实现，路径必须存在
#   impl_kind = "external" → 外部能力（如用户级 skill），不校验路径
#   impl_kind = "todo"     → 空槽（留白），必须写 trigger（何时该填）
# enabled = false → 本轮卸载：不跑、不报失败，但**仍在册**（不是删除）

[[pipeline]]
slot = "collect"
purpose = "候选生成：跑探针，只出候选不裁决"
enabled = true
impl_kind = "file"
impl = "tools/audit_cycle.py"

[[pipeline]]
slot = "judge"
purpose = "证伪：对候选构造最小反例 + 给证据种类"
enabled = true
impl_kind = "external"
impl = "~/.agents/skills/invariant-falsifier/SKILL.md"

[[pipeline]]
slot = "close"
purpose = "闭合判据：每维 closure + 关闭即冻结"
enabled = true
impl_kind = "file"
impl = "policy/collaboration.md"

[[pipeline]]
slot = "record"
purpose = "落账：本轮结果 + 人判结论，可回溯趋势"
enabled = true
impl_kind = "file"
impl = "docs/audit-ledger.jsonl"

[[pipeline]]
slot = "retro"
purpose = "自省：每轮产出制度改进候选（可为「无」），不立即改制度"
enabled = true
impl_kind = "file"
impl = "docs/audit-retro.jsonl"

# 留白槽位（示例）：本轮不需要，但在册——需要时只翻 enabled 并填 impl，不改代码
[[pipeline]]
slot = "autofix"
purpose = "机械修复：对同一类重复返工自动生成补丁候选"
enabled = false
impl_kind = "todo"
trigger = "同一维度连续 3 轮出现同一类机械改动（如漏 encoding=、漏 status 字段）"

# ============================================================================
# 本版闭合目标（met 必须附证据；证据指向的文件/测试必须存在）
# ============================================================================
[[goal]]
id = "G1"
statement = "槽位定义齐全且三态合法（file/external/todo + trigger）"
met = true
evidence = "tests/policy/test_audit_dimensions.py"

[[goal]]
id = "G2"
statement = "装载/卸载只改数据：enabled 翻转即生效，不改任何代码"
met = true
evidence = "tools/audit_cycle.py"

[[goal]]
id = "G3"
statement = "至少 2 个槽位有真实实现并被本仓实际跑过"
met = true
evidence = "docs/audit-ledger.jsonl"

[[goal]]
id = "G4"
statement = "retro 槽每轮产出 1 条改进候选（可为「无」），且不改制度本身"
met = true
evidence = "docs/audit-retro.jsonl"

[[goal]]
id = "G5"
statement = "全量门禁绿且结构分不劣化"
met = true
evidence = "policy/check_invariants.py"

# 明确不做（保持制度开放，不做的事写下来防反复争论）
[not_doing]
items = [
  "不做「制度全自动闭环」——判据是否仍成立必须人判（见 collaboration.md 探针有效性复核）",
  "不做「一次性补全所有槽位」——空槽留白，触发条件到了再填",
  "不做「制度版本号/发布流程」——改制度走 CHANGELOG + 门禁，不另设流程",
]
